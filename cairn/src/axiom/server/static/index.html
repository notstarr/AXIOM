<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOM</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/vendor/tailwindcss.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } },
    fontFamily: { sans: ['Inter','-apple-system','BlinkMacSystemFont','SF Pro Text','Helvetica Neue','Arial','sans-serif'], mono: ['JetBrains Mono','SF Mono','Fira Code','monospace'] }
  }}
}
</script>
<style>
[x-cloak]{display:none!important}
*{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
html{ font-size:14px; }
body{ font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:-0.01em; }
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,0.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(100,116,139,0.5)}
input,select,textarea{font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px rgba(59,130,246,0.3)}
.transition-all{transition:all 150ms cubic-bezier(0.4,0,0.2,1)}
.fade-in{animation:fadeIn 200ms ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp 250ms cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pulse-dot{animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.4}}
.card{background:rgb(30,41,59);border:1px solid rgb(51,65,85);border-radius:12px;transition:all 150ms ease}
.card:hover{border-color:rgb(71,85,105)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:all 150ms ease;cursor:pointer;white-space:nowrap;border:none}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-ghost{background:transparent;color:#94a3b8;border:1px solid rgb(51,65,85)}
.btn-ghost:hover{background:rgb(30,41,59);color:#e2e8f0}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.input{width:100%;padding:8px 12px;background:rgb(15,23,42);border:1px solid rgb(51,65,85);border-radius:8px;color:#e2e8f0;font-size:13px;transition:all 150ms ease}
.input:focus{border-color:#3b82f6}
.input::placeholder{color:#475569}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500;line-height:1.4}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;transition:all 150ms ease;cursor:pointer}
.tab:hover{color:#94a3b8}
.tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
.nav-item{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:#475569;transition:all 150ms ease;cursor:pointer}
.nav-item:hover{background:rgb(30,41,59);color:#94a3b8}
.nav-item.active{background:rgb(30,41,59);color:#3b82f6}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:#475569;border-bottom:1px solid rgb(51,65,85)}
td{padding:10px 12px;font-size:13px;color:#cbd5e1;border-bottom:1px solid rgb(30,41,59)}
tr:hover td{background:rgb(30,41,59)}
</style>
</head>
<body class="bg-slate-950 text-slate-200" x-data="axiomApp()" x-init="init()">
<div class="flex h-screen overflow-hidden">

<!-- ═══ SIDEBAR ═══ -->
<aside class="w-14 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-3 gap-1 shrink-0">
  <div class="w-8 h-8 rounded-lg bg-blue-500 flex items-center justify-center mb-3 shrink-0">
    <span class="text-white font-bold text-sm">A</span>
  </div>
  <button class="nav-item" :class="{active: activePage==='dashboard'}" @click="nav('dashboard')" title="仪表盘">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  </button>
  <button class="nav-item" :class="{active: activePage==='tasks'}" @click="nav('tasks')" title="任务">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
  </button>
  <button class="nav-item" :class="{active: activePage==='vulns'}" @click="nav('vulns')" title="漏洞">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4m0 4h.01"/></svg>
  </button>
  <button class="nav-item" :class="{active: activePage==='crawler'}" @click="nav('crawler')" title="爬虫">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20"/></svg>
  </button>
  <button class="nav-item" :class="{active: activePage==='projects'}" @click="nav('projects')" title="项目组">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <div class="flex-1"></div>
  <button class="nav-item" @click="showSearch=true" title="搜索 ⌘K">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  </button>
  <button class="nav-item" @click="darkMode=!darkMode; document.documentElement.classList.toggle('dark')" title="主题">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>
  <button class="nav-item" :class="{active: activePage==='settings'}" @click="nav('settings')" title="设置">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m11-7h-6m-6 0H1m16.5-5.5L16 8m-8 8-1.5 1.5M7.5 7.5 6 6m12 12-1.5-1.5"/></svg>
  </button>
</aside>

<!-- ═══ MAIN ═══ -->
<div class="flex-1 flex flex-col overflow-hidden min-w-0">

<!-- ── DASHBOARD ── -->
<div x-show="activePage==='dashboard'" x-cloak class="flex-1 overflow-y-auto p-6 fade-in">
  <h1 class="text-xl font-semibold text-slate-100 mb-1">仪表盘</h1>
  <p class="text-sm text-slate-500 mb-6">系统总览</p>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="card p-5">
      <p class="text-xs text-slate-500 uppercase tracking-wider mb-2">项目总数</p>
      <p class="text-3xl font-bold text-slate-100" x-text="projects.length"></p>
    </div>
    <div class="card p-5">
      <p class="text-xs text-slate-500 uppercase tracking-wider mb-2">活跃任务</p>
      <p class="text-3xl font-bold text-blue-400" x-text="projects.filter(p=>p.status==='active').length"></p>
    </div>
    <div class="card p-5">
      <p class="text-xs text-slate-500 uppercase tracking-wider mb-2">漏洞总数</p>
      <p class="text-3xl font-bold text-red-400" x-text="allVulns.length"></p>
    </div>
    <div class="card p-5">
      <p class="text-xs text-slate-500 uppercase tracking-wider mb-2">项目组</p>
      <p class="text-3xl font-bold text-slate-100" x-text="groups.length"></p>
    </div>
  </div>
  <div class="card p-5">
    <h3 class="text-sm font-semibold text-slate-300 mb-3">最近事件</h3>
    <div class="space-y-1 max-h-96 overflow-y-auto">
      <template x-for="p in projects.slice(0,10)" :key="p.id">
        <div class="flex items-center gap-3 py-2 px-3 rounded-lg hover:bg-slate-800/50 cursor-pointer" @click="nav('tasks')">
          <span class="badge" :class="p.status==='active'?'bg-blue-500/15 text-blue-400':p.status==='completed'?'bg-emerald-500/15 text-emerald-400':'bg-slate-500/15 text-slate-400'" x-text="p.status"></span>
          <span class="text-sm text-slate-300 flex-1 truncate" x-text="p.title"></span>
          <span class="text-xs text-slate-500 font-mono" x-text="p.id"></span>
        </div>
      </template>
      <div x-show="projects.length===0" class="text-center py-8 text-slate-500 text-sm">暂无项目</div>
    </div>
  </div>
</div>

<!-- ── TASKS ── -->
<div x-show="activePage==='tasks'" x-cloak class="flex-1 flex flex-col overflow-hidden fade-in">
  <div class="px-6 py-4 border-b border-slate-800 flex items-center gap-4">
    <h1 class="text-xl font-semibold text-slate-100">任务</h1>
    <div class="flex-1"></div>
    <button class="btn btn-primary" @click="showNewTask=true">+ 新建任务</button>
  </div>
  <div class="flex-1 overflow-y-auto p-6">
    <div class="grid grid-cols-[300px_1fr] gap-4 h-full">
      <div class="card p-2 overflow-y-auto space-y-1">
        <template x-for="p in projects" :key="p.id">
          <div @click="selectTask(p.id)" class="p-3 rounded-lg cursor-pointer transition-all"
            :class="selectedTaskId===p.id?'bg-blue-500/10 border border-blue-500/30':'hover:bg-slate-800/50'">
            <div class="flex items-center gap-2 mb-1">
              <span class="badge" :class="p.status==='active'?'bg-blue-500/15 text-blue-400':p.status==='completed'?'bg-emerald-500/15 text-emerald-400':'bg-slate-500/15 text-slate-400'" x-text="p.status"></span>
              <span class="text-xs text-slate-500 font-mono" x-text="p.id"></span>
            </div>
            <p class="text-sm text-slate-200 truncate" x-text="p.title"></p>
            <div class="flex gap-3 mt-1 text-xs text-slate-500">
              <span x-text="p.fact_count+' facts'"></span>
              <span x-text="p.working_intent_count+' open'"></span>
            </div>
          </div>
        </template>
        <div x-show="projects.length===0" class="text-center py-8 text-slate-500 text-sm">暂无任务</div>
      </div>
      <div class="card p-5 overflow-y-auto">
        <template x-if="!taskDetail">
          <div class="h-full flex items-center justify-center text-slate-500 text-sm">选择左侧任务查看详情</div>
        </template>
        <template x-if="taskDetail">
          <div>
            <div class="flex items-center gap-3 mb-4">
              <h2 class="text-lg font-semibold text-slate-100" x-text="taskDetail.project.title"></h2>
              <span class="badge" :class="taskDetail.project.status==='active'?'bg-blue-500/15 text-blue-400':'bg-slate-500/15 text-slate-400'" x-text="taskDetail.project.status"></span>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-6">
              <div class="card p-4"><p class="text-xs text-slate-500 mb-1">Facts</p><p class="text-2xl font-bold text-slate-200" x-text="taskDetail.facts.length"></p></div>
              <div class="card p-4"><p class="text-xs text-slate-500 mb-1">Intents</p><p class="text-2xl font-bold text-slate-200" x-text="taskDetail.intents.length"></p></div>
            </div>
            <div class="mb-6">
              <h3 class="text-sm font-semibold text-slate-300 mb-2">Facts</h3>
              <div class="space-y-1">
                <template x-for="f in taskDetail.facts" :key="f.id">
                  <div class="p-3 rounded-lg bg-slate-800/30 border border-slate-800">
                    <span class="text-xs font-mono text-blue-400 mr-2" x-text="f.id"></span>
                    <span class="text-sm text-slate-300" x-text="f.description"></span>
                  </div>
                </template>
              </div>
            </div>
            <div class="mb-6">
              <h3 class="text-sm font-semibold text-slate-300 mb-2">Intents</h3>
              <div class="space-y-1">
                <template x-for="i in taskDetail.intents" :key="i.id">
                  <div class="p-3 rounded-lg bg-slate-800/30 border border-slate-800">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="text-xs font-mono text-amber-400" x-text="i.id"></span>
                      <span class="badge" :class="i.to?'bg-emerald-500/15 text-emerald-400':'bg-amber-500/15 text-amber-400'" x-text="i.to?'done':'open'"></span>
                      <span x-show="i.worker" class="text-xs text-slate-500" x-text="'@'+i.worker"></span>
                    </div>
                    <p class="text-sm text-slate-400" x-text="i.description"></p>
                  </div>
                </template>
              </div>
            </div>
            <div x-show="taskDetail.vulns && taskDetail.vulns.length > 0">
              <h3 class="text-sm font-semibold text-slate-300 mb-2">漏洞</h3>
              <div class="space-y-1">
                <template x-for="v in taskDetail.vulns" :key="v.id">
                  <div class="p-3 rounded-lg bg-red-500/5 border border-red-500/20">
                    <div class="flex items-center gap-2">
                      <span class="badge bg-red-500/15 text-red-400" x-text="v.severity"></span>
                      <span class="text-sm text-slate-200" x-text="v.title"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<!-- ── VULNS ── -->
<div x-show="activePage==='vulns'" x-cloak class="flex-1 flex flex-col overflow-hidden fade-in">
  <div class="px-6 py-4 border-b border-slate-800 flex items-center gap-4">
    <h1 class="text-xl font-semibold text-slate-100">漏洞</h1>
    <div class="flex-1"></div>
    <input x-model="vulnSearch" placeholder="搜索漏洞…" class="input max-w-xs">
  </div>
  <div class="flex-1 overflow-y-auto p-6">
    <div class="card overflow-hidden">
      <table>
        <thead><tr><th>ID</th><th>标题</th><th>严重性</th><th>状态</th><th>项目</th><th>操作</th></tr></thead>
        <tbody>
          <template x-for="v in filteredVulns" :key="v.id+v.project_id">
            <tr>
              <td class="font-mono text-xs text-slate-500" x-text="v.id"></td>
              <td class="text-slate-200" x-text="v.title"></td>
              <td><span class="badge" :class="sevClass(v.severity)" x-text="v.severity"></span></td>
              <td><span class="badge" :class="vulnStatusClass(v.status)" x-text="v.status"></span></td>
              <td class="text-xs text-slate-500" x-text="v.project_id"></td>
              <td><button class="btn btn-ghost text-xs" @click="editVuln(v)">编辑</button></td>
            </tr>
          </template>
        </tbody>
      </table>
      <div x-show="filteredVulns.length===0" class="text-center py-12 text-slate-500 text-sm">暂无漏洞</div>
    </div>
  </div>
</div>

<!-- ── CRAWLER ── -->
<div x-show="activePage==='crawler'" x-cloak class="flex-1 flex flex-col overflow-hidden fade-in">
  <div class="px-6 py-4 border-b border-slate-800 flex items-center gap-4">
    <h1 class="text-xl font-semibold text-slate-100">爬虫</h1>
    <div class="flex-1"></div>
    <select x-model="crawlerGroupId" @change="loadCrawlerResults()" class="input max-w-xs">
      <option value="">选择项目组</option>
      <template x-for="g in groups" :key="g.id"><option :value="g.id" x-text="g.title||g.id"></option></template>
    </select>
  </div>
  <div class="flex-1 overflow-y-auto p-6">
    <template x-if="!crawlerGroupId">
      <div class="h-full flex items-center justify-center text-slate-500 text-sm">选择项目组查看爬虫结果</div>
    </template>
    <template x-if="crawlerGroupId">
      <div x-init="loadCrawlerResults()">
        <div class="grid grid-cols-3 gap-4 mb-6">
          <div class="card p-5"><p class="text-xs text-slate-500 uppercase tracking-wider mb-2">页面</p><p class="text-3xl font-bold text-slate-100" x-text="crawlerData?.counts?.pages||0"></p></div>
          <div class="card p-5"><p class="text-xs text-slate-500 uppercase tracking-wider mb-2">API</p><p class="text-3xl font-bold text-blue-400" x-text="crawlerData?.counts?.apis||0"></p></div>
          <div class="card p-5"><p class="text-xs text-slate-500 uppercase tracking-wider mb-2">映射</p><p class="text-3xl font-bold text-slate-100" x-text="crawlerData?.counts?.mappings||0"></p></div>
        </div>
        <div class="flex gap-1 mb-4 border-b border-slate-800">
          <button class="tab" :class="{active:crawlerTab==='pages'}" @click="crawlerTab='pages'">页面</button>
          <button class="tab" :class="{active:crawlerTab==='apis'}" @click="crawlerTab='apis'">API</button>
          <button class="tab" :class="{active:crawlerTab==='mappings'}" @click="crawlerTab='mappings'">映射</button>
        </div>
        <template x-if="crawlerTab==='pages'">
          <div class="space-y-2">
            <template x-for="(p,i) in (crawlerData?.pages||[])" :key="p.id||i">
              <div class="card p-4">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-medium text-slate-200" x-text="p.name||p.id"></span>
                  <span x-show="p.page_type" class="badge bg-slate-700 text-slate-400" x-text="p.page_type"></span>
                </div>
                <a :href="p.url" target="_blank" class="text-xs text-blue-400 hover:underline" x-text="p.url"></a>
              </div>
            </template>
          </div>
        </template>
        <template x-if="crawlerTab==='apis'">
          <div class="card overflow-hidden">
            <table><thead><tr><th>#</th><th>方法</th><th>路径</th><th>状态码</th><th>说明</th></tr></thead>
            <tbody>
              <template x-for="(a,i) in (crawlerData?.apis||[])" :key="a.id||i">
                <tr>
                  <td class="text-slate-500" x-text="i+1"></td>
                  <td><span class="badge font-mono" :class="methodClass(a.method)" x-text="a.method"></span></td>
                  <td class="font-mono text-xs text-slate-300 break-all" x-text="a.path"></td>
                  <td><template x-for="c in (a.status_codes_seen||[])" :key="c"><span class="badge mr-1" :class="statusClass(c)" x-text="c"></span></template></td>
                  <td class="text-xs text-slate-500" x-text="a.purpose||''"></td>
                </tr>
              </template>
            </tbody></table>
          </div>
        </template>
        <template x-if="crawlerTab==='mappings'">
          <div class="space-y-2">
            <template x-for="(m,i) in (crawlerData?.mappings||[])" :key="m.id||i">
              <div class="card p-4">
                <p class="text-sm font-medium text-slate-200 mb-1" x-text="m.page_name||m.page_id"></p>
                <template x-if="m.on_load&&m.on_load.length">
                  <div class="flex flex-wrap gap-1 mb-1">
                    <template x-for="(a,j) in m.on_load" :key="j"><span class="badge bg-amber-500/10 text-amber-400 font-mono" x-text="(a.method||'GET')+' '+a.path"></span></template>
                  </div>
                </template>
                <template x-if="m.actions&&m.actions.length">
                  <div class="space-y-1">
                    <template x-for="(act,j) in m.actions" :key="j">
                      <div class="flex items-center gap-2 text-xs">
                        <span class="badge bg-indigo-500/10 text-indigo-400" x-text="act.trigger_type||'action'"></span>
                        <span class="text-slate-400" x-text="act.action_name||act.trigger_label"></span>
                        <template x-if="act.apis&&act.apis.length"><template x-for="(a,k) in act.apis" :key="k"><span class="badge bg-amber-500/10 text-amber-400 font-mono" x-text="(a.method||'GET')+' '+a.path"></span></template></template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>
</div>

<!-- ── PROJECTS ── -->
<div x-show="activePage==='projects'" x-cloak class="flex-1 overflow-y-auto p-6 fade-in">
  <div class="flex items-center gap-4 mb-6">
    <h1 class="text-xl font-semibold text-slate-100">项目组</h1>
    <div class="flex-1"></div>
    <button class="btn btn-primary" @click="showNewGroup=true">+ 新建项目组</button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <template x-for="g in groups" :key="g.id">
      <div class="card p-5">
        <div class="flex items-center gap-2 mb-2">
          <h3 class="text-sm font-semibold text-slate-100 flex-1" x-text="g.title"></h3>
          <span class="badge bg-slate-700 text-slate-400" x-text="g.task_count+' tasks'"></span>
        </div>
        <p class="text-xs text-slate-500" x-text="g.description||'无描述'"></p>
        <div class="flex gap-3 mt-3 text-xs text-slate-500">
          <span x-text="g.active_task_count+' active'"></span>
          <span x-text="g.completed_task_count+' done'"></span>
          <span x-show="g.vuln_count" class="text-red-400" x-text="g.vuln_count+' vulns'"></span>
        </div>
      </div>
    </template>
    <div x-show="groups.length===0" class="col-span-full text-center py-12 text-slate-500 text-sm">暂无项目组</div>
  </div>
</div>

<!-- ── SETTINGS ── -->
<div x-show="activePage==='settings'" x-cloak class="flex-1 overflow-y-auto p-6 fade-in">
  <h1 class="text-xl font-semibold text-slate-100 mb-6">设置</h1>
  <div class="max-w-2xl space-y-6">
    <div class="card p-5">
      <h3 class="text-sm font-semibold text-slate-300 mb-4">基础设置</h3>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs text-slate-500 block mb-1">Intent 超时</label><input type="number" x-model.number="settings.intent_timeout" class="input"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Reason 超时</label><input type="number" x-model.number="settings.reason_timeout" class="input"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Bootstrap Workers</label><input type="number" x-model.number="settings.bootstrap_worker_count" class="input"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Explore Workers</label><input type="number" x-model.number="settings.explore_worker_count" class="input"></div>
      </div>
      <button class="btn btn-primary mt-4" @click="saveSettings()">保存</button>
    </div>
    <div class="card p-5">
      <h3 class="text-sm font-semibold text-slate-300 mb-4">爬虫 Worker</h3>
      <div class="space-y-3">
        <div><label class="text-xs text-slate-500 block mb-1">模型</label><input x-model="crawlerWorker.pi_model" class="input" placeholder="model name"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Base URL</label><input x-model="crawlerWorker.pi_base_url" class="input" placeholder="https://api.openai.com/v1"></div>
        <div><label class="text-xs text-slate-500 block mb-1">API Key</label><input type="password" x-model="crawlerWorker.pi_api_key" class="input" placeholder="留空保持现有"></div>
        <button class="btn btn-primary" @click="saveCrawlerWorker()">保存</button>
      </div>
    </div>
  </div>
</div>

</div><!-- /main -->
</div><!-- /flex -->

<!-- ═══ MODALS ═══ -->

<!-- Global Search -->
<div x-show="showSearch" x-cloak class="fixed inset-0 z-50 flex items-start justify-center pt-[20vh] bg-black/60 backdrop-blur-sm" @click.self="showSearch=false" @keydown.escape.window="showSearch=false">
  <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-xl mx-4 overflow-hidden slide-up">
    <div class="px-4 py-3 border-b border-slate-800 flex items-center gap-3">
      <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input x-model="searchQ" x-ref="searchInput" placeholder="搜索项目、漏洞…" class="flex-1 bg-transparent text-slate-200 placeholder-slate-600 focus:outline-none text-sm">
      <kbd class="text-xs text-slate-600 bg-slate-800 px-1.5 py-0.5 rounded">ESC</kbd>
    </div>
    <div class="max-h-[50vh] overflow-y-auto p-2">
      <template x-for="r in searchResults" :key="r.id">
        <div @click="r.action(); showSearch=false; searchQ=''" class="px-3 py-2.5 rounded-lg hover:bg-slate-800 cursor-pointer flex items-center gap-3">
          <span class="badge text-xs" :class="r.type==='vuln'?'bg-red-500/15 text-red-400':'bg-blue-500/15 text-blue-400'" x-text="r.type==='vuln'?'V':'P'"></span>
          <span class="text-sm text-slate-200 flex-1 truncate" x-text="r.title"></span>
          <span class="text-xs text-slate-500" x-text="r.sub"></span>
        </div>
      </template>
      <div x-show="searchQ && searchResults.length===0" class="py-8 text-center text-slate-500 text-sm">未找到结果</div>
    </div>
  </div>
</div>

<!-- New Task -->
<div x-show="showNewTask" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" @click.self="showNewTask=false">
  <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-lg mx-4 p-6 slide-up">
    <h3 class="text-sm font-semibold text-slate-200 mb-4">新建任务</h3>
    <div class="space-y-3">
      <div><label class="text-xs text-slate-500 block mb-1">项目组</label>
        <select x-model="newTask.parent" class="input"><option value="">无</option><template x-for="g in groups" :key="g.id"><option :value="g.id" x-text="g.title||g.id"></option></template></select>
      </div>
      <div><label class="text-xs text-slate-500 block mb-1">标题</label><input x-model="newTask.title" class="input" placeholder="任务标题"></div>
      <div><label class="text-xs text-slate-500 block mb-1">Origin</label><textarea x-model="newTask.origin" class="input" rows="2" placeholder="起始信息"></textarea></div>
      <div><label class="text-xs text-slate-500 block mb-1">Goal</label><textarea x-model="newTask.goal" class="input" rows="2" placeholder="目标"></textarea></div>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-primary flex-1" @click="createTask()">创建</button>
        <button class="btn btn-ghost" @click="showNewTask=false">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- New Group -->
<div x-show="showNewGroup" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" @click.self="showNewGroup=false">
  <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md mx-4 p-6 slide-up">
    <h3 class="text-sm font-semibold text-slate-200 mb-4">新建项目组</h3>
    <div class="space-y-3">
      <div><label class="text-xs text-slate-500 block mb-1">标题</label><input x-model="newGroup.title" class="input"></div>
      <div><label class="text-xs text-slate-500 block mb-1">描述</label><textarea x-model="newGroup.description" class="input" rows="2"></textarea></div>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-primary flex-1" @click="createGroup()">创建</button>
        <button class="btn btn-ghost" @click="showNewGroup=false">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- Vuln Editor -->
<div x-show="vulnEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" @click.self="vulnEditor.open=false">
  <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-y-auto mx-4 p-6 slide-up">
    <h3 class="text-sm font-semibold text-slate-200 mb-4" x-text="vulnEditor.isNew?'新增漏洞':'编辑漏洞'"></h3>
    <div class="space-y-3">
      <div><label class="text-xs text-slate-500 block mb-1">标题</label><input x-model="vulnEditor.title" class="input"></div>
      <div class="grid grid-cols-3 gap-3">
        <div><label class="text-xs text-slate-500 block mb-1">严重性</label>
          <select x-model="vulnEditor.severity" class="input"><option>info</option><option>low</option><option>medium</option><option>high</option><option>critical</option></select>
        </div>
        <div><label class="text-xs text-slate-500 block mb-1">状态</label>
          <select x-model="vulnEditor.status" class="input"><option>confirmed</option><option>pending</option><option>rejected</option><option>ignored</option></select>
        </div>
        <div><label class="text-xs text-slate-500 block mb-1">类型</label><input x-model="vulnEditor.type" class="input" placeholder="e.g. XSS"></div>
      </div>
      <div><label class="text-xs text-slate-500 block mb-1">描述</label><textarea x-model="vulnEditor.description" class="input" rows="3"></textarea></div>
      <div><label class="text-xs text-slate-500 block mb-1">影响</label><textarea x-model="vulnEditor.impact" class="input" rows="2"></textarea></div>
      <div><label class="text-xs text-slate-500 block mb-1">利用前提</label><textarea x-model="vulnEditor.prerequisites" class="input" rows="2"></textarea></div>
      <div><label class="text-xs text-slate-500 block mb-1">证据 (每行一条)</label><textarea x-model="vulnEditor.evidence" class="input" rows="3"></textarea></div>
      <div><label class="text-xs text-slate-500 block mb-1">复现步骤 (每行一条)</label><textarea x-model="vulnEditor.reproduction_steps" class="input" rows="3"></textarea></div>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-primary flex-1" @click="saveVuln()">保存</button>
        <button class="btn btn-ghost" @click="vulnEditor.open=false">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div x-show="toast.show" x-cloak x-transition class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium slide-up"
  :class="toast.type==='error'?'bg-red-500 text-white':toast.type==='success'?'bg-emerald-500 text-white':'bg-slate-800 text-slate-200'"
  x-text="toast.msg"></div>

<script>
function axiomApp() {
  return {
    activePage: 'dashboard', darkMode: true,
    projects: [], groups: [], allVulns: [],
    selectedTaskId: '', taskDetail: null,
    settings: {}, crawlerWorker: { pi_model:'', pi_base_url:'', pi_api_key:'', pi_provider_api:'openai-completions', pi_context_window:'128000' },
    crawlerGroupId: '', crawlerTab: 'pages', crawlerData: null,
    showSearch: false, searchQ: '', showNewTask: false, showNewGroup: false,
    newTask: { parent:'', title:'', origin:'', goal:'' }, newGroup: { title:'', description:'' },
    vulnSearch: '', vulnEditor: { open:false, isNew:true, project_id:'', id:'', title:'', type:'', severity:'info', description:'', prerequisites:'', impact:'', evidence:'', reproduction_steps:'', status:'confirmed' },
    toast: { show:false, msg:'', type:'info' },
    pollTimer: null,

    async init() {
      await this.loadGroups(); await this.loadProjects(); await this.loadSettings(); await this.loadCrawlerWorker();
      window.addEventListener('keydown', e => {
        if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); this.showSearch=true; }
        if (e.key==='Escape') { this.showSearch=false; }
      });
      this.startPolling();
    },

    nav(page) { this.activePage = page; },

    async api(method, path, body) {
      const opts = { method, headers: {'Content-Type':'application/json'} };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      if (r.status===204) return null;
      const data = await r.json();
      if (!r.ok) { this.showToast(data.detail||`HTTP ${r.status}`, 'error'); throw new Error(data.detail||`HTTP ${r.status}`); }
      return data;
    },

    showToast(msg, type='info') { this.toast = {show:true, msg, type}; setTimeout(()=>this.toast.show=false, 3000); },

    async loadGroups() { try { this.groups = await this.api('GET','/project-groups'); } catch(e){} },
    async loadProjects() { try { this.projects = await this.api('GET','/projects'); this.loadAllVulns(); } catch(e){} },
    async loadAllVulns() {
      this.allVulns = [];
      for (const p of this.projects) {
        try { const vs = await this.api('GET',`/projects/${p.id}/vulns`); this.allVulns.push(...vs.map(v=>({...v, project_id:p.id}))); } catch(e){}
      }
    },
    async loadSettings() { try { this.settings = await this.api('GET','/settings'); } catch(e){} },
    async loadCrawlerWorker() { try { const d = await this.api('GET','/crawler/worker'); this.crawlerWorker = {...d, pi_api_key:''}; } catch(e){} },

    async selectTask(id) {
      this.selectedTaskId = id;
      try { this.taskDetail = await this.api('GET', `/projects/${id}`); } catch(e){}
    },

    async createTask() {
      try {
        await this.api('POST','/projects', { parent_project_id:this.newTask.parent||null, title:this.newTask.title, origin:this.newTask.origin, goal:this.newTask.goal, bootstrap_enabled:true });
        this.showToast('任务已创建','success'); this.showNewTask=false; this.newTask={parent:'',title:'',origin:'',goal:''};
        await this.loadProjects();
      } catch(e){}
    },
    async createGroup() {
      try { await this.api('POST','/project-groups', {title:this.newGroup.title, description:this.newGroup.description}); this.showToast('项目组已创建','success'); this.showNewGroup=false; this.newGroup={title:'',description:''}; await this.loadGroups(); } catch(e){}
    },
    async saveSettings() { try { await this.api('PUT','/settings', this.settings); this.showToast('设置已保存','success'); } catch(e){} },
    async saveCrawlerWorker() { try { await this.api('PUT','/crawler/worker', this.crawlerWorker); this.showToast('爬虫配置已保存','success'); this.crawlerWorker.pi_api_key=''; } catch(e){} },

    get filteredVulns() {
      if (!this.vulnSearch.trim()) return this.allVulns;
      const q = this.vulnSearch.toLowerCase();
      return this.allVulns.filter(v => (v.title||'').toLowerCase().includes(q) || (v.id||'').toLowerCase().includes(q));
    },
    get searchResults() {
      if (!this.searchQ.trim()) return [];
      const q = this.searchQ.toLowerCase();
      const r = [];
      for (const p of this.projects) if ((p.title||'').toLowerCase().includes(q) || (p.id||'').toLowerCase().includes(q)) r.push({id:p.id, type:'project', title:p.title, sub:p.id, action:()=>{this.nav('tasks'); this.selectTask(p.id);}});
      for (const v of this.allVulns) if ((v.title||'').toLowerCase().includes(q)) r.push({id:v.id+v.project_id, type:'vuln', title:v.title, sub:v.project_id, action:()=>{this.nav('vulns');}});
      return r;
    },

    editVuln(v) {
      this.vulnEditor = { open:true, isNew:!v, project_id:v?.project_id||'', id:v?.id||'', title:v?.title||'', type:v?.type||'', severity:v?.severity||'info', description:v?.description||'', prerequisites:v?.prerequisites||'', impact:v?.impact||'', evidence:(v?.evidence||[]).join('\n'), reproduction_steps:(v?.reproduction_steps||[]).join('\n'), status:v?.status||'confirmed' };
    },
    async saveVuln() {
      const ed = this.vulnEditor;
      if (!ed.title || !ed.project_id) { this.showToast('标题和项目必填','error'); return; }
      const body = { title:ed.title, type:ed.type, severity:ed.severity, description:ed.description, prerequisites:ed.prerequisites, impact:ed.impact, evidence:ed.evidence.split('\n').filter(Boolean), reproduction_steps:ed.reproduction_steps.split('\n').filter(Boolean), status:ed.status, source:'manual', reported_by:'human' };
      try {
        if (ed.isNew) await this.api('POST', `/projects/${ed.project_id}/vulns`, body);
        else await this.api('PUT', `/projects/${ed.project_id}/vulns/${ed.id}`, body);
        this.showToast('漏洞已保存','success'); this.vulnEditor.open=false; await this.loadAllVulns();
      } catch(e){}
    },

    async loadCrawlerResults() {
      if (!this.crawlerGroupId) { this.crawlerData=null; return; }
      try { this.crawlerData = await this.api('GET', `/project-groups/${this.crawlerGroupId}/crawler/results`); } catch(e){ this.crawlerData={pages:[],apis:[],mappings:[],counts:{pages:0,apis:0,mappings:0}}; }
    },

    sevClass(s) { return {critical:'bg-red-500/20 text-red-400',high:'bg-orange-500/20 text-orange-400',medium:'bg-amber-500/20 text-amber-400',low:'bg-yellow-500/20 text-yellow-400',info:'bg-slate-500/20 text-slate-400'}[s]||'bg-slate-500/20 text-slate-400'; },
    vulnStatusClass(s) { return {confirmed:'bg-red-500/15 text-red-400',pending:'bg-amber-500/15 text-amber-400',rejected:'bg-slate-500/15 text-slate-400',ignored:'bg-slate-600/15 text-slate-500'}[s]||'bg-slate-500/15 text-slate-400'; },
    methodClass(m) { return {GET:'bg-emerald-500/15 text-emerald-400',POST:'bg-amber-500/15 text-amber-400',PUT:'bg-sky-500/15 text-sky-400',DELETE:'bg-red-500/15 text-red-400',PATCH:'bg-purple-500/15 text-purple-400'}[m]||'bg-slate-500/15 text-slate-400'; },
    statusClass(c) { return c<300?'bg-emerald-500/15 text-emerald-400':c<400?'bg-amber-500/15 text-amber-400':'bg-red-500/15 text-red-400'; },

    startPolling() {
      this.pollTimer = setInterval(async () => {
        await this.loadProjects();
      }, 5000);
    },
  }
}
</script>
</body>
</html>
