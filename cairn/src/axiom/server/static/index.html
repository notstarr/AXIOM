<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>axiom</title>
<link rel="icon" href="/static/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="/static/apple.css">
<script src="/static/vendor/tailwindcss.js"></script>
<script src="/static/vendor/dagre.min.js"></script>
<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/vendor/cytoscape-dagre.js"></script>
<script src="/static/vendor/elk.bundled.js"></script>
<script src="/static/vendor/cytoscape-elk.js"></script>
<script src="/static/vendor/cytoscape-html-label.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
<link rel="stylesheet" href="/static/custom.css">
<script>
  tailwind.config = {
    theme: {
      fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','SF Pro Text','Helvetica Neue','sans-serif'] },
      extend: {
        colors: {
          brand: { 50:'#EFF6FF',100:'#DBEAFE',200:'#BFDBFE',300:'#93C5FD',400:'#60A5FA',500:'#0071E3',600:'#0064CC',700:'#0055B3',800:'#004499',900:'#003380' }
        }
      }
    }
  }
</script>
</head>
<body class="h-screen overflow-hidden" :class="{ 'select-none cursor-col-resize': isResizingPanel }" x-data="cairnApp()" style="background:var(--bg-secondary);color:var(--text-primary)">

<!-- ═══════════ APPLE-STYLE SIDEBAR ═══════════ -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="/static/logo.jpg" alt="axiom">
  </div>
  <button type="button" class="nav-item nav-back" data-tooltip="返回上一页"
    x-show="pageHistory.length > 0" @click="goBack()" style="margin-bottom:4px">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <nav class="sidebar-nav">
    <button type="button" class="nav-item" data-tooltip="仪表盘"
      :class="{ 'is-active': activePage === 'dashboard' }" @click="navigateTo('dashboard')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm10 7h6V4h-6v16ZM4 20h6v-4H4v4Z"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="任务管理"
      :class="{ 'is-active': activePage === 'tasks' || activePage === 'task-detail' }" @click="navigateTo('tasks')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="漏洞管理"
      :class="{ 'is-active': activePage === 'vulnerabilities' }" @click="navigateTo('vulnerabilities')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.2 2.7 7.9 7.5 9.5 4.8-1.6 7.5-5.3 7.5-9.5V6L12 3Z"/><path d="M12 8v5m0 3h.01"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="项目管理"
      :class="{ 'is-active': activePage === 'projects' }" @click="navigateTo('projects')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z"/><path d="m4 12 8 4.5 8-4.5"/><path d="m4 16.5 8 4.5 8-4.5"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="守门审计日志"
      :class="{ 'is-active': activePage === 'guard-audit' }" @click="navigateTo('guard-audit')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.2 2.8 7.9 7 9.5 4.2-1.6 7-5.3 7-9.5V6l-7-3Z"/><path d="M9 12h6"/><path d="M9 15h4"/><path d="M9 9h6"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="URL 守门测试"
      :class="{ 'is-active': activePage === 'batch-url-judge' }" @click="navigateTo('batch-url-judge')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="爬虫管理"
      :class="{ 'is-active': activePage === 'crawler-results' }" @click="navigateTo('crawler-results')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
    </button>

    <div class="sidebar-divider"></div>


    <button type="button" class="nav-item" data-tooltip="Skill"
      :class="{ 'is-active': activePage === 'skills' }" @click="navigateTo('skills')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 12h6m-3-3v6m-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14l-4-2-4 2-4-2-4 2Z"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="MCP"
      :class="{ 'is-active': activePage === 'mcp' }" @click="navigateTo('mcp')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 11-13h-8l1-7Z"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="Files"
      :class="{ 'is-active': activePage === 'files' }" @click="navigateTo('files')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v11Z"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="资产管理"
      :class="{ 'is-active': activePage === 'assets' }" @click="navigateTo('assets')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="提示词备忘录"
      :class="{ 'is-active': activePage === 'prompts' }" @click="navigateTo('prompts')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></svg>
    </button>
  </nav>
  <div class="sidebar-bottom">
    <button type="button" class="nav-item" data-tooltip="全局搜索 (⌘K)"
      @click.window.meta.k="showGlobalSearch = true" @click="showGlobalSearch = true">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button type="button" class="nav-item" data-tooltip="深色模式"
      @click="toggleDarkMode()">
      <template x-if="!darkMode">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </template>
      <template x-if="darkMode">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </template>
    </button>
    <button type="button" class="nav-item" data-tooltip="系统设置"
      :class="{ 'is-active': activePage === 'settings' }" @click="navigateTo('settings')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05a2 2 0 1 1-2.83 2.83l-.05-.05a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.07a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.07A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.34-1.88l-.05-.05a2 2 0 1 1 2.83-2.83l.05.05A1.7 1.7 0 0 0 8.97 3.6 1.7 1.7 0 0 0 10 2.07V2a2 2 0 1 1 4 0v.07a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.05-.05a2 2 0 1 1 2.83 2.83l-.05.05A1.7 1.7 0 0 0 19.4 8c.18.6.7 1 1.56 1H21a2 2 0 1 1 0 4h-.07A1.7 1.7 0 0 0 19.4 15Z"/></svg>
    </button>
  </div>
</aside>

<div class="main-content">
<div x-show="activePage === 'dashboard'" x-cloak
     data-page="dashboard" x-init="loadPageTemplate('dashboard')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'tasks'" x-cloak
     data-page="task-list" x-init="loadPageTemplate('task-list')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'task-detail' && view === 'graph'" x-cloak
     data-page="graph-view" x-init="loadPageTemplate('graph-view')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'vulnerabilities'" x-cloak
     data-page="vulnerabilities" x-init="loadPageTemplate('vulnerabilities')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'projects'" x-cloak
     data-page="project-mgmt" x-init="loadPageTemplate('project-mgmt')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'guard-audit'" x-cloak
     data-page="guard-audit" x-init="loadPageTemplate('guard-audit')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'batch-url-judge'" x-cloak
     data-page="batch-url-judge" x-init="loadPageTemplate('batch-url-judge')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'skills'" x-cloak
     data-page="skills" x-init="loadPageTemplate('skills')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'files'" x-cloak
     data-page="files" x-init="loadPageTemplate('files')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'assets'" x-cloak
     data-page="assets" x-init="loadPageTemplate('assets')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'crawler-results'" x-cloak
     data-page="crawler" x-init="loadPageTemplate('crawler')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'mcp'" x-cloak
     data-page="mcp" x-init="loadPageTemplate('mcp')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<!-- Placeholder Pages -->
<template x-for="page in placeholderPages()" :key="page.id">
  <div x-show="activePage === page.id" x-cloak class="flex-1 flex flex-col overflow-hidden min-w-0">
    <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 shrink-0">
      <h2 class="text-base font-semibold text-slate-800 tracking-tight" x-text="page.title"></h2>
      <p class="text-xs text-slate-400 mt-0.5" x-text="page.subtitle"></p>
    </header>
    <main class="flex-1 overflow-y-auto p-5">
      <section class="rounded-2xl border border-dashed border-slate-200 bg-white px-6 py-16 text-center">
        <h3 class="text-lg font-semibold text-slate-700" x-text="page.title"></h3>
        <p class="mt-2 text-sm text-slate-400" x-text="page.description"></p>
        <p class="mt-4 text-xs text-slate-400">当前版本先预留完整页面入口，后续接入后端能力。</p>
      </section>
    </main>
  </div>
</template>

<div x-show="activePage === 'prompts'" x-cloak
     data-page="prompts" x-init="loadPageTemplate('prompts')" @keydown.meta.k.prevent="showPromptSearch = true"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

<div x-show="activePage === 'settings'" x-cloak
     data-page="settings" x-init="loadPageTemplate('settings')"
     class="flex-1 flex flex-col overflow-hidden min-w-0">
</div>

</div><!-- /main-content -->

<!-- ═══════════ MODALS ═══════════ -->

<!-- Create Intent -->
<div x-show="showIntentModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showIntentModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">新建意图</h3>
    <div class="mb-4">
      <label class="text-[11px] text-slate-400 mb-1 block font-medium">来源事实</label>
      <div class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 min-h-[42px] flex flex-wrap gap-1.5 items-center">
        <template x-for="fid in selectedFacts" :key="`intent-from-${fid}`">
          <span class="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-mono text-slate-600" x-text="fid"></span>
        </template>
      </div>
    </div>
    <div class="space-y-3">
      <textarea x-model="intentForm.description" placeholder="本轮准备探索什么？" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">目标主机/IP（可留空，留空时使用任务白名单；多个用换行或逗号分隔）</label>
        <textarea x-model="intentForm.targets" placeholder="例如：api.example.com 或 10.0.0.1" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      </div>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500" x-show="intentScopeHint" x-text="intentScopeHint"></div>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showIntentModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="createIntent(false)" :disabled="!intentForm.description"
        class="px-5 py-2 text-sm border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition disabled:opacity-30">声明</button>
      <button @click="createIntent(true)" :disabled="!intentForm.description"
        class="px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium hover:bg-brand-600 transition disabled:opacity-30 shadow-sm shadow-brand-200">声明并认领</button>
    </div>
  </div>
</div>

<!-- Conclude -->
<div x-show="showConcludeModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showConcludeModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">结束意图</h3>
    <p class="text-xs text-slate-400 mb-4 font-mono" x-text="concludeForm.intentId"></p>
    <div class="space-y-3">
      <textarea x-model="concludeForm.description" placeholder="本轮发现了什么（写入新事实）" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showConcludeModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="concludeIntent()" :disabled="!concludeForm.description"
        class="px-5 py-2 text-sm bg-teal-500 text-white rounded-xl font-medium hover:bg-teal-600 transition disabled:opacity-30 shadow-sm shadow-teal-200">确认结束</button>
    </div>
  </div>
</div>

<!-- Complete Project -->
<div x-show="showCompleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showCompleteModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">完成项目</h3>
    <p class="text-xs text-slate-400 mb-4">将项目标记为已完成</p>
    <div class="space-y-3">
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">来源事实</label>
        <div class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 min-h-[42px] flex flex-wrap gap-1.5 items-center">
          <template x-for="fid in selectedFacts" :key="`complete-from-${fid}`">
            <span class="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-mono text-slate-600" x-text="fid"></span>
          </template>
        </div>
      </div>
      <textarea x-model="completeForm.description" placeholder="为什么可以判定目标已达成？" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showCompleteModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="completeProject()" :disabled="selectedFacts.length === 0 || !completeForm.description"
        class="px-5 py-2 text-sm bg-teal-500 text-white rounded-xl font-medium hover:bg-teal-600 transition disabled:opacity-30 shadow-sm shadow-teal-200">确认完成</button>
    </div>
  </div>
</div>

<!-- Hint -->
<div x-show="showHintModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showHintModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-4">添加提示</h3>
    <div class="space-y-3">
      <textarea x-model="hintForm.content" placeholder="策略建议或备注..." rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showHintModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="addHint()" :disabled="!hintForm.content"
        class="px-5 py-2 text-sm bg-amber-500 text-white rounded-xl font-medium hover:bg-amber-600 transition disabled:opacity-30 shadow-sm shadow-amber-200">添加</button>
    </div>
</div>
</div>

<!-- Blackboard Editor -->
<div x-show="blackboardEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="blackboardEditor.open = false">
<div class="bg-white rounded-2xl shadow-2xl modal-enter p-6 w-full max-w-lg mx-4 relative z-10">
  <h3 class="text-lg font-semibold text-slate-800" x-text="blackboardEditor.id ? '编辑黑板' : '添加黑板'"></h3>
  <input x-model="blackboardEditor.title" placeholder="标题（可选）" class="mt-4 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400">
  <textarea x-model="blackboardEditor.content" rows="5" placeholder="内容（如测试账号、业务逻辑等）" class="mt-3 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400"></textarea>
  <div class="mt-3">
    <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide block mb-1">何时相关（hint）</label>
    <input x-model="blackboardEditor.hint" placeholder="一句话说明何时 AI 应参考此条目，空则始终注入" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400 text-slate-600 placeholder-slate-300">
    <p class="text-[10px] text-slate-300 mt-1">例：“发送 HTTP 请求时使用”、“判断越权时参考”——AI 会读取所有条目但优先关注 hint 匹配的条目</p>
  </div>
  <div class="flex justify-end gap-2 mt-5">
    <button @click="blackboardEditor.open = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
    <button @click="saveBlackboardItem()" :disabled="!blackboardEditor.title && !blackboardEditor.content"
      class="px-5 py-2 text-sm bg-sky-500 text-white rounded-xl font-medium hover:bg-sky-600 transition disabled:opacity-30 shadow-sm shadow-sky-200">保存</button>
  </div>
</div>
</div>

<!-- Crawler Results Modal -->
<div x-show="crawlerResultsOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="crawlerResultsOpen = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-5xl mx-4 border border-slate-200/60 overflow-hidden flex flex-col" style="max-height:85vh" @click.stop>
    <!-- Header -->
    <div class="px-5 py-4 border-b border-slate-200/80 flex items-center justify-between gap-4 shrink-0">
      <div class="min-w-0 flex items-center gap-3">
        <h3 class="text-sm font-semibold text-slate-700">爬虫结果</h3>
        <template x-if="crawlerResultsData">
          <div class="flex items-center gap-2 text-[11px] text-slate-400">
            <span class="px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 font-mono tabular-nums" x-text="crawlerResultsData.counts.pages + ' 页'"></span>
            <span class="px-1.5 py-0.5 rounded bg-amber-50 text-amber-600 font-mono tabular-nums" x-text="crawlerResultsData.counts.apis + ' API'"></span>
            <span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600 font-mono tabular-nums" x-text="crawlerResultsData.counts.mappings + ' 映射'"></span>
          </div>
        </template>
      </div>
      <div class="flex items-center gap-2">
        <button @click="refreshCrawlerResults()" :disabled="crawlerResultsLoading" class="px-3 py-1.5 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition disabled:opacity-40">刷新</button>
        <button @click="crawlerResultsOpen = false" class="px-3 py-1.5 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">关闭</button>
      </div>
    </div>
    <!-- Tabs -->
    <div class="px-5 py-2 border-b border-slate-100 flex items-center gap-1 shrink-0">
      <button @click="crawlerResultsTab = 'pages'" class="px-3 py-1.5 text-xs font-medium rounded-lg transition"
        :class="crawlerResultsTab === 'pages' ? 'bg-blue-50 text-blue-600' : 'text-slate-400 hover:text-slate-600'">
        页面 <span class="opacity-60" x-text="crawlerResultsData ? '(' + crawlerResultsData.counts.pages + ')' : ''"></span>
      </button>
      <button @click="crawlerResultsTab = 'apis'" class="px-3 py-1.5 text-xs font-medium rounded-lg transition"
        :class="crawlerResultsTab === 'apis' ? 'bg-amber-50 text-amber-600' : 'text-slate-400 hover:text-slate-600'">
        API <span class="opacity-60" x-text="crawlerResultsData ? '(' + crawlerResultsData.counts.apis + ')' : ''"></span>
      </button>
      <button @click="crawlerResultsTab = 'mappings'" class="px-3 py-1.5 text-xs font-medium rounded-lg transition"
        :class="crawlerResultsTab === 'mappings' ? 'bg-emerald-50 text-emerald-600' : 'text-slate-400 hover:text-slate-600'">
        映射 <span class="opacity-60" x-text="crawlerResultsData ? '(' + crawlerResultsData.counts.mappings + ')' : ''"></span>
      </button>
    </div>
    <!-- Content -->
    <div class="flex-1 overflow-auto bg-slate-50 p-4">
      <!-- Loading -->
      <template x-if="crawlerResultsLoading">
        <div class="flex items-center justify-center py-12 text-sm text-slate-400">加载中…</div>
      </template>
      <!-- No data -->
      <template x-if="!crawlerResultsLoading && !crawlerResultsData">
        <div class="flex items-center justify-center py-12 text-sm text-slate-400">暂无数据</div>
      </template>

      <!-- Pages tab -->
      <template x-if="!crawlerResultsLoading && crawlerResultsData && crawlerResultsTab === 'pages'">
        <div class="space-y-2">
          <template x-for="(page, i) in crawlerResultsData.pages" :key="page.id || i">
            <div class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
              <div class="flex items-start gap-3">
                <div class="shrink-0 w-7 h-7 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-[11px] font-mono" x-text="i + 1"></div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-medium text-slate-700" x-text="page.name || page.id"></span>
                    <template x-if="page.page_type">
                      <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-500" x-text="page.page_type"></span>
                    </template>
                    <template x-if="page.requires_auth">
                      <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-rose-50 text-rose-500">需认证</span>
                    </template>
                    <template x-if="page.exhausted">
                      <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-emerald-50 text-emerald-600">已穷尽</span>
                    </template>
                  </div>
                  <a :href="page.url" target="_blank" class="text-[11px] text-blue-400 hover:text-blue-600 break-all" x-text="page.url"></a>
                  <template x-if="page.discovered_via && page.discovered_via.trigger_label">
                    <p class="text-[10px] text-slate-400 mt-1">来源: <span x-text="page.discovered_via.trigger_label"></span></p>
                  </template>
                  <template x-if="page.actions && page.actions.length">
                    <div class="mt-1.5 flex flex-wrap gap-1">
                      <template x-for="(action, j) in page.actions" :key="action.id || j">
                        <span class="px-1.5 py-0.5 rounded text-[10px] bg-indigo-50 text-indigo-500" x-text="action.name || action.label || action.id"></span>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
          <template x-if="!crawlerResultsData.pages.length">
            <div class="text-center py-8 text-sm text-slate-400">暂无页面数据</div>
          </template>
        </div>
      </template>

      <!-- APIs tab -->
      <template x-if="!crawlerResultsLoading && crawlerResultsData && crawlerResultsTab === 'apis'">
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
          <table class="w-full text-xs">
            <thead class="bg-slate-50 text-slate-400 text-[10px] uppercase tracking-wide">
              <tr>
                <th class="text-left px-3 py-2 font-medium">#</th>
                <th class="text-left px-3 py-2 font-medium">方法</th>
                <th class="text-left px-3 py-2 font-medium">路径</th>
                <th class="text-left px-3 py-2 font-medium">状态码</th>
                <th class="text-left px-3 py-2 font-medium">认证</th>
                <th class="text-left px-3 py-2 font-medium">说明</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <template x-for="(api, i) in crawlerResultsData.apis" :key="api.id || i">
                <tr class="hover:bg-slate-50/60">
                  <td class="px-3 py-2 text-slate-300 font-mono" x-text="i + 1"></td>
                  <td class="px-3 py-2">
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold"
                      :class="{
                        'bg-emerald-50 text-emerald-600': api.method === 'GET',
                        'bg-amber-50 text-amber-600': api.method === 'POST',
                        'bg-sky-50 text-sky-600': api.method === 'PUT' || api.method === 'PATCH',
                        'bg-rose-50 text-rose-500': api.method === 'DELETE',
                        'bg-slate-100 text-slate-500': !['GET','POST','PUT','PATCH','DELETE'].includes(api.method),
                      }"
                      x-text="api.method || '?'"></span>
                  </td>
                  <td class="px-3 py-2 font-mono text-slate-600 break-all" x-text="api.path || api.full_url_example || ''"></td>
                  <td class="px-3 py-2">
                    <div class="flex flex-wrap gap-1">
                      <template x-for="code in (api.status_codes_seen || [])" :key="code">
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono"
                          :class="{
                            'bg-emerald-50 text-emerald-600': code < 300,
                            'bg-amber-50 text-amber-600': code >= 300 && code < 400,
                            'bg-rose-50 text-rose-500': code >= 400,
                          }"
                          x-text="code"></span>
                      </template>
                    </div>
                  </td>
                  <td class="px-3 py-2">
                    <template x-if="api.auth && api.auth.required">
                      <span class="px-1.5 py-0.5 rounded text-[10px] bg-rose-50 text-rose-500" x-text="api.auth.type || '需认证'"></span>
                    </template>
                    <template x-if="!api.auth || !api.auth.required">
                      <span class="text-[10px] text-slate-300">—</span>
                    </template>
                  </td>
                  <td class="px-3 py-2 text-slate-400 text-[11px] max-w-xs truncate" x-text="api.purpose || (api.notes || []).join('; ') || ''"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <template x-if="!crawlerResultsData.apis.length">
            <div class="text-center py-8 text-sm text-slate-400">暂无 API 数据</div>
          </template>
        </div>
      </template>

      <!-- Mappings tab -->
      <template x-if="!crawlerResultsLoading && crawlerResultsData && crawlerResultsTab === 'mappings'">
        <div class="space-y-2">
          <template x-for="(map, i) in crawlerResultsData.mappings" :key="map.id || i">
            <div class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
              <div class="flex items-center gap-2 mb-1.5">
                <span class="text-sm font-medium text-slate-700" x-text="map.page_name || map.page_id"></span>
                <a :href="map.page_url" target="_blank" class="text-[10px] text-blue-400 hover:text-blue-600 truncate" x-text="map.page_url"></a>
              </div>
              <!-- on_load APIs -->
              <template x-if="map.on_load && map.on_load.length">
                <div class="mb-1.5">
                  <p class="text-[10px] text-slate-400 mb-1">页面加载时:</p>
                  <div class="flex flex-wrap gap-1">
                    <template x-for="(api, j) in map.on_load" :key="j">
                      <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-amber-50 text-amber-600" x-text="(api.method || 'GET') + ' ' + (api.path || '')"></span>
                    </template>
                  </div>
                </div>
              </template>
              <!-- actions -->
              <template x-if="map.actions && map.actions.length">
                <div>
                  <p class="text-[10px] text-slate-400 mb-1">用户操作:</p>
                  <div class="space-y-1">
                    <template x-for="(action, j) in map.actions" :key="action.action_id || j">
                      <div class="flex items-center gap-2 text-[11px]">
                        <span class="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-500" x-text="action.trigger_type || 'action'"></span>
                        <span class="text-slate-600" x-text="action.action_name || action.trigger_label || ''"></span>
                        <template x-if="action.result && action.result.status">
                          <span class="px-1.5 py-0.5 rounded text-[10px]"
                            :class="{
                              'bg-emerald-50 text-emerald-600': action.result.status === 'success',
                              'bg-rose-50 text-rose-500': action.result.status === 'denied' || action.result.status === 'failure',
                              'bg-slate-100 text-slate-500': action.result.status === 'noop',
                            }"
                            x-text="action.result.status"></span>
                        </template>
                        <template x-if="action.apis && action.apis.length">
                          <span class="text-slate-300">→</span>
                          <template x-for="(api, k) in action.apis" :key="k">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-amber-50 text-amber-600" x-text="(api.method || 'GET') + ' ' + (api.path || '')"></span>
                          </template>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <template x-if="!crawlerResultsData.mappings.length">
            <div class="text-center py-8 text-sm text-slate-400">暂无映射数据</div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- New Project Group Modal -->

  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-md mx-4 border border-slate-200/60 overflow-hidden" @click.stop>

      </div>
    </div>
    <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2">
      <button @click="showGroupModal = false" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition">取消</button>
      <button @click="createProjectGroup()" :disabled="!projectGroupForm.title" class="px-4 py-2 text-sm rounded-xl bg-brand-500 text-white font-medium hover:bg-brand-600 transition disabled:opacity-30">创建</button>
    </div>
  </div>
</div>

<!-- Delete Project Group Confirmation -->
<div x-show="showDeleteGroupModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showDeleteGroupModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-md p-6 border border-slate-200/60" @click.stop>
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="text-sm font-semibold text-slate-700">删除项目</h3>
        <p class="mt-1 text-xs text-slate-400">即将删除项目「<span class="font-medium text-slate-600" x-text="deleteGroupConfirm.title"></span>」及其下所有任务、漏洞、黑板事项和爬虫数据。此操作不可撤销。</p>
      </div>
    </div>
    <div class="mt-5 flex justify-end gap-2">
      <button @click="showDeleteGroupModal = false" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition">取消</button>
      <button @click="confirmDeleteProjectGroup()" class="px-4 py-2 text-sm rounded-xl bg-rose-500 text-white font-medium hover:bg-rose-600 transition">确认删除</button>
    </div>
  </div>
</div>

<!-- Delete Project -->
<div x-show="showDeleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="closeDeleteModal()">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-md p-6 border border-slate-200/60" @click.stop>
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6"/><path d="M19 6l-.63 11.338A2 2 0 0 1 16.37 19.5H7.63a2 2 0 0 1-1.997-2.162L5 6"/><path d="M10 10.5v5"/><path d="M14 10.5v5"/></svg>
      </div>
      <div class="min-w-0 flex-1">
        <h3 class="text-base font-semibold text-slate-700">删除项目</h3>
        <p class="text-sm text-slate-500 mt-1 leading-relaxed">
          将永久删除
          <span class="font-medium text-slate-700 break-all" x-text="deleteConfirmLabel()"></span>.
        </p>
        <p class="text-xs text-slate-400 mt-3">此操作不可撤销。</p>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-6">
      <button @click="closeDeleteModal()" :disabled="isDeletingProject" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">取消</button>
      <button @click="confirmDeleteProject()" :disabled="isDeletingProject" class="px-4 py-2 text-sm bg-rose-500 text-white rounded-xl font-medium hover:bg-rose-600 transition shadow-sm shadow-rose-200 disabled:opacity-40 disabled:cursor-not-allowed">
        <span x-text="isDeletingProject ? '删除中...' : '删除'"></span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div x-show="toast && toast.show" x-cloak
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0 translate-y-2"
  class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium"
  :class="(toast && toast.type) === 'error' ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'">
  <span x-text="toast ? toast.message : ''"></span>
</div>

</body>
