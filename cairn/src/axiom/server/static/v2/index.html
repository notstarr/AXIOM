<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AXIOM penetration testing orchestration console">
  <title>AXIOM</title>
  <link rel="icon" href="/static/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/static/v2/app.css">
  <script src="/static/vendor/cytoscape.min.js"></script>
  <script src="/static/vendor/dagre.min.js"></script>
  <script src="/static/vendor/cytoscape-dagre.js"></script>
  <script defer src="/static/v2/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app-main">跳到主内容</a>
  <header class="topbar">
    <button class="brand" data-nav="dashboard" aria-label="AXIOM 首页">
      <img src="/static/logo.jpg" alt="AXIOM">
      <span>AXIOM</span>
      <small>control plane</small>
    </button>
    <nav class="primary-nav" aria-label="主导航">
      <button data-nav="dashboard">概览</button>
      <button data-nav="tasks">任务</button>
      <button data-nav="projects">项目</button>
      <button data-nav="vulnerabilities">漏洞</button>
      <button data-nav="settings">设置</button>
    </nav>
    <div class="topbar-status">
      <span class="status-dot" id="api-dot"></span>
      <span id="api-status">连接中</span>
      <button class="icon-button" id="refresh-button" title="刷新数据" aria-label="刷新数据">↻</button>
    </div>
  </header>
  <main id="app-main" tabindex="-1"></main>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
