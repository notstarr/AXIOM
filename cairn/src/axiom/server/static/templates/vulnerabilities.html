<!-- ═══════════ VULNERABILITY PAGE ═══════════ -->
<div x-show="activePage === 'vulnerabilities'" x-cloak class="flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800 tracking-tight">漏洞管理</h2>
      <p class="text-xs text-slate-400 mt-0.5">跨任务聚合漏洞，按卡片查看证据、影响和修复建议</p>
    </div>
    <div class="flex-1"></div>
    <button @click="showVulnBoard = !showVulnBoard" class="h-8 px-3 rounded-lg border border-slate-200 text-xs transition"
      :class="showVulnBoard ? 'bg-brand-500 text-white border-brand-500' : 'text-slate-600 hover:bg-slate-50'">
      <span x-show="!showVulnBoard">看板视图</span>
      <span x-show="showVulnBoard">列表视图</span>
    </button>
    <button @click="loadAllProjectDetails(true)" class="h-8 px-3 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50 transition">刷新</button>
  </header>
  <!-- Filter bar - sticky above scroll area -->
  <div class="shrink-0 px-5 py-3 border-b border-slate-100 bg-white">
    <div class="flex items-center gap-3">
      <input x-model="vulnFilter.keyword" placeholder="搜索标题、类型、描述" class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
      <select x-model="vulnFilter.projectId" class="px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
        <option value="">全部任务</option>
        <template x-for="p in projects" :key="`vuln-filter-${p.id}`">
          <option :value="p.id" x-text="`${p.id} ${p.title}`"></option>
        </template>
      </select>
      <button @click="openVulnEditor()" class="px-3 py-2 text-xs rounded-lg bg-rose-500 text-white hover:bg-rose-600">新增漏洞</button>
    </div>
    <p class="mt-2 text-xs text-slate-400" x-text="`显示 ${filteredVulnerabilities().length} / ${allVulnerabilities().length}`"></p>
  </div>

  <main class="flex-1 min-h-0 p-5">
    <!-- Board view -->
    <template x-if="showVulnBoard">
      <div class="grid grid-cols-4 gap-4 h-full overflow-x-auto">
        <div class="space-y-2">
          <div class="flex items-center gap-2 px-1 pb-2">
            <span class="h-2 w-2 rounded-full bg-amber-400"></span>
            <span class="text-xs font-semibold text-slate-600">待确认</span>
            <span class="text-[10px] text-slate-400" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'pending').length"></span>
          </div>
          <template x-for="v in filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'pending')" :key="v.id + v.project_id">
            <div @click="openVulnStatusQuick(v)" class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm card-hover cursor-pointer min-w-0 overflow-hidden">
              <p class="text-sm font-medium text-slate-700 truncate" x-text="v.title"></p>
              <p class="text-[10px] text-slate-400 mt-1 font-mono truncate" x-text="v.project_id"></p>
            </div>
          </template>
        </div>
        <div class="space-y-2">
          <div class="flex items-center gap-2 px-1 pb-2">
            <span class="h-2 w-2 rounded-full bg-rose-400"></span>
            <span class="text-xs font-semibold text-slate-600">已验证</span>
            <span class="text-[10px] text-slate-400" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'verified').length"></span>
          </div>
          <template x-for="v in filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'verified')" :key="v.id + v.project_id">
            <div @click="openVulnStatusQuick(v)" class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm card-hover cursor-pointer min-w-0 overflow-hidden">
              <p class="text-sm font-medium text-slate-700 truncate" x-text="v.title"></p>
              <p class="text-[10px] text-slate-400 mt-1 font-mono truncate" x-text="v.project_id"></p>
            </div>
          </template>
        </div>
        <div class="space-y-2">
          <div class="flex items-center gap-2 px-1 pb-2">
            <span class="h-2 w-2 rounded-full bg-slate-400"></span>
            <span class="text-xs font-semibold text-slate-600">忽略</span>
            <span class="text-[10px] text-slate-400" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'ignored').length"></span>
          </div>
          <template x-for="v in filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'ignored')" :key="v.id + v.project_id">
            <div @click="openVulnStatusQuick(v)" class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm card-hover cursor-pointer min-w-0 overflow-hidden">
              <p class="text-sm font-medium text-slate-700 truncate" x-text="v.title"></p>
              <p class="text-[10px] text-slate-400 mt-1 font-mono truncate" x-text="v.project_id"></p>
            </div>
          </template>
        </div>
        <div class="space-y-2">
          <div class="flex items-center gap-2 px-1 pb-2">
            <span class="h-2 w-2 rounded-full bg-rose-400"></span>
            <span class="text-xs font-semibold text-slate-600">重复</span>
            <span class="text-[10px] text-slate-400" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'duplicate').length"></span>
          </div>
          <template x-for="v in filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'duplicate')" :key="v.id + v.project_id">
            <div @click="openVulnStatusQuick(v)" class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm card-hover cursor-pointer min-w-0 overflow-hidden">
              <p class="text-sm font-medium text-slate-700 truncate" x-text="v.title"></p>
              <p class="text-[10px] text-slate-400 mt-1 font-mono truncate" x-text="v.project_id"></p>
            </div>
          </template>
        </div>
      </div>
    </template>
    <!-- List view -->
    <template x-if="!showVulnBoard">
      <div class="grid grid-cols-[340px_minmax(0,1fr)] gap-4 flex-1 min-h-0 h-full">
        <aside class="rounded-2xl border border-slate-200 bg-white shadow-sm p-3 overflow-y-auto overflow-x-hidden space-y-2">
          <template x-if="filteredVulnerabilities().length === 0">
            <div class="px-4 py-10 text-sm text-center text-slate-400">暂无漏洞记录</div>
          </template>
          <template x-for="v in filteredVulnerabilities()" :key="`${v.project_id}-${v.id}`">
           <button type="button" @click="selectedVulnerabilityKey = vulnerabilityKey(v)" class="w-full flex flex-col items-start text-left rounded-xl border p-3 transition overflow-hidden"
            :class="selectedVulnerabilityKey === vulnerabilityKey(v) ? 'border-rose-200 bg-rose-50/60' : 'border-slate-200 hover:bg-slate-50'">
            <div class="flex items-center gap-1.5">
              <span class="px-1.5 py-0.5 rounded-md text-[9px] font-semibold whitespace-nowrap" :class="vulnSeverityClass(v.severity)" x-text="vulnSeverityLabel(v.severity)"></span>
              <span
                role="button"
                tabindex="0"
                @click.stop="openVulnStatusQuick(v)"
                @keydown.enter.prevent.stop="openVulnStatusQuick(v)"
                @keydown.space.prevent.stop="openVulnStatusQuick(v)"
                class="px-1.5 py-0.5 rounded-md text-[9px] font-semibold whitespace-nowrap cursor-pointer border"
                :class="vulnStatusClass(v.status)"
                x-text="vulnStatusLabel(v.status)"></span>
            </div>
            <p class="mt-1.5 text-sm font-semibold text-slate-700 line-clamp-2" x-text="v.title"></p>
          </button>
          </template>
        </aside>
        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-y-auto">
          <template x-if="!selectedVulnerability()">
            <div class="h-full min-h-[420px] flex items-center justify-center text-sm text-slate-400">请选择左侧漏洞查看详情</div>
          </template>
          <template x-if="selectedVulnerability()">
            <article>
              <div class="px-5 py-4 border-b border-rose-100 bg-rose-50/60">
                 <div class="flex flex-wrap items-center gap-2">
                  <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[10px] font-mono font-bold" x-text="selectedVulnerability().id"></span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold" :class="vulnSeverityClass(selectedVulnerability().severity)" x-text="vulnSeverityLabel(selectedVulnerability().severity)"></span>
                  <button type="button" @click="openVulnStatusQuick(selectedVulnerability())" class="px-2 py-0.5 rounded-md text-[10px] font-semibold" :class="vulnStatusClass(selectedVulnerability().status)" x-text="vulnStatusLabel(selectedVulnerability().status)"></button>
                  <span class="text-[11px] text-slate-400" x-text="`${selectedVulnerability().project_group_title || '未归属项目'} / ${selectedVulnerability().task_title || selectedVulnerability().project_id}`"></span>
                </div>
                <h3 class="mt-3 text-lg font-semibold text-slate-800 break-words" x-text="selectedVulnerability().title"></h3>
                <div class="mt-2 flex gap-2">
                  <button @click="editVuln(selectedVulnerability())" class="text-[10px] px-2 py-0.5 rounded border border-slate-200 text-slate-500 hover:bg-slate-50">编辑</button>
                  <button @click="deleteVuln(selectedVulnerability())" class="text-[10px] px-2 py-0.5 rounded border border-rose-200 text-rose-500 hover:bg-rose-50">删除</button>
                  <button @click="exportVulnMd(selectedVulnerability())" class="text-[10px] px-2 py-0.5 rounded border border-emerald-200 text-emerald-600 hover:bg-emerald-50 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    导出 MD
                  </button>
                </div>
              </div>
              <div class="p-5 space-y-4">
                <div>
                  <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1">描述</p>
                  <p class="text-sm text-slate-700 whitespace-pre-wrap break-words" x-text="selectedVulnerability().description"></p>
                </div>
                <div x-show="selectedVulnerability().prerequisites">
                  <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1">利用前提</p>
                  <p class="text-sm text-slate-700 whitespace-pre-wrap break-words" x-text="selectedVulnerability().prerequisites"></p>
                </div>
                <div>
                  <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1">影响</p>
                  <p class="text-sm text-slate-700 whitespace-pre-wrap break-words" x-text="selectedVulnerability().impact"></p>
                </div>
                <template x-if="(selectedVulnerability().evidence || []).length > 0">
                  <div>
                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1">证据</p>
                    <ul class="list-disc ml-5 space-y-1">
                      <template x-for="(ev, idx) in (selectedVulnerability().evidence || [])" :key="`${selectedVulnerability().id}-page-ev-${idx}`">
                        <li class="text-xs text-slate-600 break-words" x-text="ev"></li>
                      </template>
                    </ul>
                  </div>
                </template>
                <template x-if="(selectedVulnerability().reproduction_steps || []).length > 0">
                  <div>
                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1">复现步骤</p>
                    <ol class="list-none ml-2 space-y-1">
                      <template x-for="(step, idx) in (selectedVulnerability().reproduction_steps || [])" :key="`${selectedVulnerability().id}-page-step-${idx}`">
                        <li class="text-xs text-slate-600 break-words" x-text="step"></li>
                      </template>
                    </ol>
                  </div>
                </template>
              </div>
            </article>
          </template>
        </section>
      </div>
    </template>
  </main>
</div>

<!-- Quick Status Modal -->
<div x-show="vulnStatusQuick.open" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center overlay" @click.self="closeVulnStatusQuick()">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4" @click.stop>
    <div class="px-5 py-4 border-b border-slate-200">
      <h3 class="text-sm font-semibold text-slate-700">漏洞状态</h3>
      <p class="mt-1 text-xs text-slate-500 break-all" x-text="`${vulnStatusQuick.id} · ${vulnStatusQuick.title}`"></p>
    </div>
    <div class="p-5 grid grid-cols-2 gap-3">
      <button type="button" @click="saveVulnStatusQuick('待确认')" class="px-3 py-2.5 rounded-lg border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 text-sm font-medium">待确认</button>
      <button type="button" @click="saveVulnStatusQuick('已验证')" class="px-3 py-2.5 rounded-lg border border-blue-300 bg-blue-50 text-blue-800 hover:bg-blue-100 text-sm font-medium">已验证</button>
      <button type="button" @click="saveVulnStatusQuick('忽略')" class="px-3 py-2.5 rounded-lg border border-slate-300 bg-slate-50 text-slate-800 hover:bg-slate-100 text-sm font-medium">忽略</button>
      <button type="button" @click="saveVulnStatusQuick('重复')" class="px-3 py-2.5 rounded-lg border border-rose-300 bg-rose-50 text-rose-800 hover:bg-rose-100 text-sm font-medium">重复</button>
    </div>
    <div class="px-5 py-3 border-t border-slate-200 flex justify-end">
      <button @click="closeVulnStatusQuick()" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500">取消</button>
    </div>
  </div>
</div>

<!-- Vuln Editor Modal -->
<div x-show="vulnEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="vulnEditor.open = false">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[85vh] overflow-y-auto mx-4" @click.stop>
    <div class="sticky top-0 bg-white px-5 py-3 border-b border-slate-200 flex items-center gap-3 z-10 rounded-t-2xl">
      <h3 class="text-sm font-semibold text-slate-700" x-text="vulnEditor.isNew ? '新增漏洞' : '编辑漏洞'"></h3>
      <div class="flex-1"></div>
      <button @click="vulnEditor.open = false" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
    </div>
    <div class="p-5 space-y-3">
      <input x-model="vulnEditor.project_id" placeholder="项目ID (如 proj_042)" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" :disabled="!vulnEditor.isNew">
      <input x-model="vulnEditor.title" placeholder="标题 *" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">严重程度</label>
        <div class="flex gap-2">
          <template x-for="sev in ['critical','high','medium','low','info']" :key="sev">
            <button type="button" @click="vulnEditor.severity = sev" class="px-3 py-1.5 rounded-lg text-[11px] font-semibold transition border"
              :class="vulnEditor.severity === sev ? vulnSeverityClass(sev) : 'border-slate-200 text-slate-400 hover:bg-slate-50'"
              x-text="vulnSeverityLabel(sev)"></button>
          </template>
        </div>
      </div>
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">状态</label>
        <select x-model="vulnEditor.status" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white">
          <option value="待确认">待确认</option>
          <option value="已验证">已验证</option>
          <option value="忽略">忽略</option>
          <option value="重复">重复</option>
        </select>
      </div>
      <textarea x-model="vulnEditor.description" rows="3" placeholder="描述 *" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></textarea>
      <textarea x-model="vulnEditor.prerequisites" rows="2" placeholder="利用前提" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></textarea>
      <textarea x-model="vulnEditor.impact" rows="2" placeholder="影响 *" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></textarea>
      <textarea x-model="vulnEditor.evidence" rows="3" placeholder="证据（每行一条）" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></textarea>
      <textarea x-model="vulnEditor.reproduction_steps" rows="3" placeholder="复现步骤（每行一条）" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></textarea>
    </div>
    <div class="sticky bottom-0 bg-white px-5 py-3 border-t border-slate-200 flex justify-end gap-2 rounded-b-2xl">
      <button @click="vulnEditor.open = false" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500">取消</button>
      <button @click="saveVuln()" class="px-4 py-2 text-sm rounded-xl bg-rose-500 text-white hover:bg-rose-600">保存</button>
    </div>
  </div>
</div>
