<div x-show="activePage === 'guard-audit'" x-cloak class="flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 shrink-0">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h2 class="text-base font-semibold text-slate-800 tracking-tight">守门审计日志</h2>
        <p class="text-xs text-slate-400 mt-0.5">记录 bootstrap / explore 工具调用的裁判放行与拦截结果</p>
      </div>
      <button @click="loadGuardAuditEvents()" :disabled="guardAudit.loading"
        class="px-4 py-2 text-sm border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 transition disabled:opacity-40"
        x-text="guardAudit.loading ? '刷新中...' : '刷新'">
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-5 space-y-4">
    <section class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="space-y-1">
          <label class="text-[11px] font-medium text-slate-500">日志状态</label>
          <select x-model="guardAudit.decision" @change="loadGuardAuditEvents()"
            class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
            <option value="all">全部</option>
            <option value="block">仅拦截</option>
            <option value="allow">仅放行</option>
          </select>
        </div>
        <div class="space-y-1 md:col-span-2">
          <label class="text-[11px] font-medium text-slate-500">任务筛选</label>
          <select x-model="guardAudit.project_id" @change="loadGuardAuditEvents()"
            class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
            <option value="">全部任务</option>
            <template x-for="p in projects" :key="'guard-audit-project-' + p.id">
              <option :value="p.id" x-text="`${p.title || p.id} · ${p.id}`"></option>
            </template>
          </select>
        </div>
      </div>
    </section>

    <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-slate-700">裁判记录</h3>
        <span class="text-xs text-slate-400" x-text="`${(guardAudit.events || []).length} 条`"></span>
      </div>

      <template x-if="guardAudit.loading && (!guardAudit.events || guardAudit.events.length === 0)">
        <div class="p-8 text-center text-sm text-slate-400">正在加载审计日志...</div>
      </template>
      <template x-if="!guardAudit.loading && (!guardAudit.events || guardAudit.events.length === 0)">
        <div class="p-8 text-center text-sm text-slate-400">暂无裁判记录</div>
      </template>

      <div class="divide-y divide-slate-100">
        <template x-for="event in guardAudit.events" :key="event.id">
          <article class="p-4 hover:bg-slate-50/70 transition">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-2 py-0.5 rounded-lg text-[11px] font-semibold border"
                    :class="event.decision === 'BLOCK' ? 'bg-rose-50 text-rose-600 border-rose-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100'"
                    x-text="guardAuditStatusLabel(event)"></span>
                  <span class="text-xs font-mono text-slate-400" x-text="event.tool_name || 'tool'"></span>
                  <span class="text-xs text-slate-300">·</span>
                  <span class="text-xs text-slate-500" x-text="event.phase || 'unknown phase'"></span>
                  <span class="text-xs text-slate-300">·</span>
                  <span class="text-xs text-slate-500" x-text="event.worker || 'unknown worker'"></span>
                </div>
                <p class="mt-2 text-sm font-medium text-slate-700 truncate" x-text="guardAuditCommandPreview(event)"></p>
                <p class="mt-1 text-xs text-slate-500">
                  <span x-text="guardAuditProjectLabel(event.project_id)"></span>
                  <span class="text-slate-300 mx-1">·</span>
                  <span x-text="event.intent_id || '无 intent' "></span>
                </p>
                <p class="mt-2 text-xs" :class="event.decision === 'BLOCK' ? 'text-rose-600' : 'text-slate-500'">
                  原因：<span x-text="guardAuditReason(event)"></span>
                </p>
              </div>
              <div class="text-right shrink-0">
                <p class="text-xs text-slate-400" x-text="formatDate(event.created_at)"></p>
                <p class="mt-1 text-[11px] text-slate-400" x-text="`${event.decision_source || 'unknown'} · ${event.mode || ''}`"></p>
              </div>
            </div>

            <div class="mt-3 flex items-center gap-2">
              <button @click="guardAudit.expanded[event.id] = !guardAudit.expanded[event.id]"
                class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg text-slate-500 hover:bg-white transition"
                x-text="guardAudit.expanded[event.id] ? '收起具体命令' : '查看具体命令'"></button>
              <span x-show="event.model_latency_ms" class="text-[11px] text-slate-400" x-text="`模型 ${event.model_latency_ms}ms`"></span>
            </div>

            <pre x-show="guardAudit.expanded[event.id]" x-cloak class="mt-3 max-h-80 overflow-auto rounded-xl bg-slate-950 text-slate-100 text-xs p-3 whitespace-pre-wrap" x-text="guardAuditDetail(event)"></pre>
          </article>
        </template>
      </div>
    </section>
  </main>
</div>
