  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0">
    <button @click="backToList()" class="p-1.5 rounded-lg hover:bg-slate-100 transition text-slate-400 hover:text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <span class="text-base font-semibold text-slate-800 tracking-tight">操作回溯</span>
        <span class="px-2 py-0.5 rounded-md bg-brand-50 text-brand-600 text-[10px] font-semibold">实时</span>
      </div>
      <p class="mt-0.5 text-xs text-slate-400 truncate" x-text="actionReplayProjectTitle ? `${actionReplayProjectTitle} · ${actionReplayProjectId}` : '请选择任务'"></p>
    </div>
    <div class="flex-1"></div>
    <div class="flex flex-wrap items-center gap-2 text-[11px] text-slate-500">
      <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200" x-text="`Worker ${actionReplayWorkers().length}`"></span>
      <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200" x-text="`工具 ${toolExecutions.length}`"></span>
      <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200" x-text="`配置 ${dispatchVersionLabel()}`"></span>
      <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200" x-text="`生效 ${dispatcherAppliedLabel()}`"></span>
      <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 max-w-[260px] truncate" :title="actionReplayBootstrapOutcome()" x-text="actionReplayBootstrapOutcome()"></span>
    </div>
    <div class="flex items-center gap-1.5 ml-1">
      <button @click="loadToolExecutions()" class="h-7 px-2.5 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition inline-flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
        刷新
      </button>
    </div>
  </header>

  <div class="px-4 py-3 border-b border-slate-200 bg-slate-50/60">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">当前可用工具</span>
      <template x-if="enabledPiTools().length === 0">
        <span class="text-xs text-slate-400">暂无已启用工具</span>
      </template>
      <template x-for="toolName in enabledPiTools()" :key="`enabled-pi-tool-${toolName}`">
        <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs text-slate-600" x-text="toolName"></span>
      </template>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="px-4 py-2 border-b border-slate-100 bg-white flex items-center gap-2">
    <select x-model="toolFilterType" class="h-7 px-2 rounded-md border border-slate-200 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-100">
      <option value="">全部工具</option>
      <option value="bash">bash</option>
      <option value="read">read</option>
      <option value="write">write</option>
      <option value="edit">edit</option>
    </select>
    <input type="text" x-model="toolFilterSearch" placeholder="搜索参数或输出..." class="flex-1 h-7 px-2.5 rounded-md border border-slate-200 text-xs text-slate-600 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-100">
    <span class="text-[11px] text-slate-400 tabular-nums" x-text="`${toolExecutions.length} 条`"></span>
  </div>

  <!-- Skill usage stats bar -->
  <div class="px-4 py-2 border-b border-slate-100 bg-slate-50/60" x-show="skillUsage.length > 0">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Skill 调用</span>
      <span class="text-[11px] text-slate-400 tabular-nums" x-text="`共 ${skillUsage.reduce((a,s)=>a+s.count,0)} 次`"></span>
      <button x-show="skillUsageFilter" @click="skillUsageFilter = ''" class="px-2 py-0.5 rounded-md text-[10px] bg-amber-50 text-amber-600 border border-amber-200 hover:bg-amber-100">清除过滤</button>
      <template x-for="su in skillUsage" :key="su.skill">
        <button @click="skillUsageFilter = (skillUsageFilter === su.skill ? '' : su.skill)"
          class="px-2.5 py-1 rounded-lg text-xs transition border"
          :class="skillUsageFilter === su.skill ? 'bg-brand-500 text-white border-brand-500' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'">
          <span x-text="su.skill"></span>
          <span class="ml-1 tabular-nums opacity-70" x-text="su.count"></span>
        </button>
      </template>
    </div>
  </div>

  <div class="flex-1 min-h-0" style="display:flex;flex-direction:column;">
    <section class="flex-1 bg-white overflow-y-auto p-4 space-y-3" x-ref="actionReplayScroll">
      <!-- ═══════════ TOOL EXECUTION CARDS ═══════════ -->
      <div x-show="!filteredToolExecutions() || filteredToolExecutions().length === 0" class="rounded-2xl border border-dashed border-slate-200 bg-slate-50/50 px-5 py-14 text-center text-sm text-slate-400">
        <p x-show="skillUsageFilter">无「<span x-text="skillUsageFilter"></span>」调用记录</p>
        <p x-show="!skillUsageFilter">暂无工具调用记录</p>
        <p class="mt-1 text-xs text-slate-300" x-show="!skillUsageFilter">等待任务执行后自动采集</p>
      </div>
      <template x-for="te in filteredToolExecutions()" :key="te.id">
        <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/80 flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-bold uppercase tracking-wider bg-slate-100 text-slate-600" x-text="te.tool"></span>
            <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-600" x-text="te.status"></span>
            <span class="flex-1"></span>
            <span class="text-[11px] text-slate-400" x-text="te.created_at"></span>
          </div>
          <div class="p-4 space-y-3">
            <div x-show="te.argv && te.argv.length > 1" class="rounded-xl border border-brand-100 bg-brand-50/40 p-3">
              <p class="text-[10px] font-semibold text-brand-500 uppercase tracking-widest mb-2">参数</p>
              <pre class="text-[12px] text-slate-700 whitespace-pre-wrap break-words font-mono" x-text="te.argv.slice(1).join('\n')"></pre>
            </div>
            <div x-show="te.stdout" class="rounded-xl border border-slate-200 bg-slate-50/70 p-3">
              <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-2">输出</p>
              <pre class="text-[12px] text-slate-700 whitespace-pre-wrap break-words font-mono max-h-96 overflow-y-auto" x-text="te.stdout"></pre>
            </div>
            <div x-show="te.stderr" class="rounded-xl border border-rose-100 bg-rose-50/40 p-3">
              <p class="text-[10px] font-semibold text-rose-500 uppercase tracking-widest mb-2">错误</p>
              <pre class="text-[12px] text-rose-700 whitespace-pre-wrap break-words font-mono max-h-48 overflow-y-auto" x-text="te.stderr"></pre>
            </div>
          </div>
        </div>
      </template>
    </section>
  </div>
  <!-- Scroll to bottom button -->
  <button @click="scrollReplayToBottom()" class="fixed bottom-6 right-6 w-10 h-10 rounded-full bg-brand-500 text-white shadow-lg hover:bg-brand-600 transition flex items-center justify-center z-50" title="滚动到底部">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
