<!-- ═══════════ PROMPTS MEMO PAGE ═══════════ -->
<div x-show="activePage === 'prompts'" x-cloak class="flex-1 flex flex-col overflow-hidden min-w-0"
     x-init="loadPrompts()" @keydown.meta.k.prevent="showPromptSearch = true">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center justify-between shrink-0">
    <div>
      <h1 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
        <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/>
        </svg>
        提示词备忘录
      </h1>
      <p class="text-xs text-slate-400 mt-0.5">存放常用的提示词脚本，点击即可复制</p>
    </div>
    <div class="flex items-center gap-2">
      <div class="relative">
        <input type="text" x-model="promptSearch" placeholder="搜索提示词…"
               class="h-8 w-48 rounded-lg border border-slate-200 bg-white px-3 pl-8 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500">
        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <select x-model="promptFilter" class="h-8 rounded-lg border border-slate-200 bg-white px-2 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/30">
        <option value="">全部分类</option>
        <template x-for="cat in promptCategories()" :key="cat">
          <option :value="cat" x-text="cat"></option>
        </template>
      </select>
      <button @click="showPromptEditor = true; editingPrompt = null; newPrompt = { title: '', category: '通用', content: '' }"
              class="h-8 px-3 rounded-lg bg-brand-500 text-white text-xs font-medium hover:bg-brand-600 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        新建
      </button>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto p-5">
    <!-- Empty state -->
    <div x-show="filteredPrompts().length === 0" class="flex flex-col items-center justify-center py-20 text-center">
      <div class="w-16 h-16 rounded-2xl bg-brand-50 flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-brand-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/>
        </svg>
      </div>
      <p class="text-sm text-slate-500 font-medium" x-text="promptSearch || promptFilter ? '没有匹配的提示词' : '还没有保存的提示词'"></p>
      <p class="text-xs text-slate-400 mt-1" x-show="!promptSearch && !promptFilter">点击上方「新建」开始添加</p>
    </div>

    <!-- Cards grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <template x-for="prompt in filteredPrompts()" :key="prompt.id">
        <div class="group rounded-2xl border border-slate-200 bg-white hover:border-brand-200 hover:shadow-md transition overflow-hidden">
          <!-- Card header -->
          <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-brand-50 text-brand-600 text-[10px] font-medium" x-text="prompt.category"></span>
              <h3 class="text-sm font-medium text-slate-700 truncate" x-text="prompt.title"></h3>
            </div>
            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
              <button @click="editPrompt(prompt)" class="p-1 rounded-md hover:bg-slate-100 text-slate-400 hover:text-slate-600" title="编辑">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></svg>
              </button>
              <button @click="deletePrompt(prompt.id)" class="p-1 rounded-md hover:bg-rose-50 text-slate-400 hover:text-rose-500" title="删除">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14Z"/></svg>
              </button>
            </div>
          </div>
          <!-- Card content -->
          <div class="p-4">
            <pre class="text-[11px] text-slate-600 font-mono whitespace-pre-wrap break-words max-h-32 overflow-y-auto leading-relaxed" x-text="prompt.content"></pre>
          </div>
          <!-- Card footer -->
          <div class="px-4 py-2 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
            <span class="text-[10px] text-slate-400" x-text="'创建于 ' + formatShortDate(prompt.created_at)"></span>
            <button @click="copyPromptContent(prompt)"
                    class="text-[11px] text-brand-500 hover:text-brand-600 transition flex items-center gap-1"
                    :class="{ 'text-emerald-500': prompt._copied }">
              <svg x-show="!prompt._copied" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg x-show="prompt._copied" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
              <span x-text="prompt._copied ? '已复制' : '复制'"></span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </main>
</div>

<!-- ═══════════ PROMPT EDITOR MODAL ═══════════ -->
<div x-show="showPromptEditor" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showPromptEditor = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden" @keyup.escape.window="showPromptEditor = false">
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-base font-semibold text-slate-800" x-text="editingPrompt ? '编辑提示词' : '新建提示词'"></h2>
      <button @click="showPromptEditor = false" class="p-1 rounded-lg hover:bg-slate-100 text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-5 space-y-4">
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-xs font-medium text-slate-500 mb-1">标题</label>
          <input type="text" x-model="newPrompt.title" placeholder="输入提示词标题…"
                 class="w-full h-9 rounded-lg border border-slate-200 px-3 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500">
        </div>
        <div class="w-36">
          <label class="block text-xs font-medium text-slate-500 mb-1">分类</label>
          <input type="text" x-model="newPrompt.category" placeholder="如：渗透测试" list="prompt-category-list"
                 class="w-full h-9 rounded-lg border border-slate-200 px-3 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500">
          <datalist id="prompt-category-list">
            <option value="通用"></option>
            <option value="渗透测试"></option>
            <option value="代码审查"></option>
            <option value="漏洞分析"></option>
            <option value="报告生成"></option>
            <option value="爬虫"></option>
          </datalist>
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">提示词内容</label>
        <textarea x-model="newPrompt.content" rows="12" placeholder="输入提示词内容…"
                  class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 placeholder-slate-400 font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 resize-y"></textarea>
      </div>
    </div>
    <div class="px-5 py-4 border-t border-slate-100 bg-slate-50/50 flex justify-end gap-2">
      <button @click="showPromptEditor = false" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50 transition">取消</button>
      <button @click="savePrompt()" :disabled="!newPrompt.title || !newPrompt.content"
              class="px-4 py-2 rounded-lg bg-brand-500 text-white text-sm font-medium hover:bg-brand-600 transition disabled:opacity-40 disabled:cursor-not-allowed">
        保存
      </button>
    </div>
  </div>
</div>

<!-- ═══════════ NOTIFICATIONS PANEL ═══════════ -->
<div x-show="notifications.length > 0" x-cloak class="fixed top-3 right-3 z-[55] w-80 space-y-2 pointer-events-none">
  <template x-for="notif in notifications.slice(0, 5)" :key="notif.id">
    <div class="rounded-xl shadow-lg p-3 pointer-events-auto toast-enter"
      :class="{
        'bg-white border border-slate-200': notif.type === 'info',
        'bg-emerald-50 border border-emerald-200': notif.type === 'success',
        'bg-rose-50 border border-rose-200': notif.type === 'error',
        'bg-amber-50 border border-amber-200': notif.type === 'warning',
      }">
      <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
          <p class="text-xs font-medium text-slate-700" x-text="notif.title || '通知'"></p>
          <p class="text-[11px] text-slate-400 mt-0.5" x-text="notif.message"></p>
        </div>
        <button @click="dismissNotification(notif.id)" class="text-slate-300 hover:text-slate-500 shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </template>
</div>
