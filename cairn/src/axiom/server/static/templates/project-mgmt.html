<!-- ═══════════ PROJECT MANAGEMENT PAGE ═══════════ -->
<div x-show="activePage === 'projects'" x-cloak class="flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800 tracking-tight">项目管理</h2>
      <p class="text-xs text-slate-400 mt-0.5">查看项目基础信息，并在项目内维护黑板事项</p>
    </div>
    <div class="flex-1"></div>
    <button @click="openGroupModal()" class="h-8 px-3 rounded-lg border border-brand-200 text-xs text-brand-600 hover:bg-brand-50 transition">新建项目</button>
    <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="h-8 px-3 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50 disabled:opacity-40 transition">刷新</button>
  </header>
  <main class="flex-1 overflow-hidden grid grid-cols-[280px_minmax(0,1fr)]">
    <aside class="border-r border-slate-200 bg-white overflow-y-auto overflow-x-hidden p-3 space-y-2">
      <template x-if="projectGroups.length === 0">
        <p class="text-sm text-slate-400 text-center py-10">暂无项目</p>
      </template>
      <template x-for="p in projectGroups" :key="p.id">
        <button type="button" @click="selectManagedProject(p.id)" class="w-full flex flex-col items-start text-left rounded-xl border p-3 transition overflow-hidden"
          :class="selectedProjectManagementId === p.id ? 'border-brand-200 bg-brand-50/60' : 'border-slate-200 bg-white hover:bg-slate-50'">
          <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold whitespace-nowrap" :class="p.status === 'active' ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-500'" x-text="p.status === 'active' ? '启用' : '已归档'"></span>
          <p class="mt-1.5 text-sm font-semibold text-slate-700 line-clamp-2" x-text="p.title"></p>
        </button>
      </template>
    </aside>
    <section class="overflow-y-auto p-5 space-y-4">
      <template x-if="!selectedProjectGroup()">
        <div class="rounded-2xl border border-dashed border-slate-200 bg-white px-5 py-14 text-center text-slate-400">请选择一个项目</div>
      </template>
      <template x-if="selectedProjectGroup()">
        <div class="space-y-4">
          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm p-5">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-mono text-xs text-slate-400 tabular-nums" x-text="selectedProjectGroup().id"></span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold" :class="selectedProjectGroup().status === 'active' ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-500'" x-text="selectedProjectGroup().status === 'active' ? '启用' : '已归档'"></span>
                </div>
                <h3 class="mt-2 text-lg font-semibold text-slate-800" x-text="selectedProjectGroup().title"></h3>
                <p class="mt-1 text-xs text-slate-400" x-text="selectedProjectGroup().description || '暂无项目说明'"></p>
              </div>
              <div class="flex gap-2">
                <button @click="openTaskComposer(selectedProjectGroup().id); navigateTo('tasks')" class="px-3 py-2 text-sm rounded-xl border border-brand-200 text-brand-600 hover:bg-brand-50 transition">新建关联任务</button>
                <button @click="deleteProjectGroup(selectedProjectGroup().id, selectedProjectGroup().title)" class="px-3 py-2 text-sm rounded-xl border border-rose-200 text-rose-500 hover:bg-rose-50 transition">删除项目</button>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3">
              <div class="rounded-xl bg-slate-50 p-3"><p class="text-xs text-slate-400">任务</p><p class="mt-1 text-xl font-semibold tabular-nums" x-text="selectedProjectGroup().task_count"></p></div>
              <div class="rounded-xl bg-teal-50 p-3"><p class="text-xs text-teal-600">运行中</p><p class="mt-1 text-xl font-semibold text-teal-700 tabular-nums" x-text="selectedProjectGroup().active_task_count"></p></div>
              <div class="rounded-xl bg-rose-50 p-3"><p class="text-xs text-rose-600">漏洞</p><p class="mt-1 text-xl font-semibold text-rose-700 tabular-nums" x-text="selectedProjectGroup().vuln_count"></p></div>
              <div class="rounded-xl bg-sky-50 p-3"><p class="text-xs text-sky-600">黑板</p><p class="mt-1 text-xl font-semibold text-sky-700 tabular-nums" x-text="selectedProjectGroup().blackboard_count"></p></div>
            </div>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4">
            <div class="flex items-center justify-between gap-3 mb-3">
              <h3 class="text-sm font-semibold text-slate-700">关联任务</h3>
              <span class="text-xs text-slate-400" x-text="`${selectedProjectGroupTasks().length} 个任务`"></span>
            </div>
            <template x-if="selectedProjectGroupTasks().length === 0">
              <div class="rounded-xl border border-dashed border-slate-200 px-4 py-8 text-center text-sm text-slate-400">这个项目下还没有任务</div>
            </template>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
              <template x-for="task in selectedProjectGroupTasks()" :key="`managed-task-${task.id}`">
                <button type="button" @click="selectedProjectManagementTaskId = task.id; loadProjectDetailForManagement(task.id)" class="text-left rounded-xl border p-3 transition"
                  :class="selectedProjectManagementTaskId === task.id ? 'border-brand-200 bg-brand-50/50' : 'border-slate-200 hover:bg-slate-50'">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-mono text-[11px] text-slate-400" x-text="task.id"></span>
                    <div class="flex items-center gap-1.5">
                      <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold" :class="task.kk_report_enabled ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'" x-text="task.kk_report_enabled ? 'KK开' : 'KK关'"></span>
                      <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold" :class="projectStatusBadgeClass(task.status)" x-text="projectStatusLabel(task.status)"></span>
                    </div>
                  </div>
                  <p class="mt-2 text-sm font-semibold text-slate-700 break-words" x-text="task.title"></p>
                  <p class="mt-1 text-xs text-slate-400" x-text="`${task.fact_count} 事实 · ${task.intent_count} 意图`"></p>
                </button>
              </template>
            </div>
          </section>

          <section class="rounded-2xl border border-sky-200/70 bg-white shadow-sm p-4 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <div>
                <h3 class="text-sm font-semibold text-slate-700">黑板</h3>
                <p class="text-xs text-slate-400 mt-0.5" x-text="`${groupBlackboardItems().length} 条，自动注入到任务 prompt 中`"></p>
              </div>
              <button @click="openBlackboardEditor(null, true)" x-show="selectedProjectManagementId"
                class="px-3 py-1.5 text-xs bg-sky-500 text-white rounded-lg hover:bg-sky-600 transition">添加</button>
            </div>
            <template x-if="groupBlackboardItems().length === 0">
              <div class="rounded-xl border border-dashed border-slate-200 px-4 py-8 text-center text-sm text-slate-400">暂无黑板内容</div>
            </template>
            <template x-for="item in groupBlackboardItems()" :key="item.id">
              <div class="rounded-xl border border-sky-100 bg-white p-4">
                <p class="text-sm font-medium text-slate-700 whitespace-pre-wrap break-words" x-text="item.title || item.content"></p>
                <p class="mt-1 text-xs text-slate-500 whitespace-pre-wrap break-words" x-show="item.title && item.content" x-text="item.content"></p>
                <p class="mt-1.5 text-[11px] text-sky-500 inline-flex items-center gap-1" x-show="item.hint">
                  <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                  <span x-text="item.hint"></span>
                </p>
                <div class="mt-3 flex items-center justify-between gap-2">
                  <span class="text-[11px] text-slate-400" x-text="`${item.creator} · ${formatTime(item.updated_at || item.created_at)}`"></span>
                  <div class="flex gap-2" x-show="selectedProjectManagementId">
                    <button @click="openBlackboardEditor(item, true)" class="px-2 py-1 text-[11px] text-slate-500 hover:bg-slate-50 rounded-md transition">编辑</button>
                    <button @click="deleteBlackboardItem(item.id)" class="px-2 py-1 text-[11px] text-rose-500 hover:bg-rose-50 rounded-md transition">删除</button>
                  </div>
                </div>
              </div>
            </template>
          </section>

        </div>
      </template>
    </section>
  </main>
</div>
