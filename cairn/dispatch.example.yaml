server: http://127.0.0.1:8888
common_env:
  TSEC_SERVER_HOST: "<YOUR_TSEC_SERVER>:8000"
  TSEC_AGENT_TOKEN: "<YOUR_TSEC_TOKEN>"
runtime:
  interval: 3
  max_workers: 8
  max_running_projects: 3
  max_project_workers: 4
  healthcheck_timeout: 60
  worker_healthcheck: startup_only
  prompt_group: default
tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 90
  reason:
    timeout: 300
    max_intents: 3
    depth_max_intents: 5
  explore:
    timeout: 600
    conclude_timeout: 150
workers:
- name: deepseekv4-pro
  type: pi
  task_types:
  - bootstrap
  - explore
  - plan
  max_running: 2
  priority: 1
  env:
    PI_MODEL: deepseek-v4-pro
    PI_BASE_URL: "<YOUR_LLM_PROXY_BASE_URL>"
    PI_API_KEY: "<YOUR_PI_API_KEY>"
    PI_PROVIDER_API: openai-completions
    PI_MODEL_CONTEXT_WINDOW: '200000'
- name: qwen3.6-plus
  type: pi
  task_types:
  - bootstrap
  - reason
  - explore
  - plan
  max_running: 2
  priority: 1
  env:
    PI_MODEL: qwen3.6-plus
    PI_BASE_URL: "<YOUR_LLM_PROXY_BASE_URL>"
    PI_API_KEY: "<YOUR_PI_API_KEY>"
    PI_PROVIDER_API: openai-completions
    PI_MODEL_CONTEXT_WINDOW: '200000'
- name: stepfun-flash
  type: pi
  task_types:
  - maintainer
  max_running: 2
  priority: 2
  env:
    PI_MODEL: step-3.7-flash
    PI_BASE_URL: "<YOUR_LLM_PROXY_BASE_URL>"
    PI_API_KEY: "<YOUR_PI_API_KEY>"
    PI_PROVIDER_API: openai-completions
    PI_MODEL_CONTEXT_WINDOW: '200000'
