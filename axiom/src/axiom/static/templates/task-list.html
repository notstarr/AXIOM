<div x-show="activePage === 'tasks'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <span class="text-base font-semibold text-slate-800 tracking-tight">任务管理</span>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-3 text-[11px] text-slate-400">
      <span class="inline-flex items-center gap-1.5 shrink-0" title="全部未归档任务">
        <span class="font-medium uppercase tracking-[0.12em] text-slate-400">全部</span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="activeProjectsCount()"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="运行中任务">
        <span class="h-1.5 w-1.5 rounded-full bg-teal-500"></span>
        <span class="font-semibold text-teal-700 tabular-nums" x-text="countProjectsByStatus('active')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="已暂停任务">
        <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
        <span class="font-semibold text-amber-700 tabular-nums" x-text="countProjectsByStatus('stopped')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="已完成任务">
        <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="countProjectsByStatus('completed')"></span>
      </span>
    </div>
    <div class="flex items-center gap-1.5">
      <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="sto-ghost" style="padding:6px 11px; font-size:12px;">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
        刷新
      </button>
      <button @click="showTaskComposer ? (showTaskComposer = false) : openTaskComposer()" class="sto-btn" style="padding:6px 11px; font-size:12px;">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        新建任务
      </button>
    </div>
  </header>

  <div x-ref="projectListScroll" class="flex-1 min-h-0 p-4 flex flex-col gap-3">
    <div class="sto-panel" style="padding:9px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; border-radius:12px;">
      <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input x-model="taskSearch" placeholder="搜索任务名称、ID、Origin、Goal 或所属项目" class="sto-input" style="flex:1; padding:7px 12px; font-size:12.5px; border:none; background:transparent;">
      <select x-model="taskStatusFilter" class="sto-input" style="width:auto; padding:7px 10px; font-size:12px;">
        <option value="all">全部状态</option><option value="active">运行中</option><option value="stopped">已暂停</option><option value="completed">已完成</option><option value="failed">失败</option><option value="archived">已归档</option>
      </select>
      <span class="text-[11px] text-slate-400 tabular-nums" x-text="`${filteredTasks().length} / ${taskStatusFilter === 'archived' ? archivedProjectsCount() : activeProjectsCount()}`"></span>
    </div>
    <!-- New Task overlay -->
    <div x-show="showTaskComposer" x-cloak class="fixed inset-0 z-50 flex items-start justify-center overlay pt-10" @click.self="showTaskComposer = false">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto mx-4" @click.stop>
        <div class="sticky top-0 bg-white px-6 py-4 border-b border-slate-200 flex items-center justify-between gap-4 z-10 rounded-t-2xl">
          <div>
            <h3 class="text-base font-semibold text-slate-800">新建任务</h3>
            <p class="mt-0.5 text-[11px] text-slate-400" x-text="taskComposerStep === 1 ? '第一步：基础信息' : '第二步：其他设置'"></p>
          </div>
          <div class="flex items-center gap-2 ml-auto" aria-label="创建任务步骤">
            <button type="button" @click="taskComposerStep = 1" aria-label="前往第一步：基础信息" title="基础信息"
              class="h-2 rounded-full transition-all hover:opacity-80"
              :class="taskComposerStep === 1 ? 'w-8 bg-brand-500' : 'w-2 bg-brand-200'"></button>
            <button type="button" @click="taskComposerStep = 2" aria-label="前往第二步：其他设置" title="其他设置"
              class="h-2 rounded-full transition-all hover:opacity-80"
              :class="taskComposerStep === 2 ? 'w-8 bg-brand-500' : 'w-2 bg-slate-200'"></button>
          </div>
          <button @click="showTaskComposer = false" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
        </div>
        <div class="p-6">
          <!-- Step 1: basic task information only -->
          <div x-show="taskComposerStep === 1" class="space-y-5">
            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">任务名称</label>
              <input x-model="newProject.title" placeholder="例：第一轮渗透测试" autofocus class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">测试入口 / 初始信息</label>
              <textarea x-model="newProject.origin" rows="4" placeholder="例如：&#10;https://api.example.com&#10;微信小程序“测试商城”，AppID wx123，重点测试投诉与退款流程&#10;Android App 安装包或 HAR 文件及使用说明"
                class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"></textarea>
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">任务目标</label>
              <textarea x-model="newProject.goal" rows="3"
                class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"></textarea>
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">任务模式</label>
              <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5 text-xs">
                <button type="button" @click="setEngagementMode('vulnerability')"
                  class="px-3 py-1.5 rounded-md transition"
                  :class="newProject.engagement_mode !== 'red_team' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">漏洞挖掘</button>
                <button type="button" @click="setEngagementMode('red_team')"
                  class="px-3 py-1.5 rounded-md transition"
                  :class="newProject.engagement_mode === 'red_team' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">红队</button>
              </div>
            </div>
          </div>

          <!-- Step 2: optional and operational settings -->
          <div x-show="taskComposerStep === 2" x-cloak class="space-y-5">
            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">所属项目</label>
              <select x-model="newProject.parent_project_id" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
                <option value="">选择所属项目</option>
                <template x-for="group in projectGroups" :key="`new-task-group-${group.id}`">
                  <option :value="group.id" x-text="group.title"></option>
                </template>
              </select>
            </div>

            <div class="rounded-xl border border-slate-200 bg-slate-50/60 p-4">
              <div class="flex flex-wrap items-start justify-between gap-3">
                <div>
                  <p class="text-xs font-semibold text-slate-600">本次运行时长</p>
                  <p class="mt-0.5 text-[11px] text-slate-400">从任务创建开始按自然时间计时，到期后自动暂停。</p>
                </div>
                <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5 text-xs">
                  <button type="button" @click="newProject.run_time_limited = false"
                    class="px-3 py-1.5 rounded-md transition"
                    :class="!newProject.run_time_limited ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">不限时</button>
                  <button type="button" @click="newProject.run_time_limited = true"
                    class="px-3 py-1.5 rounded-md transition"
                    :class="newProject.run_time_limited ? 'bg-brand-500 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">限时运行</button>
                </div>
              </div>
              <div x-show="newProject.run_time_limited" x-cloak class="mt-3 grid grid-cols-2 gap-3">
                <label class="text-[11px] text-slate-400">小时
                  <input type="number" min="0" max="8760" step="1" x-model.number="newProject.run_hours"
                    class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl bg-white text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-brand-100">
                </label>
                <label class="text-[11px] text-slate-400">分钟
                  <input type="number" min="0" max="59" step="1" x-model.number="newProject.run_minutes"
                    class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl bg-white text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-brand-100">
                </label>
              </div>
              <p class="mt-3 text-[11px]" :class="newProjectRunDurationValid() ? 'text-slate-500' : 'text-rose-600'"
                x-text="runDeadlinePreview(newProject.run_time_limited, newProject.run_hours, newProject.run_minutes)"></p>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="text-xs font-semibold text-slate-500">参与 Worker</label>
                <div class="flex items-center gap-2 text-[10px]">
                  <button type="button" @click="newProject.worker_pool = ((dispatchSettings && dispatchSettings.workers) || []).filter(w => w && w.name && !w.disabled).map(w => w.name)" class="text-brand-600 hover:underline">全选</button>
                  <button type="button" @click="newProject.worker_pool = []" class="text-slate-400 hover:underline">清空</button>
                </div>
              </div>
              <template x-if="!(dispatchSettings && dispatchSettings.workers && dispatchSettings.workers.length)">
                <p class="text-[11px] text-slate-400">尚未配置 Worker，请先在设置中添加</p>
              </template>
              <div class="space-y-1.5 max-h-40 overflow-y-auto border border-slate-100 rounded-xl p-2 bg-slate-50/60">
                <template x-for="worker in (dispatchSettings && dispatchSettings.workers) || []" :key="`new-task-worker-${worker.name}`">
                  <label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-white cursor-pointer" :class="worker.disabled ? 'opacity-40' : ''">
                    <input type="checkbox" :value="worker.name" x-model="newProject.worker_pool" :disabled="worker.disabled" class="rounded border-slate-300 text-brand-500 focus:ring-brand-200">
                    <span class="text-xs font-medium text-slate-700" x-text="worker.name"></span>
                    <span x-show="worker.disabled" class="px-1.5 py-0.5 rounded text-[9px] font-semibold bg-slate-200 text-slate-500">已停用</span>
                    <span class="ml-auto text-[10px] text-slate-400" x-text="(worker.task_types || []).join(' / ')"></span>
                  </label>
                </template>
              </div>
              <p class="mt-1 text-[10px] text-slate-400">默认选择全部启用的 Worker；清空表示不限制 Worker。</p>
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">网络范围（可选）</label>
              <p class="mb-2 text-[11px] text-slate-400">填写任一名单即启用 Scope；两者都为空时不设置网络范围，也不会从测试入口自动补充。</p>
              <textarea x-model="newProject.task_scope_targets" rows="2" placeholder="白名单：api.example.com 或 *.example.com，每行一个"
                class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 mb-2"></textarea>
              <textarea x-model="newProject.task_scope_exclude" rows="2" placeholder="黑名单：forbidden.example.com，每行一个；黑名单优先"
                class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"></textarea>
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">提示（Hints）</label>
              <textarea x-model="newProject.hints" rows="4" placeholder="提供给 Bootstrap 和后续 Reason 的任务提示&#10;例：系统使用 JWT 认证，优先检查权限边界"
                class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"></textarea>
            </div>

            <div>
              <button type="button" @click="newProject.guard_enabled = !newProject.guard_enabled; newProject._guardTouched = true"
                class="h-11 px-3 rounded-xl border text-sm font-medium transition flex items-center justify-between"
                :class="newProject.guard_enabled ? 'border-rose-300 bg-rose-50 text-rose-700' : 'border-slate-300 bg-slate-100 text-slate-500'"
                title="开启后 Bootstrap / Explore 的工具调用会经过白名单、硬规则和裁判模型">
                <span>裁判监管</span>
                <span class="px-2 py-0.5 rounded-lg text-xs font-semibold bg-white/90 border border-current/20" x-text="newProject.guard_enabled ? '开启' : '关闭'"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="sticky bottom-0 bg-white px-6 py-4 border-t border-slate-200 flex items-center justify-between gap-2 rounded-b-2xl">
          <button x-show="taskComposerStep === 1" @click="showTaskComposer = false" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50">取消</button>
          <button x-show="taskComposerStep === 2" @click="taskComposerStep = 1" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50">上一步</button>
          <button x-show="taskComposerStep === 1" @click="taskComposerStep = 2"
            class="ml-auto px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium hover:bg-brand-600 transition shadow-sm shadow-brand-200">下一步</button>
          <button x-show="taskComposerStep === 2" @click="createProject()"
            :disabled="!newProject.parent_project_id || !String(newProject.title || '').trim() || !String(newProject.origin || '').trim() || !String(newProject.goal || '').trim() || !newProjectRunDurationValid()"
            class="ml-auto px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium hover:bg-brand-600 transition disabled:opacity-30 shadow-sm shadow-brand-200">创建任务</button>
        </div>
      </div>
    </div>
    <template x-if="projects.length === 0">
      <div class="flex flex-col items-center justify-center h-full text-slate-400">
        <img src="/static/favicon.svg" alt="" class="w-20 h-20 mb-5 opacity-30">
        <p class="text-lg font-medium text-slate-500">还没有任务</p>
        <p class="text-sm mt-1">新建一个任务开始测试</p>
      </div>
    </template>

    <div class="grid grid-cols-[320px_minmax(0,1fr)] gap-4 flex-1 min-h-0">
      <aside class="sto-panel sto-vlist" style="padding:10px; overflow-y:auto; overflow-x:hidden;">
        <template x-if="filteredTasks().length === 0">
          <p class="text-sm text-slate-400 text-center py-10">没有匹配的任务</p>
        </template>
        <template x-for="p in filteredTasks()" :key="p.id">
          <button type="button" :data-task-management-id="p.id" @click="selectTaskManagement(p.id)" class="sto-navitem"
            :class="selectedTaskManagementId === p.id ? 'active' : ''">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="sto-livedot" :class="p.status === 'active' ? (p.working_intent_count > 0 ? 'run' : 'idle') : (p.status === 'completed' ? 'done' : '')"
                  :title="p.status === 'active' ? (p.working_intent_count > 0 ? `运行中 · ${p.working_intent_count} 个意图执行中` : '运行中 · 空闲') : projectStatusLabel(p.status)"></span>
                <span class="font-mono text-[11px] text-slate-400" x-text="p.id"></span>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <span x-show="p.guard_enabled" class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold bg-rose-50 text-rose-700">监管开</span>
                <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold" :class="projectStatusBadgeClass(p.status)" x-text="projectStatusLabel(p.status)"></span>
                <span x-show="p.archived" class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold bg-slate-200 text-slate-600">已归档</span>
              </div>
            </div>
            <p class="mt-2 text-sm font-semibold text-slate-700 break-words" x-text="p.title"></p>
            <p class="mt-1 text-xs text-slate-400 truncate" x-text="projectGroupTitle(p.parent_project_id)"></p>
            <div class="mt-2 flex items-center gap-2 text-[10px] tabular-nums">
              <span class="text-slate-400"><span x-text="p.fact_count"></span> 事实 · <span x-text="p.intent_count"></span> 意图</span>
              <span x-show="p.working_intent_count > 0" class="font-semibold" style="color: var(--sto-warn);" x-text="`${p.working_intent_count} 执行中`"></span>
            </div>
            <div x-show="taskRunWindowLabel(p)" class="mt-2 flex items-center justify-between gap-2 rounded-lg border px-2 py-1.5"
              :class="taskRunWindowClass(p)">
              <span class="text-[10px] font-semibold tabular-nums" x-text="taskRunWindowLabel(p)"></span>
              <span class="text-[9px] opacity-75 truncate" x-text="taskRunDeadlineLabel(p)"></span>
            </div>
          </button>
        </template>
      </aside>
      <section class="sto-panel" style="padding:18px 20px; overflow-y:auto;">
        <template x-if="!selectedTaskSummary()">
          <div class="h-full min-h-[420px] flex items-center justify-center text-sm text-slate-400">请选择左侧任务查看详情</div>
        </template>
        <template x-if="selectedTaskSummary()">
          <div class="space-y-5">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-mono text-xs text-slate-400" x-text="selectedTaskSummary().id"></span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold" :class="selectedTaskSummary().guard_enabled ? 'bg-rose-50 text-rose-700' : 'bg-slate-100 text-slate-500'" x-text="selectedTaskSummary().guard_enabled ? '监管开启' : '监管关闭'"></span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold" :class="projectStatusBadgeClass(selectedTaskSummary().status)" x-text="projectStatusLabel(selectedTaskSummary().status)"></span>
                  <span x-show="selectedTaskSummary().archived" class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-200 text-slate-600">已归档</span>
                  <span x-show="selectedTaskSummary().legacy_readonly" class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-100 text-slate-500">旧任务只读</span>
                </div>
                <h3 class="mt-2 text-xl font-semibold text-slate-800 break-words" x-text="selectedTaskSummary().title"></h3>
                <p class="mt-1 text-xs text-brand-600" x-text="`所属项目：${projectGroupTitle(selectedTaskSummary().parent_project_id)}`"></p>
                <div x-show="taskRunWindowLabel(selectedTaskSummary())" class="mt-2 inline-flex flex-wrap items-center gap-x-2 gap-y-1 rounded-lg border px-2.5 py-1.5"
                  :class="taskRunWindowClass(selectedTaskSummary())">
                  <span class="text-xs font-semibold tabular-nums" x-text="taskRunWindowLabel(selectedTaskSummary())"></span>
                  <span class="text-[10px] opacity-75" x-text="taskRunDeadlineLabel(selectedTaskSummary())"></span>
                </div>
              </div>
              <div class="flex flex-wrap gap-2">
                <button x-show="!selectedTaskSummary().archived" @click="openTaskOverview(selectedTaskSummary().id)" class="sto-btn">打开概览</button>
                <button x-show="!selectedTaskSummary().archived" @click="openTaskGraph(selectedTaskSummary().id)" class="sto-ghost is-brand">打开图谱</button>
                <button x-show="!selectedTaskSummary().legacy_readonly && !selectedTaskSummary().archived" @click="openRenameProject(selectedTaskSummary().id, selectedTaskSummary().title)" class="sto-ghost">重命名</button>
              </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div class="sto-statcell"><p class="sto-label">事实</p><p class="mt-1 text-xl font-semibold tabular-nums" x-text="selectedTaskSummary().fact_count"></p></div>
              <div class="sto-statcell"><p class="sto-label" style="color:var(--sto-accent);">意图</p><p class="mt-1 text-xl font-semibold text-violet-700 tabular-nums" x-text="selectedTaskSummary().intent_count"></p></div>
              <div class="sto-statcell"><p class="sto-label" style="color:var(--sto-warn);">执行中</p><p class="mt-1 text-xl font-semibold text-amber-700 tabular-nums" x-text="selectedTaskSummary().working_intent_count"></p></div>
              <div class="sto-statcell"><p class="sto-label" style="color:var(--sto-ok);">Hints</p><p class="mt-1 text-xl font-semibold text-sky-700 tabular-nums" x-text="selectedTaskSummary().hint_count"></p></div>
            </div>
            <details class="sto-collapse" style="margin-top:14px;">
              <summary>任务诊断</summary>
              <div class="sto-collapse-body">
            <div style="padding:0;" x-data="{ activeDiagnosticPhase: 'bootstrap' }" x-init="
              const diagPick = () => {
                const val = selectedTaskDiagnostics();
                if (!val) return;
                const cur = activeDiagnosticPhase;
                const curBoard = val.worker_rankings && val.worker_rankings.boards ? val.worker_rankings.boards[cur] : null;
                if (curBoard && (curBoard.total || 0) > 0) return;
                const order = ['bootstrap', 'explore', 'reason', 'plan', 'review'];
                for (const p of order) {

                  x-text="selectedTaskSummary().guard_enabled ? '关闭守卫' : '开启守卫'"></button>
                <button x-show="!selectedTaskSummary().legacy_readonly && !selectedTaskSummary().archived" @click="archiveProjectById(selectedTaskSummary().id, selectedTaskSummary().title)" :disabled="selectedTaskSummary().status === 'active'" :title="selectedTaskSummary().status === 'active' ? '请先暂停任务' : '归档后保留全部历史，但不再进入 Worker 调度'" class="px-3 py-2 text-sm rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-50 transition disabled:cursor-not-allowed disabled:opacity-40">归档任务</button>
                <button x-show="!selectedTaskSummary().legacy_readonly && selectedTaskSummary().archived" @click="unarchiveProjectById(selectedTaskSummary().id, selectedTaskSummary().title)" class="px-3 py-2 text-sm rounded-xl border border-emerald-200 text-emerald-700 hover:bg-emerald-50 transition">恢复任务</button>
                <button x-show="!selectedTaskSummary().legacy_readonly && selectedTaskSummary().archived" @click="deleteProjectById(selectedTaskSummary().id, selectedTaskSummary().title)" class="px-3 py-2 text-sm rounded-xl border border-rose-200 text-rose-500 hover:bg-rose-50 transition">永久删除</button>
              </div>
            </div>
          </div>
        </template>
      </section>
    </div>
  </div>
</div>
