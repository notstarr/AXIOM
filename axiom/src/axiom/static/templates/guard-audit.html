<div x-show="activePage === 'guard-audit'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 shrink-0">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h2 class="text-base font-semibold text-slate-800 tracking-tight">守门审计日志</h2>
        <p class="text-xs text-slate-400 mt-0.5">只记录 explore 工具调用的护栏裁决；其余阶段的判定不回显到审计</p>
      </div>
      <button @click="loadGuardAuditEvents()" :disabled="guardAudit.loading" class="sto-ghost" style="padding:7px 13px;"
        x-text="guardAudit.loading ? '刷新中...' : '刷新'">
      </button>
    </div>
  </header>

  <main class="guard-audit-main flex-1 overflow-hidden p-5" style="background:var(--sto-inset);">

    <!-- 左栏：筛选 + 统计（与右栏顶部对齐） -->
    <div class="sto-panel" style="padding:15px 16px;">
      <div class="guard-audit-railhead">
        <p class="sto-label">筛选</p>
      </div>
      <div class="sto-field" style="margin-top:10px;">
        <label>日志状态</label>
        <select x-model="guardAudit.decision" @change="applyGuardAuditFilter()" class="sto-input">
          <option value="all">全部</option>
          <option value="block">仅拦截</option>
          <option value="allow">仅放行</option>
        </select>
      </div>
      <div class="sto-field" style="margin-top:10px;">
        <label>任务筛选</label>
        <select x-model="guardAudit.project_id" @change="loadGuardAuditEvents()" class="sto-input">
          <option value="">全部任务</option>
          <template x-for="p in projects" :key="'guard-audit-project-' + p.id">
            <option :value="p.id" x-text="`${p.title || p.id} · ${p.id}`"></option>
          </template>
        </select>
      </div>

      <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--sto-line);">
        <p class="sto-label">概览</p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px;">
          <div @click="guardAudit.decision = 'all'; applyGuardAuditFilter()" class="sto-minicard" :class="guardAudit.decision === 'all' ? 'stat-active' : ''" title="查看全部">
            <div class="k">总记录</div><b x-text="guardAuditCounts().total"></b>
          </div>
          <div @click="guardAudit.decision = 'block'; applyGuardAuditFilter()" class="sto-minicard" :class="guardAudit.decision === 'block' ? 'stat-active' : ''" title="只看拦截">
            <div class="k" style="color:var(--sto-danger);">拦截</div><b style="color:var(--sto-danger);" x-text="guardAuditCounts().blocked"></b>
          </div>
          <div @click="guardAudit.decision = 'allow'; applyGuardAuditFilter()" class="sto-minicard" :class="guardAudit.decision === 'allow' ? 'stat-active' : ''" title="只看放行">
            <div class="k" style="color:var(--sto-ok);">放行</div><b style="color:var(--sto-ok);" x-text="guardAuditCounts().allowed"></b>
          </div>
          <div class="sto-minicard">
            <div class="k">拦截率</div><b x-text="`${guardAuditCounts().rate}%`"></b>
          </div>
        </div>
      </div>

      <p class="sto-muted" style="margin-top:14px; font-size:10px; line-height:1.6;">
        仅审计 explore。拦截原因会同时回给发起调用的 worker。<br>统计跟随任务筛选，不随“日志状态”变化。
      </p>
    </div>

    <!-- 右栏：裁判记录 -->
    <div class="sto-panel" style="overflow:auto; min-width:0;">
      <div class="guard-audit-railhead flex items-center justify-between" style="padding:15px 16px; border-bottom:1px solid var(--sto-line);">
        <p class="sto-label">裁判记录</p>
        <span class="sto-muted sto-num" style="font-size:10px;" x-text="`${(guardAudit.events || []).length} 条`"></span>
      </div>

      <template x-if="guardAudit.loading && (!guardAudit.events || guardAudit.events.length === 0)">
        <div class="sto-empty" style="border:0;">正在加载审计日志...</div>
      </template>
      <template x-if="!guardAudit.loading && (!guardAudit.events || guardAudit.events.length === 0)">
        <div class="sto-empty" style="border:0;">暂无裁判记录</div>
      </template>

      <div>
        <template x-for="event in guardAudit.events" :key="event.id">
          <article class="sto-eventrow" :class="event.decision === 'BLOCK' ? 'block' : 'allow'">
            <!-- 左：判定与它作用于什么；右：出处与归属 -->
            <div class="ga-row">
              <div class="ga-main">
                <span class="ga-verdict" :class="event.decision === 'BLOCK' ? 'block' : 'allow'"
                  x-text="guardAuditStatusLabel(event)"></span>
                <p class="ga-content" x-text="guardAuditContent(event)"></p>
                <p class="ga-reason" :class="event.decision === 'BLOCK' ? 'block' : 'allow'"
                  x-text="guardAuditReason(event)"></p>
              </div>

              <dl class="ga-side">
                <div><dt>时间</dt><dd x-text="formatDate(event.created_at)"></dd></div>
                <div><dt>依据</dt><dd x-text="guardAuditSourceLabel(event)"></dd></div>
                <div><dt>模式</dt><dd x-text="guardAuditModeLabel(event)"></dd></div>
                <div><dt>任务</dt><dd x-text="event.project_id || '未知'"></dd></div>
                <div><dt>意图</dt><dd x-text="event.intent_id || '无'"></dd></div>
                <div x-show="event.tool_name"><dt>工具</dt><dd x-text="event.tool_name"></dd></div>
                <div x-show="event.model_latency_ms"><dt>耗时</dt><dd x-text="`${event.model_latency_ms}ms`"></dd></div>
              </dl>
            </div>

            <div class="flex items-center" style="gap:9px; margin-top:8px;">
              <button @click="guardAudit.expanded[event.id] = !guardAudit.expanded[event.id]" class="sto-minibtn"
                x-text="guardAudit.expanded[event.id] ? '收起原始记录' : '原始记录'"></button>
            </div>

            <pre x-show="guardAudit.expanded[event.id]" x-cloak class="sto-usage" style="margin-top:9px; max-height:320px; overflow:auto;" x-text="guardAuditDetail(event)"></pre>
          </article>
        </template>
      </div>
    </div>
  </main>
</div>
