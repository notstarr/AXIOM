<div x-show="activePage === 'guard-audit'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 shrink-0">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h2 class="text-base font-semibold text-slate-800 tracking-tight">守门审计日志</h2>
        <p class="text-xs text-slate-400 mt-0.5">记录 bootstrap / explore 工具调用的裁判放行与拦截结果</p>
      </div>
      <button @click="loadGuardAuditEvents()" :disabled="guardAudit.loading" class="sto-ghost" style="padding:7px 13px;"
        x-text="guardAudit.loading ? '刷新中...' : '刷新'">
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-5 space-y-4" style="background:var(--sto-inset);">
    <!-- 筛选 + 统计 -->
    <div class="sto-panel" style="padding:15px 18px;">
      <div class="sto-grid2" style="grid-template-columns:1fr 2fr; gap:12px;">
        <div class="sto-field">
          <label>日志状态</label>
          <select x-model="guardAudit.decision" @change="loadGuardAuditEvents()" class="sto-input">
            <option value="all">全部</option>
            <option value="block">仅拦截</option>
            <option value="allow">仅放行</option>
          </select>
        </div>
        <div class="sto-field">
          <label>任务筛选</label>
          <select x-model="guardAudit.project_id" @change="loadGuardAuditEvents()" class="sto-input">
            <option value="">全部任务</option>
            <template x-for="p in projects" :key="'guard-audit-project-' + p.id">
              <option :value="p.id" x-text="`${p.title || p.id} · ${p.id}`"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="sto-statflat" style="margin-top:13px;">
        <div><div class="k">总记录</div><b x-text="(guardAudit.events || []).length"></b></div>
        <div><div class="k" style="color:var(--sto-danger);">拦截</div><b style="color:var(--sto-danger);" x-text="(guardAudit.events || []).filter(e => e.decision === 'BLOCK').length"></b></div>
        <div><div class="k" style="color:var(--sto-ok);">放行</div><b style="color:var(--sto-ok);" x-text="(guardAudit.events || []).filter(e => e.decision !== 'BLOCK').length"></b></div>
        <div><div class="k">拦截率</div><b x-text="`${(guardAudit.events || []).length ? Math.round((guardAudit.events || []).filter(e => e.decision === 'BLOCK').length / (guardAudit.events || []).length * 100) : 0}%`"></b></div>
      </div>
    </div>

    <!-- 裁判记录 -->
    <div class="sto-panel" style="overflow:hidden;">
      <div class="flex items-center justify-between" style="padding:11px 16px; border-bottom:1px solid var(--sto-line);">
        <p class="sto-label">裁判记录</p>
        <span class="sto-muted sto-num" style="font-size:10px;" x-text="`${(guardAudit.events || []).length} 条`"></span>
      </div>

      <template x-if="guardAudit.loading && (!guardAudit.events || guardAudit.events.length === 0)">
        <div class="sto-empty" style="border:0;">正在加载审计日志...</div>
      </template>
      <template x-if="!guardAudit.loading && (!guardAudit.events || guardAudit.events.length === 0)">
        <div class="sto-empty" style="border:0;">暂无裁判记录</div>
      </template>

      <div>
        <template x-for="event in guardAudit.events" :key="event.id">
          <article class="sto-eventrow" :class="event.decision === 'BLOCK' ? 'block' : 'allow'">
            <div class="flex items-start justify-between" style="gap:12px;">
              <div style="min-width:0; flex:1;">
                <div class="flex flex-wrap items-center" style="gap:8px;">
                  <span class="sto-status" :class="event.decision === 'BLOCK' ? 'err' : 'ok'"><i></i><span x-text="guardAuditStatusLabel(event)"></span></span>
                  <span class="etool" x-text="event.tool_name || 'tool'"></span>
                  <span class="emeta" x-text="event.phase || 'unknown phase'"></span>
                  <span class="emeta" x-text="event.worker || 'unknown worker'"></span>
                </div>
                <p class="ecmd" x-text="guardAuditCommandPreview(event)"></p>
                <p class="sto-muted" style="margin-top:4px; font-size:10.5px;">
                  <span x-text="guardAuditProjectLabel(event.project_id)"></span>
                  <span style="margin:0 4px;">·</span>
                  <span x-text="event.intent_id || '无 intent'"></span>
                </p>
                <p class="ereason">
                  原因：<span x-text="guardAuditReason(event)"></span>
                </p>
              </div>
              <div style="text-align:right; flex-shrink:0;">
                <p class="sto-muted sto-num" style="font-size:10.5px;" x-text="formatDate(event.created_at)"></p>
                <p class="sto-muted" style="margin-top:3px; font-size:10px;" x-text="`${event.decision_source || 'unknown'} · ${event.mode || ''}`"></p>
              </div>
            </div>

            <div class="flex items-center" style="gap:9px; margin-top:9px;">
              <button @click="guardAudit.expanded[event.id] = !guardAudit.expanded[event.id]" class="sto-minibtn"
                x-text="guardAudit.expanded[event.id] ? '收起具体命令' : '查看具体命令'"></button>
              <span x-show="event.model_latency_ms" class="sto-muted sto-num" style="font-size:10.5px;" x-text="`模型 ${event.model_latency_ms}ms`"></span>
            </div>

            <pre x-show="guardAudit.expanded[event.id]" x-cloak class="sto-usage" style="margin-top:9px; max-height:320px; overflow:auto;" x-text="guardAuditDetail(event)"></pre>
          </article>
        </template>
      </div>
    </div>
  </main>
</div>
