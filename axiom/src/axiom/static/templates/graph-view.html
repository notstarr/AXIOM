<!-- ═══════════ GRAPH VIEW ═══════════ -->
<template x-if="activePage === 'task-detail' && view === 'graph' && !project && taskDetailLoad?.summary === 'error'">
<div class="h-full min-h-0 flex items-center justify-center bg-slate-50/60 p-6">
  <section class="w-full max-w-lg rounded-2xl border border-rose-200 bg-white p-8 text-center shadow-sm">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-rose-50 text-xl text-rose-500">!</div>
    <h2 class="mt-4 text-base font-semibold text-slate-800">任务信息加载失败</h2>
    <p class="mt-2 text-sm leading-6 text-slate-500" x-text="taskDetailLoad?.summaryError || '无法读取任务摘要，请稍后重试。'"></p>
    <div class="mt-5 flex items-center justify-center gap-2">
      <button @click="retryTaskSummary()" class="rounded-xl bg-brand-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-600">重试</button>
      <button @click="backToList()" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50">返回任务列表</button>
    </div>
  </section>
</div>
</template>

<template x-if="activePage === 'task-detail' && view === 'graph' && project">
<div class="flex-1 flex flex-col overflow-hidden min-w-0 relative">
  <header class="app-page-header shrink-0 bg-white/90 backdrop-blur border-b border-slate-200/70 z-[60]">
    <div class="task-detail-toolbar">
      <button @click="backToList()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 transition shrink-0" aria-label="返回任务列表">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="task-detail-title min-w-0">
        <div class="flex items-center gap-2 min-w-0">
          <h2 class="text-base font-semibold text-slate-800 truncate" x-text="project.project.title"></h2>
          <span class="text-[11px] font-mono text-slate-400 shrink-0" x-text="project.project.id"></span>
          <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold shrink-0" :class="projectStatusBadgeClass(project.project.status)" x-text="projectStatusLabel(project.project.status)"></span>
          <span x-show="project.project.archived" class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold bg-slate-200 text-slate-600 shrink-0">已归档</span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5 truncate" x-text="project.project.origin"></p>
      </div>
      <div class="sto-seg" role="group" aria-label="任务视图">
        <button type="button" @click="switchTaskView('human')" :class="view === 'human' ? 'on' : ''" :aria-pressed="view === 'human'">概览</button>
        <button type="button" @click="switchTaskView('graph')" :class="view === 'graph' ? 'on' : ''" :aria-pressed="view === 'graph'">图谱</button>
        <button type="button" @click="switchTaskView('archive')" :class="view === 'archive' ? 'on' : ''" :aria-pressed="view === 'archive'">归档</button>
      </div>
      <div class="task-detail-spacer flex-1"></div>
      <div class="task-detail-actions flex items-center gap-1.5">
        <div class="hidden 2xl:flex items-center gap-3 text-xs text-slate-400 shrink-0">
          <span x-text="taskDetailSectionPending('graph') ? '事实加载中' : `${project.facts.length} 事实`"></span>
          <span x-text="taskDetailSectionPending('graph') ? '意图加载中' : `${project.intents.length} 意图`"></span>
        </div>
        <span x-show="taskRunWindowLabel(project.project)" class="hidden xl:inline-flex items-center rounded-lg border px-2 py-1 text-[10px] font-semibold tabular-nums shrink-0"
          :class="taskRunWindowClass(project.project)" :title="taskRunDeadlineLabel(project.project)" x-text="taskRunWindowLabel(project.project)"></span>
        <button x-show="!replay.active && !project.project.archived && !project.project.legacy_readonly" @click="openRenameProject(project.project.id, project.project.title)"
          class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:border-slate-300 hover:bg-slate-50 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"
          title="重命名任务"
          :aria-label="`重命名 ${project.project.title}`">
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m16.862 4.487 1.65-1.65a1.875 1.875 0 1 1 2.652 2.652l-9.193 9.193a4.5 4.5 0 0 1-1.897 1.13L6 17l1.188-4.074a4.5 4.5 0 0 1 1.13-1.897l8.544-8.542Z"/><path d="M19.5 7.125 16.875 4.5"/><path d="M5.25 18.75h13.5"/></svg>
        </button>
        <template x-if="!replay.active">
          <button @click="startProjectReplay()" class="px-2.5 py-1 rounded-lg border border-violet-200 text-xs text-violet-600 hover:bg-violet-50 transition flex items-center gap-1.5 shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/><path d="M4 5v14"/></svg>
            回放
          </button>
        </template>
        <template x-if="replay.active">
          <div class="flex items-center gap-1.5 rounded-xl border border-violet-200 bg-violet-50/80 px-2 py-1 text-xs text-violet-700 shrink-0">
            <span class="font-medium whitespace-nowrap" x-text="replayProgressLabel()"></span>
            <button @click="toggleProjectReplayPlayback()" class="inline-flex h-6 w-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 hover:bg-white transition" :title="replay.playing ? '暂停回放' : '继续回放'">
              <svg x-show="replay.playing" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 6h3v12H8zM13 6h3v12h-3z"/></svg>
              <svg x-show="!replay.playing" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6V6Z"/></svg>
            </button>
            <select x-model="replay.stepMs" @change="updateReplaySpeed()" class="h-6 rounded-md border border-violet-200 bg-white/80 px-1.5 text-[11px] text-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-100">
              <option value="700">快速</option>
              <option value="1100">正常</option>
              <option value="1600">慢速</option>
            </select>
            <button @click="exitProjectReplay()" class="inline-flex h-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 px-2 hover:bg-white transition">退出</button>
          </div>
        </template>
        <button x-show="!replay.active && !project.project.archived && !project.project.legacy_readonly"
          @click="triggerManualReason()"
          :disabled="!canTriggerManualReason()"
          :title="manualReasonDisabledReason() || '立即触发一次人工 Reason 复盘'"
          class="px-2.5 py-1 rounded-lg border border-brand-500 bg-brand-500 text-xs font-medium text-white hover:bg-brand-600 transition shrink-0 disabled:cursor-not-allowed">
          <span x-text="manualReasonTriggering ? '正在触发…' : '立即 Reason'"></span>
        </button>
        <button x-show="!replay.active && !project.project.archived && !project.project.legacy_readonly"
          @click="toggleProjectGuardById(project.project.id, project.project.guard_enabled)"
          class="px-2.5 py-1 rounded-lg border text-xs transition shrink-0"
          :class="project.project.guard_enabled ? 'border-emerald-200 text-emerald-700 hover:bg-emerald-50' : 'border-rose-200 text-rose-600 hover:bg-rose-50'"
          :title="project.project.guard_enabled ? '关闭当前任务的 Guard 守卫' : '开启当前任务的 Guard 守卫'"
          x-text="project.project.guard_enabled ? '关闭守卫' : '开启守卫'"></button>
        <button x-show="!replay.active && !project.project.archived && !project.project.legacy_readonly && ['active', 'stopped'].includes(project.project.status)"
          @click="toggleProjectStopById(project.project.id, project.project.status)"
          class="px-2.5 py-1 rounded-lg border text-xs transition shrink-0"
          :class="project.project.status === 'active' ? 'border-amber-200 text-amber-600 hover:bg-amber-50' : 'border-teal-200 text-teal-600 hover:bg-teal-50'"
          x-text="project.project.status === 'active' ? '暂停' : '继续'"></button>
        <button x-show="!replay.active && project.project.status === 'completed' && !project.project.archived && !project.project.legacy_readonly" @click="openTaskContinuation(project.project)" class="px-2.5 py-1 rounded-lg border border-amber-300 bg-amber-50 text-xs font-medium text-amber-800 hover:bg-amber-100 transition shrink-0">继续任务</button>
        <button x-show="!replay.active && !project.project.archived && !project.project.legacy_readonly" @click="archiveProjectById(project.project.id, project.project.title)" :disabled="project.project.status === 'active'" :title="project.project.status === 'active' ? '请先暂停任务' : '保留历史并停止后续 Worker 调度'" class="px-2.5 py-1 rounded-lg border border-slate-300 text-xs text-slate-600 hover:bg-slate-50 transition disabled:cursor-not-allowed disabled:opacity-40 shrink-0">归档任务</button>
        <button x-show="!replay.active && project.project.archived && !project.project.legacy_readonly" @click="unarchiveProjectById(project.project.id, project.project.title)" class="px-2.5 py-1 rounded-lg border border-emerald-200 text-xs text-emerald-700 hover:bg-emerald-50 transition shrink-0">恢复任务</button>
        <button x-show="!replay.active && project.project.archived && !project.project.legacy_readonly" @click="deleteProjectById(project.project.id, project.project.title)" class="px-2.5 py-1 rounded-lg border border-rose-200 text-xs text-rose-600 hover:bg-rose-50 transition shrink-0">永久删除</button>
        <button x-show="!replay.active && (project.goal_history || []).length" @click="showGoalHistory = !showGoalHistory; updateGraph()" class="px-2.5 py-1 rounded-lg border text-xs transition shrink-0" :class="showGoalHistory ? 'border-amber-300 bg-amber-50 text-amber-800' : 'border-slate-200 text-slate-500 hover:bg-slate-50'" x-text="showGoalHistory ? '隐藏历史 Goal' : '历史 Goal'"></button>
        <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition flex items-center gap-1.5 disabled:opacity-40 shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
          刷新
        </button>
      </div>
    </div>
  </header>

  <div x-cloak x-show="!project?.project?.archived && (taskDetailLoad?.hydrating || taskDetailHasErrors())"
    class="shrink-0 border-b px-5 py-2 text-xs z-50"
    :class="taskDetailHasErrors() ? 'border-amber-200 bg-amber-50 text-amber-800' : 'border-blue-100 bg-blue-50 text-blue-700'">
    <div class="flex items-center justify-between gap-3">
      <span x-text="taskDetailHasErrors() ? '部分详情加载失败，已加载内容仍可使用。' : '任务摘要已显示，正在后台加载图谱、Todo、漏洞和产物…'"></span>
      <button x-show="taskDetailHasErrors()" @click="retryTaskDetailSection()" class="shrink-0 rounded-lg border border-amber-300 bg-white/70 px-2.5 py-1 font-medium hover:bg-white">重试失败区块</button>
    </div>
  </div>

  <div x-show="project.project.archived" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-50/95 p-6">
    <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
      <div class="mx-auto h-12 w-12 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center text-xl">▣</div>
      <h3 class="mt-4 text-base font-semibold text-slate-800">任务已归档</h3>
      <p class="mt-2 text-sm leading-6 text-slate-500">图谱及其关联产物不会在归档状态下披露。恢复任务后才能查看历史内容。</p>
      <div class="mt-5 flex items-center justify-center gap-2">
        <button @click="unarchiveProjectById(project.project.id, project.project.title)" class="px-4 py-2 rounded-xl bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 transition">恢复任务并查看图谱</button>
        <button @click="deleteProjectById(project.project.id, project.project.title)" class="px-4 py-2 rounded-xl border border-rose-200 text-sm font-medium text-rose-600 hover:bg-rose-50 transition">永久删除</button>
      </div>
    </section>
  </div>

  <div class="flex-1 flex overflow-hidden" id="graphLayout">
    <!-- Graph column -->
    <div class="flex-1 flex flex-col min-w-0">
     <div class="flex-1 relative min-w-0 overflow-hidden">
      <div x-show="taskDetailSectionPending('graph')" class="absolute inset-0 z-30 flex items-center justify-center bg-slate-50/85 backdrop-blur-[1px]">
        <div class="rounded-2xl border border-blue-100 bg-white px-5 py-4 text-sm text-blue-700 shadow-sm">正在加载图谱数据…</div>
      </div>
      <div x-show="taskDetailSectionError('graph')" class="absolute inset-0 z-30 flex items-center justify-center bg-slate-50/90">
        <div class="rounded-2xl border border-rose-200 bg-white px-5 py-4 text-center shadow-sm"><p class="text-sm text-rose-600">图谱加载失败</p><button @click="retryTaskDetailSection('graph')" class="mt-2 text-xs font-medium text-brand-600 hover:underline">重试图谱</button></div>
      </div>
      <button @pointerdown.stop @click="toggleSidePanel()" title="折叠/展开侧面板"
        class="absolute z-30 h-24 w-5 rounded-l-lg border border-r-0 border-slate-200/60 bg-white/90 shadow-sm text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition flex items-center justify-center"
        style="right: 0; top: 50%; transform: translateY(-50%);">
        <svg x-show="!sidePanelCollapsed" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/><path d="m17 7 5 5-5 5"/></svg>
        <svg x-show="sidePanelCollapsed" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/><path d="m7 7-5 5 5 5"/></svg>
      </button>
      <div class="absolute top-3 left-3 z-10 flex items-center gap-1.5">
        <button @click="fitGraph()" class="h-7 w-7 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 text-slate-500 hover:text-slate-700 hover:bg-white transition inline-flex items-center justify-center" title="适配图谱" aria-label="适配图谱">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <select x-model="layoutMode" @change="applySelectedLayout()"
          class="h-7 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 px-2.5 text-xs text-slate-600 hover:bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-300 transition">
          <option value="elk_tb">ELK ↓</option>
          <option value="elk_lr">ELK →</option>
          <option value="dagre_tb">Dagre ↓</option>
          <option value="dagre_lr">Dagre →</option>
        </select>
        <input x-model="graphSearch" @input="searchGraphNodes()" placeholder="搜索节点…" class="h-7 w-36 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 px-2.5 text-xs text-slate-600 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-300 transition">
      </div>

      <!-- Plan 阶段全图背景声呐扩散扫描动画 -->
      <template x-if="project.project.plan && (project.project.plan.status === 'running' || project.project.plan.status === 'concluding' || project.project.phase === 'plan')">
        <div class="graph-plan-sonar">
          <div class="graph-plan-sonar-wave graph-plan-sonar-wave-1"></div>
          <div class="graph-plan-sonar-wave-2"></div>
          <div class="graph-plan-sonar-wave-3"></div>
        </div>
      </template>

      <template x-if="project.project.plan">
        <div class="absolute top-14 right-3 z-10 w-80 max-w-[calc(100vw-1.5rem)] select-none">
          <div class="relative cursor-pointer" @click="planStackExpanded = !planStackExpanded">
            <template x-if="!planStackExpanded && (project.project.queued_plans || []).length > 0">
              <div class="absolute -bottom-2.5 left-2 right-2 h-12 rounded-2xl border border-sky-300/40 bg-sky-50/70 shadow-md backdrop-blur -z-10"></div>
            </template>
            <template x-if="!planStackExpanded && (project.project.queued_plans || []).length > 1">
              <div class="absolute -bottom-4 left-4 right-4 h-12 rounded-2xl border border-sky-300/20 bg-sky-100/40 shadow-sm backdrop-blur -z-20"></div>
            </template>
            <div class="plan-panel-running relative overflow-hidden rounded-2xl border border-sky-200/80 bg-white/92 px-4 py-3.5 shadow-lg shadow-sky-100/60 backdrop-blur transition hover:border-sky-300">
              <div class="flex items-start gap-3">
                <span class="plan-beacon mt-1 shrink-0"></span>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-2">
                    <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-sky-600 flex items-center gap-1.5">
                      <span x-text="project.project.plan.id ? `PlanRun ${project.project.plan.id}` : 'Plan'"></span>
                      <template x-if="(project.project.queued_plan_count || 0) > 0">
                        <span class="px-1.5 py-0.5 text-[9px] font-bold rounded-md bg-sky-500 text-white" x-text="`+${project.project.queued_plan_count ?? project.project.queued_plans.length} 排队`"></span>
                      </template>
                    </div>
                    <div class="flex items-center gap-1">
                      <span class="shrink-0 rounded-full border border-sky-100 bg-sky-50 px-2 py-0.5 text-[10px] font-medium text-sky-700" x-text="project.project.plan.status === 'pending' ? '等待 Plan Worker' : (project.project.plan.status === 'concluding' ? '收口中' : '全景复盘')"></span>
                      <template x-if="(project.project.queued_plans || []).length > 0">
                        <span class="text-xs text-sky-500" x-text="planStackExpanded ? '▲' : '▼'"></span>
                      </template>
                    </div>
                  </div>
                  <div class="mt-0.5 text-sm font-semibold text-slate-700 truncate" x-text="project.project.plan.worker || '等待 Plan Worker'"></div>
                  <p class="mt-2 text-sm font-medium leading-relaxed text-slate-700" x-text="project.project.plan.activity_summary || '正在进行全景深水区复盘' "></p>
                  <div class="mt-2 text-[11px] text-slate-500"><span class="text-slate-400">正在使用</span><span class="ml-2 font-mono font-medium text-slate-600" x-text="project.project.plan.activity_tool || '—'"></span></div>
                  <div class="mt-3 grid grid-cols-2 gap-x-4 gap-y-2 text-[11px] text-slate-500">
                    <div><span class="block text-slate-400">Plan 轮次</span><span class="mt-0.5 block font-medium text-sky-600" x-text="`第 ${(project.project.plan_run_count || 0) + 1} 次`"></span></div>
                    <div><span class="block text-slate-400">最后更新</span><span class="mt-0.5 block font-medium text-slate-600" x-text="formatTime(project.project.plan.activity_updated_at || project.project.plan.last_heartbeat_at)"></span></div>
                    <div><span class="block text-slate-400">触发器</span><span class="mt-0.5 block font-medium text-slate-600" x-text="project.project.plan.trigger || 'reconcile'"></span></div>
                    <div><span class="block text-slate-400">配置快照</span><span class="mt-0.5 block font-medium text-slate-600" x-text="project.project.plan.settings_version ? `v${project.project.plan.settings_version}` : '历史运行'"></span></div>
                    <div><span class="block text-slate-400">最后决策</span><span class="mt-0.5 block font-medium text-sky-600" x-text="planDecisionLabel(project.project.last_plan_decision)"></span></div>
                  </div>
                </div>
              </div>
            </div>
            <div x-show="planStackExpanded && (project.project.queued_plans || []).length > 0" class="mt-2.5 space-y-2">
              <div class="text-[11px] font-semibold text-slate-400 px-1 flex items-center justify-between">
                <span>Plan 排队列表（FIFO）</span>
                <span class="font-mono" x-text="`${project.project.queued_plan_count ?? project.project.queued_plans.length} 个`"></span>
              </div>
              <template x-for="(queued, index) in project.project.queued_plans" :key="queued.id">
                <div class="rounded-xl border border-sky-200/60 bg-sky-50/80 p-3 shadow-sm backdrop-blur">
                  <div class="flex items-center justify-between">
                    <span class="font-mono text-xs font-bold text-sky-700" x-text="queued.id"></span>
                    <span class="px-2 py-0.5 rounded-full bg-sky-100 text-sky-700 text-[10px] font-medium" x-text="`排队 #${index + 1}`"></span>
                  </div>
                  <div class="mt-1.5 flex items-center justify-between text-[11px] text-slate-500">
                    <span>触发源: <strong class="text-slate-700" x-text="queued.trigger || 'reconcile'"></strong></span>
                    <span x-text="formatTime(queued.created_at)"></span>
                  </div>
                  <div x-show="queued.trigger_payload?.coalesced_count" class="mt-1 text-[10px] text-slate-400" x-text="`已合并 ${queued.trigger_payload.coalesced_count} 次`"></div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Plan is a separate planning phase.  Legacy API payloads may still
           expose the same Plan row through project.reason; keep the UI
           Plan-only while the task is in that phase. -->
      <template x-if="project.project.reason && project.project.phase !== 'plan'">
        <div class="absolute right-3 z-10 w-80 max-w-[calc(100vw-1.5rem)] select-none" :style="{ top: project.project.plan ? '23rem' : '3.5rem' }">
          <div class="relative cursor-pointer" @click="reasonStackExpanded = !reasonStackExpanded">
            <template x-if="!reasonStackExpanded && (project.project.queued_reasons || []).length > 0">
              <div class="absolute -bottom-2.5 left-2 right-2 h-12 rounded-2xl border border-amber-300/40 bg-amber-50/70 shadow-md backdrop-blur -z-10"></div>
            </template>
            <template x-if="!reasonStackExpanded && (project.project.queued_reasons || []).length > 1">

            <div>
              <p class="text-sm font-semibold text-slate-700">Reason Todo List</p>
              <p class="mt-0.5 text-[11px] text-slate-400">跨轮次持续更新，Intent 必须关联 Todo。</p>
            </div>
            <span class="text-[10px] text-slate-400" x-text="project.todos.filter(item => item.status === 'completed').length + '/' + project.todos.length"></span>
          </div>
        </div>
        <template x-if="taskDetailSectionPending('todos')">
          <div class="rounded-2xl border border-dashed border-slate-200 bg-white px-5 py-10 text-center"><p class="text-sm text-slate-400">正在加载 Todo…</p></div>
        </template>
        <template x-if="taskDetailSectionError('todos')">
          <div class="rounded-2xl border border-dashed border-rose-200 bg-white px-5 py-10 text-center"><p class="text-sm text-rose-500">Todo 加载失败</p><button @click="retryTaskDetailSection('todos')" class="mt-2 text-xs text-brand-600 hover:underline">重试</button></div>
        </template>
        <template x-if="taskDetailSectionReady('todos') && project.todos.length === 0">
          <div class="rounded-2xl border border-dashed border-slate-200 bg-white px-5 py-10 text-center">
            <p class="text-sm text-slate-400">Reason 尚未写入 Todo</p>
            <p class="mt-1 text-xs text-slate-300">先覆盖攻击面，再逐步深入。</p>
          </div>
        </template>
        <template x-for="todo in [...project.todos].sort((a,b) => (b.priority || 0) - (a.priority || 0))" :key="todo.id">
          <article class="rounded-xl border bg-white p-3 shadow-xs hover:border-slate-300 transition"
            :class="todo.status === 'completed' ? 'border-emerald-100 bg-emerald-50/10' : todo.status === 'blocked' ? 'border-amber-200' : todo.status === 'partial' ? 'border-brand-200' : 'border-slate-200/80'">
            <!-- Header Row: Meta Badges + Priority + Status -->
            <div class="flex items-center gap-2">
              <span class="font-mono text-[10px] font-bold text-slate-500" x-text="todo.id"></span>
              <span class="px-1.5 py-0.5 rounded bg-slate-100 text-[9px] font-semibold text-slate-500" x-text="todo.category"></span>
              <span x-show="todo.theme" class="px-1.5 py-0.5 rounded bg-violet-50 text-[9px] text-violet-600 truncate max-w-[90px]" x-text="todo.theme"></span>
              <span class="ml-auto font-mono text-[10px] font-semibold text-slate-400" x-text="'P' + (todo.priority ?? 0)"></span>
              <span class="px-1.5 py-0.5 rounded border text-[9px]" :class="humanTodoClass(todo.status)" x-text="humanTodoLabel(todo.status)"></span>
            </div>

            <!-- Title -->
            <p class="mt-1.5 text-xs font-semibold leading-relaxed break-words"
              :class="todo.status === 'completed' ? 'line-through text-slate-400 font-normal' : 'text-slate-800'"
              x-text="todo.title"></p>

            <!-- Status Reason if any -->
            <p x-show="todo.status_reason" class="mt-1 text-[10px] text-slate-400" x-text="todo.status_reason"></p>

            <!-- Intent List (if has intents) -->
            <div x-show="getIntentsForTodo(todo.id).length > 0" class="mt-2.5">
              <div class="space-y-1 pl-2 border-l-2 border-slate-200/80">
                <template x-for="intent in getIntentsForTodo(todo.id)" :key="intent.id">
                  <div @click="centerGraphOnIntent(intent.id); selectIntent(intent.id)"
                    @mouseenter="intentHover = { d: intent, x: $event.clientX, y: $event.clientY }"
                    @mouseleave="intentHover = null"
                    class="intent-row relative rounded-md border border-slate-100 bg-slate-50/80 px-2 py-1.5 hover:border-brand-300 hover:bg-brand-50/40 cursor-pointer transition flex items-center justify-between gap-1.5">
                    <div class="flex items-center gap-1.5 min-w-0 flex-1">
                      <span class="h-1.5 w-1.5 rounded-full shrink-0" :class="intentDotClass(intent)"></span>
                      <span class="font-mono text-[10px] font-semibold text-slate-600 shrink-0" x-text="intent.id"></span>
                      <span class="text-[11px] text-slate-700 truncate group-hover:text-brand-700" x-text="intent.description"></span>
                    </div>
                    <span class="shrink-0 text-[9px] font-medium" :class="intentStatusClass(intent)" x-text="intentStatusLabel(intent)"></span>

                    <!-- Hover Floating Full Description Tooltip -->
                    <div class="intent-hover-card absolute left-0 bottom-full mb-1.5 hidden z-[999] w-80 max-w-[90vw] p-3 rounded-xl border border-slate-700/80 bg-slate-900/95 text-slate-100 text-[11px] leading-relaxed shadow-2xl backdrop-blur-sm pointer-events-none transition-all">
                      <div class="flex items-center justify-between gap-2 border-b border-slate-700 pb-1.5 mb-1.5">
                        <span class="font-mono font-bold text-amber-400 text-[10px]" x-text="intent.id"></span>
                        <span class="text-[9px] px-1.5 py-0.5 rounded" :class="intentStatusClass(intent)" x-text="intentStatusLabel(intent)"></span>
                      </div>
                      <div class="max-h-60 overflow-y-auto whitespace-pre-wrap font-sans break-words text-slate-200" x-text="intent.description || '暂无详细描述'"></div>
                      <div x-show="intent.targets?.length" class="mt-1.5 pt-1.5 border-t border-slate-800 text-[9px] text-slate-400 truncate">
                        <span>目标：</span><span class="font-mono text-slate-300" x-text="intent.targets.join(', ')"></span>
                      </div>
                      <div class="mt-1.5 pt-1.5 border-t border-slate-800 flex items-center justify-between gap-2">
                        <span class="text-[9px] text-slate-400 shrink-0">评估</span>
                        <span class="text-[9px] font-bold"
                          :class="intent.assessment_status === 'completed' ? 'text-emerald-400' : (intent.assessment_status === 'partial' ? 'text-amber-400' : (intent.assessment_status === 'blocked' ? 'text-rose-400' : 'text-slate-500'))"
                          x-text="intent.assessment_status || '未评估'"></span>
                      </div>
                      <div x-show="intent.assessment_reason" class="mt-1 text-[10px] text-slate-300 whitespace-pre-wrap break-words leading-relaxed" x-text="intent.assessment_reason"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Intent 悬浮详情卡（fixed，脱离 overflow 裁剪） -->
            <div x-show="intentHover" x-cloak
              class="fixed z-[70] w-[26rem] max-w-[90vw] p-3.5 rounded-xl border border-slate-700/80 bg-slate-900/96 text-slate-100 text-[11px] leading-relaxed shadow-2xl pointer-events-none"
              :style="intentHover ? { left: Math.min(intentHover.x + 14, window.innerWidth - 440) + 'px', top: Math.min(intentHover.y + 12, window.innerHeight - 300) + 'px' } : {}">
              <template x-if="intentHover">
                <div>
                  <div class="flex items-center justify-between gap-2 border-b border-slate-700 pb-1.5 mb-2">
                    <span class="font-mono font-bold text-amber-400 text-[11px]" x-text="intentHover.d.id"></span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded font-medium" :class="intentStatusClass(intentHover.d)" x-text="intentStatusLabel(intentHover.d)"></span>
                  </div>
                  <div class="max-h-52 overflow-y-auto whitespace-pre-wrap font-sans break-words text-slate-200" x-text="intentHover.d.description || '暂无详细描述'"></div>
                  <div x-show="intentHover.d.targets?.length" class="mt-2 pt-1.5 border-t border-slate-800 text-[10px] text-slate-400">
                    <span class="text-slate-500">目标：</span><span class="font-mono text-slate-300 break-all" x-text="intentHover.d.targets.join(', ')"></span>
                  </div>
                  <div class="mt-2 pt-1.5 border-t border-slate-800 flex items-center justify-between gap-2">
                    <span class="text-[10px] text-slate-400 shrink-0">评估</span>
                    <span class="text-[10px] font-bold"
                      :class="intentHover.d.assessment_status === 'completed' ? 'text-emerald-400' : (intentHover.d.assessment_status === 'partial' ? 'text-amber-400' : (intentHover.d.assessment_status === 'blocked' ? 'text-rose-400' : 'text-slate-500'))"
                      x-text="intentHover.d.assessment_status || '未评估'"></span>
                  </div>
                  <div x-show="intentHover.d.assessment_reason" class="mt-1 text-[10px] text-slate-300 whitespace-pre-wrap break-words" x-text="intentHover.d.assessment_reason"></div>
                </div>
              </template>
            </div>
            <!-- If 0 Intent: Subtle empty hint -->
            <div x-show="getIntentsForTodo(todo.id).length === 0" class="mt-1.5 text-[10px] text-slate-400 italic">
              待 Reason 派发子 Intent
            </div>
          </article>
        </template>

        <!-- Unlinked Global Intents Section (excluding bootstrap) -->
        <template x-if="getUnlinkedIntents().length > 0">
          <div class="mt-4 pt-3 border-t border-slate-200">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold text-slate-500">未关联 Todo 的探索 Intent</span>
              <span class="text-[10px] text-slate-400 font-mono" x-text="`${getUnlinkedIntents().length} 个`"></span>
            </div>
            <div class="space-y-1">
              <template x-for="intent in getUnlinkedIntents()" :key="intent.id">
                <div @click="centerGraphOnIntent(intent.id); selectIntent(intent.id)"
                  class="group rounded-md border border-slate-200 bg-white p-2 hover:border-brand-300 hover:bg-brand-50/30 cursor-pointer transition shadow-xs flex items-center justify-between gap-1.5">
                  <div class="flex items-center gap-1.5 min-w-0">
                    <span class="h-1.5 w-1.5 rounded-full shrink-0" :class="intentDotClass(intent)"></span>
                    <span class="font-mono text-[10px] font-semibold text-slate-600" x-text="intent.id"></span>
                    <span class="text-[11px] text-slate-700 truncate group-hover:text-brand-700" x-text="intent.description"></span>
                  </div>
                  <span class="shrink-0 text-[9px] font-medium" :class="intentStatusClass(intent)" x-text="intentStatusLabel(intent)"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>


    </div>
  </div>

</div>
</template>
