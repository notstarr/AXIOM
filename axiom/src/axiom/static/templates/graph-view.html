<!-- ═══════════ GRAPH VIEW ═══════════ -->
<template x-if="activePage === 'task-detail' && view === 'graph'">
<div class="flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0 z-20">
    <button @click="backToList()" class="p-1.5 rounded-lg hover:bg-slate-100 transition text-slate-400 hover:text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="title-action-trigger flex items-center gap-2 min-w-0">
      <span class="text-base font-semibold text-slate-800 tracking-tight shrink-0">任务图谱</span>
      <span class="text-[11px] font-mono text-slate-400" x-text="project.project.id"></span>
      <h2 class="text-[15px] font-semibold text-slate-700 truncate" x-text="project.project.title"></h2>
      <button x-show="!replay.active && !project.project.legacy_readonly" @click="openRenameProject(project.project.id, project.project.title)"
        class="title-action-button inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:border-slate-300 hover:bg-slate-50 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"
        title="重命名项目"
        :aria-label="`重命名 ${project.project.title}`">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m16.862 4.487 1.65-1.65a1.875 1.875 0 1 1 2.652 2.652l-9.193 9.193a4.5 4.5 0 0 1-1.897 1.13L6 17l1.188-4.074a4.5 4.5 0 0 1 1.13-1.897l8.544-8.542Z"/><path d="M19.5 7.125 16.875 4.5"/><path d="M5.25 18.75h13.5"/></svg>
      </button>
      <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold uppercase tracking-[0.12em] shrink-0"
        :class="projectStatusBadgeClass(project.project.status)"
        x-text="projectStatusLabel(project.project.status)"></span>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center rounded-lg border border-slate-200 bg-slate-50 p-0.5">
      <button @click="switchTaskView('human')" class="px-2.5 py-1 rounded-md text-[11px] text-slate-500 hover:bg-white">概览</button>
      <button @click="switchTaskView('graph')" class="px-2.5 py-1 rounded-md text-[11px] bg-white text-brand-600 shadow-sm">图谱</button>
    </div>
    <div class="flex items-center gap-4 text-xs text-slate-400">
      <span x-text="`${project.facts.length} 事实`"></span>
      <span x-text="`${project.intents.length} 意图`"></span>
    </div>
    <div class="flex items-center gap-1.5">
      <template x-if="!replay.active">
        <button @click="startProjectReplay()" class="px-2.5 py-1 rounded-lg border border-violet-200 text-xs text-violet-600 hover:bg-violet-50 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/><path d="M4 5v14"/></svg>
          回放
        </button>
      </template>
      <template x-if="replay.active">
        <div class="flex items-center gap-1.5 rounded-xl border border-violet-200 bg-violet-50/80 px-2 py-1 text-xs text-violet-700">
          <span class="font-medium whitespace-nowrap" x-text="replayProgressLabel()"></span>
          <button @click="toggleProjectReplayPlayback()" class="inline-flex h-6 w-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 hover:bg-white transition" :title="replay.playing ? '暂停回放' : '继续回放'">
            <svg x-show="replay.playing" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 6h3v12H8zM13 6h3v12h-3z"/></svg>
            <svg x-show="!replay.playing" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
          </button>
          <button @click="restartProjectReplay()" class="inline-flex h-6 w-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 hover:bg-white transition" title="重新回放">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
          </button>
          <select x-model="replay.stepMs" @change="updateReplaySpeed()" class="h-6 rounded-md border border-violet-200 bg-white/80 px-1.5 text-[11px] text-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-100">
            <option value="700">快速</option>
            <option value="1100">正常</option>
            <option value="1600">慢速</option>
          </select>
          <button @click="exitProjectReplay()" class="inline-flex h-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 px-2 hover:bg-white transition">
            退出
          </button>
        </div>
      </template>
      <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition flex items-center gap-1.5 disabled:opacity-40">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
        刷新
      </button>
      <button @click="viewProjectYaml(selectedProjectId, project.project.title)" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14.25 3H7.5A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h9a2.25 2.25 0 0 0 2.25-2.25V8.25L14.25 3Z"/><path d="M14.25 3v5.25h4.5"/><path d="M8.25 12h7.5M8.25 15h5.25"/></svg>
        漏洞报告
      </button>
      <template x-if="!replay.active && !project.project.legacy_readonly && ['active', 'stopped'].includes(project.project.status)">
        <button @click="toggleProjectStop()"
          class="px-2.5 py-1 rounded-lg border text-xs transition flex items-center gap-1.5"
          :class="project.project.status === 'active'
            ? 'border-amber-200 text-amber-600 hover:bg-amber-50'
            : 'border-teal-200 text-teal-600 hover:bg-teal-50'">
          <svg x-show="project.project.status === 'active'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
          <svg x-show="project.project.status === 'stopped'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
          <span x-text="project.project.status === 'active' ? '暂停' : '继续'"></span>
        </button>
      </template>
      <button x-show="!replay.active && !project.project.legacy_readonly" @click="deleteProject()" class="px-2.5 py-1 rounded-lg border border-rose-200 text-xs text-rose-500 hover:bg-rose-50 hover:text-rose-600 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6"/><path d="M19 6l-.63 11.338A2 2 0 0 1 16.37 19.5H7.63a2 2 0 0 1-1.997-2.162L5 6"/><path d="M10 10.5v5"/><path d="M14 10.5v5"/></svg>
        删除
      </button>
    </div>
    <div class="flex items-center gap-1.5 ml-1">
      <button @click="showLocalPrefs = true" class="h-7 max-w-40 px-2.5 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition inline-flex items-center shrink-0">
        <span class="truncate block" x-text="actorName()"></span>
      </button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden" id="graphLayout">
    <!-- Graph column -->
    <div class="flex-1 flex flex-col min-w-0">
     <div class="flex-1 relative min-w-0 overflow-hidden">
      <div class="absolute top-3 left-3 z-10 flex items-center gap-1.5">
        <button @click="fitGraph()" class="h-7 w-7 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 text-slate-500 hover:text-slate-700 hover:bg-white transition inline-flex items-center justify-center" title="适配图谱" aria-label="适配图谱">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <select x-model="layoutMode" @change="applySelectedLayout()"
          class="h-7 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 px-2.5 text-xs text-slate-600 hover:bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-300 transition">
          <option value="elk_tb">ELK ↓</option>
          <option value="elk_lr">ELK →</option>
          <option value="dagre_tb">Dagre ↓</option>
          <option value="dagre_lr">Dagre →</option>
        </select>
        <input x-model="graphSearch" @input="searchGraphNodes()" placeholder="搜索节点…" class="h-7 w-36 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 px-2.5 text-xs text-slate-600 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-300 transition">
      </div>

      <template x-if="project.project.reason">
        <div class="absolute top-14 right-3 z-10 w-80 max-w-[calc(100vw-1.5rem)]">
          <div class="reason-panel-running relative overflow-hidden rounded-2xl border border-sky-200/80 bg-white/92 px-4 py-3.5 shadow-lg shadow-sky-100/60 backdrop-blur">
            <div class="flex items-start gap-3">
              <span class="reason-beacon mt-1 shrink-0"></span>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2">
                  <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-sky-500">reason 运行中</div>
                  <span class="shrink-0 rounded-full border border-sky-100 bg-sky-50 px-2 py-0.5 text-[10px] font-medium text-sky-600" x-text="reasonActivityStateLabel(project.project.reason)"></span>
                </div>
                <div class="mt-0.5 text-sm font-semibold text-slate-700 truncate" x-text="project.project.reason.worker"></div>
                <p class="mt-2 text-sm font-medium leading-relaxed text-slate-700" x-text="project.project.reason.activity_summary || '正在分析任务上下文并规划下一批 Intent'"></p>
                <div class="mt-3 grid grid-cols-2 gap-x-4 gap-y-2 text-[11px] text-slate-500">
                  <div><span class="block text-slate-400">运行时间</span><span class="mt-0.5 block font-medium text-slate-600" x-text="reasonRunDuration(project.project.reason)"></span></div>
                  <div><span class="block text-slate-400">最后更新</span><span class="mt-0.5 block font-medium text-slate-600" x-text="reasonActivityAge(project.project.reason)"></span></div>
                  <div><span class="block text-slate-400">心跳</span><span class="mt-0.5 block font-medium text-slate-600" x-text="formatTime(project.project.reason.last_heartbeat_at)"></span></div>
                  <div><span class="block text-slate-400">触发器</span><span class="mt-0.5 block font-medium text-slate-600" x-text="project.project.reason.trigger || 'scheduler'"></span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template x-if="project.project.reason">
        <div class="reason-graph-scan z-[1]">
          <span class="reason-graph-grid"></span>
          <span class="reason-graph-ambient"></span>
          <span class="reason-graph-scanline"></span>
          <span class="reason-graph-sweep"></span>
        </div>
      </template>

      <div class="absolute top-3 right-3 z-10 flex flex-wrap justify-end gap-2">
        <div class="hidden" x-show="false">
          <button @click="openCreateIntent()" :disabled="!canActOnSelectedFacts()"
            class="px-3 py-1.5 bg-white/90 backdrop-blur border border-brand-200 text-brand-600 rounded-lg shadow-sm text-xs font-medium hover:bg-brand-50 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            意图
          </button>
          <button @click="openCompleteProject()" :disabled="!canActOnSelectedFacts()"
            class="px-3 py-1.5 bg-white/90 backdrop-blur border border-teal-200 text-teal-600 rounded-lg shadow-sm text-xs font-medium hover:bg-teal-50 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            完成
          </button>
        </div>
        <div class="flex gap-1.5" x-show="projectCanWriteHints()">
          <button @click="openHintModal()"
            class="px-3 py-1.5 bg-white/90 backdrop-blur border border-amber-200 text-amber-600 rounded-lg shadow-sm text-xs font-medium hover:bg-amber-50 transition flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547Z"/></svg>
            提示
          </button>
        </div>
        <div class="hidden" x-show="false">
          <button @click="sendHeartbeatForSelectedIntent()" :disabled="!selectedActionableOpenIntentRecord()"
            class="px-3 py-1.5 bg-white/90 backdrop-blur border border-slate-200 text-slate-600 rounded-lg shadow-sm text-xs font-medium hover:bg-slate-50 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12h3.5l2.75-6 3.5 12 2.75-7H21"/></svg>
            <span x-text="selectedIntentPrimaryActionLabel()"></span>
          </button>
          <button @click="releaseSelectedIntent()" :disabled="!selectedReleasableOpenIntentRecord()"
            class="px-3 py-1.5 bg-white/90 backdrop-blur border border-amber-200 text-amber-700 rounded-lg shadow-sm text-xs font-medium hover:bg-amber-50 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 10V7.75A3.75 3.75 0 1 1 16.5 7"/><path d="M7.5 10.5h9A1.5 1.5 0 0 1 18 12v6A1.5 1.5 0 0 1 16.5 19.5h-9A1.5 1.5 0 0 1 6 18v-6A1.5 1.5 0 0 1 7.5 10.5Z"/><path d="M12 14.25v1.5"/></svg>
            释放
          </button>
          <button @click="selectedActionableOpenIntentRecord() && openConclude(selectedActionableOpenIntentRecord())" :disabled="!selectedActionableOpenIntentRecord()"
            class="px-3 py-1.5 bg-white/90 backdrop-blur border border-teal-200 text-teal-600 rounded-lg shadow-sm text-xs font-medium hover:bg-teal-50 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.25 3H7.5A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h9a2.25 2.25 0 0 0 2.25-2.25V8.25L14.25 3Z"/><path d="M14.25 3v5.25h4.5"/><path d="M9 13.5 10.875 15.375 15 11.25"/></svg>
            结束
          </button>
        </div>
      </div>

      <div id="cy" class="relative z-0 flex-1 h-full"></div>

      <template x-if="minimapVisible && cy">
        <canvas id="minimap" width="160" height="96" x-init="$nextTick(() => drawMinimap())"
          class="absolute bottom-3 right-3 z-10 rounded-lg border border-slate-200/60 bg-white/85 shadow-sm cursor-pointer backdrop-blur"
          @pointerdown.prevent="onMinimapPointerDown($event)"
          @pointermove="onMinimapPointerMove($event)"
          @pointerup="onMinimapPointerUp($event)"
          @pointerleave="onMinimapPointerUp($event)"></canvas>
      </template>
      <button @click="minimapVisible = !minimapVisible"
        class="absolute bottom-3 z-10 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 text-slate-400 hover:text-slate-600 transition h-7 px-2 text-[10px] font-medium"
        :class="minimapVisible ? 'right-[176px]' : 'right-3'"
        title="缩略图">
        <span x-show="!minimapVisible">缩略图</span>
        <svg x-show="minimapVisible" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 3v18"/></svg>
      </button>
     </div>

      <!-- Bottom timeline -->
      <template x-if="timelineBarVisible && timelineEvents().length > 0">
        <div class="h-14 shrink-0 border-t border-slate-200/60 bg-slate-50/60 backdrop-blur flex items-center px-2 gap-1">
          <button @click="timelineBarVisible = false" class="shrink-0 text-slate-300 hover:text-slate-500 transition px-1 self-stretch flex items-center" title="收起">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          </button>
          <div class="flex-1 h-10 flex items-center gap-1 overflow-x-auto overflow-y-hidden timeline-scroll" x-ref="timelineBar" @wheel.prevent="e => { $refs.timelineBar.scrollLeft += e.deltaY; }">
            <template x-for="(entry, i) in timelineEvents()" :key="entry.id">
              <button @click="onTimelineMarkerClick(entry)"
                class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold transition whitespace-nowrap"
                :class="timelineEntryIsSelected(entry) ? 'ring-1 ring-brand-400 scale-105' : 'hover:scale-105'"
                :style="timelineEntryStyle(entry)"
                :title="entry.title">
                <span x-text="entry.targetId || entry.type"></span>
              </button>
            </template>
          </div>
        </div>
      </template>
      <template x-if="!timelineBarVisible && timelineEvents().length > 0">
        <button @click="timelineBarVisible = true" class="h-6 shrink-0 border-t border-slate-200/60 text-[10px] text-slate-400 hover:text-slate-600 px-3 flex items-center gap-1 transition bg-slate-50/60">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          时间轴
        </button>
      </template>
    </div>

    <div @pointerdown.prevent="startPanelResize($event)" class="w-2 shrink-0 cursor-col-resize group flex items-stretch justify-center touch-none relative z-20">
      <div class="w-px bg-slate-200/70 transition group-hover:bg-brand-300" :class="{ 'bg-brand-400': isResizingPanel }"></div>
    </div>

    <!-- Side panel -->
    <div class="border-l border-slate-200/60 bg-white flex flex-col overflow-hidden shrink-0 relative z-20" :style="{ width: sidePanelWidth + 'px', minWidth: sidePanelWidth + 'px', flexBasis: sidePanelWidth + 'px' }">
      <div class="flex border-b border-slate-100 shrink-0">
        <button @click="sideTab = 'detail'" class="flex-1 px-3 py-2.5 text-xs font-medium transition"
          :class="sideTab === 'detail' ? 'text-brand-600 border-b-2 border-brand-500' : 'text-slate-400 hover:text-slate-600'">详情</button>
        <button @click="sideTab = 'hints'" class="flex-1 px-3 py-2.5 text-xs font-medium transition"
          :class="sideTab === 'hints' ? 'text-brand-600 border-b-2 border-brand-500' : 'text-slate-400 hover:text-slate-600'">
          提示 <span class="ml-0.5 text-[10px] opacity-60" x-text="project.hints.length"></span>
        </button>
        <button @click="sideTab = 'board'; reloadBlackboardGroup(project?.project?.parent_project_id)" class="flex-1 px-3 py-2.5 text-xs font-medium transition"
          :class="sideTab === 'board' ? 'text-brand-600 border-b-2 border-brand-500' : 'text-slate-400 hover:text-slate-600'">
          知识 <span class="ml-0.5 text-[10px] opacity-60" x-text="groupBlackboardItems().length || ''"></span>
        </button>
        <button @click="sideTab = 'vulns'" class="flex-1 px-3 py-2.5 text-xs font-medium transition"
          :class="sideTab === 'vulns' ? 'text-rose-600 border-b-2 border-rose-500' : 'text-slate-400 hover:text-slate-600'">
          漏洞 <span class="ml-0.5 text-[10px] opacity-60" x-text="project.vulns.length || ''"></span>
        </button>
        <button @click="sideTab = 'todo'" class="flex-1 px-3 py-2.5 text-xs font-medium transition"
          :class="sideTab === 'todo' ? 'text-brand-600 border-b-2 border-brand-500' : 'text-slate-400 hover:text-slate-600'">
          Todo <span class="ml-0.5 text-[10px] opacity-60" x-text="project.todos.length || ''"></span>
        </button>
      </div>

      <!-- Detail -->
      <div x-show="sideTab === 'detail'" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/40">
        <template x-if="!selectedNode">
          <div class="rounded-2xl border border-dashed border-slate-200 bg-white/80 px-5 py-10 text-center shadow-sm">
            <p class="text-sm text-slate-400">点击节点或边查看详情</p>
            <p class="text-xs text-slate-300 mt-1">按住 Shift 点击可多选</p>
          </div>
        </template>
        <template x-if="selectedNode && selectedNode.type === 'fact' && selectedFacts.length > 1">
          <div class="space-y-3">
            <template x-for="fact in selectedFactRecords()" :key="fact.id">
              <article class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">

          </div>
        </template>
        <template x-for="todo in [...project.todos].sort((a,b) => (b.priority || 0) - (a.priority || 0))" :key="todo.id">
          <article class="rounded-2xl border bg-white p-4 shadow-sm"
            :class="todo.status === 'completed' ? 'border-emerald-100 opacity-75' : todo.status === 'active' ? 'border-brand-200' : 'border-slate-200'">
            <div class="flex items-start gap-2">
              <button type="button" @click="updateTodoStatus(todo.id, todo.status === 'completed' ? 'pending' : 'completed')"
                :disabled="project.project.legacy_readonly"
                class="mt-0.5 h-5 w-5 shrink-0 rounded-md border inline-flex items-center justify-center transition disabled:opacity-40"
                :class="todo.status === 'completed' ? 'border-emerald-400 bg-emerald-500 text-white' : 'border-slate-300 text-transparent hover:border-brand-400'">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
              </button>
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="font-mono text-[10px] text-slate-400" x-text="todo.id"></span>
                  <span class="px-1.5 py-0.5 rounded-md bg-slate-100 text-[9px] font-semibold text-slate-500" x-text="todo.category"></span>
                  <span x-show="todo.theme" class="px-1.5 py-0.5 rounded-md bg-violet-50 text-[9px] text-violet-600" x-text="todo.theme"></span>
                  <span class="ml-auto text-[10px] text-slate-400" x-text="'P' + todo.priority"></span>
                </div>
                <p class="mt-2 text-sm leading-relaxed break-words"
                  :class="todo.status === 'completed' ? 'line-through text-slate-400' : 'text-slate-700'"
                  x-text="todo.title"></p>
                <div class="mt-2 flex items-center justify-between gap-2">
                  <span class="text-[10px] text-slate-400" x-text="todo.status"></span>
                  <div class="flex gap-1" x-show="!project.project.legacy_readonly && todo.status !== 'completed'">
                    <button x-show="todo.status !== 'active'" @click="updateTodoStatus(todo.id, 'active')" class="px-2 py-1 rounded-md border border-brand-100 text-[10px] text-brand-600 hover:bg-brand-50">开始</button>
                    <button @click="updateTodoStatus(todo.id, 'obsolete')" class="px-2 py-1 rounded-md border border-slate-200 text-[10px] text-slate-500 hover:bg-slate-50">作废</button>
                  </div>
                </div>
                <p x-show="todo.status_reason" class="mt-2 text-[11px] text-slate-400" x-text="todo.status_reason"></p>
              </div>
            </div>
          </article>
        </template>
      </div>


    </div>
  </div>

</div>
</template>
