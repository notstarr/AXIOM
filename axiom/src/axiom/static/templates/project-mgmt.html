<!-- ═══════════ PROJECT MANAGEMENT PAGE ═══════════ -->
<div x-show="activePage === 'projects'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800 tracking-tight">项目管理</h2>
      <p class="text-xs text-slate-400 mt-0.5">维护项目资料、归档状态、关联任务与共享知识</p>
    </div>
    <div class="flex-1"></div>
    <button @click="openGroupModal()" class="h-8 px-3 rounded-lg border border-brand-200 text-xs text-brand-600 hover:bg-brand-50 transition">新建项目</button>
    <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="h-8 px-3 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50 disabled:opacity-40 transition">刷新</button>
  </header>
  <main class="flex-1 overflow-hidden grid grid-cols-[280px_minmax(0,1fr)]">
    <aside class="border-r border-slate-200 bg-white overflow-y-auto overflow-x-hidden p-3 space-y-2">
      <div class="sticky top-0 z-10 bg-white pb-2 space-y-2">
        <input x-model="projectSearch" placeholder="搜索项目名称、ID 或说明" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-100">
        <select x-model="projectStatusFilter" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-brand-100">
          <option value="all">全部状态</option>
          <option value="active">启用</option>
          <option value="archived">已归档</option>
        </select>
      </div>
      <template x-if="filteredProjectGroups().length === 0">
        <p class="text-sm text-slate-400 text-center py-10" x-text="projectGroups.length ? '没有匹配的项目' : '暂无项目'"></p>
      </template>
      <template x-for="p in filteredProjectGroups()" :key="p.id">
        <button type="button" @click="selectManagedProject(p.id)" class="w-full flex flex-col items-start text-left rounded-xl border p-3 transition overflow-hidden"
          :class="selectedProjectManagementId === p.id ? 'border-brand-200 bg-brand-50/60' : 'border-slate-200 bg-white hover:bg-slate-50'">
          <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold whitespace-nowrap" :class="p.status === 'active' ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-500'" x-text="p.status === 'active' ? '启用' : '已归档'"></span>
          <p class="mt-1.5 text-sm font-semibold text-slate-700 line-clamp-2" x-text="p.title"></p>
        </button>
      </template>
    </aside>
    <section class="overflow-y-auto p-5 space-y-4">
      <template x-if="!selectedProjectGroup()">
        <div class="rounded-2xl border border-dashed border-slate-200 bg-white px-5 py-14 text-center text-slate-400">请选择一个项目</div>
      </template>
      <template x-if="selectedProjectGroup()">
        <div class="space-y-4">
          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm p-5">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-mono text-xs text-slate-400 tabular-nums" x-text="selectedProjectGroup().id"></span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold" :class="selectedProjectGroup().status === 'active' ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-500'" x-text="selectedProjectGroup().status === 'active' ? '启用' : '已归档'"></span>
                </div>
                <h3 class="mt-2 text-lg font-semibold text-slate-800" x-text="selectedProjectGroup().title"></h3>
                <p class="mt-1 text-xs text-slate-400" x-text="selectedProjectGroup().description || '暂无项目说明'"></p>
              </div>
              <div class="flex gap-2">
                <button @click="toggleSelectedProjectArchive()" class="px-3 py-2 text-sm rounded-xl border border-amber-200 text-amber-700 hover:bg-amber-50 transition" x-text="selectedProjectGroup().status === 'active' ? '归档项目' : '恢复项目'"></button>
                <button @click="openTaskComposer(selectedProjectGroup().id); navigateTo('tasks')" class="px-3 py-2 text-sm rounded-xl border border-brand-200 text-brand-600 hover:bg-brand-50 transition">新建关联任务</button>
                <button @click="deleteProjectGroup(selectedProjectGroup().id, selectedProjectGroup().title)" class="px-3 py-2 text-sm rounded-xl border border-rose-200 text-rose-500 hover:bg-rose-50 transition">删除项目</button>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_minmax(0,2fr)_auto] gap-2 border-t border-slate-100 pt-4">
              <input x-model="projectGroupSettingsForm.title" placeholder="项目名称" class="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100">
              <input x-model="projectGroupSettingsForm.description" placeholder="项目说明" class="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100">
              <button @click="saveSelectedProjectGroup()" class="px-4 py-2 text-sm rounded-xl bg-slate-800 text-white hover:bg-slate-900 transition">保存资料</button>
            </div>
            <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3">
              <div class="rounded-xl bg-slate-50 p-3"><p class="text-xs text-slate-400">任务</p><p class="mt-1 text-xl font-semibold tabular-nums" x-text="selectedProjectGroup().task_count"></p></div>
              <div class="rounded-xl bg-teal-50 p-3"><p class="text-xs text-teal-600">运行中</p><p class="mt-1 text-xl font-semibold text-teal-700 tabular-nums" x-text="selectedProjectGroup().active_task_count"></p></div>
              <div class="rounded-xl bg-rose-50 p-3"><p class="text-xs text-rose-600">漏洞</p><p class="mt-1 text-xl font-semibold text-rose-700 tabular-nums" x-text="selectedProjectGroup().vuln_count"></p></div>
              <div class="rounded-xl bg-sky-50 p-3"><p class="text-xs text-sky-600">共享知识</p><p class="mt-1 text-xl font-semibold text-sky-700 tabular-nums" x-text="selectedProjectGroup().blackboard_count"></p></div>
            </div>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4">
            <div class="flex items-center justify-between gap-3 mb-3">
              <h3 class="text-sm font-semibold text-slate-700">关联任务</h3>
              <span class="text-xs text-slate-400" x-text="`${selectedProjectGroupTasks().length} 个任务`"></span>
            </div>
            <template x-if="selectedProjectGroupTasks().length === 0">
              <div class="rounded-xl border border-dashed border-slate-200 px-4 py-8 text-center text-sm text-slate-400">这个项目下还没有任务</div>
            </template>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
              <template x-for="task in selectedProjectGroupTasks()" :key="`managed-task-${task.id}`">
                <button type="button" @click="openTaskManagementLocation(task.id)" class="text-left rounded-xl border p-3 transition"
                  :class="selectedProjectManagementTaskId === task.id ? 'border-brand-200 bg-brand-50/50' : 'border-slate-200 hover:bg-slate-50'">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-mono text-[11px] text-slate-400" x-text="task.id"></span>
                    <div class="flex items-center gap-1.5">
                      <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold" :class="projectStatusBadgeClass(task.status)" x-text="projectStatusLabel(task.status)"></span>
                    </div>
                  </div>
                  <p class="mt-2 text-sm font-semibold text-slate-700 break-words" x-text="task.title"></p>
                  <p class="mt-1 text-xs text-slate-400" x-text="`${task.fact_count} 事实 · ${task.intent_count} 意图`"></p>
                </button>
              </template>
            </div>
          </section>

          <section class="rounded-2xl border border-sky-200/70 bg-white shadow-sm p-4 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <div>
                <h3 class="text-sm font-semibold text-slate-700">共享知识</h3>
                <p class="text-xs text-slate-400 mt-0.5" x-text="`${groupBlackboardItems().length} 条，供项目内任务的 Reason 与 Explore 读取`"></p>
              </div>
              <button @click="openBlackboardEditor(null, true)" x-show="selectedProjectManagementId"
                class="px-3 py-1.5 text-xs bg-sky-500 text-white rounded-lg hover:bg-sky-600 transition">添加</button>
            </div>
            <template x-if="groupBlackboardItems().length === 0">
              <div class="rounded-xl border border-dashed border-slate-200 px-4 py-8 text-center text-sm text-slate-400">暂无共享知识</div>
            </template>
            <template x-for="item in groupBlackboardItems()" :key="item.id">
              <div class="rounded-xl border border-sky-100 bg-white p-4">
                <p class="text-sm font-medium text-slate-700 whitespace-pre-wrap break-words" x-text="item.title || item.content"></p>
                <p class="mt-1 text-xs text-slate-500 whitespace-pre-wrap break-words" x-show="item.title && item.content" x-text="item.content"></p>
                <p class="mt-1.5 text-[11px] text-sky-500 inline-flex items-center gap-1" x-show="item.hint">
                  <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                  <span x-text="item.hint"></span>
                </p>
                <div class="mt-3 flex items-center justify-between gap-2">
                  <span class="text-[11px] text-slate-400" x-text="`${item.creator} · ${formatTime(item.updated_at || item.created_at)}`"></span>
                  <div class="flex gap-2" x-show="selectedProjectManagementId">
                    <button @click="openBlackboardEditor(item, true)" class="px-2 py-1 text-[11px] text-slate-500 hover:bg-slate-50 rounded-md transition">编辑</button>
                    <button @click="deleteBlackboardItem(item.id)" class="px-2 py-1 text-[11px] text-rose-500 hover:bg-rose-50 rounded-md transition">删除</button>
                  </div>
                </div>
              </div>
            </template>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="text-sm font-semibold text-slate-700">项目凭证</h3>
                <p class="text-xs text-slate-400 mt-0.5">项目内任务共享，Bootstrap、Reason 与 Explore 通过 AXIOM CLI 按需读取。</p>
              </div>
              <div class="flex items-center gap-2">
                <input x-model="projectCredentialSearch" placeholder="搜索名称或备注" class="w-52 px-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-100">
                <button @click="openProjectCredentialEditor()" class="px-3 py-1.5 text-xs bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition">添加凭证</button>
              </div>
            </div>
            <template x-if="filteredProjectCredentials().length === 0">
              <div class="rounded-xl border border-dashed border-slate-200 px-4 py-8 text-center text-sm text-slate-400">暂无项目凭证</div>
            </template>
            <div class="overflow-x-auto" x-show="filteredProjectCredentials().length > 0">
              <table class="w-full text-xs">
                <thead><tr class="border-b border-slate-100 text-left text-[10px] text-slate-400 uppercase tracking-wider"><th class="px-2 py-2">名称</th><th class="px-2 py-2">备注</th><th class="px-2 py-2">刷新方式</th><th class="px-2 py-2">状态</th><th class="px-2 py-2 text-right">操作</th></tr></thead>
                <tbody>
                  <template x-for="credential in filteredProjectCredentials()" :key="credential.id">
                    <tr class="border-b border-slate-50" :class="credential.enabled ? '' : 'opacity-55'">
                      <td class="px-2 py-2"><p class="font-medium text-slate-700" x-text="credential.name"></p><p class="mt-0.5 text-[10px] font-mono text-slate-400" x-text="credential.id"></p></td>
                      <td class="px-2 py-2 text-slate-500 max-w-xs"><p class="line-clamp-2 whitespace-pre-line" x-text="credential.notes || '—'"></p></td>
                      <td class="px-2 py-2"><span class="inline-flex rounded-md px-2 py-1 text-[10px] font-medium" :class="credential.refresh_id ? 'bg-sky-50 text-sky-700' : 'bg-slate-50 text-slate-400'" x-text="credential.refresh_id ? `已配置 · ${credential.refresh_id}` : '未配置'"></span></td>
                      <td class="px-2 py-2"><button @click="toggleProjectCredential(credential)" class="px-2 py-1 rounded-md text-[10px] font-semibold" :class="credential.enabled ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'" x-text="credential.enabled ? '启用' : '停用'"></button></td>
                      <td class="px-2 py-2"><div class="flex justify-end gap-1"><button @click="openProjectCredentialEditor(credential)" class="px-2 py-1 rounded-md text-[10px] text-brand-600 hover:bg-brand-50">编辑</button><button @click="deleteProjectCredential(credential)" class="px-2 py-1 rounded-md text-[10px] text-rose-500 hover:bg-rose-50">删除</button></div></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>

        </div>
      </template>
    </section>
  </main>

  <div x-show="credentialEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="credentialEditor.open=false">
    <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-2xl p-6 border border-slate-200/60" @click.stop>
      <div class="flex items-center justify-between gap-3">
        <div><h3 class="text-base font-semibold text-slate-700" x-text="credentialEditor.id ? '编辑项目凭证' : '添加项目凭证'"></h3><p class="mt-0.5 text-xs text-slate-400">内容格式不限；Worker 通过 list → get → refresh 渐进读取。</p></div>
        <button @click="credentialEditor.open=false" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>
      <div x-show="credentialEditor.loading" class="mt-5 rounded-xl border border-slate-100 bg-slate-50 px-4 py-8 text-center text-sm text-slate-400">正在按需读取凭证详情…</div>
      <div x-show="!credentialEditor.loading" class="mt-5 grid grid-cols-1 gap-3">
        <label class="text-[11px] text-slate-400">名称<input x-model="credentialEditor.name" maxlength="128" placeholder="生产管理员会话" class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></label>
        <label class="text-[11px] text-slate-400">凭证内容（必填，格式不限）<textarea x-model="credentialEditor.content" rows="8" placeholder="Cookie、JWT、SSH 私钥、原始 HTTP 请求、账号密码等均可原样填写" class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-mono"></textarea></label>
        <label class="text-[11px] text-slate-400">备注（可选）<textarea x-model="credentialEditor.notes" rows="3" placeholder="用途、权限级别、使用注意事项等" class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm"></textarea></label>
        <label class="text-[11px] text-slate-400">凭证如何刷新（可选，格式不限）<textarea x-model="credentialEditor.refreshContent" rows="6" placeholder="可填写完整请求包、登录地址、账号密码、刷新步骤或其他说明" class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-mono"></textarea></label>
        <label class="inline-flex items-center gap-2 text-xs text-slate-600"><input type="checkbox" x-model="credentialEditor.enabled" class="rounded border-slate-300 text-brand-500">启用此凭证</label>
      </div>
      <div class="mt-5 flex justify-end gap-2"><button @click="credentialEditor.open=false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl">取消</button><button @click="saveProjectCredential()" :disabled="credentialSaving || credentialEditor.loading || !credentialEditor.name.trim() || !credentialEditor.content.trim()" class="px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium disabled:opacity-40" x-text="credentialSaving ? '保存中...' : '保存凭证'"></button></div>
    </div>
  </div>
</div>
