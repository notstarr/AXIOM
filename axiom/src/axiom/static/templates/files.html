<div x-show="activePage === 'files'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/90 border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800">任务产物中心</h2>
      <p class="text-xs text-slate-400 mt-0.5">按任务和 Intent 查看正式产物；运行日志与内部文件不会进入这里。</p>
    </div>
    <div class="flex-1"></div>
    <label
      class="sto-btn"
      :class="artifactCenterSelectedTask ? '' : 'sto-ghost'"
      :style="artifactCenterSelectedTask ? '' : 'cursor:not-allowed;'"
      @click="if (!artifactCenterSelectedTask) { $event.preventDefault(); showToast('请先选择一个任务', 'error'); }"
    >
      上传到任务文件
      <input type="file" @change="uploadArtifactCenter($event)" class="hidden" :disabled="!artifactCenterSelectedTask">
    </label>
    <button @click="loadArtifactCenter()" class="sto-ghost" style="padding:7px 12px;">刷新</button>
  </header>

  <main class="flex-1 min-h-0 flex overflow-hidden">
    <!-- ═══ 资源管理器（VS Code 树） ═══ -->
    <aside class="vsc-sidebar shrink-0 flex flex-col overflow-hidden">
      <div class="vsc-side-head">
        <span>资源管理器</span>
        <span class="vsc-side-count" x-text="`${(artifactCenterTasks || []).length} 任务`"></span>
      </div>
      <div class="vsc-tree flex-1 overflow-y-auto">
        <!-- 任务节点 -->
        <template x-for="task in (artifactCenterTasks || [])" :key="task.id">
          <div x-show="explorerNodeVisible('task', task.id, task.title || task.id)">
            <button type="button" class="vsc-tree-row lvl0 vsc-sticky-head" :class="artifactCenterSelectedTask === task.id ? 'active' : ''"
              @click="toggleExplorerTask(task.id)">
              <span class="vsc-chev" :class="explorerExpanded[task.id] ? 'open' : ''">
                <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4V4Z"/></svg>
              </span>
              <span class="vsc-fileicon dir">
                <svg style="width:14px; height:14px;" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
              </span>
              <span class="vsc-label" x-text="task.title || task.id"></span>
              <span class="vsc-rowmeta" x-show="explorerExpanded[task.id] && (explorerFolders[task.id] || []).length" x-text="`${(explorerFolders[task.id] || []).length}`"></span>
            </button>
            <!-- Intent 节点 -->
            <template x-for="folder in (explorerExpanded[task.id] ? (explorerFolders[task.id] || []) : [])" :key="`${task.id}:${folder.folder_key}`">
              <div x-show="explorerNodeVisible('intent', `${task.id}:${folder.folder_key}`, artifactFolderLabel(folder) + ' ' + artifactFolderDescription(folder))">
                <button type="button" class="vsc-tree-row lvl1 vsc-sticky-sub"
                  :class="artifactCenterSelectedTask === task.id && artifactCenterFolderKey === folder.folder_key ? 'active' : ''"
                  @click="toggleExplorerIntent(task.id, folder.folder_key)">
                  <span class="vsc-chev" :class="explorerExpanded[`${task.id}:${folder.folder_key}`] ? 'open' : ''">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4V4Z"/></svg>
                  </span>
                  <span class="vsc-fileicon dir2">
                    <svg style="width:13px; height:13px;" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
                  </span>
                  <span class="vsc-label" :title="artifactFolderDescription(folder)" x-text="artifactFolderLabel(folder)"></span>
                  <span class="vsc-badge" x-text="artifactFolderPhase(folder)"></span>
                </button>
                <!-- 文件节点 -->
                <template x-for="item in (explorerExpanded[`${task.id}:${folder.folder_key}`] ? (explorerFiles[`${task.id}:${folder.folder_key}`] || []) : [])" :key="item.id">
                  <button type="button" class="vsc-tree-row lvl2"
                    :class="editorActiveId === item.id ? 'active-file' : ''"
                    x-show="explorerNodeVisible('file', item.id, artifactFileName(item) + ' ' + (item.summary || ''))"
                    @click.stop="openEditorTab(item)">
                    <span class="vsc-fileicon" :style="item.artifact_type === 'explore.findings' ? 'color:#059669;' : item.artifact_type === 'explore.leads' ? 'color:#b45309;' : item.artifact_type === 'explore.evidence' ? 'color:#0071e3;' : item.artifact_type === 'review.report' ? 'color:#7c3aed;' : ''"
                      x-text="artifactTypeIcon(item.artifact_type)"></span>
                    <span class="vsc-label" :title="item.summary || ''" x-text="artifactFileName(item)"></span>
                    <span class="vsc-rowmeta" x-text="formatBytes(item.size)"></span>
                  </button>
                </template>
                <div x-show="explorerExpanded[`${task.id}:${folder.folder_key}`] && (explorerFiles[`${task.id}:${folder.folder_key}`] || []).length === 0 && !artifactCenterLoading" class="vsc-tree-empty lvl2">（空）</div>
              </div>
            </template>
            <!-- 文件夹翻页 -->
            <div x-show="explorerExpanded[task.id] && explorerFolderHasMore(task.id)" class="vsc-tree-pager">
              <button type="button" @click.stop="loadMoreExplorerFolders(task.id)" class="sto-minibtn" style="font-size:10px; padding:3px 10px;">
                加载更多 <span class="sto-num" x-text="`(共 ${(explorerFolderMeta[task.id] || {}).total || '…'})`"></span>
              </button>
            </div>
          </div>
        </template>
        <div x-show="artifactCenterLoading && !(artifactCenterTasks || []).length" class="sto-empty" style="border:0;">加载中…</div>
      </div>
      <div class="vsc-side-foot">
        <span x-text="`${Object.keys(explorerFiles).length} 个 Intent 已加载`"></span>
      </div>
    </aside>

    <!-- ═══ 编辑器区（标签页 + 面包屑 + 预览） ═══ -->
    <section class="flex-1 min-w-0 flex flex-col overflow-hidden" style="position:relative;">
      <!-- 标签页 -->
      <div class="vsc-tabbar" @contextmenu.self.prevent="openTabContextMenu($event, editorActiveId)">
        <template x-for="tab in (editorTabs || [])" :key="tab.id">
          <div class="vsc-tab" :class="editorActiveId === tab.id ? 'active' : ''" @click="activateEditorTab(tab.id)" @contextmenu.prevent="openTabContextMenu($event, tab.id)">
            <span class="vsc-fileicon" :style="tab.artifact_type === 'explore.findings' ? 'color:#059669;' : tab.artifact_type === 'explore.leads' ? 'color:#b45309;' : tab.artifact_type === 'explore.evidence' ? 'color:#0071e3;' : tab.artifact_type === 'review.report' ? 'color:#7c3aed;' : ''"
              x-text="artifactTypeIcon(tab.artifact_type)"></span>
            <span class="vsc-tabname" x-text="artifactFileName(tab)"></span>
            <button type="button" class="vsc-tabclose" @click.stop="closeEditorTab(tab.id)" aria-label="关闭">&times;</button>
          </div>
        </template>
        <div class="vsc-tab-spacer" @contextmenu.prevent="openTabContextMenu($event, '')"></div>
      </div>
      <!-- 标签右键菜单 -->
      <div x-show="tabContextMenu.open" x-cloak class="vsc-ctxmenu" :style="`left:${tabContextMenu.x}px; top:${tabContextMenu.y}px;`"
        @click.outside="tabContextMenu.open = false" @keydown.escape.window="tabContextMenu.open = false">
        <button type="button" @click="tabContextMenuClose('others')">关闭其他标签</button>
        <button type="button" @click="tabContextMenuClose('right')">关闭右侧全部</button>
        <button type="button" @click="tabContextMenuClose('all')">关闭全部标签</button>
      </div>

      <!-- 内容 -->
      <div class="flex-1 min-h-0 overflow-auto" style="background:var(--sto-panel);">
        <!-- 未打开任何文件 -->
        <div x-show="!artifactCenterSelected" class="vsc-welcome">
          <div class="vsc-welcome-logo">
            <svg style="width:26px; height:26px;" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M16 13H8m8 4H8m2-8H8"/></svg>
          </div>
          <p>在左侧资源管理器中选择文件打开</p>
          <p class="sub">展开任务 › Intent，点击文件在编辑器中预览</p>
        </div>
        <!-- 已打开 -->
        <template x-if="artifactCenterSelected">
          <div>
            <div class="vsc-meta-strip">
              <span x-text="artifactCenterSelected.task_title"></span>
              <span class="k">来源</span><span x-text="artifactCenterSelected.created_by || '未知'"></span>
              <span class="k">阶段</span><span x-text="artifactCenterSelected.phase || '未知'"></span>
              <span class="k">大小</span><span class="sto-num" x-text="formatBytes(artifactCenterSelected.size)"></span>
            </div>
            <div class="vsc-content">
              <template x-if="artifactCenterSelected._previewKind === 'image'"><img :src="artifactDownloadUrl(artifactCenterSelected)" style="max-width:100%; border-radius:10px; border:1px solid var(--sto-line);"></template>
              <template x-if="artifactCenterSelected._loading"><div class="sto-empty" style="border-style:solid;">读取中…</div></template>
              <template x-if="artifactCenterSelected._error"><div class="sto-errbox" x-text="artifactCenterSelected._error"></div></template>
              <template x-if="artifactCenterSelected._notice"><div class="sto-errbox" style="border-color:color-mix(in srgb, var(--sto-warn) 30%, transparent); background:color-mix(in srgb, var(--sto-warn) 6%, transparent); color:var(--sto-warn);" x-text="artifactCenterSelected._notice"></div></template>
              <template x-if="artifactCenterSelected._previewKind === 'markdown' && !artifactCenterSelected._loading && !artifactCenterSelected._error && !artifactCenterSelected._notice"><div><div x-show="artifactCenterSelected._rendered" class="md-preview text-sm" x-html="artifactCenterSelected._rendered"></div><div x-show="!artifactCenterSelected._rendered" class="sto-empty" style="border-style:solid;">文件为空</div></div></template>
              <template x-if="(artifactCenterSelected._previewKind === 'text' || artifactCenterSelected._previewKind === 'json') && !artifactCenterSelected._loading && !artifactCenterSelected._error && !artifactCenterSelected._notice"><div class="space-y-3"><div x-show="artifactCenterSelected._warning" class="sto-errbox" style="border-color:color-mix(in srgb, var(--sto-warn) 30%, transparent); background:color-mix(in srgb, var(--sto-warn) 6%, transparent); color:var(--sto-warn);" x-text="artifactCenterSelected._warning"></div><pre data-testid="artifact-preview-text" x-show="artifactCenterSelected._content.length > 0" style="font-size:12px; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,'SF Mono',Menlo,monospace; color:var(--sto-fg); line-height:1.6;" x-text="artifactCenterSelected._content"></pre></div></template>
            </div>
          </div>
        </template>
      </div>
    </section>
  </main>
</div>
