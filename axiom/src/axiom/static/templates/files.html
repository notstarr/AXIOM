<div x-show="activePage === 'files'" x-cloak class="flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0"><div><h2 class="text-base font-semibold text-slate-800">任务产物中心</h2><p class="text-xs text-slate-400 mt-0.5">按任务、阶段和产物查看正式结果；运行日志与内部文件不会进入正式产物。</p></div><div class="flex-1"></div><label class="px-3 py-1.5 rounded-lg bg-brand-500 text-white text-xs cursor-pointer hover:bg-brand-600">上传到任务<input type="file" @change="uploadArtifactCenter($event)" class="hidden"></label><button @click="loadArtifactCenter()" class="h-8 px-3 rounded-lg border border-slate-200 text-xs text-slate-600">刷新</button></header>
  <main class="flex-1 min-h-0 flex overflow-hidden">
    <aside class="w-64 shrink-0 border-r border-slate-200 bg-slate-50/50 p-3 overflow-y-auto"><div class="text-[11px] font-semibold text-slate-500 mb-2">任务</div><button @click="artifactCenterSelectedTask = ''; artifactCenterPage = 0; loadArtifactCenter()" class="w-full text-left px-3 py-2 rounded-lg text-xs mb-1" :class="!artifactCenterSelectedTask ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-white'">全部任务</button><template x-for="task in (artifactCenterTasks || [])" :key="task.id"><button @click="artifactCenterSelectedTask = task.id; artifactCenterPage = 0; loadArtifactCenter()" class="w-full text-left px-3 py-2 rounded-lg text-xs mb-1 truncate" :class="artifactCenterSelectedTask === task.id ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-white'" x-text="task.title || task.id"></button></template></aside>
    <section class="flex-1 min-w-0 overflow-y-auto p-5"><div class="flex flex-wrap gap-2 mb-4"><input x-model="artifactCenterSearch" @input="scheduleArtifactCenterSearch()" class="h-9 flex-1 min-w-48 rounded-lg border border-slate-200 px-3 text-xs" placeholder="搜索名称、摘要、Intent…"><select x-model="artifactCenterType" @change="artifactCenterPage=0; loadArtifactCenter()" class="h-9 rounded-lg border border-slate-200 px-2 text-xs"><option value="all">全部类型</option><template x-for="type in artifactCenterTypes()" :key="type"><option :value="type" x-text="type"></option></template></select><select x-model="artifactCenterPhase" @change="artifactCenterPage=0; loadArtifactCenter()" class="h-9 rounded-lg border border-slate-200 px-2 text-xs"><option value="all">全部阶段</option><template x-for="phase in artifactCenterPhases()" :key="phase"><option :value="phase" x-text="phase"></option></template></select><select x-model="artifactCenterSource" @change="artifactCenterPage=0; loadArtifactCenter()" class="h-9 rounded-lg border border-slate-200 px-2 text-xs"><option value="all">全部来源</option><option value="upload">人工上传</option><option value="worker">Worker / 阶段</option></select></div><div class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-3"><template x-for="item in artifactCenterFiltered()" :key="item.id"><article @click="openArtifactCenter(item)" class="cursor-pointer rounded-2xl border bg-white p-4 hover:shadow-sm transition" :class="item.artifact_type === 'explore.findings' ? 'border-emerald-200 hover:border-emerald-400' : item.artifact_type === 'explore.leads' ? 'border-amber-200 hover:border-amber-400' : item.artifact_type === 'explore.evidence' ? 'border-blue-200 hover:border-blue-400' : 'border-slate-200 hover:border-brand-300'"><div class="flex items-start gap-3"><div class="h-9 w-9 rounded-xl flex items-center justify-center text-base border" :class="artifactKindClass(item)" x-text="artifactTypeIcon(item.artifact_type)"></div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><h3 class="text-sm font-semibold text-slate-800 truncate" x-text="artifactFileName(item)"></h3><span class="px-1.5 py-0.5 rounded border text-[10px]" :class="artifactKindClass(item)" x-text="artifactKindLabel(item)"></span></div><p class="mt-1 text-xs text-slate-400 truncate" x-text="item.summary || '无摘要'"></p></div></div><div class="mt-3 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-400"><span x-text="item.task_title"></span><span x-text="item.phase || '阶段未知'"></span><span x-text="formatBytes(item.size)"></span><span x-text="formatTime(item.created_at)"></span></div><div class="mt-2 text-[10px] text-slate-400 font-mono truncate" x-text="item.path"></div></article></template><div x-show="!artifactCenterLoading && artifactCenterFiltered().length === 0" class="col-span-full py-16 text-center text-sm text-slate-400">暂无匹配产物</div><div x-show="artifactCenterLoading" class="col-span-full py-16 text-center text-sm text-slate-400">加载中…</div></div><div class="mt-4 flex items-center justify-between text-xs text-slate-400"><span x-text="`共 ${artifactCenterTotal} 个产物`"></span><div class="flex items-center gap-2"><button @click="setArtifactCenterPage(artifactCenterPage - 1)" :disabled="artifactCenterPage <= 0" class="h-8 px-3 rounded-lg border border-slate-200 disabled:opacity-30">上一页</button><span class="tabular-nums" x-text="`${artifactCenterPage + 1} / ${artifactCenterPageCount()}`"></span><button @click="setArtifactCenterPage(artifactCenterPage + 1)" :disabled="artifactCenterPage + 1 >= artifactCenterPageCount()" class="h-8 px-3 rounded-lg border border-slate-200 disabled:opacity-30">下一页</button></div></div></section>
    <aside x-show="artifactCenterSelected" x-cloak class="w-[min(42vw,560px)] shrink-0 border-l border-slate-200 bg-white flex flex-col"><template x-if="artifactCenterSelected"><div class="flex flex-col h-full"><header class="p-4 border-b border-slate-100 flex items-start gap-3"><div class="flex-1 min-w-0"><h3 class="text-sm font-semibold text-slate-800 truncate" x-text="artifactFileName(artifactCenterSelected)"></h3><p class="text-xs text-slate-400 mt-1" x-text="artifactCenterSelected.summary || '无摘要'"></p></div><button @click="artifactCenterSelected=null" class="text-slate-400">×</button></header><div class="px-4 py-3 border-b border-slate-100 space-y-1 text-[11px] text-slate-500"><div><span class="text-slate-400">任务：</span><span x-text="artifactCenterSelected.task_title"></span></div><div><span class="text-slate-400">来源：</span><span x-text="artifactCenterSelected.created_by"></span><span class="ml-3 text-slate-400">阶段：</span><span x-text="artifactCenterSelected.phase || '未知'"></span></div><div><span class="text-slate-400">路径：</span><span class="font-mono" x-text="artifactCenterSelected.path"></span></div></div><div class="flex-1 overflow-auto p-4">
      <template x-if="artifactCenterSelected._previewKind === 'image'"><img :src="artifactDownloadUrl(artifactCenterSelected)" class="max-w-full rounded-lg"></template>
      <template x-if="artifactCenterSelected._loading"><div class="py-12 text-center text-xs text-slate-400">读取中…</div></template>
      <template x-if="artifactCenterSelected._error"><div class="rounded-lg border border-rose-100 bg-rose-50 p-3 text-xs text-rose-600" x-text="artifactCenterSelected._error"></div></template>
      <template x-if="artifactCenterSelected._notice"><div class="rounded-lg border border-amber-100 bg-amber-50 p-3 text-xs text-amber-700" x-text="artifactCenterSelected._notice"></div></template>
      <template x-if="artifactCenterSelected._previewKind === 'markdown' && !artifactCenterSelected._loading && !artifactCenterSelected._error && !artifactCenterSelected._notice"><div><div x-show="artifactCenterSelected._rendered" class="md-preview text-sm" x-html="artifactCenterSelected._rendered"></div><div x-show="!artifactCenterSelected._rendered" class="py-12 text-center text-xs text-slate-400">文件为空</div></div></template>
      <template x-if="(artifactCenterSelected._previewKind === 'text' || artifactCenterSelected._previewKind === 'json') && !artifactCenterSelected._loading && !artifactCenterSelected._error && !artifactCenterSelected._notice"><div class="space-y-3"><div x-show="artifactCenterSelected._warning" class="rounded-lg border border-amber-100 bg-amber-50 p-3 text-xs text-amber-700" x-text="artifactCenterSelected._warning"></div><pre data-testid="artifact-preview-text" x-show="artifactCenterSelected._content.length > 0" class="text-xs whitespace-pre-wrap break-words font-mono text-slate-700" x-text="artifactCenterSelected._content"></pre><div x-show="artifactCenterSelected._content.length === 0" class="py-12 text-center text-xs text-slate-400">文件为空</div></div></template>
    </div><footer class="p-3 border-t border-slate-100 flex justify-end gap-2"><a :href="artifactDownloadUrl(artifactCenterSelected)" download class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600">下载</a><button @click="archiveArtifactCenter(artifactCenterSelected)" class="px-3 py-1.5 rounded-lg border border-rose-100 text-xs text-rose-500">归档</button></footer></div></template></aside>
  </main>
</div>
