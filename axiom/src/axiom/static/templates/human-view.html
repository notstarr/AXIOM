<template x-if="activePage === 'task-detail' && view === 'human' && !project && taskDetailLoad?.summary === 'error'">
<div class="h-full min-h-0 flex items-center justify-center bg-slate-50/60 p-6">
  <section class="w-full max-w-lg rounded-2xl border border-rose-200 bg-white p-8 text-center shadow-sm">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-rose-50 text-xl text-rose-500">!</div>
    <h2 class="mt-4 text-base font-semibold text-slate-800">任务信息加载失败</h2>
    <p class="mt-2 text-sm leading-6 text-slate-500" x-text="taskDetailLoad?.summaryError || '无法读取任务摘要，请稍后重试。'"></p>
    <div class="mt-5 flex items-center justify-center gap-2">
      <button @click="retryTaskSummary()" class="rounded-xl bg-brand-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-600">重试</button>
      <button @click="backToList()" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50">返回任务列表</button>
    </div>
  </section>
</div>
</template>

<template x-if="activePage === 'task-detail' && view === 'human' && project">
<div class="h-full min-h-0 flex flex-col overflow-hidden min-w-0 bg-slate-50/40">
  <header class="app-page-header shrink-0 bg-white/90 backdrop-blur border-b border-slate-200/70">
    <div class="task-detail-toolbar">
      <button @click="backToList()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 transition shrink-0" aria-label="返回任务列表">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="task-detail-title min-w-0">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-semibold text-slate-800 truncate" x-text="project?.project?.title"></h2>
          <span class="text-[11px] font-mono text-slate-400" x-text="project?.project?.id"></span>
          <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold" :class="projectStatusBadgeClass(project.project.status)" x-text="projectStatusLabel(project.project.status)"></span>
          <span x-show="project?.project?.archived" class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold bg-slate-200 text-slate-600">已归档</span>
        </div>
      </div>
      <div class="sto-seg" role="group" aria-label="任务视图">
        <button type="button" @click="switchTaskView('human')" :class="view === 'human' ? 'on' : ''" :aria-pressed="view === 'human'">概览</button>
        <button type="button" @click="switchTaskView('graph')" :class="view === 'graph' ? 'on' : ''" :aria-pressed="view === 'graph'">图谱</button>
        <button type="button" @click="switchTaskView('archive')" :class="view === 'archive' ? 'on' : ''" :aria-pressed="view === 'archive'">归档</button>
      </div>
      <div class="task-detail-spacer flex-1"></div>
      <div class="task-detail-actions flex items-center gap-2">
        <span x-show="taskRunWindowLabel(project?.project)" class="hidden md:inline-flex flex-col rounded-lg border px-2.5 py-1 leading-tight"
          :class="taskRunWindowClass(project?.project)">
          <span class="text-[10px] font-semibold tabular-nums" x-text="taskRunWindowLabel(project?.project)"></span>
          <span class="text-[9px] opacity-75" x-text="taskRunDeadlineLabel(project?.project)"></span>
        </span>
        <span class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200 text-[11px] text-slate-500">
          <span class="h-1.5 w-1.5 rounded-full" :class="project?.project?.status === 'active' ? 'bg-emerald-400' : project?.project?.status === 'completed' ? 'bg-slate-400' : 'bg-amber-400'"></span>
          <span x-text="humanGoalStatusLabel()"></span>
        </span>
        <button x-show="!project?.project?.archived && !project?.project?.legacy_readonly && ['active', 'stopped'].includes(project?.project?.status)"
          @click="toggleProjectStopById(project.project.id, project.project.status)"
          class="sto-ghost"
          :class="project.project.status === 'active' ? 'is-warn' : 'is-ok'"
          x-text="project.project.status === 'active' ? '暂停' : '继续'"></button>
        <button x-show="!project?.project?.archived && !project?.project?.legacy_readonly"
          @click="toggleProjectGuardById(project.project.id, project.project.guard_enabled)"
          class="sto-ghost"
          :class="project.project.guard_enabled ? 'is-ok' : 'is-danger'"
          :title="project.project.guard_enabled ? '关闭当前任务的 Guard 守卫' : '开启当前任务的 Guard 守卫'"
          x-text="project.project.guard_enabled ? '关闭守卫' : '开启守卫'"></button>
        <button x-show="project?.project?.status === 'completed' && !project?.project?.archived && !project?.project?.legacy_readonly" @click="openTaskContinuation(project.project)" class="sto-ghost is-warn">继续任务</button>
        <button x-show="!project?.project?.archived && !project?.project?.legacy_readonly" @click="archiveProjectById(project.project.id, project.project.title)" :disabled="project.project.status === 'active'" :title="project.project.status === 'active' ? '请先暂停任务' : '保留历史并停止后续 Worker 调度'" class="sto-ghost" style="font-size: 12px;" disabled:cursor-not-allowed disabled:opacity-40>归档任务</button>
        <button x-show="project?.project?.archived && !project?.project?.legacy_readonly" @click="unarchiveProjectById(project.project.id, project.project.title)" class="sto-ghost is-ok">恢复任务</button>
        <button x-show="project?.project?.archived && !project?.project?.legacy_readonly" @click="deleteProjectById(project.project.id, project.project.title)" class="px-2.5 py-1 rounded-lg border border-rose-200 text-xs text-rose-600 hover:bg-rose-50 transition">永久删除</button>
        <button @click="refreshCurrentPage()" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 transition">刷新</button>
      </div>
    </div>
    <nav class="px-5 flex items-center gap-1 border-t border-slate-100 overflow-x-auto" aria-label="任务工作台导航">
      <template x-for="tab in [
        {id: 'workspace', label: '工作台'},
        {id: 'todos', label: '看板'},
      ]" :key="tab.id">
        <button x-show="!project?.project?.archived" @click="switchHumanTab(tab.id)" class="relative px-3 py-2.5 text-xs whitespace-nowrap transition"
          :class="humanTab === tab.id ? 'text-brand-600 font-semibold' : 'text-slate-500 hover:text-slate-700'">
          <span x-text="tab.label"></span>
          <span x-show="tab.id === 'todos' && (isRedTeamBoard() ? project.chains?.length : project.todos?.length)" class="ml-1 inline-flex items-center rounded-full px-1.5 py-px text-[9px] font-semibold tabular-nums" :class="humanTab === tab.id ? 'bg-brand-50 text-brand-600' : 'bg-slate-100 text-slate-500'" x-text="isRedTeamBoard() ? (project.chains || []).length : project.todos.filter(item => !item.archived).length"></span>
          <span x-show="humanTab === tab.id" class="absolute inset-x-2 bottom-0 h-0.5 rounded-full bg-brand-500"></span>
        </button>
      </template>
    </nav>
  </header>

  <div x-cloak x-show="!project?.project?.archived && (taskDetailLoad?.hydrating || taskDetailHasErrors())"
    class="shrink-0 border-b px-5 py-2 text-xs"
    :class="taskDetailHasErrors() ? 'border-amber-200 bg-amber-50 text-amber-800' : 'border-blue-100 bg-blue-50 text-blue-700'">
    <div class="mx-auto flex max-w-[1600px] items-center justify-between gap-3">
      <span x-text="taskDetailHasErrors() ? '部分详情加载失败，已加载内容仍可使用。' : (isRedTeamBoard() ? '任务摘要已显示，正在后台加载图谱、攻击链、成果和产物…' : '任务摘要已显示，正在后台加载图谱、Todo、漏洞和产物…')"></span>
      <button x-show="taskDetailHasErrors()" @click="retryTaskDetailSection()" class="shrink-0 rounded-lg border border-amber-300 bg-white/70 px-2.5 py-1 font-medium hover:bg-white">重试失败区块</button>
    </div>
  </div>

  <template x-if="project?.project?.archived">
    <main class="flex-1 min-h-0 flex items-center justify-center p-6 bg-slate-50/40">
      <section class="w-full max-w-lg sto-panel p-8 text-center">
        <div class="mx-auto h-12 w-12 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center text-xl">▣</div>
        <h3 class="mt-4 text-base font-semibold text-slate-800">任务已归档</h3>
        <p class="mt-2 text-sm leading-6 text-slate-500">该任务的 Fact、Intent、Todo、漏洞和产物已从正常页面隐藏。恢复任务后，历史内容才会重新显示。</p>
        <div class="mt-5 flex items-center justify-center gap-2">
          <button @click="unarchiveProjectById(project.project.id, project.project.title)" class="px-4 py-2 rounded-xl bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 transition">恢复任务并查看产物</button>
          <button @click="deleteProjectById(project.project.id, project.project.title)" class="px-4 py-2 rounded-xl border border-rose-200 text-sm font-medium text-rose-600 hover:bg-rose-50 transition">永久删除</button>
        </div>
      </section>
    </main>
  </template>

  <!-- 工作台：用运行循环表达 Reason 重入和 Explore 并发，不把任务伪装成线性流程。 -->
  <template x-if="humanTab === 'workspace'">
  <main x-show="!project?.project?.archived" class="flex-1 min-h-0 overflow-y-auto p-5">
    <div class="grid grid-cols-1 xl:grid-cols-[260px_minmax(0,1fr)] gap-4 max-w-[1600px] mx-auto">
      <aside class="space-y-3 self-start xl:sticky xl:top-0">
        <section class="sto-panel" style="padding:16px;">
          <div class="flex items-center justify-between">
            <div>
              <p class="sto-label">运行循环</p>
              <h3 class="mt-1 text-sm font-semibold text-slate-800" x-text="humanCycleModel().current ? `当前第 ${humanCycleModel().current.number} 轮` : '等待启动'"></h3>
            </div>
            <span class="px-2 py-1 rounded-lg text-[10px] border" :class="humanCycleStatusClass(humanCycleModel().current?.status)" x-text="humanCycleStatusLabel(humanCycleModel().current?.status)"></span>
          </div>

          <div class="mt-4 space-y-2.5">
            <div class="flex items-center gap-2">
              <span class="h-5 w-5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0" :class="humanStageStateClass('bootstrap')" title="攻击面初始化" x-text="humanStageState('bootstrap').icon"></span>
              <span class="text-xs font-semibold text-slate-700">Bootstrap</span>
              <span class="ml-auto text-[10px] text-slate-400 shrink-0" x-text="humanStageLabel('bootstrap')"></span>
            </div>
            <div class="flex items-center gap-2">
              <span class="h-5 w-5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0" :class="humanStageStateClass('plan')" title="复核历史覆盖、证据武器化和阻断替代方案" x-text="humanStageState('plan').icon"></span>
              <span class="text-xs font-semibold text-indigo-700">Plan 全景复盘</span>
              <span class="ml-auto text-[10px] text-indigo-400 shrink-0" x-text="humanStageLabel('plan')"></span>
            </div>
            <div class="flex items-center gap-2">
              <span class="h-5 w-5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0" :class="humanStageStateClass('reason')" x-text="humanStageState('reason').icon"></span>
              <span class="text-xs font-semibold text-slate-700">Reason</span>
              <span class="ml-auto text-[10px] shrink-0" :class="humanStageLabel('reason') === '等待领取' ? 'text-slate-400' : 'text-blue-600'" x-text="`${humanStageLabel('reason')} · ${humanCycleCounts().reason} 轮`"></span>
            </div>
            <div class="flex items-center gap-2">
              <span class="h-5 w-5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0" :class="humanStageStateClass('explore')" x-text="humanStageState('explore').icon"></span>
              <span class="text-xs font-semibold text-slate-700">Explore</span>
              <span class="ml-auto text-[10px] shrink-0" :class="humanStageLabel('explore') === '等待执行' ? 'text-slate-400' : 'text-violet-600'" x-text="`${humanStageLabel('explore')} · ${humanCycleCounts().explore} Intent`"></span>
            </div>
          </div>

          <div class="mt-4 rounded-xl bg-slate-50 border border-slate-100 p-3">
            <p class="text-[10px] uppercase tracking-wider text-slate-400">下一步</p>
            <p class="mt-1.5 text-xs leading-5 text-slate-600" x-text="humanNextActionLabel()"></p>
          </div>

          <template x-if="project?.project?.last_plan_decision">
            <div class="mt-3 rounded-xl border border-indigo-100 bg-indigo-50/60 p-3">
              <div class="flex items-center justify-between gap-2">
                <p class="text-[10px] uppercase tracking-wider text-indigo-400">最近 Plan 决策</p>
                <span class="rounded-lg border border-indigo-200 bg-white/70 px-2 py-0.5 text-[10px] font-semibold text-indigo-700" x-text="planDecisionLabel(project.project.last_plan_decision)"></span>
              </div>
              <p x-show="project.project.last_plan_decision.exhaustion_reason" class="mt-1.5 text-[11px] leading-5 text-indigo-900/70" x-text="project.project.last_plan_decision.exhaustion_reason"></p>
              <p class="mt-1 text-[10px] text-indigo-500" x-text="`置信度：${project.project.last_plan_decision.confidence || '未记录'}`"></p>
            </div>
          </template>
        </section>

        <section class="sto-panel" style="padding:16px;">
          <details>
            <summary class="flex items-center justify-between cursor-pointer select-none" style="list-style:none;">
              <h3 class="text-xs font-semibold text-slate-700">历史循环</h3>
              <span class="text-[10px] text-slate-400" x-text="`${humanCycleModel().history.length} 轮 ▾`"></span>
            </summary>
            <div class="human-cycle-history mt-3 space-y-2">
            <template x-for="cycle in humanCycleModel().history" :key="cycle.key">
              <details class="rounded-lg border border-slate-100 bg-slate-50/60 group">
                <summary class="flex items-center gap-2 cursor-pointer list-none px-2 py-2 hover:bg-slate-100/70 transition">
                  <span class="h-5 w-5 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-[10px] font-semibold" x-text="cycle.number"></span>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center justify-between gap-2"><span class="text-[11px] text-slate-600" x-text="humanCycleStatusLabel(cycle.status)"></span><span class="text-[10px] text-slate-400" x-text="`${cycle.intents.length} Intent`"></span></div>
                    <p class="text-[10px] text-slate-400 truncate" x-text="`${cycle.reasonRunId || '历史 Reason'} · ${cycle.reasonWorker || 'Reason'}`"></p>
                  </div>
                  <span class="text-slate-400 text-[10px] group-open:rotate-90 transition-transform">›</span>
                </summary>
                <div class="px-2.5 pb-2.5 pt-1 border-t border-slate-100 space-y-1.5 text-[10px] text-slate-500">
                  <div class="flex flex-wrap gap-x-3 gap-y-1"><span x-text="`触发：${cycle.trigger || 'scheduler'}`"></span><span x-text="`Worker：${cycle.reasonWorker || '未记录'}`"></span><span x-text="`Workspace：${cycle.workspaceAttempts || 0} 次`"></span><span x-text="cycle.createdAt ? `开始：${formatDate(cycle.createdAt)}` : '开始：未记录'"></span><span x-text="cycle.finishedAt ? `结束：${formatDate(cycle.finishedAt)}` : '结束：未记录'"></span></div>
                  <p x-show="cycle.failureReason" class="text-rose-600" x-text="`原因：${cycle.failureReason}`"></p>
                  <template x-if="cycle.intents.length">
                    <div class="space-y-1"><p class="text-[9px] uppercase tracking-wider text-slate-400">本轮 Intent</p><template x-for="intent in cycle.intents" :key="`${cycle.key}-${intent.id}`"><div class="flex items-start gap-1.5"><span class="font-mono text-slate-400" x-text="intent.id"></span><span class="truncate" x-text="intent.description || '未命名 Intent'"></span><span class="ml-auto shrink-0" x-text="humanIntentStatusLabel(intent)"></span></div></template></div>
                  </template>
                  <p x-show="!cycle.intents.length" class="text-slate-400">本轮没有派发 Intent。</p>
                </div>
              </details>
            </template>
            <p x-show="humanCycleModel().history.length === 0" class="text-[11px] text-slate-400">还没有已结束的历史循环。</p>
            </div>
          </details>
        </section>

        <section class="sto-panel" style="padding:16px;" x-show="(project?.goal_cycles || []).length > 1">
          <details>
            <summary class="flex items-center justify-between cursor-pointer select-none" style="list-style:none;">
              <h3 class="text-xs font-semibold text-slate-700">Goal 历史</h3>
              <span class="text-[10px] text-slate-400" x-text="`${project.goal_cycles.length} 轮 ▾`"></span>
            </summary>
            <div class="mt-3 space-y-2">
              <template x-for="cycle in project.goal_cycles" :key="cycle.id">
                <div class="rounded-xl border px-3 py-2" :class="cycle.id === project.project.current_goal_cycle_id ? 'border-amber-200 bg-amber-50/70' : 'border-slate-100 bg-slate-50'">
                  <div class="flex items-center justify-between gap-2"><span class="text-[10px] font-semibold" :class="cycle.id === project.project.current_goal_cycle_id ? 'text-amber-800' : 'text-slate-500'" x-text="`第 ${cycle.sequence} 轮${cycle.id === project.project.current_goal_cycle_id ? ' · 当前' : ''}`"></span><span class="text-[9px] text-slate-400" x-text="cycle.status === 'completed' ? `完成于 ${formatTime(cycle.completed_at)}` : '进行中'"></span></div>
                  <p class="mt-1 text-xs leading-5 text-slate-600" x-text="cycle.goal"></p>
                  <p x-show="cycle.continuation_reason" class="mt-1 text-[10px] text-slate-400" x-text="`续跑原因：${cycle.continuation_reason}`"></p>
                </div>
              </template>
            </div>
          </details>
        </section>
      </aside>

      <div class="min-w-0 space-y-4">
        <section class="sto-panel" style="padding:16px 20px;">
          <div class="flex items-start gap-4 flex-wrap">
            <div class="min-w-0 flex-1" style="min-width:260px;">
              <p class="sto-label">任务目标</p>
              <p class="mt-1 text-sm font-semibold text-slate-800" :title="project?.project?.goal" x-text="project?.project?.goal || '未设置任务目标'"></p>
            </div>
            <div class="min-w-0 flex-1" style="min-width:260px;">
              <p class="sto-label">任务起点</p>
              <p class="mt-1 text-sm font-semibold text-slate-800 whitespace-pre-wrap break-all" :title="project?.project?.origin" x-text="project?.project?.origin || '未设置任务起点'"></p>
            </div>
            <div class="hidden md:flex items-center gap-2.5 flex-wrap justify-end">
              <div class="flex items-center gap-2 rounded-xl border border-slate-200/80 bg-slate-50/70 px-3.5 py-2">
                <span class="text-lg font-bold tabular-nums leading-none text-slate-800" x-text="humanCycleModel().current?.number ?? 0"></span>
                <span class="text-[10px] text-slate-500">当前轮次</span>
              </div>
              <div class="flex items-center gap-2 rounded-xl border border-slate-200/80 bg-slate-50/70 px-3.5 py-2">
                <span x-show="isRedTeamBoard()" class="text-lg font-bold tabular-nums leading-none text-rose-500" x-text="`${humanRedTeamPoints().awarded}/${humanRedTeamPoints().target}`"></span>
                <span x-show="!isRedTeamBoard()" class="text-lg font-bold tabular-nums leading-none text-brand-600" x-text="`${humanTodoProgress().completed}/${humanTodoProgress().total}`"></span>
                <span class="text-[10px] text-slate-500" x-text="isRedTeamBoard() ? '积分' : 'Todo'"></span>
              </div>
              <div class="flex items-center gap-2 rounded-xl border border-slate-200/80 bg-slate-50/70 px-3.5 py-2">
                <span class="text-lg font-bold tabular-nums leading-none text-blue-600" x-text="humanCurrentIntents().length"></span>
                <span class="text-[10px] text-slate-500">活跃 Intent</span>
              </div>
              <span class="px-2.5 py-1.5 rounded-lg border text-[10px] font-semibold" :class="humanGoalStatusClass()" x-text="humanGoalStatusLabel()"></span>
            </div>
          </div>
          <div class="mt-3 flex items-center gap-2.5">
            <div class="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
              <div class="h-full rounded-full transition-all" :class="isRedTeamBoard() ? 'bg-rose-500' : 'bg-brand-500'" :style="`width:${isRedTeamBoard() ? humanRedTeamPoints().percent : humanIntentCoverage().percent}%`"></div>
            </div>
            <span class="text-sm font-bold tabular-nums" :class="isRedTeamBoard() ? 'text-rose-500' : 'text-brand-600'" x-text="`${isRedTeamBoard() ? humanRedTeamPoints().percent : humanIntentCoverage().percent}%`"></span>
          </div>
        </section>
        <template x-if="humanAttentionItems().length">
          <div class="sto-panel" style="padding:12px 16px; border-left:3px solid var(--sto-warn);">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="sto-label" style="color:var(--sto-warn); flex-shrink:0;">需要关注</p>
              <template x-for="(item, idx) in humanAttentionItems()" :key="`attn-${idx}`">
                <span class="px-2.5 py-1 rounded-lg text-[11px] font-medium"
                  :class="item.level === 'danger' ? 'bg-rose-50 text-rose-700 border border-rose-100' : item.level === 'warn' ? 'bg-amber-50 text-amber-700 border border-amber-100' : 'bg-sky-50 text-sky-700 border border-sky-100'"
                  x-text="item.label"></span>
              </template>
            </div>
          </div>
        </template>

        <section class="token-usage-panel sto-panel" style="padding:14px 20px;">
          <div class="flex items-center gap-4 flex-wrap">
            <p class="sto-label" style="flex-shrink:0;">Token 消耗</p>
            <template x-if="selectedTaskDiagnostics()">
              <div class="flex items-center gap-x-4 gap-y-1 flex-wrap text-[11px] text-slate-500">
                <span>总 <b class="text-[13px] font-bold text-slate-800 tabular-nums" x-text="formatTokenCount(taskTokenSummary().total_tokens ?? taskTokenSummary().total)"></b></span>
                <span style="color:#3b82f6;">输入 <b class="font-semibold tabular-nums" x-text="formatTokenCount(taskTokenSummary().input_tokens ?? taskTokenSummary().input_uncached)"></b></span>
                <span style="color:#18a875;">命中 <b class="font-semibold tabular-nums" x-text="formatTokenCount(taskTokenSummary().cache_read_tokens ?? taskTokenSummary().cache_read)"></b></span>

        <section class="sto-panel" style="padding:18px 20px;">
            <div class="flex items-center justify-between"><div><h3 class="text-sm font-semibold text-slate-800">事实与待验证线索</h3><p class="mt-1 text-xs text-slate-400">各展示最新 3 条，并保留生产 Intent 深链。</p></div></div>
            <div class="mt-3 grid grid-cols-1 xl:grid-cols-2 gap-3">
              <div class="space-y-2"><p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">事实</p><template x-for="fact in humanRecentFacts(3)" :key="`workspace-fact-${fact.id}`"><button type="button" @click="openHumanFact(fact)" class="human-link-card w-full text-left rounded-lg bg-slate-50 border border-slate-100 p-2.5 hover:border-brand-300 transition"><div class="flex items-center justify-between gap-2"><span class="text-[10px] font-mono text-slate-400" x-text="fact.id"></span><span class="text-[10px] text-brand-600 truncate" x-text="humanSourceLabel(fact, '系统事实')"></span></div><p class="mt-1 text-xs text-slate-600 line-clamp-2" x-text="fact.description"></p></button></template><p x-show="taskDetailSectionPending('graph')" class="py-2 text-xs text-slate-400">正在加载事实…</p><p x-show="taskDetailSectionError('graph')" class="py-2 text-xs text-rose-500">事实加载失败。<button @click="retryTaskDetailSection('graph')" class="ml-1 text-brand-600 hover:underline">重试</button></p><p x-show="taskDetailSectionReady('graph') && humanRecentFacts(3).length === 0" class="py-2 text-xs text-slate-400">尚未产生事实。</p></div>

        </section>

        <section class="sto-panel" style="padding:18px 20px;">
            <div class="flex items-center justify-between"><div><h3 class="text-sm font-semibold text-slate-800" x-text="isRedTeamBoard() ? '积分进度' : '风险摘要'"></h3><p class="mt-1 text-xs text-slate-400" x-text="isRedTeamBoard() ? '核定积分和成果状态在重要事实的成果视图维护。' : '漏洞详情和状态统一在漏洞管理中维护。'"></p></div><button @click="openTaskVulnerabilities()" class="text-[11px] text-brand-600 hover:text-brand-700" x-text="isRedTeamBoard() ? '查看本任务成果 →' : '查看本任务漏洞 →'"></button></div>
            <div x-show="isRedTeamBoard()" class="mt-4 flex flex-wrap gap-2">

              <span class="px-2.5 py-1.5 rounded-full bg-slate-50 text-slate-700 border border-slate-100 text-xs">攻击链 <b x-text="(project.chains || []).length"></b></span>
            </div>
            <div x-show="!isRedTeamBoard()" class="mt-4 flex flex-wrap gap-2">

              <span class="px-2.5 py-1.5 rounded-full bg-orange-50 text-orange-700 border border-orange-100 text-xs">高危 <b x-text="humanSeverityCounts().high"></b></span>

            <p x-show="isRedTeamBoard()" class="mt-4 text-xs text-slate-400" x-text="(project.red_team_results || []).length ? `本任务已上报 ${(project.red_team_results || []).length} 条成果。` : '当前没有已上报成果。'"></p>

  <!-- Todo 全量视图：左总览树 + 右 Intent 详情 -->
  <template x-if="humanTab === 'todos'">

      <div class="flex gap-4 items-stretch">
        <section class="sto-panel shrink-0 flex flex-col" style="padding:12px; width:380px; max-height:calc(100vh - 220px); overflow:hidden;">
          <div class="flex items-center justify-between px-2 pb-2 shrink-0">

            <span x-show="isRedTeamBoard()" class="text-[10px] font-mono text-rose-500 tabular-nums" x-text="`${humanRedTeamPoints().awarded}/${humanRedTeamPoints().target}`"></span>
            <div class="flex items-center" style="gap:6px;">
              <span x-show="!isRedTeamBoard()" class="text-[10px] font-mono text-slate-400 tabular-nums" x-text="`${humanTodoProgress().completed}/${humanTodoProgress().total}`"></span>

                <button type="button" :class="humanNavMode === 'tree' ? 'on' : ''" @click="humanNavMode = 'tree'">总览</button>

          <div x-show="humanNavMode === 'tree'" class="space-y-1.5">

            <template x-for="todo in humanSortedTodos()" :key="`nav-${todo.id}`">
              <div class="rounded-xl border transition"
                :class="todoNavExpandedId === todo.id ? 'border-brand-200 bg-brand-50/20' : (todo.status === 'completed' ? 'border-emerald-100/80 bg-emerald-50/10' : 'border-slate-200/80 bg-white')">
                <button type="button" @click="toggleTodoNav(todo.id)"

                  <span class="font-mono text-[10px] font-bold text-slate-600 shrink-0" x-text="todo.id"></span>

          </div>
        </section>

        <section class="sto-panel min-h-[420px]" style="padding:12px 16px; flex:1 1 0; min-width:0;">
          <template x-if="!todoNavIntentRecord()">
            <div class="min-h-[380px] grid place-items-center text-center">
              <div>
                <div class="mx-auto h-12 w-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center text-xl">&#9776;</div>
                <p class="mt-3 text-sm text-slate-400" x-text="isRedTeamBoard() ? '从左侧展开攻击链，点击任意 Intent 查看详情' : '从左侧展开 Todo，点击任意 Intent 查看详情'"></p>
              </div>
            </div>
          </template>
          <template x-if="todoNavIntentRecord()">
            <div class="space-y-4">
              <div class="flex items-start justify-between gap-3 pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-mono text-sm font-bold text-slate-700" x-text="todoNavIntentRecord().id"></span>
                  <span class="px-2 py-0.5 rounded-md border text-[10px] font-medium" :class="humanIntentStatusClass(todoNavIntentRecord())" x-text="humanIntentStatusLabel(todoNavIntentRecord())"></span>
                </div>
                <span class="text-[10px] text-slate-400 shrink-0" x-show="todoNavIntentRecord().created_at" x-text="formatTime(todoNavIntentRecord().created_at)"></span>
              </div>

              <div>
                <p class="tip-label">Intent 详情</p>
                <p class="mt-1.5 text-sm leading-6 text-slate-700 whitespace-pre-wrap break-words" x-text="todoNavIntentRecord().description || '未命名 Intent'"></p>
              </div>

              <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="rounded-xl bg-slate-50 border border-slate-100 px-3 py-2.5"><p class="text-[10px] text-slate-400">Worker</p><p class="mt-0.5 text-xs font-medium text-slate-700 truncate" x-text="todoNavIntentRecord().worker || '未领取'"></p></div>
                <div class="rounded-xl bg-slate-50 border border-slate-100 px-3 py-2.5"><p class="text-[10px] text-slate-400" x-text="intentParentNoun()"></p><p class="mt-0.5 text-xs font-medium text-slate-700 truncate" x-text="intentParentLabel(todoNavIntentRecord())"></p></div>
                <div class="rounded-xl bg-slate-50 border border-slate-100 px-3 py-2.5"><p class="text-[10px] text-slate-400">重试</p><p class="mt-0.5 text-xs font-medium text-slate-700" x-text="`${todoNavIntentRecord().retry_count || 0} 执行 · ${todoNavIntentRecord().infrastructure_retry_count || 0} 基础设施`"></p></div>
                <div class="rounded-xl bg-slate-50 border border-slate-100 px-3 py-2.5"><p class="text-[10px] text-slate-400">目标</p><p class="mt-0.5 text-xs font-medium text-slate-700 truncate" x-text="todoNavIntentRecord().targets?.join(', ') || '&#8212;'"></p></div>
              </div>

              <div x-show="isRedTeamBoard() && navIntentsForTodo(todoNavIntentRecord().chain_id).length" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5">
                <p class="tip-label">攻击链</p>
                <div class="chain-strip" style="margin-top:8px;">
                  <template x-for="(intent, index) in navIntentsForTodo(todoNavIntentRecord().chain_id)" :key="`detail-chain-${intent.id}`">
                    <span class="chain-strip-item">
                      <button type="button" class="chain-chip" :class="intent.id === todoNavIntentRecord().id ? 'on' : ''" :title="intent.description || ''" @click="selectTodoNavIntent(intent.id)">
                        <span x-text="intent.id"></span>
                      </button>
                      <span class="chain-arrow" x-show="index < navIntentsForTodo(todoNavIntentRecord().chain_id).length - 1">→</span>
                    </span>
                  </template>
                </div>
              </div>

              <div>
                <p class="tip-label">来源 · 输入 Facts</p>
                <div class="mt-1.5 space-y-1.5">
                  <template x-for="fact in intentSourceFacts(todoNavIntentRecord())" :key="`src-${fact.id}`">
                    <div class="rounded-lg bg-slate-50 border border-slate-100 px-3 py-2 flex items-baseline gap-2">
                      <span class="font-mono text-[10px] shrink-0 cursor-pointer text-brand-600 hover:text-brand-700 hover:underline transition"
                        @click="(() => { const p = humanFactProducer(fact); if (p) selectTodoNavIntent(p.id); })()"
                        :title="'上一步：跳转到 ' + (humanFactProducer(fact) ? humanFactProducer(fact).id : '')"
                        x-text="fact.id"></span>
                      <span class="text-[11px] text-slate-600 truncate" x-text="fact.description"></span>
                    </div>
                  </template>
                  <p x-show="intentSourceFacts(todoNavIntentRecord()).length === 0" class="text-[11px] text-slate-400">没有记录输入来源。</p>
                </div>
              </div>

              <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                <div class="rounded-xl border border-slate-200 bg-slate-50/60 p-4">
                  <p class="tip-label">评估详情</p>
                  <div class="mt-2">
                    <span class="text-xs font-bold tracking-wide"
                      :class="todoNavIntentRecord().assessment_status === 'completed' ? 'text-emerald-600' : (todoNavIntentRecord().assessment_status === 'partial' ? 'text-amber-600' : (todoNavIntentRecord().assessment_status === 'blocked' ? 'text-rose-600' : 'text-slate-400'))"
                      x-text="todoNavIntentRecord().assessment_status || '未评估'"></span>
                  </div>
                  <p x-show="todoNavIntentRecord().assessment_reason" class="tip-reason mt-1.5 text-[11px] leading-5 whitespace-pre-wrap break-words" x-text="todoNavIntentRecord().assessment_reason || ''"></p>
                  <p x-show="!todoNavIntentRecord().assessment_reason" class="mt-1.5 text-[11px] text-slate-400">暂无评估描述。</p>
                </div>
                <div class="rounded-xl border border-slate-200 bg-slate-50/60 p-4">
                  <p class="tip-label">产出物 · Fact</p>
                  <div class="mt-2 space-y-1.5">
                    <template x-for="fact in intentProducedFacts(todoNavIntentRecord())" :key="`out-${fact.id}`">
                      <div class="rounded-lg border border-slate-200 bg-white px-3 py-2">
                        <div class="flex items-baseline gap-2">
                          <span class="font-mono text-[10px] text-slate-400 shrink-0" x-text="fact.id"></span>
                          <span class="text-[11px] text-slate-600 truncate" style="min-width:0; flex:1 1 0;" x-text="fact.description"></span>
                        </div>
                        <div class="mt-1.5 flex flex-wrap gap-x-3 gap-y-1">
                          <template x-for="link in factArtifactLinks(fact)" :key="`out-link-${fact.id}-${link.id}`">
                            <button type="button" @click="openFactArtifactLink(selectedProjectId || project?.project?.id, link.id)"
                              class="font-mono text-[10px] text-brand-600 hover:text-brand-700 hover:underline transition"
                              x-text="`${link.label} &#8599;`"></button>
                          </template>
                          <span x-show="factArtifactLinks(fact).length === 0" class="text-[10px] text-slate-400">暂无产物链接</span>
                        </div>
                      </div>
                    </template>
                    <p x-show="intentProducedFacts(todoNavIntentRecord()).length === 0" class="text-[11px] text-slate-400">该 Intent 尚未产出 Fact。</p>
                  </div>
                </div>
              </div>
              <template x-if="humanNextStepIntents(todoNavIntentRecord().id).length > 0">
                <div class="rounded-xl border border-brand-200 bg-brand-50/10 p-4">
                  <p class="tip-label">下一步 · 派发 Intent</p>
                  <div class="mt-2 space-y-1.5">
                    <template x-for="next in humanNextStepIntents(todoNavIntentRecord().id)" :key="`next-${next.id}`">
                      <div class="rounded-lg border border-slate-200 bg-white px-3 py-2">
                        <div class="flex items-baseline gap-2">
                          <span class="font-mono text-[10px] shrink-0 cursor-pointer text-brand-600 hover:text-brand-700 hover:underline transition"
                            @click="selectTodoNavIntent(next.id)"
                            :title="'下一步：跳转到 ' + next.id"
                            x-text="next.id"></span>
                          <span class="text-[11px] text-slate-600 truncate" x-text="next.description || '未命名 Intent'"></span>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </section>
      </div>


    </div>
  </main>
  </template>

  <!-- 全局 Intent 悬浮卡（单实例跟随鼠标，pointer-events:none 不挡交互；与 graph-view 共用样式） -->
  <div x-show="intentHover" x-cloak class="intent-hover-tip" x-ref="intentTip" :style="intentHoverStyle($refs.intentTip)">
    <div class="flex items-center justify-between gap-2 pb-1.5 mb-2 border-b border-slate-100">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="h-1.5 w-1.5 rounded-full shrink-0" :class="intentDotClass(intentHover?.d || {})"></span>
        <span class="tip-id" x-text="intentHover?.d?.id"></span>
      </div>
      <span class="tip-chip shrink-0" :class="intentStatusClass(intentHover?.d || {})" x-text="intentHover ? intentStatusLabel(intentHover.d) : ''"></span>
    </div>
    <div class="whitespace-pre-wrap break-words text-slate-700" x-text="intentHover?.d?.description || '暂无详细描述'"></div>
    <div x-show="intentHover?.d?.targets?.length" class="mt-2 pt-1.5 border-t border-slate-100 flex items-baseline gap-1.5">
      <span class="tip-label shrink-0">目标</span>
      <span class="font-mono text-[10px] text-slate-500 break-all min-w-0" x-text="intentHover?.d?.targets?.join('  ·  ')"></span>
    </div>
    <div x-show="!intentHover?.lite" class="mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between gap-2">
      <span class="tip-label">评估</span>
      <span class="text-[10px] font-bold tracking-wide"
        :class="intentHover?.d?.assessment_status === 'completed' ? 'text-emerald-600' : (intentHover?.d?.assessment_status === 'partial' ? 'text-amber-600' : (intentHover?.d?.assessment_status === 'blocked' ? 'text-rose-600' : 'text-slate-400'))"
        x-text="intentHover?.d?.assessment_status || '未评估'"></span>
    </div>
    <div x-show="!intentHover?.lite && intentHover?.d?.assessment_reason" class="tip-reason mt-1.5 text-[10px] whitespace-pre-wrap break-words" x-text="intentHover?.d?.assessment_reason"></div>
  </div>

  <!-- Todo 行悬停浮窗：评估详情（status_reason）+ 子 Intent 进度 -->
  <div x-show="todoHover" x-cloak class="intent-hover-tip" x-ref="todoTip" :style="todoHoverStyle($refs.todoTip)">
    <div class="flex items-center justify-between gap-2 pb-1.5 mb-2 border-b border-slate-100">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="h-1.5 w-1.5 rounded-full shrink-0"
          :class="todoHover?.d?.status === 'completed' ? 'bg-emerald-500' : (todoHover?.d?.status === 'blocked' ? 'bg-amber-500' : 'bg-brand-500')"></span>
        <span class="tip-id" x-text="todoHover?.d?.id"></span>
      </div>
      <span class="tip-chip shrink-0"
        :class="todoHover?.d?.status === 'completed' ? 'text-emerald-600' : (todoHover?.d?.status === 'blocked' ? 'text-amber-600' : (todoHover?.d?.status === 'partial' ? 'text-brand-600' : 'text-slate-500'))"
        x-text="todoHover ? humanTodoLabel(todoHover.d.status) : ''"></span>
    </div>
    <div class="text-slate-700 break-words" x-text="todoHover?.d?.title || ''"></div>
    <div class="mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between gap-2">
      <span class="tip-label">子 Intent</span>
      <span class="text-[11px] font-semibold text-slate-700 tabular-nums" x-text="`${todoIntentProgress(todoHover?.d?.id).completed}/${getIntentsForTodo(todoHover?.d?.id).length}`"></span>
    </div>
    <div class="mt-2 pt-1.5 border-t border-slate-100">
      <span class="tip-label">评估</span>
      <p x-show="todoHover?.d?.status_reason" class="tip-reason mt-1 text-[11px] leading-5 whitespace-pre-wrap break-words" x-text="todoHover?.d?.status_reason"></p>
      <p x-show="!todoHover?.d?.status_reason" class="mt-1 text-[11px] text-slate-400">暂无评估说明。</p>
    </div>
  </div>
</div>
</template>
