<template x-if="activePage === 'task-detail' && view === 'human' && project">
<div class="h-full min-h-0 flex flex-col overflow-hidden min-w-0 bg-slate-50/40">
  <header class="app-page-header shrink-0 bg-white/90 backdrop-blur border-b border-slate-200/70">
    <div class="px-5 py-3 flex items-center gap-3">
      <button @click="backToList()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 transition" aria-label="返回任务列表">‹</button>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-semibold text-slate-800 truncate" x-text="project?.project?.title"></h2>
          <span class="text-[11px] font-mono text-slate-400" x-text="project?.project?.id"></span>
          <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold" :class="projectStatusBadgeClass(project.project.status)" x-text="projectStatusLabel(project.project.status)"></span>
          <span x-show="project?.project?.archived" class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold bg-slate-200 text-slate-600">已归档</span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5 truncate" x-text="project?.project?.origin"></p>
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-2">
        <span x-show="taskRunWindowLabel(project?.project)" class="hidden md:inline-flex flex-col rounded-lg border px-2.5 py-1 leading-tight"
          :class="taskRunWindowClass(project?.project)">
          <span class="text-[10px] font-semibold tabular-nums" x-text="taskRunWindowLabel(project?.project)"></span>
          <span class="text-[9px] opacity-75" x-text="taskRunDeadlineLabel(project?.project)"></span>
        </span>
        <span class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200 text-[11px] text-slate-500">
          <span class="h-1.5 w-1.5 rounded-full" :class="project?.project?.status === 'active' ? 'bg-emerald-400' : project?.project?.status === 'completed' ? 'bg-slate-400' : 'bg-amber-400'"></span>
          <span x-text="humanGoalStatusLabel()"></span>
        </span>
        <button @click="triggerManualReason()" :disabled="!canTriggerManualReason()" :title="manualReasonDisabledReason() || '立即触发一次人工 Reason 复盘'" class="manual-reason-trigger px-2.5 py-1 rounded-lg border text-xs transition disabled:cursor-not-allowed">
          <span x-text="manualReasonTriggering ? '正在触发…' : '立刻 Reason'"></span>
        </button>
        <button x-show="project?.project?.status === 'completed' && !project?.project?.archived && !project?.project?.legacy_readonly" @click="openTaskContinuation(project.project)" class="px-2.5 py-1 rounded-lg border border-amber-300 bg-amber-50 text-xs font-medium text-amber-800 hover:bg-amber-100 transition">继续任务</button>
        <button x-show="!project?.project?.archived && !project?.project?.legacy_readonly" @click="archiveProjectById(project.project.id, project.project.title)" :disabled="project.project.status === 'active'" :title="project.project.status === 'active' ? '请先暂停任务' : '保留历史并停止后续 Worker 调度'" class="px-2.5 py-1 rounded-lg border border-slate-300 text-xs text-slate-600 hover:bg-slate-50 transition disabled:cursor-not-allowed disabled:opacity-40">归档任务</button>
        <button x-show="project?.project?.archived && !project?.project?.legacy_readonly" @click="unarchiveProjectById(project.project.id, project.project.title)" class="px-2.5 py-1 rounded-lg border border-emerald-200 text-xs text-emerald-700 hover:bg-emerald-50 transition">恢复任务</button>
        <button @click="refreshCurrentPage()" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 transition">刷新</button>
        <button @click="switchTaskView('graph')" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 transition">图谱</button>
        <button @click="switchTaskView('archive')" class="px-2.5 py-1 rounded-lg border border-amber-200 text-xs text-amber-700 hover:bg-amber-50 transition">归档</button>
      </div>
    </div>
    <nav class="px-5 flex items-center gap-1 border-t border-slate-100 overflow-x-auto" aria-label="任务工作台导航">
      <template x-for="tab in [
        {id: 'workspace', label: '工作台'},
        {id: 'conversation', label: '实时对话'},
        {id: 'todos', label: 'Todo'},
        {id: 'intents', label: 'Intents'},
        {id: 'facts', label: '事实与线索'},
        {id: 'artifacts', label: '产物'}
      ]" :key="tab.id">
        <button x-show="!project?.project?.archived" @click="switchHumanTab(tab.id)" class="relative px-3 py-2.5 text-xs whitespace-nowrap transition"
          :class="humanTab === tab.id ? 'text-brand-700 font-semibold' : 'text-slate-400 hover:text-slate-600'">
          <span x-text="tab.label"></span>
          <span x-show="tab.id === 'todos' && project.todos?.length" class="ml-1 text-[10px] text-slate-400" x-text="project.todos.filter(item => !item.archived).length"></span>
          <span x-show="tab.id === 'intents' && project.intents?.length" class="ml-1 text-[10px] text-slate-400" x-text="humanIntentCount()"></span>
          <span x-show="humanTab === tab.id" class="absolute inset-x-2 bottom-0 h-0.5 rounded-full bg-brand-500"></span>
        </button>
      </template>
    </nav>
  </header>

  <template x-if="project?.project?.archived">
    <main class="flex-1 min-h-0 flex items-center justify-center p-6 bg-slate-50/40">
      <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <div class="mx-auto h-12 w-12 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center text-xl">▣</div>
        <h3 class="mt-4 text-base font-semibold text-slate-800">任务已归档</h3>
        <p class="mt-2 text-sm leading-6 text-slate-500">该任务的 Fact、Intent、Todo、漏洞和产物已从正常页面隐藏。恢复任务后，历史内容才会重新显示。</p>
        <button @click="unarchiveProjectById(project.project.id, project.project.title)" class="mt-5 px-4 py-2 rounded-xl bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 transition">恢复任务并查看产物</button>
      </section>
    </main>
  </template>

  <!-- 工作台：用运行循环表达 Reason 重入和 Explore 并发，不把任务伪装成线性流程。 -->
  <template x-if="humanTab === 'workspace'">
  <main x-show="!project?.project?.archived" class="flex-1 min-h-0 overflow-y-auto p-5">
    <div class="grid grid-cols-1 xl:grid-cols-[260px_minmax(0,1fr)] gap-4 max-w-[1600px] mx-auto">
      <aside class="space-y-3 self-start xl:sticky xl:top-0">
        <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-[10px] uppercase tracking-[0.16em] text-slate-400">运行循环</p>
              <h3 class="mt-1 text-sm font-semibold text-slate-800" x-text="humanCycleModel().current ? `当前第 ${humanCycleModel().current.number} 轮` : '等待启动'"></h3>
            </div>
            <span class="px-2 py-1 rounded-lg text-[10px] border" :class="humanCycleStatusClass(humanCycleModel().current?.status)" x-text="humanCycleStatusLabel(humanCycleModel().current?.status)"></span>
          </div>

          <div class="mt-4 space-y-3">
            <div class="flex items-start gap-2.5">
              <span class="mt-0.5 h-5 w-5 rounded-full flex items-center justify-center text-[10px] font-bold" :class="humanStageStateClass('bootstrap')" x-text="humanStageState('bootstrap').icon"></span>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2"><span class="text-xs font-semibold text-slate-700">Bootstrap</span><span class="text-[10px] text-slate-400" x-text="humanStageLabel('bootstrap')"></span></div>
                <p class="mt-0.5 text-[10px] text-slate-400">攻击面初始化</p>
              </div>
            </div>
            <div class="ml-2.5 h-3 border-l border-dashed border-slate-200"></div>
            <div class="flex items-start gap-2.5">
              <span class="mt-0.5 h-5 w-5 rounded-full flex items-center justify-center text-[10px] font-bold" :class="humanStageStateClass('reason')" x-text="humanStageState('reason').icon"></span>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2"><span class="text-xs font-semibold text-slate-700">Reason</span><span class="text-[10px] text-blue-600" x-text="`${humanCycleCounts().reason} 轮`"></span></div>
                <p class="mt-0.5 text-[10px] text-slate-400" x-text="humanStageLabel('reason')"></p>
              </div>
            </div>
            <div class="ml-2.5 h-3 border-l border-dashed border-slate-200"></div>
            <div class="flex items-start gap-2.5">
              <span class="mt-0.5 h-5 w-5 rounded-full flex items-center justify-center text-[10px] font-bold" :class="humanStageStateClass('explore')" x-text="humanStageState('explore').icon"></span>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2"><span class="text-xs font-semibold text-slate-700">Explore</span><span class="text-[10px] text-violet-600" x-text="`${humanCycleCounts().explore} 个 Intent`"></span></div>
                <p class="mt-0.5 text-[10px] text-slate-400" x-text="`${humanStageLabel('explore')}${humanCycleCounts().active ? ` · ${humanCycleCounts().active} 个活动` : ''}`"></p>
              </div>
            </div>
          </div>

          <div class="mt-4 rounded-xl bg-slate-50 border border-slate-100 p-3">
            <p class="text-[10px] uppercase tracking-wider text-slate-400">下一步</p>
            <p class="mt-1.5 text-xs leading-5 text-slate-600" x-text="humanNextActionLabel()"></p>
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-semibold text-slate-700">历史循环</h3>
            <span class="text-[10px] text-slate-400" x-text="`${humanCycleModel().history.length} 轮`"></span>
          </div>
          <div class="human-cycle-history mt-3 space-y-2">
            <template x-for="cycle in humanCycleModel().history" :key="cycle.key">
              <details class="rounded-lg border border-slate-100 bg-slate-50/60 group">
                <summary class="flex items-center gap-2 cursor-pointer list-none px-2 py-2 hover:bg-slate-100/70 transition">
                  <span class="h-5 w-5 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-[10px] font-semibold" x-text="cycle.number"></span>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center justify-between gap-2"><span class="text-[11px] text-slate-600" x-text="humanCycleStatusLabel(cycle.status)"></span><span class="text-[10px] text-slate-400" x-text="`${cycle.intents.length} Intent`"></span></div>
                    <p class="text-[10px] text-slate-400 truncate" x-text="`${cycle.reasonRunId || '历史 Reason'} · ${cycle.reasonWorker || 'Reason'}`"></p>
                  </div>
                  <span class="text-slate-400 text-[10px] group-open:rotate-90 transition-transform">›</span>
                </summary>
                <div class="px-2.5 pb-2.5 pt-1 border-t border-slate-100 space-y-1.5 text-[10px] text-slate-500">
                  <div class="flex flex-wrap gap-x-3 gap-y-1"><span x-text="`触发：${cycle.trigger || 'scheduler'}`"></span><span x-text="`Worker：${cycle.reasonWorker || '未记录'}`"></span><span x-text="`Workspace：${cycle.workspaceAttempts || 0} 次`"></span><span x-text="cycle.createdAt ? `开始：${formatDate(cycle.createdAt)}` : '开始：未记录'"></span><span x-text="cycle.finishedAt ? `结束：${formatDate(cycle.finishedAt)}` : '结束：未记录'"></span></div>
                  <p x-show="cycle.failureReason" class="text-rose-600" x-text="`原因：${cycle.failureReason}`"></p>
                  <template x-if="cycle.intents.length">
                    <div class="space-y-1"><p class="text-[9px] uppercase tracking-wider text-slate-400">本轮 Intent</p><template x-for="intent in cycle.intents" :key="`${cycle.key}-${intent.id}`"><div class="flex items-start gap-1.5"><span class="font-mono text-slate-400" x-text="intent.id"></span><span class="truncate" x-text="intent.description || '未命名 Intent'"></span><span class="ml-auto shrink-0" x-text="humanIntentStatusLabel(intent)"></span></div></template></div>
                  </template>
                  <p x-show="!cycle.intents.length" class="text-slate-400">本轮没有派发 Intent。</p>
                </div>
              </details>
            </template>
            <p x-show="humanCycleModel().history.length === 0" class="text-[11px] text-slate-400">还没有已结束的历史循环。</p>
          </div>
        </section>
      </aside>

      <div class="min-w-0 space-y-4">
        <section class="grid grid-cols-1 lg:grid-cols-[1.35fr_1fr] gap-4">
          <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-[10px] uppercase tracking-[0.16em] text-slate-400">Goal</p>
                <h3 class="mt-1 text-base font-semibold text-slate-800">任务目标与完成条件</h3>
              </div>
              <span class="px-2.5 py-1 rounded-lg border text-[10px] font-semibold" :class="humanGoalStatusClass()" x-text="humanGoalStatusLabel()"></span>
            </div>
            <p class="mt-3 text-sm leading-6 text-slate-700" x-text="project?.project?.goal || '未设置任务目标'"></p>
            <div class="mt-4 rounded-xl bg-slate-50 border border-slate-100 p-3">
              <p class="text-[10px] text-slate-400">当前判定</p>
              <p class="mt-1 text-xs leading-5 text-slate-600" x-text="humanGoalExplanation()"></p>
            </div>
            <div x-show="(project?.goal_cycles || []).length > 1" class="mt-4 border-t border-slate-100 pt-4">
              <div class="flex items-center justify-between"><p class="text-[10px] uppercase tracking-[0.14em] text-slate-400">Goal 历史</p><span class="text-[10px] text-slate-400" x-text="`${project.goal_cycles.length} 轮`"></span></div>
              <div class="mt-2 space-y-2">
                <template x-for="cycle in project.goal_cycles" :key="cycle.id">
                  <div class="rounded-xl border px-3 py-2" :class="cycle.id === project.project.current_goal_cycle_id ? 'border-amber-200 bg-amber-50/70' : 'border-slate-100 bg-slate-50'">
                    <div class="flex items-center justify-between gap-2"><span class="text-[10px] font-semibold" :class="cycle.id === project.project.current_goal_cycle_id ? 'text-amber-800' : 'text-slate-500'" x-text="`第 ${cycle.sequence} 轮${cycle.id === project.project.current_goal_cycle_id ? ' · 当前' : ''}`"></span><span class="text-[9px] text-slate-400" x-text="cycle.status === 'completed' ? `完成于 ${formatTime(cycle.completed_at)}` : '进行中'"></span></div>
                    <p class="mt-1 text-xs leading-5 text-slate-600" x-text="cycle.goal"></p>
                    <p x-show="cycle.continuation_reason" class="mt-1 text-[10px] text-slate-400" x-text="`续跑原因：${cycle.continuation_reason}`"></p>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-center justify-between"><div><p class="text-[10px] uppercase tracking-[0.16em] text-slate-400">覆盖概况</p><h3 class="mt-1 text-base font-semibold text-slate-800">Todo 覆盖进度</h3></div><span class="text-sm font-semibold text-brand-600" x-text="`${humanTodoProgress().percent}%`"></span></div>
            <div class="mt-4 h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-brand-500 transition-all" :style="`width:${humanTodoProgress().percent}%`"></div></div>
            <div class="mt-4 grid grid-cols-4 gap-2 text-center">
              <div><div class="text-lg font-semibold text-slate-700" x-text="humanFactCount()"></div><div class="text-[10px] text-slate-400">事实</div></div>
              <div><div class="text-lg font-semibold text-violet-700" x-text="humanIntentCount()"></div><div class="text-[10px] text-slate-400">Intent</div></div>
              <div><div class="text-lg font-semibold text-amber-700" x-text="`${humanTodoProgress().completed}/${humanTodoProgress().total}`"></div><div class="text-[10px] text-slate-400">Todo</div></div>
              <div><div class="text-lg font-semibold text-slate-700" x-text="humanArtifactCount()"></div><div class="text-[10px] text-slate-400">产物</div></div>
            </div>
          </div>
        </section>

        <section class="token-usage-panel rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex flex-wrap items-start gap-3">
            <div>
              <p class="text-[10px] uppercase tracking-[0.16em] text-slate-400">LLM usage</p>
              <h3 class="mt-1 text-base font-semibold text-slate-800">本任务 Token 消耗</h3>
              <p class="mt-1 text-xs text-slate-400">包含所有 Goal 轮次、失败、超时、重试、Execute 与 Conclude。</p>
            </div>
            <div class="flex-1"></div>
            <label class="token-filter-select inline-flex items-center gap-1.5 text-[11px] text-slate-400">
              <span>模型</span>
              <select class="rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-xs text-slate-600 focus:outline-none" :value="taskTokenModel" @change="setTaskTokenModel($event.target.value)">
                <option value="all">全部模型</option>
                <template x-for="model in (tokenRankings().available_models || [])" :key="`task-token-model-${model.key}`"><option :value="model.key" x-text="model.key"></option></template>
              </select>
            </label>
            <div class="token-range-switch inline-flex items-center gap-0.5 rounded-xl border border-slate-200 p-0.5">
              <template x-for="option in tokenRangeOptions()" :key="`task-token-range-${option.value}`"><button type="button" @click="setTaskTokenRange(option.value)" class="rounded-lg px-2 py-1.5 text-[11px] font-medium transition" :class="taskTokenRange === option.value ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'" x-text="option.label"></button></template>
            </div>
          </div>
          <template x-if="!selectedTaskDiagnostics()">
            <div class="mt-4 rounded-xl bg-slate-50 p-4 text-xs text-slate-400">正在读取本任务 Token 明细…</div>
          </template>
          <template x-if="selectedTaskDiagnostics()">
            <div class="mt-4 space-y-3">
              <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-2.5">
                <div class="token-hit-rate rounded-xl border border-slate-200 p-3"><p class="text-[10px] text-slate-400">总 Token</p><p class="mt-1 text-lg font-semibold text-slate-800 tabular-nums" x-text="formatTokenCount(taskTokenSummary().total_tokens ?? taskTokenSummary().total)"></p></div>
                <div class="token-hit-rate rounded-xl border border-slate-200 p-3"><p class="text-[10px] text-slate-400">输入（未命中）</p><p class="mt-1 text-lg font-semibold token-fg-input tabular-nums" x-text="formatTokenCount(taskTokenSummary().input_tokens ?? taskTokenSummary().input_uncached)"></p></div>
                <div class="token-hit-rate rounded-xl border border-slate-200 p-3"><p class="text-[10px] text-slate-400">缓存命中</p><p class="mt-1 text-lg font-semibold token-fg-cache tabular-nums" x-text="formatTokenCount(taskTokenSummary().cache_read_tokens ?? taskTokenSummary().cache_read)"></p></div>
                <div class="token-hit-rate rounded-xl border border-slate-200 p-3"><p class="text-[10px] text-slate-400">缓存写入</p><p class="mt-1 text-lg font-semibold token-fg-cache-write tabular-nums" x-text="formatTokenCount(taskTokenSummary().cache_write_tokens ?? taskTokenSummary().cache_write)"></p></div>
                <div class="token-hit-rate rounded-xl border border-slate-200 p-3"><p class="text-[10px] text-slate-400">输出</p><p class="mt-1 text-lg font-semibold token-fg-output tabular-nums" x-text="formatTokenCount(taskTokenSummary().output_tokens ?? taskTokenSummary().output)"></p></div>
                <div class="token-hit-rate rounded-xl border border-slate-200 p-3"><p class="text-[10px] text-slate-400">缓存命中率</p><p class="mt-1 text-lg font-semibold token-fg-cache tabular-nums" x-text="tokenCacheHitRateLabel(taskTokenSummary().cache_hit_rate)"></p></div>
              </div>
              <div x-show="taskTokenSummary().complete === false || taskTokenSummary().incomplete_sources > 0" class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">有 <span class="font-semibold" x-text="taskTokenSummary().incomplete_sources || 0"></span> 个 Session 来源不完整；缺失 Token 未被估算。</div>
            </div>
          </template>
        </section>

        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
            <div><h3 class="text-sm font-semibold text-slate-800" x-text="humanCurrentIntents().length ? '当前执行' : '最近一轮执行'"></h3><p class="mt-1 text-xs text-slate-400" x-text="humanCurrentIntents().length ? '按运行状态优先展示当前或等待领取的 Intent。' : `当前没有活动 Intent，展示 ${humanCycleDisplaySourceLabel()} 的最近批次。`"></p></div>
            <span class="px-2 py-1 rounded-lg bg-blue-50 text-blue-700 text-[10px] font-semibold" x-text="humanCurrentIntents().length ? `${humanCurrentIntents().length} 个活动 Intent` : `${humanCycleDisplayIntents().length} 个最近 Intent`"></span>
          </div>
          <div class="p-4">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
              <template x-for="intent in humanCycleDisplayIntents()" :key="`running-intent-${intent.id}`">
                <div class="rounded-xl border border-slate-200 p-3 hover:border-brand-200 hover:bg-brand-50/20 transition">
                  <div class="flex items-start gap-2.5">
                    <span class="mt-0.5 h-7 w-7 rounded-lg flex items-center justify-center text-xs font-mono" :class="`${humanIntentStatusClass(intent)} ${humanIntentIconClass(intent)}`" x-text="humanIntentIcon(intent)"></span>
                    <div class="min-w-0 flex-1">
                      <div class="flex items-start justify-between gap-2"><p class="text-xs font-medium leading-5 text-slate-700" x-text="intent.description || '未命名 Intent'"></p><span class="shrink-0 px-1.5 py-0.5 rounded-md border text-[9px]" :class="humanIntentStatusClass(intent)" x-text="humanIntentStatusLabel(intent)"></span></div>

        <button x-show="(project?.facts || []).filter(item => !item.archived && !['goal', 'origin'].includes(item.id)).length > humanFactLimit" @click="humanFactLimit += 50" class="mt-3 w-full py-2 rounded-lg border border-slate-200 text-xs text-brand-600">再显示 50 条</button>
      </section>
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><div><p class="text-[10px] uppercase tracking-[0.16em] text-slate-400">Follow-up</p><h3 class="mt-1 text-base font-semibold text-slate-800">待验证线索</h3><p class="mt-1 text-xs text-slate-400">每条线索显示生产 Intent，并可直接打开文件。</p></div><div class="mt-4 space-y-3"><template x-for="lead in humanLeadArtifacts(20)" :key="`lead-tab-${lead.id}`"><button type="button" @click="openHumanArtifact(lead)" class="w-full text-left rounded-xl border border-amber-100 bg-amber-50/50 p-3 hover:border-amber-300"><div class="flex items-center justify-between gap-2"><span class="text-xs font-semibold text-amber-800" x-text="humanArtifactLabel(lead)"></span><span class="text-[10px] text-amber-600 truncate" x-text="humanSourceLabel(lead)"></span><span class="text-[10px] text-amber-600 shrink-0" x-text="formatTime(lead.created_at)"></span></div><p class="mt-2 text-xs leading-5 text-amber-900" x-text="lead.summary || '存在待验证线索，请查看产物原文。'"></p></button></template><p x-show="humanLeadArtifacts(20).length === 0" class="py-12 text-center text-xs text-slate-400">当前没有待验证线索产物。</p></div></section>
    </div>
  </main>
  </template>

  <!-- Artifact 视图 -->
  <template x-if="humanTab === 'artifacts'">
  <main x-show="!project?.project?.archived" class="flex-1 min-h-0 overflow-y-auto p-5">
    <div class="max-w-[1300px] mx-auto rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3"><div><p class="text-[10px] uppercase tracking-[0.16em] text-slate-400">Task files</p><h3 class="mt-1 text-base font-semibold text-slate-800">任务产物</h3><p class="mt-1 text-xs text-slate-400">原始文件统一由文件管理中心维护。</p></div><span class="text-xs text-slate-400" x-text="`${humanArtifactTotal} 个`"></span></div>
      <div class="divide-y divide-slate-100"><template x-for="artifact in (humanArtifactItems || []).filter(item => !item.archived)" :key="`artifact-tab-${artifact.id}`"><button type="button" @click="openHumanArtifact(artifact)" class="w-full text-left px-5 py-3.5 flex items-center gap-3 hover:bg-brand-50/50"><span class="text-lg text-slate-400">▤</span><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="text-sm text-slate-700 truncate" x-text="humanArtifactLabel(artifact)"></span><span class="px-1.5 py-0.5 rounded border border-slate-200 text-[9px] text-slate-500" x-text="humanArtifactTypeLabel(artifact)"></span><span class="px-1.5 py-0.5 rounded border border-brand-100 bg-brand-50 text-[9px] text-brand-600" x-text="humanArtifactPhase(artifact)"></span></div><p class="mt-1 text-xs text-slate-400 truncate" x-text="`${humanSourceLabel(artifact)} · ${artifact.summary || artifact.path}`"></p></div><span class="text-[10px] text-slate-400" x-text="formatTime(artifact.created_at)"></span></button></template></div>
      <p x-show="!(humanArtifactItems || []).length" class="py-12 text-center text-xs text-slate-400">尚未产生任务产物。</p>
      <div class="px-5 py-3 border-t border-slate-100 flex items-center justify-between"><button @click="setHumanArtifactPage(humanArtifactPage - 1)" :disabled="humanArtifactPage <= 0" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-500 disabled:opacity-30">上一页</button><span class="text-[10px] text-slate-400 tabular-nums" x-text="`${humanArtifactPage + 1} / ${humanArtifactPageCount()}`"></span><button @click="setHumanArtifactPage(humanArtifactPage + 1)" :disabled="humanArtifactPage + 1 >= humanArtifactPageCount()" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-500 disabled:opacity-30">下一页</button></div>
    </div>
  </main>
  </template>
</div>
</template>
