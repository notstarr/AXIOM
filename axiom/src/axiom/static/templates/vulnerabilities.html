<!-- ═══════════ VULNERABILITY PAGE ═══════════ -->
<div x-show="activePage === 'vulnerabilities'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800 tracking-tight" x-text="factViewMode === 'result' ? '红队成果' : '漏洞管理'"></h2>
      <p class="text-xs text-slate-400 mt-0.5" x-text="factViewMode === 'result' ? '红队成果（权限 / 数据 / 凭证 / 横向），不计入漏洞数量' : '跨任务聚合漏洞，按列表查看证据、影响和修复建议'"></p>
    </div>
    <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5 text-xs ml-2">
      <button type="button" @click="switchFactView('vulnerability')"
        class="px-3 py-1.5 rounded-md transition"
        :class="factViewMode !== 'result' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">漏洞</button>
      <button type="button" @click="switchFactView('result')"
        class="px-3 py-1.5 rounded-md transition"
        :class="factViewMode === 'result' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">成果</button>
    </div>
    <div class="flex-1"></div>
    <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="sto-ghost" style="padding:7px 13px;">刷新</button>
  </header>

  <!-- 筛选 + 统计（漏洞视图） -->
  <div x-show="factViewMode !== 'result'" class="shrink-0 px-5 py-3 border-b border-slate-100" style="background:var(--sto-panel);">
    <div class="flex items-center" style="gap:9px;">
      <input x-model="vulnFilter.keyword" @input="scheduleVulnerabilitySearch()" placeholder="搜索标题、类型、描述" class="sto-input" style="flex:1;">
      <select x-model="vulnFilter.projectId" @change="applyVulnerabilityFilters()" class="sto-input" style="width:auto;">
        <option value="">全部任务</option>
        <template x-for="p in projects.filter(item => !item.archived && (item.engagement_mode || 'vulnerability') !== 'red_team')" :key="`vuln-filter-${p.id}`">
          <option :value="p.id" x-text="`${p.id} ${p.title}`"></option>
        </template>
      </select>
      <button @click="openVulnEditor()" class="sto-btn" style="padding:8px 13px;">新增漏洞</button>
    </div>
    <div class="flex items-center" style="gap:7px; margin-top:9px;">
      <span class="sto-muted" style="font-size:10.5px;">排序</span>
      <template x-for="opt in vulnerabilitySortOptions()" :key="`vsort-${opt.id}`">
        <button @click="setVulnerabilitySort(opt.id)" class="sto-minibtn"
          :class="vulnerabilitySort === opt.id ? 'acc' : ''"
          style="padding:3px 10px;"
          x-text="opt.label"></button>
      </template>
    </div>
    <div class="flex flex-wrap items-center" style="gap:16px; margin-top:11px;">
      <span class="sto-muted sto-num" style="font-size:10.5px;" x-text="`已载入 ${filteredVulnerabilities().length} / ${vulnerabilityTotal} 条`"></span>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <span class="sto-muted" style="font-size:11px;" title="以下分布只统计当前已载入的记录">本页</span>
      <template x-for="sev in ['critical','high','medium','low']" :key="`vstat-${sev}`">
        <span class="sto-status" :class="{critical:'err',high:'warn',medium:'warn',low:'ok'}[sev]" style="font-size:11px;">
          <i class="sto-sevdot" :class="`sto-sev-${sev}`" style="box-shadow:none;"></i>
          <span x-text="vulnSeverityLabel(sev)"></span>
          <b class="sto-num" style="color:var(--sto-fg);" x-text="filteredVulnerabilities().filter(v => (v.severity || '').toLowerCase() === sev).length"></b>
        </span>
      </template>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <span class="sto-status ok" style="font-size:11px;"><i></i><span>已验证</span><b class="sto-num" style="color:var(--sto-fg);" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'verified').length"></b></span>
      <span class="sto-status warn" style="font-size:11px;"><i></i><span>待验证</span><b class="sto-num" style="color:var(--sto-fg);" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'pending').length"></b></span>
    </div>
  </div>

  <main x-show="factViewMode !== 'result'" class="flex-1 min-h-0 grid grid-cols-[340px_minmax(0,1fr)] gap-4" style="padding:14px 16px; background:var(--sto-inset);">
    <!-- 列表 -->
    <aside class="sto-panel sto-vlist overflow-y-auto overflow-x-hidden" style="padding:10px;">
      <template x-if="filteredVulnerabilities().length === 0">
        <div class="sto-muted" style="text-align:center; padding:36px 0;">暂无漏洞记录</div>
      </template>
      <template x-for="v in filteredVulnerabilities()" :key="`${v.project_id}-${v.id}`">
        <button type="button" @click="selectVulnerability(v)" class="sto-navitem sto-vlist"
          :class="[`sto-sev-${(v.severity || 'info').toLowerCase()}`, selectedVulnerabilityKey === vulnerabilityKey(v) ? 'active' : '']">
          <div class="flex items-center" style="gap:7px;">
            <span class="sto-sevdot" x-text="''"></span>
            <span class="sto-num" style="font-size:10px; font-weight:700; color:var(--sto-fg-2);" x-text="v.id"></span>
            <span style="flex:1;"></span>
            <span x-show="v.human_reviewed" role="button" @click.stop="toggleVulnReviewed(v)"
              class="vlist-reviewed" title="人工已阅（点击取消）">已阅</span>
            <span x-show="v.red_team_exploitable" role="button" @click.stop="toggleVulnRedTeamExploitable(v)"
              class="vlist-flag" title="红队可利用：新建红队任务时可作为种子线索批量注入（点击取消）">红队</span>
            <span class="sto-status" style="font-size:10px;" :class="({verified:'ok',pending:'warn',duplicate:'err',ignored:'off'})[vulnStatusKey(v.status)] || 'off'"><i></i><span x-text="vulnStatusLabel(v.status)"></span></span>
          </div>
          <p style="margin-top:5px; font-size:12.5px; font-weight:600; color:var(--sto-fg); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" x-text="v.title"></p>
        </button>
      </template>
      <div class="sto-pager" style="border-top:1px solid var(--sto-line); margin-top:10px; padding-top:10px;">
        <button @click="setVulnerabilityPage(vulnerabilityPage - 1)" :disabled="vulnerabilityLoading || vulnerabilityPage <= 0" class="sto-minibtn">上一页</button>
        <span class="sto-num" x-text="`${vulnerabilityPage + 1} / ${vulnerabilityPageCount()}`"></span>
        <button @click="setVulnerabilityPage(vulnerabilityPage + 1)" :disabled="vulnerabilityLoading || vulnerabilityPage + 1 >= vulnerabilityPageCount()" class="sto-minibtn">下一页</button>
      </div>
    </aside>

    <!-- 详情：版式对齐 AntiFox —— 扁平头 + 描述 + 测试过程（分步报文） + 影响 + 证据 + 审核结论 -->
    <section class="sto-panel overflow-y-auto" style="overflow-x:hidden;">
      <template x-if="!selectedVulnerability()">
        <div class="sto-muted" style="min-height:420px; display:flex; align-items: center; justify-content: center;">请选择左侧漏洞查看详情</div>
      </template>
      <template x-if="selectedVulnerability()">
        <article class="rp-doc">

          <!-- 报头：标题 / 印章 / 元信息 / 操作 -->
          <header class="rp-dochead">
            <div class="rp-titleline">
              <h1 class="rp-doctitle" x-text="selectedVulnerability().title"></h1>
              <div class="rp-stamps">
                <span class="sto-sevbadge" x-text="vulnSeverityLabel(selectedVulnerability().severity)"></span>
                <button type="button" @click="openVulnStatusQuick(selectedVulnerability())" class="sto-status" style="font-size:11px; cursor:pointer; border:0; background:none; padding:0;" :class="({verified:'ok',pending:'warn',duplicate:'err',ignored:'off'})[vulnStatusKey(selectedVulnerability().status)] || 'off'"><i></i><span x-text="vulnStatusLabel(selectedVulnerability().status)"></span></button>
              </div>
            </div>
            <div class="rp-meta">
              <code x-text="selectedVulnerability().id"></code>
              <code x-text="selectedVulnerability().type || '通用漏洞'"></code>
              <span x-show="selectedVulnerability().affected_target" x-text="selectedVulnerability().affected_target"></span>
              <span x-text="`${selectedVulnerability().project_group_title || '未归属项目'} / ${selectedVulnerability().task_title || selectedVulnerability().project_id}`"></span>
            </div>
            <div class="rp-acts">
              <button @click="triggerVulnerabilityReview(selectedVulnerability())" :disabled="!vulnerabilityReviewCanRetry()" :title="vulnerabilityReviewCanRetry() ? '创建一次新的 Reviewer 审核' : '已有审核正在排队或运行'" class="rp-act primary" x-text="vulnerabilityReviewSubmitting ? '正在排队…' : '重新审核'"></button>
              <button @click="editVuln(selectedVulnerability())" class="rp-act">编辑</button>
              <button @click="exportSingleVulnerability(selectedVulnerability())" class="rp-act" title="导出正文、Findings 与证据图">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                导出
              </button>
              <button x-show="selectedVulnerability().finding_artifact" @click="openVulnerabilityArtifact(selectedVulnerability(), selectedVulnerability().finding_artifact)" class="rp-act">Findings</button>
              <button @click="toggleVulnReviewed(selectedVulnerability())" class="rp-act" :class="selectedVulnerability().human_reviewed ? 'on' : ''" x-text="selectedVulnerability().human_reviewed ? '已阅' : '标记已阅'"></button>
              <button @click="toggleVulnRedTeamExploitable(selectedVulnerability())" class="rp-act" :class="selectedVulnerability().red_team_exploitable ? 'on' : ''" x-text="selectedVulnerability().red_team_exploitable ? '红队可利用' : '标记红队可利用'"></button>
              <button @click="deleteVuln(selectedVulnerability())" class="rp-act danger">删除</button>
            </div>
          </header>

          <!-- 描述 -->
          <section class="rp-block">
            <h2 class="rp-h">描述</h2>
            <p class="rp-p" x-text="formatMultiline(selectedVulnerability().description)"></p>
          </section>

          <!-- 测试过程 -->
          <section class="rp-block">
            <h2 class="rp-h">测试过程</h2>
            <p class="rp-absent" x-show="!selectedVulnerability().reproduction">未提供结构化复现，本报告只有描述与影响。</p>
            <div class="rp-proc" x-show="selectedVulnerability().reproduction">
              <div class="rp-entry">
                <div class="rp-entryrow">
                  <span class="rp-k">入口点</span>
                  <span class="rp-codes" x-text="selectedVulnerability().reproduction.entry_point"></span>
                </div>
                <div x-show="(selectedVulnerability().reproduction.prerequisites || []).length">
                  <div class="rp-k" style="margin-top:5px;">前置条件</div>
                  <ul class="rp-req">
                    <template x-for="(item, idx) in (selectedVulnerability().reproduction.prerequisites || [])" :key="`pre-${idx}`">
                      <li x-text="item"></li>
                    </template>
                  </ul>
                </div>
              </div>
              <ol class="rp-steps">
                <template x-for="(step, i) in (selectedVulnerability().reproduction.steps || [])" :key="`step-${i}`">
                  <li class="rp-step">
                    <div class="rp-stephead">
                      <span class="rp-stepno" x-text="i + 1"></span>
                      <p class="rp-stepsum"><span x-text="step.title"></span><span x-show="step.proves" style="color:var(--rp-ink-2);" x-text="` ｜ ${step.proves}`"></span></p>
                    </div>
                    <pre class="rp-packet" x-text="step.request"></pre>
                    <div class="rp-resplabel">响应</div>
                    <pre class="rp-packet" x-text="step.response"></pre>
                    <div class="rp-slots" x-show="vulnEvidenceForStep(i + 1).length">
                      <template x-for="ev in vulnEvidenceForStep(i + 1)" :key="`ev-${ev.artifact_id}`">
                        <a class="rp-shot" :href="ev.url" target="_blank" rel="noopener">
                          <img :src="ev.url" :alt="ev.caption || '证据截图'">
                          <span class="rp-shotcap" x-text="ev.caption || `步骤 ${i + 1} 证据`"></span>
                        </a>
                      </template>
                    </div>
                    <div class="rp-slots">
                      <label class="rp-slot" title="为这一步补截图">
                        <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        <span>本步截图</span>
                        <input type="file" accept="image/*" style="display:none;"
                               @change="uploadReportEvidence('vulnerability', selectedVulnerability().id, i + 1, $event)">
                      </label>
                    </div>
                  </li>
                </template>
              </ol>
            </div>
          </section>

          <!-- 影响 -->
          <section class="rp-block">
            <h2 class="rp-h">影响</h2>
            <p class="rp-p" x-text="formatMultiline(selectedVulnerability().impact)"></p>
          </section>

          <!-- 修复建议：缺失则整节省略 -->
          <section class="rp-block" x-show="selectedVulnerability().remediation">
            <h2 class="rp-h">修复建议</h2>
            <p class="rp-p" x-text="formatMultiline(selectedVulnerability().remediation)"></p>
          </section>

          <!-- 审核结论即记录：裁决与理由属于每一条 ReviewRun，不再单独占一节。
               默认展开——现在它是页面上唯一的结论来源。 -->
          <details open>
            <summary class="rp-h" style="cursor:pointer; margin:0;">
              Reviewer 审核记录<span x-show="latestVulnerabilityReview()" style="margin-left:7px; text-transform:none; letter-spacing:0; font-weight:400;" x-text="vulnerabilityReviewStateLabel(latestVulnerabilityReview())"></span>
            </summary>
            <p x-show="vulnerabilityReviewsLoading" class="rp-absent" style="margin-top:8px;">正在加载…</p>
            <p x-show="vulnerabilityReviewsError" class="sto-warnline" style="margin-top:8px;" x-text="vulnerabilityReviewsError"></p>
            <p x-show="!vulnerabilityReviewsLoading && !vulnerabilityReviewsError && (vulnerabilityReviews || []).length === 0 && !selectedVulnerability().status_reason" class="rp-absent" style="margin-top:8px;">暂无审核记录。</p>
            <!-- 人工直接改过状态（没有 ReviewRun）时，理由只剩 status_reason，兜成一条记录 -->
            <div class="rp-runs" style="margin-top:9px;" x-show="!vulnerabilityReviewsLoading && !(vulnerabilityReviews || []).length && selectedVulnerability().status_reason">
              <div class="rp-run">
                <div class="rp-runhead">
                  <span>人工判定</span>
                  <span x-text="vulnStatusLabel(selectedVulnerability().status)"></span>
                </div>
                <p class="rp-runnote" style="white-space:pre-wrap;" x-text="formatMultiline(selectedVulnerability().status_reason)"></p>
              </div>
            </div>
            <div class="rp-runs" style="margin-top:9px;" x-show="(vulnerabilityReviews || []).length > 0">
              <template x-for="run in (vulnerabilityReviews || [])" :key="run.id">
                <div class="rp-run">
                  <div class="rp-runhead">
                    <code x-text="run.id"></code>
                    <span x-text="vulnerabilityReviewStateLabel(run)"></span>
                    <span x-text="vulnerabilityReviewTriggerLabel(run.trigger)"></span>
                    <span x-show="run.decision" x-text="vulnerabilityReviewDecisionLabel(run.decision)"></span>
                    <span style="margin-left:auto;" x-text="formatDate(run.concluded_at || run.updated_at || run.created_at)"></span>
                  </div>
                  <p x-show="run.worker" class="rp-runnote"><strong>审查者</strong> <span x-text="run.worker"></span></p>
                  <p x-show="run.activity_summary && ['pending','claimed','running','concluding'].includes(run.status)" class="rp-runnote" x-text="run.activity_summary"></p>
                  <p x-show="run.decision_reason" class="rp-runnote"><strong>原因</strong> <span x-text="run.decision_reason"></span></p>
                  <p x-show="run.status === 'failed' && run.last_failure_kind" class="rp-runnote"><strong>失败</strong> <span x-text="run.last_failure_kind"></span></p>
                  <button x-show="run.duplicate_of_vulnerability_id" @click="openReviewDuplicate(run)" class="rp-act" style="margin-top:3px;">重复于 <span x-text="run.duplicate_of_vulnerability_id"></span></button>
                </div>
              </template>
            </div>
          </details>

          <!-- 旧格式内容 -->
          <details x-show="selectedVulnerability().legacy">
            <summary class="rp-h" style="cursor:pointer; margin:0;">旧格式内容（只读）</summary>
            <div style="margin-top:9px; display:flex; flex-direction:column; gap:7px;">
              <div x-show="(selectedVulnerability().legacy && selectedVulnerability().legacy.reproduction_steps || []).length">
                <div class="rp-k">旧复现步骤</div>
                <ul class="rp-req"><template x-for="(step, idx) in (selectedVulnerability().legacy ? selectedVulnerability().legacy.reproduction_steps : [])" :key="`ls-${idx}`"><li x-text="step"></li></template></ul>
              </div>
              <div x-show="(selectedVulnerability().legacy && selectedVulnerability().legacy.evidence || []).length">
                <div class="rp-k">旧文字证据</div>
                <ul class="rp-req"><template x-for="(ev, idx) in (selectedVulnerability().legacy ? selectedVulnerability().legacy.evidence : [])" :key="`le-${idx}`"><li x-text="ev"></li></template></ul>
              </div>
              <div x-show="selectedVulnerability().legacy && selectedVulnerability().legacy.curl_command">
                <div class="rp-k">旧请求示例</div>
                <pre class="rp-packet" x-text="selectedVulnerability().legacy ? selectedVulnerability().legacy.curl_command : ''"></pre>
              </div>
            </div>
          </details>
        </article>
      </template>
    </section>
  </main>

  <!-- 筛选 + 统计（成果视图，与漏洞视图同一套顶栏） -->
  <div x-show="factViewMode === 'result'" x-cloak class="shrink-0 px-5 py-3 border-b border-slate-100" style="background:var(--sto-panel);">
    <div class="flex items-center" style="gap:9px;">
      <input x-model="rtResultFilter.keyword" @input="scheduleRtResultSearch()" placeholder="搜索标题、描述、身份" class="sto-input" style="flex:1;">
      <select x-model="rtResultFilter.projectId" @change="loadRedTeamResultPage()" class="sto-input" style="width:auto;">
        <option value="">全部任务</option>
        <template x-for="p in projects.filter(item => !item.archived && item.engagement_mode === 'red_team')" :key="`rt-filter-${p.id}`">
          <option :value="p.id" x-text="`${p.id} ${p.title}`"></option>
        </template>
      </select>
      <select x-model="rtResultFilter.status" @change="loadRedTeamResultPage()" class="sto-input" style="width:auto;">
        <option value="">全部状态</option>
        <option value="reported">已上报</option>
        <option value="reviewing">审核中</option>
        <option value="verified">已验证</option>
        <option value="rejected">已驳回</option>
        <option value="duplicate">重复</option>
        <option value="needs-human">需人工</option>
      </select>
      <select x-model="rtResultFilter.type" @change="loadRedTeamResultPage()" class="sto-input" style="width:auto;">
        <option value="">全部类型</option>
        <option value="permission">权限跃迁</option>
        <option value="data">数据获取</option>
        <option value="credential">凭证获取</option>
        <option value="pivot">横向控制</option>
      </select>
    </div>
    <div class="flex flex-wrap items-center" style="gap:16px; margin-top:11px;">
      <span class="sto-muted sto-num" style="font-size:10.5px;" x-text="`已载入 ${rtResultItems.length} / ${rtResultTotal} 条`"></span>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <span class="sto-muted" style="font-size:11px;" title="以下分布只统计当前已载入的记录">本页</span>
      <template x-for="kind in [{id:'permission',label:'权限'},{id:'data',label:'数据'},{id:'credential',label:'凭证'},{id:'pivot',label:'横向'}]" :key="`rtstat-${kind.id}`">
        <span class="sto-status" :class="rtTypeClass(kind.id)" style="font-size:11px;">
          <i class="sto-sevdot" :class="rtTypeTone(kind.id)" style="box-shadow:none;"></i>
          <span x-text="kind.label"></span>
          <b class="sto-num" style="color:var(--sto-fg);" x-text="rtResultItems.filter(item => item.result_type === kind.id).length"></b>
        </span>
      </template>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <span class="sto-status ok" style="font-size:11px;"><i></i><span>已验证</span><b class="sto-num" style="color:var(--sto-fg);" x-text="rtResultItems.filter(item => item.status === 'verified').length"></b></span>
      <span class="sto-status warn" style="font-size:11px;"><i></i><span>审核中</span><b class="sto-num" style="color:var(--sto-fg);" x-text="rtResultItems.filter(item => item.status === 'reviewing' || item.status === 'reported').length"></b></span>
      <span class="sto-status ok" style="font-size:11px;"><i></i><span>核定</span><b class="sto-num" style="color:var(--sto-fg);" x-text="`${rtVerifiedPoints()} 分`"></b></span>
    </div>
  </div>

  <main x-show="factViewMode === 'result'" x-cloak class="flex-1 min-h-0 grid grid-cols-[340px_minmax(0,1fr)] gap-4" style="padding:14px 16px; background:var(--sto-inset);">
    <aside class="sto-panel sto-vlist overflow-y-auto overflow-x-hidden" style="padding:10px;">
      <template x-if="!rtResultLoading && rtResultItems.length === 0">
        <div class="sto-muted" style="text-align:center; padding:36px 0;">暂无红队成果</div>
      </template>
      <template x-for="r in rtResultItems" :key="rtResultKey(r)">
        <button type="button" @click="selectRtResult(r)" class="sto-navitem sto-vlist"
          :class="[rtTypeTone(r.result_type), selectedRtResultId === rtResultKey(r) ? 'active' : '']">
          <div class="flex items-center" style="gap:7px;">
            <span class="sto-sevdot"></span>
            <span class="sto-num" style="font-size:10px; font-weight:700; color:var(--sto-fg-2);" x-text="r.id"></span>
            <span class="sto-muted" style="font-size:9.5px;" x-text="r.task_id"></span>
            <span style="flex:1;"></span>
            <span class="sto-num" style="font-size:10px; font-weight:700; color:var(--sto-fg-2);" x-text="rtPointsLabel(r)"></span>
            <span class="sto-status" style="font-size:10px;" :class="rtStatusClass(r.status)"><i></i><span x-text="rtStatusLabel(r.status)"></span></span>
          </div>
          <p style="margin-top:5px; font-size:12.5px; font-weight:600; color:var(--sto-fg); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" x-text="r.title"></p>
        </button>
      </template>
    </aside>
    <section class="sto-panel overflow-y-auto" style="overflow-x:hidden;">
      <template x-if="!selectedRtResult()">
        <div class="sto-muted" style="min-height:420px; display:flex; align-items:center; justify-content:center;">请选择左侧成果查看详情</div>
      </template>
      <template x-if="selectedRtResult()">
        <article class="rp-doc">

          <!-- 报头 -->
          <header class="rp-dochead">
            <div class="rp-titleline">
              <h1 class="rp-doctitle" x-text="selectedRtResult().title"></h1>
              <div class="rp-stamps">
                <span class="sto-sevbadge" x-text="rtTypeLabel(selectedRtResult().result_type)"></span>
                <span class="sto-badge" :class="lineageResultTone(selectedRtResult().status)" x-text="rtResultStatusLabel(selectedRtResult().status)"></span>
              </div>
            </div>
            <div class="rp-meta">
              <code x-text="selectedRtResult().id"></code>
              <span x-show="selectedRtResult().target_asset" x-text="selectedRtResult().target_asset"></span>
              <span x-text="selectedRtResult().chain_id || '—'"></span>
              <span x-text="`上报 ${selectedRtResult().reported_by || '—'}`"></span>
            </div>
            <div class="rp-acts">
              <button @click="triggerRtResultReview(selectedRtResult())" :disabled="!rtResultReviewCanRetry()" :title="rtResultReviewCanRetry() ? '让审核者重新核定这条成果' : '已有审核正在排队或运行'" class="rp-act primary" x-text="rtResultReviewSubmitting ? '正在排队…' : '重新审核'"></button>
              <button @click="editRtResult(selectedRtResult())" class="rp-act">编辑</button>
              <button @click="exportRtResult(selectedRtResult())" class="rp-act" title="导出这份报告（有图时连同图片打成压缩包）">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                导出
              </button>
            </div>
          </header>

          <!-- 描述 -->
          <section class="rp-block">
            <h2 class="rp-h">描述</h2>
            <p class="rp-p" x-text="formatMultiline(selectedRtResult().description)"></p>
          </section>

          <!-- 利用前提 -->
          <section class="rp-block">
            <h2 class="rp-h">利用前提</h2>
            <p class="rp-absent" x-show="!selectedRtResult().reproduction">未填写</p>
            <div class="rp-proc" x-show="selectedRtResult().reproduction">
              <div class="rp-entry">
                <div class="rp-entryrow" x-show="selectedRtResult().reproduction && selectedRtResult().reproduction.chain_input">
                  <span class="rp-k">起始身份</span>
                  <span x-text="selectedRtResult().reproduction ? selectedRtResult().reproduction.chain_input : ''"></span>
                </div>
                <div x-show="(selectedRtResult().reproduction && selectedRtResult().reproduction.prerequisites || []).length">
                  <div class="rp-k" style="margin-top:5px;">前置条件</div>
                  <ul class="rp-req">
                    <template x-for="(item, idx) in (selectedRtResult().reproduction ? selectedRtResult().reproduction.prerequisites || [] : [])" :key="`rtpre-${idx}`">
                      <li x-text="item"></li>
                    </template>
                  </ul>
                </div>
              </div>
            </div>
          </section>

          <!-- 测试过程 -->
          <section class="rp-block">
            <h2 class="rp-h">测试过程</h2>
            <p class="rp-absent" x-show="!selectedRtResult().reproduction">未提供结构化复现。</p>
            <div class="rp-proc" x-show="selectedRtResult().reproduction">
              <div class="rp-entry">
                <div class="rp-entryrow">
                  <span class="rp-k">入口点</span>
                  <span class="rp-codes" x-text="selectedRtResult().reproduction ? selectedRtResult().reproduction.entry_point : ''"></span>
                </div>
              </div>
              <ol class="rp-steps">
                <template x-for="(step, i) in (selectedRtResult().reproduction ? selectedRtResult().reproduction.steps || [] : [])" :key="`rtstep-${i}`">
                  <li class="rp-step">
                    <div class="rp-stephead">
                      <span class="rp-stepno" x-text="i + 1"></span>
                      <p class="rp-stepsum"><span x-text="step.title"></span><span x-show="step.proves" style="color:var(--rp-ink-2);" x-text="` ｜ ${step.proves}`"></span></p>
                    </div>
                    <pre class="rp-packet" x-text="step.request"></pre>
                    <div class="rp-resplabel">响应</div>
                    <pre class="rp-packet" x-text="step.response"></pre>
                    <div class="rp-slots" x-show="rtEvidenceForStep(i + 1).length">
                      <template x-for="ev in rtEvidenceForStep(i + 1)" :key="`rtev-${ev.artifact_id}`">
                        <a class="rp-shot" :href="ev.url" target="_blank" rel="noopener">
                          <img :src="ev.url" :alt="ev.caption || '证据截图'">
                          <span class="rp-shotcap" x-text="ev.caption || `步骤 ${i + 1} 证据`"></span>
                        </a>
                      </template>
                    </div>
                    <div class="rp-slots">
                      <label class="rp-slot" title="为这一步补截图">
                        <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        <span>本步截图</span>
                        <input type="file" accept="image/*" style="display:none;"
                               @change="uploadReportEvidence('redteam_result', selectedRtResult().id, i + 1, $event)">
                      </label>
                    </div>
                  </li>
                </template>
              </ol>
            </div>
          </section>

          <!-- 审核结论即记录：与漏洞面板一致，默认展开 -->
          <details open>
            <summary class="rp-h" style="cursor:pointer; margin:0;">审核记录<span x-show="(rtResultReviews || []).length" style="margin-left:7px; text-transform:none; letter-spacing:0; font-weight:400;" x-text="`${(rtResultReviews || []).length} 次`"></span></summary>
            <p x-show="rtResultReviewsLoading" class="rp-absent" style="margin-top:8px;">正在加载…</p>
            <p x-show="rtResultReviewsError" class="sto-warnline" style="margin-top:8px;" x-text="rtResultReviewsError"></p>
            <p x-show="!rtResultReviewsLoading && !rtResultReviewsError && (rtResultReviews || []).length === 0 && !selectedRtResult().review_reason" class="rp-absent" style="margin-top:8px;">暂无审核记录。</p>
            <!-- 有裁决理由但没有 ReviewRun 时，同样兜成一条 -->
            <div class="rp-runs" style="margin-top:9px;" x-show="!rtResultReviewsLoading && !(rtResultReviews || []).length && selectedRtResult().review_reason">
              <div class="rp-run">
                <div class="rp-runhead">
                  <span>审核结论</span>
                  <span x-text="rtResultStatusLabel(selectedRtResult().status)"></span>
                </div>
                <p class="rp-runnote" style="white-space:pre-wrap;" x-text="formatMultiline(selectedRtResult().review_reason)"></p>
              </div>
            </div>
            <div class="rp-runs" style="margin-top:9px;" x-show="(rtResultReviews || []).length > 0">
              <template x-for="run in (rtResultReviews || [])" :key="`rtrun-${run.id}`">
                <div class="rp-run">
                  <div class="rp-runhead">
                    <code x-text="run.id"></code>
                    <span x-text="vulnerabilityReviewStateLabel(run)"></span>
                    <span x-text="vulnerabilityReviewTriggerLabel(run.trigger)"></span>
                    <span x-show="run.decision" x-text="vulnerabilityReviewDecisionLabel(run.decision)"></span>
                    <span style="margin-left:auto;" x-text="formatDate(run.concluded_at || run.updated_at || run.created_at)"></span>
                  </div>
                  <p x-show="run.worker" class="rp-runnote"><strong>审查者</strong> <span x-text="run.worker"></span></p>
                  <p x-show="run.decision_reason" class="rp-runnote"><strong>原因</strong> <span x-text="run.decision_reason"></span></p>
                  <p x-show="run.status === 'failed' && run.last_failure_kind" class="rp-runnote"><strong>失败</strong> <span x-text="run.last_failure_kind"></span></p>
                </div>
              </template>
            </div>
          </details>
        </article>
      </template>
    </section>
  </main>
</div>

<!-- Quick Status Modal -->
<div x-show="vulnStatusQuick.open" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center overlay" @click.self="closeVulnStatusQuick()">
  <div class="sto" style="width:100%; max-width:420px; margin:0 16px;">
    <div class="sto-panel" @click.stop>
      <div style="padding:15px 18px; border-bottom:1px solid var(--sto-line);">
        <h3 style="font-size:13.5px; font-weight:650; color:var(--sto-fg);">漏洞状态</h3>
        <p class="sto-muted sto-num" style="margin-top:4px; word-break:break-all; font-size:10.5px;" x-text="`${vulnStatusQuick.id} · ${vulnStatusQuick.title}`"></p>
      </div>
      <div style="padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button type="button" @click="pickVulnStatus('待验证')" class="sto-listbtn" :class="vulnStatusQuick.selected === '待验证' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">待验证</button>
        <button type="button" @click="pickVulnStatus('已验证')" class="sto-listbtn" :class="vulnStatusQuick.selected === '已验证' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">已验证</button>
        <button type="button" @click="pickVulnStatus('忽略')" class="sto-listbtn" :class="vulnStatusQuick.selected === '忽略' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">忽略</button>
        <button type="button" @click="pickVulnStatus('重复')" class="sto-listbtn" :class="vulnStatusQuick.selected === '重复' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">重复</button>
      </div>
      <template x-if="vulnStatusQuick.selected === '忽略'">
        <div style="padding:0 18px 4px;">
          <div class="sto-field"><label>忽略原因（不少于 4 个字）</label>
            <textarea x-model="vulnStatusQuick.reason" rows="3" placeholder="请填写忽略原因…" class="sto-input"></textarea>
            <p x-show="vulnStatusQuick.reasonError" x-text="vulnStatusQuick.reasonError" class="sto-warnline"></p>
          </div>
        </div>
      </template>
      <div class="sto-foot" style="padding:13px 18px; border-top:1px solid var(--sto-line);">
        <button type="button" @click="closeVulnStatusQuick()" class="sto-ghost">取消</button>
        <button type="button" @click="confirmVulnStatus()" class="sto-btn">确认</button>
      </div>
    </div>
  </div>
</div>

<!-- Vuln Editor Modal -->
<div x-show="vulnEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="vulnEditor.open = false">
  <div class="sto sto-vmodal">
    <div class="sto-panel" style="display:flex; flex-direction:column; min-height:0; overflow:hidden;" @click.stop>

      <div class="vm-head">
        <div style="min-width:0;">
          <div class="vm-title" x-text="vulnEditor.isNew ? '新增漏洞' : '编辑漏洞'"></div>
          <div class="vm-sub" x-text="vulnEditor.project_id ? (vulnEditor.project_id + (vulnEditor.isNew ? ' · 填好后可加载已有产物' : '')) : '尚未绑定任务'"></div>
        </div>
        <button type="button" class="vm-x" @click="vulnEditor.open = false" aria-label="关闭">×</button>
      </div>

      <div class="vm-body">

        <div class="vm-sec">
          <div class="vm-seclabel">基本信息</div>
          <div class="flex" style="gap:8px;">
            <input x-model="vulnEditor.project_id" placeholder="任务 ID（如 t_042）" class="sto-input sto-num" style="flex:1;" :disabled="!vulnEditor.isNew">
            <button type="button" @click="loadVulnEditorArtifacts()" :disabled="!vulnEditor.project_id || vulnEditor.artifacts_loading" class="sto-minibtn" style="flex-shrink:0;" x-text="vulnEditor.artifacts_loading ? '加载中…' : '加载产物'"></button>
          </div>
          <div class="sto-field"><label>标题<span class="vm-req">*</span></label><input x-model="vulnEditor.title" placeholder="一句话说清：谁 · 在哪个接口 · 能干什么" class="sto-input"></div>
          <div class="sto-grid2">
            <div class="sto-field"><label>漏洞类型</label><input x-model="vulnEditor.type" placeholder="如 IDOR / SQLi / JWT" class="sto-input"></div>
            <div class="sto-field"><label>受影响目标 / 接口</label><input x-model="vulnEditor.affected_target" placeholder="如 POST /api/v1/xxx" class="sto-input"></div>
          </div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">定级与关联</div>
          <div class="sto-field"><label>严重程度</label>
            <div class="sto-sevpicker">
              <template x-for="sev in ['critical','high','medium','low','info']" :key="sev">
                <button type="button" @click="vulnEditor.severity = sev" class="sto-sevopt"
                  :class="[`sto-sev-${sev}`, vulnEditor.severity === sev ? 'active' : '']">
                  <span class="vm-dot"></span><span x-text="vulnSeverityLabel(sev)"></span>
                </button>
              </template>
            </div>
          </div>
          <div class="sto-grid2">
            <div class="sto-field"><label>状态</label>
              <select x-model="vulnEditor.status" class="sto-input">
                <option value="待验证">待验证</option>
                <option value="已验证">已验证</option>
                <option value="忽略">忽略</option>
                <option value="重复">重复</option>
              </select>
            </div>
            <div class="sto-field"><label>关联 Findings</label>
              <select x-model="vulnEditor.finding_artifact_id" class="sto-input">
                <option value="">不关联</option>
                <template x-for="artifact in (vulnEditor.available_artifacts || []).filter(item => item.artifact_type === 'explore.findings' || item.artifact_type === 'bootstrap.findings' || item.artifact_type === 'upload')" :key="`finding-${artifact.id}`"><option :value="artifact.id" x-text="`${artifact.path} · ${artifact.artifact_type}`"></option></template>
              </select>
            </div>
          </div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">内容</div>
          <div class="sto-field"><label>描述<span class="vm-req">*</span></label><textarea x-model="vulnEditor.description" rows="6" placeholder="漏洞成因 + 触发条件" class="sto-input"></textarea></div>
          <div class="sto-field"><label>利用前提</label><textarea x-model="vulnEditor.prerequisites" rows="3" placeholder="需要什么身份 / 前置条件" class="sto-input"></textarea></div>
          <div class="sto-field"><label>影响<span class="vm-req">*</span></label><textarea x-model="vulnEditor.impact" rows="5" placeholder="能造成什么后果" class="sto-input"></textarea></div>
          <div class="sto-field"><label>修复建议</label><textarea x-model="vulnEditor.remediation" rows="6" placeholder="建议怎么修" class="sto-input"></textarea></div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">证据</div>
          <div class="sto-field"><label>证据文件（可多选）</label>
            <select multiple size="5" x-model="vulnEditor.evidence_artifact_ids" class="sto-input">
              <template x-for="artifact in (vulnEditor.available_artifacts || []).filter(item => item.artifact_type === 'explore.evidence' || item.artifact_type === 'review.evidence' || item.artifact_type === 'upload')" :key="`evidence-${artifact.id}`"><option :value="artifact.id" x-text="`${artifact.path} · ${formatBytes(artifact.size)}`"></option></template>
            </select>
            <p class="vm-hint">按住 Command / Ctrl 可多选已有 Artifact。</p>
          </div>
          <div class="sto-field"><label>状态原因</label>
            <textarea x-model="vulnEditor.status_reason" rows="2" placeholder="状态为「忽略」时必填，不少于 4 字" class="sto-input"></textarea>
          </div>
        </div>

      </div>

      <div class="vm-foot">
        <button @click="vulnEditor.open = false" class="sto-ghost">取消</button>
        <button @click="saveVuln()" class="sto-btn">保存</button>
      </div>

    </div>
  </div>
</div>

<!-- 成果编辑：复用漏洞编辑弹窗的版式，字段按成果模型裁剪 -->
<div x-show="rtEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="rtEditor.open = false">
  <div class="sto sto-vmodal">
    <div class="sto-panel" style="display:flex; flex-direction:column; min-height:0; overflow:hidden;" @click.stop>
      <div class="vm-head">
        <div style="min-width:0;">
          <div class="vm-title">编辑成果</div>
          <div class="vm-sub" x-text="`${rtEditor.task_id} · ${rtEditor.id} · 改实质内容会自动重新审核`"></div>
        </div>
        <button type="button" class="vm-x" @click="rtEditor.open = false" aria-label="关闭">×</button>
      </div>

      <div class="vm-body">
        <div class="vm-sec">
          <div class="vm-seclabel">基本信息</div>
          <div class="sto-field"><label>标题<span class="vm-req">*</span></label><input x-model="rtEditor.title" class="sto-input"></div>
          <div class="sto-grid2">
            <div class="sto-field"><label>成果类型</label>
              <select x-model="rtEditor.result_type" class="sto-input">
                <option value="permission">权限跃迁</option>
                <option value="data">数据获取</option>
                <option value="credential">凭证获取</option>
                <option value="pivot">横向控制</option>
              </select>
            </div>
            <div class="sto-field"><label>自评分</label><input type="number" min="1" x-model.number="rtEditor.points_declared" class="sto-input"></div>
          </div>
          <div class="sto-field"><label>描述<span class="vm-req">*</span></label><textarea x-model="rtEditor.description" rows="4" class="sto-input"></textarea></div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">身份与对象</div>
          <div class="sto-grid2">
            <div class="sto-field"><label>执行身份</label><input x-model="rtEditor.principal" class="sto-input"></div>
            <div class="sto-field"><label>租户</label><input x-model="rtEditor.tenant" class="sto-input"></div>
          </div>
          <div class="sto-field"><label>对象（公网入口）</label><input x-model="rtEditor.target_asset" class="sto-input" placeholder="如 api.kkgroup.cn"></div>
        </div>

        <div class="vm-sec" x-show="rtEditor.result_type === 'data'">
          <div class="vm-seclabel">数据</div>
          <div class="sto-grid2">
            <div class="sto-field"><label>数据目标</label><input x-model="rtEditor.data_target_id" class="sto-input"></div>
            <div class="sto-field"><label>字段（逗号分隔）</label><input x-model="rtEditor.data_fields" class="sto-input"></div>
          </div>
          <div class="sto-grid2">
            <div class="sto-field"><label>记录数</label><input type="number" min="0" x-model.number="rtEditor.sample_count" class="sto-input"></div>
            <div class="sto-field"><label>字节数</label><input type="number" min="0" x-model.number="rtEditor.sample_bytes" class="sto-input"></div>
          </div>
          <div class="sto-field"><label>样本说明</label><textarea x-model="rtEditor.data_summary" rows="2" class="sto-input"></textarea></div>
        </div>

        <div class="vm-sec" x-show="rtEditor.result_type === 'credential'">
          <div class="vm-seclabel">凭证</div>
          <div class="sto-field"><label>凭证引用（不写明文）</label><input x-model="rtEditor.credential_ref" class="sto-input"></div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">复现</div>
          <div class="sto-field"><label>入口点</label><input x-model="rtEditor.entry_point" class="sto-input" placeholder="POST /api/xxx"></div>
          <div class="sto-grid2">
            <div class="sto-field"><label>起始身份</label><input x-model="rtEditor.chain_input" class="sto-input"></div>
            <div class="sto-field"><label>本环增量</label><input x-model="rtEditor.chain_gain" class="sto-input"></div>
          </div>
          <div class="sto-field"><label>前置条件（一行一条）</label><textarea x-model="rtEditor.prerequisites" rows="3" class="sto-input"></textarea></div>
          <div style="display:flex; flex-direction:column; gap:9px;">
            <template x-for="(step, idx) in rtEditor.steps" :key="`rts-${idx}`">
              <div style="border:1px solid var(--sto-line); border-radius:7px; padding:9px 11px; display:flex; flex-direction:column; gap:7px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="sto-num" style="font-size:11px; color:var(--sto-fg-3);" x-text="`步骤 ${idx + 1}`"></span>
                  <span style="flex:1;"></span>
                  <button type="button" class="sto-minibtn danger" @click="removeRtEditorStep(idx)">删除这一步</button>
                </div>
                <input x-model="step.title" class="sto-input" placeholder="这一步在做什么">
                <textarea x-model="step.request" rows="4" class="sto-input" placeholder="真实请求报文（请求行 + header + 空行 + body）"></textarea>
                <textarea x-model="step.response" rows="3" class="sto-input" placeholder="真实响应（状态行 + 关键内容）"></textarea>
                <input x-model="step.proves" class="sto-input" placeholder="这一步证明了什么">
              </div>
            </template>
            <button type="button" class="sto-minibtn" style="align-self:flex-start;" @click="addRtEditorStep()">+ 添加一步</button>
          </div>
        </div>

        <p x-show="rtEditor.error" class="sto-warnline" x-text="rtEditor.error"></p>
      </div>

      <div class="vm-foot">
        <button @click="rtEditor.open = false" class="sto-ghost">取消</button>
        <button @click="saveRtResult()" :disabled="rtEditor.saving" class="sto-btn" x-text="rtEditor.saving ? '保存中…' : '保存'"></button>
      </div>
    </div>
  </div>
</div>
