<!-- ═══════════ VULNERABILITY PAGE ═══════════ -->
<div x-show="activePage === 'vulnerabilities'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800 tracking-tight" x-text="factViewMode === 'result' ? '红队成果' : '漏洞管理'"></h2>
      <p class="text-xs text-slate-400 mt-0.5" x-text="factViewMode === 'result' ? '红队成果（权限 / 数据 / 凭证 / 横向），不计入漏洞数量' : '跨任务聚合漏洞，按列表查看证据、影响和修复建议'"></p>
    </div>
    <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5 text-xs ml-2">
      <button type="button" @click="switchFactView('vulnerability')"
        class="px-3 py-1.5 rounded-md transition"
        :class="factViewMode !== 'result' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">漏洞</button>
      <button type="button" @click="switchFactView('result')"
        class="px-3 py-1.5 rounded-md transition"
        :class="factViewMode === 'result' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'">成果</button>
    </div>
    <div class="flex-1"></div>
    <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="sto-ghost" style="padding:7px 13px;">刷新</button>
  </header>

  <!-- 筛选 + 统计（漏洞视图） -->
  <div x-show="factViewMode !== 'result'" class="shrink-0 px-5 py-3 border-b border-slate-100" style="background:var(--sto-panel);">
    <div class="flex items-center" style="gap:9px;">
      <input x-model="vulnFilter.keyword" @input="scheduleVulnerabilitySearch()" placeholder="搜索标题、类型、描述" class="sto-input" style="flex:1;">
      <select x-model="vulnFilter.projectId" @change="applyVulnerabilityFilters()" class="sto-input" style="width:auto;">
        <option value="">全部任务</option>
        <template x-for="p in projects.filter(item => !item.archived && (item.engagement_mode || 'vulnerability') !== 'red_team')" :key="`vuln-filter-${p.id}`">
          <option :value="p.id" x-text="`${p.id} ${p.title}`"></option>
        </template>
      </select>
      <button @click="openVulnEditor()" class="sto-btn" style="padding:8px 13px;">新增漏洞</button>
    </div>
    <div class="flex items-center" style="gap:7px; margin-top:9px;">
      <span class="sto-muted" style="font-size:10.5px;">排序</span>
      <template x-for="opt in vulnerabilitySortOptions()" :key="`vsort-${opt.id}`">
        <button @click="setVulnerabilitySort(opt.id)" class="sto-minibtn"
          :class="vulnerabilitySort === opt.id ? 'acc' : ''"
          style="padding:3px 10px;"
          x-text="opt.label"></button>
      </template>
    </div>
    <div class="flex flex-wrap items-center" style="gap:16px; margin-top:11px;">
      <span class="sto-muted sto-num" style="font-size:10.5px;" x-text="`显示 ${filteredVulnerabilities().length} / ${vulnerabilityTotal}`"></span>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <template x-for="sev in ['critical','high','medium','low']" :key="`vstat-${sev}`">
        <span class="sto-status" :class="{critical:'err',high:'warn',medium:'warn',low:'ok'}[sev]" style="font-size:11px;">
          <i class="sto-sevdot" :class="`sto-sev-${sev}`" style="box-shadow:none;"></i>
          <span x-text="vulnSeverityLabel(sev)"></span>
          <b class="sto-num" style="color:var(--sto-fg);" x-text="filteredVulnerabilities().filter(v => (v.severity || '').toLowerCase() === sev).length"></b>
        </span>
      </template>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <span class="sto-status ok" style="font-size:11px;"><i></i><span>已验证</span><b class="sto-num" style="color:var(--sto-fg);" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'verified').length"></b></span>
      <span class="sto-status warn" style="font-size:11px;"><i></i><span>待验证</span><b class="sto-num" style="color:var(--sto-fg);" x-text="filteredVulnerabilities().filter(v => vulnStatusKey(v.status) === 'pending').length"></b></span>
    </div>
  </div>

  <main x-show="factViewMode !== 'result'" class="flex-1 min-h-0 grid grid-cols-[340px_minmax(0,1fr)] gap-4" style="padding:14px 16px; background:var(--sto-inset);">
    <!-- 列表 -->
    <aside class="sto-panel sto-vlist overflow-y-auto overflow-x-hidden" style="padding:10px;">
      <template x-if="filteredVulnerabilities().length === 0">
        <div class="sto-muted" style="text-align:center; padding:36px 0;">暂无漏洞记录</div>
      </template>
      <template x-for="v in filteredVulnerabilities()" :key="`${v.project_id}-${v.id}`">
        <button type="button" @click="selectVulnerability(v)" class="sto-navitem sto-vlist"
          :class="[`sto-sev-${(v.severity || 'info').toLowerCase()}`, selectedVulnerabilityKey === vulnerabilityKey(v) ? 'active' : '']">
          <div class="flex items-center" style="gap:7px;">
            <span class="sto-sevdot" x-text="''"></span>
            <span class="sto-num" style="font-size:10px; font-weight:700; color:var(--sto-fg-2);" x-text="v.id"></span>
            <span style="flex:1;"></span>
            <span x-show="v.human_reviewed" role="button" @click.stop="toggleVulnReviewed(v)"
              title="人工已阅（点击取消）"
              style="font-size:9.5px; color:var(--sto-fg-3); flex-shrink:0; cursor:pointer; letter-spacing:0.02em;">已阅</span>
            <span x-show="v.red_team_exploitable" role="button" @click.stop="toggleVulnRedTeamExploitable(v)"
              title="红队可利用：新建红队任务时可作为种子线索批量注入（点击取消）"
              style="font-size:9.5px; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius:4px; padding:0 4px; flex-shrink:0; cursor:pointer; letter-spacing:0.02em;">红队</span>
            <span class="sto-status" style="font-size:10px;" :class="({verified:'ok',pending:'warn',duplicate:'err',ignored:'off'})[vulnStatusKey(v.status)] || 'off'"><i></i><span x-text="vulnStatusLabel(v.status)"></span></span>
          </div>
          <p style="margin-top:5px; font-size:12.5px; font-weight:600; color:var(--sto-fg); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" x-text="v.title"></p>
        </button>
      </template>
      <div class="sto-pager" style="border-top:1px solid var(--sto-line); margin-top:10px; padding-top:10px;">
        <button @click="setVulnerabilityPage(vulnerabilityPage - 1)" :disabled="vulnerabilityLoading || vulnerabilityPage <= 0" class="sto-minibtn">上一页</button>
        <span class="sto-num" x-text="`${vulnerabilityPage + 1} / ${vulnerabilityPageCount()}`"></span>
        <button @click="setVulnerabilityPage(vulnerabilityPage + 1)" :disabled="vulnerabilityLoading || vulnerabilityPage + 1 >= vulnerabilityPageCount()" class="sto-minibtn">下一页</button>
      </div>
    </aside>

    <!-- 详情 -->
    <section class="sto-panel overflow-y-auto" style="overflow-x:hidden;">
      <template x-if="!selectedVulnerability()">
        <div class="sto-muted" style="min-height:420px; display:flex; align-items:center; justify-content:center;">请选择左侧漏洞查看详情</div>
      </template>
      <template x-if="selectedVulnerability()">
        <article>
          <!-- 严重度色 hero -->
          <div class="sto-vhero" :class="`sto-sev-${(selectedVulnerability().severity || 'info').toLowerCase()}`" style="padding:16px 20px;">
            <div class="flex flex-wrap items-center" style="gap:9px;">
              <span class="sevsq" x-text="(selectedVulnerability().severity || 'info').toLowerCase() === 'critical' ? '严' : (selectedVulnerability().severity || '').toLowerCase() === 'high' ? '高' : (selectedVulnerability().severity || '').toLowerCase() === 'medium' ? '中' : (selectedVulnerability().severity || '').toLowerCase() === 'low' ? '低' : '信'"></span>
              <span class="sto-num" style="font-size:11px; font-weight:700; color:var(--sto-fg-2);" x-text="selectedVulnerability().id"></span>
              <button type="button" @click="openVulnStatusQuick(selectedVulnerability())" class="sto-status" style="font-size:11px; cursor:pointer; border:0; background:none; padding:0;" :class="({verified:'ok',pending:'warn',duplicate:'err',ignored:'off'})[vulnStatusKey(selectedVulnerability().status)] || 'off'"><i></i><span x-text="vulnStatusLabel(selectedVulnerability().status)"></span></button>
              <span class="sto-muted" style="font-size:10.5px;" x-text="`${selectedVulnerability().project_group_title || '未归属项目'} / ${selectedVulnerability().task_title || selectedVulnerability().project_id}`"></span>
            </div>
            <h3 style="margin-top:9px; font-size:17px; font-weight:700; letter-spacing:-0.01em; color:var(--sto-fg); word-break:break-word;" x-text="selectedVulnerability().title"></h3>
            <div class="flex flex-wrap items-center" style="gap:7px; margin-top:9px;">
              <span class="sto-sevbadge" x-text="selectedVulnerability().type || '通用漏洞'"></span>
              <span x-show="selectedVulnerability().affected_target" class="sto-badge neutral" x-text="selectedVulnerability().affected_target"></span>
            </div>
            <template x-if="selectedVulnerability().status_reason">
              <p class="sto-muted" style="margin-top:9px; white-space:pre-wrap; word-break:break-word;"><span style="font-weight:650; color:var(--sto-fg-2);">状态原因 / 审核结论：</span><span x-text="formatMultiline(selectedVulnerability().status_reason)"></span></p>
            </template>
            <div class="flex flex-wrap items-center" style="gap:7px; margin-top:12px;">
              <button @click="exportSingleVulnerability(selectedVulnerability())" class="sto-btn" title="一键导出包含漏洞原文、Findings与证据文件的完整Zip包">
                <svg style="width:13px; height:13px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                导出漏洞包
              </button>
              <button @click="triggerVulnerabilityReview(selectedVulnerability())" :disabled="!vulnerabilityReviewCanRetry()" :title="vulnerabilityReviewCanRetry() ? '创建一次新的 Reviewer 审核' : '已有审核正在排队或运行'" class="sto-ghost" x-text="vulnerabilityReviewSubmitting ? '正在排队…' : '重新审核'"></button>
              <button x-show="selectedVulnerability().finding_artifact" @click="openVulnerabilityArtifact(selectedVulnerability(), selectedVulnerability().finding_artifact)" class="sto-ghost">
                <svg style="width:12px; height:12px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                Findings
              </button>
              <span style="flex:1;"></span>
              <button @click="toggleVulnReviewed(selectedVulnerability())" class="sto-minibtn"
                :class="selectedVulnerability().human_reviewed ? 'acc' : ''"
                :title="selectedVulnerability().human_reviewed ? '人工已阅，点击取消' : '标记人工已阅'">
                <span x-text="selectedVulnerability().human_reviewed ? '已阅' : '标记已阅'"></span>
              </button>
              <button @click="toggleVulnRedTeamExploitable(selectedVulnerability())" class="sto-minibtn"
                :class="selectedVulnerability().red_team_exploitable ? 'acc' : ''"
                :title="selectedVulnerability().red_team_exploitable ? '已标记红队可利用，点击取消' : '标记红队可利用（新建红队任务时可批量作为种子线索）'">
                <span x-text="selectedVulnerability().red_team_exploitable ? '红队可利用' : '标记红队可利用'"></span>
              </button>
              <button @click="editVuln(selectedVulnerability())" class="sto-minibtn">编辑</button>
              <button @click="deleteVuln(selectedVulnerability())" class="sto-minibtn danger">删除</button>
            </div>
          </div>

          <div style="padding:16px 20px; display:flex; flex-direction:column; gap:13px;">
            <!-- Reviewer 审核 -->
            <div class="sto-panel inset" style="padding:13px 15px;">
              <div class="flex items-center justify-between" style="gap:10px;">
                <p class="sto-label">Reviewer 审核</p>
                <span x-show="latestVulnerabilityReview()" class="sto-badge" :class="vulnerabilityReviewStateClass(latestVulnerabilityReview())" x-text="vulnerabilityReviewStateLabel(latestVulnerabilityReview())"></span>
              </div>
              <p class="sto-muted" style="margin-top:4px;">证据优先审核；必要时在 Scope 内做最小复测。</p>
              <p x-show="vulnerabilityReviewsLoading" class="sto-muted" style="margin-top:10px;">正在加载审核记录…</p>
              <p x-show="vulnerabilityReviewsError" class="sto-warnline" style="margin-top:10px;" x-text="vulnerabilityReviewsError"></p>
              <div x-show="!vulnerabilityReviewsLoading && !vulnerabilityReviewsError && (vulnerabilityReviews || []).length === 0" class="sto-empty" style="margin-top:10px; padding:14px 0;">暂无 Reviewer 审核记录。待验证漏洞会自动排队。</div>
              <div x-show="(vulnerabilityReviews || []).length > 0" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
                <template x-for="run in (vulnerabilityReviews || [])" :key="run.id">
                  <article class="sto-group" style="padding:10px 12px;">
                    <div class="flex flex-wrap items-center" style="gap:7px;">
                      <span class="sto-num" style="font-size:10px; font-weight:650; color:var(--sto-fg-2);" x-text="run.id"></span>
                      <span class="sto-badge" style="padding:1px 7px; font-size:9px;" :class="vulnerabilityReviewStateClass(run)" x-text="vulnerabilityReviewStateLabel(run)"></span>
                      <span class="sto-badge neutral" style="padding:1px 7px; font-size:9px;" x-text="vulnerabilityReviewTriggerLabel(run.trigger)"></span>
                      <span x-show="run.decision" class="sto-badge" style="padding:1px 7px; font-size:9px; color:var(--sto-accent); border-color:color-mix(in srgb, var(--sto-accent) 35%, transparent);" x-text="vulnerabilityReviewDecisionLabel(run.decision)"></span>
                      <span class="sto-muted sto-num" style="margin-left:auto; font-size:9.5px;" x-text="formatDate(run.concluded_at || run.updated_at || run.created_at)"></span>
                    </div>
                    <p x-show="run.worker" class="sto-muted" style="margin-top:5px; font-size:10.5px;"><span style="font-weight:650;">审查者：</span><span x-text="run.worker"></span></p>
                    <p x-show="run.activity_summary && ['pending','claimed','running','concluding'].includes(run.status)" style="margin-top:3px; font-size:10.5px; color:var(--sto-accent);" x-text="run.activity_summary"></p>
                    <p x-show="run.decision_reason" class="sto-muted" style="margin-top:7px; white-space:pre-wrap; word-break:break-word; line-height:1.55;"><span style="font-weight:650; color:var(--sto-fg-2);">审核原因：</span><span x-text="run.decision_reason"></span></p>
                    <button x-show="run.duplicate_of_vulnerability_id" @click="openReviewDuplicate(run)" style="margin-top:6px; font-size:11.5px; font-weight:600; color:var(--sto-accent); background:none; border:0; cursor:pointer; padding:0;">重复于 <span x-text="run.duplicate_of_vulnerability_id"></span> →</button>
                    <p x-show="run.status === 'failed' && run.last_failure_kind" class="sto-warnline" style="margin-top:6px;"><span style="font-weight:650;">失败原因：</span><span x-text="run.last_failure_kind"></span></p>
                    <div x-show="(run.artifacts || []).length > 0" class="sto-chipline" style="margin-top:8px;">
                      <template x-for="artifact in (run.artifacts || [])" :key="`${run.id}-${artifact.id}`">
                        <button @click="openVulnerabilityArtifact(selectedVulnerability(), artifact)" class="sto-minibtn acc" style="padding:3px 9px; font-size:10px;" x-text="artifact.artifact_type === 'review.report' ? '审核报告' : (artifact.path || artifact.id)"></button>
                      </template>
                    </div>
                  </article>
                </template>
              </div>
            </div>

            <div class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">描述</p>
              <p style="font-size:13px; color:var(--sto-fg); white-space:pre-wrap; word-break:break-word; line-height:1.6;" x-text="formatMultiline(selectedVulnerability().description)"></p>
            </div>
            <div class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">利用前提</p>
              <p style="font-size:13px; white-space:pre-wrap; word-break:break-word; line-height:1.6;"
                :style="selectedVulnerability().prerequisites ? 'color:var(--sto-fg);' : 'color:var(--sto-fg-3); font-style:italic;'"
                x-text="formatMultiline(selectedVulnerability().prerequisites || '未填写')"></p>
            </div>
            <div class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">影响</p>
              <p style="font-size:13px; color:var(--sto-fg); white-space:pre-wrap; word-break:break-word; line-height:1.6;" x-text="formatMultiline(selectedVulnerability().impact)"></p>
            </div>
            <template x-if="selectedVulnerability().finding_artifact">
              <div class="sto-panel" style="padding:13px 15px;">
                <p class="sto-label" style="margin-bottom:7px;">关联 Findings</p>
                <button @click="openVulnerabilityArtifact(selectedVulnerability(), selectedVulnerability().finding_artifact)" class="sto-item" style="border:1px solid var(--sto-line); border-radius:9px; width:100%;">
                  <span style="min-width:0;">
                    <span class="sto-num" style="display:block; font-size:11.5px; font-weight:600; color:var(--sto-accent);" x-text="selectedVulnerability().finding_artifact.path"></span>
                    <span class="sto-muted" style="display:block; margin-top:2px; font-size:10px;" x-text="selectedVulnerability().finding_artifact.summary"></span>
                  </span>
                </button>
              </div>
            </template>
            <template x-if="(selectedVulnerability().evidence_artifacts || []).length > 0">
              <div class="sto-panel" style="padding:13px 15px;">
                <p class="sto-label" style="margin-bottom:7px;">证据文件</p>
                <div style="display:flex; flex-direction:column; gap:6px;">
                  <template x-for="artifact in (selectedVulnerability().evidence_artifacts || [])" :key="`${selectedVulnerability().id}-${artifact.id}`">
                    <button @click="openVulnerabilityArtifact(selectedVulnerability(), artifact)" class="sto-item" style="border:1px solid var(--sto-line); border-radius:9px; justify-content:space-between;">
                      <span style="font-size:11.5px; color:var(--sto-accent); font-family:ui-monospace,'SF Mono',Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" x-text="artifact.path"></span>
                      <span class="sto-muted sto-num" style="font-size:10px; flex-shrink:0;" x-text="formatBytes(artifact.size)"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>
            <div class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">修复建议</p>
              <p style="font-size:13px; white-space:pre-wrap; word-break:break-word; line-height:1.6;"
                :style="selectedVulnerability().remediation ? 'color:var(--sto-fg);' : 'color:var(--sto-fg-3); font-style:italic;'"
                x-text="formatMultiline(selectedVulnerability().remediation || '未填写')"></p>
            </div>
            <template x-if="selectedVulnerability().legacy">
              <div class="sto-tiercard" style="--pc:#b45309; border-left-width:3px;">
                <p class="sto-label" style="margin-bottom:8px;">旧格式内容（只读）</p>
                <div x-show="(selectedVulnerability().legacy.reproduction_steps || []).length">
                  <p class="sto-desc" style="margin-bottom:4px;">旧复现步骤</p>
                  <ul style="list-style:disc; margin-left:18px; display:flex; flex-direction:column; gap:3px;"><template x-for="(step, idx) in selectedVulnerability().legacy.reproduction_steps" :key="`legacy-step-${idx}`"><li class="sto-muted" style="font-size:11.5px;" x-text="step"></li></template></ul>
                </div>
                <div x-show="(selectedVulnerability().legacy.evidence || []).length" style="margin-top:9px;">
                  <p class="sto-desc" style="margin-bottom:4px;">旧文字证据</p>
                  <ul style="list-style:disc; margin-left:18px; display:flex; flex-direction:column; gap:3px;"><template x-for="(ev, idx) in selectedVulnerability().legacy.evidence" :key="`legacy-ev-${idx}`"><li class="sto-muted" style="font-size:11.5px;" x-text="ev"></li></template></ul>
                </div>
                <div x-show="selectedVulnerability().legacy.curl_command" style="margin-top:9px;"><p class="sto-desc" style="margin-bottom:4px;">旧请求示例</p><pre class="sto-usage" x-text="selectedVulnerability().legacy.curl_command"></pre></div>
              </div>
            </template>
          </div>
        </article>
      </template>
    </section>
  </main>

  <!-- 筛选 + 统计（成果视图，与漏洞视图同一套顶栏） -->
  <div x-show="factViewMode === 'result'" x-cloak class="shrink-0 px-5 py-3 border-b border-slate-100" style="background:var(--sto-panel);">
    <div class="flex items-center" style="gap:9px;">
      <input x-model="rtResultFilter.keyword" @input="scheduleRtResultSearch()" placeholder="搜索标题、描述、身份" class="sto-input" style="flex:1;">
      <select x-model="rtResultFilter.projectId" @change="loadRedTeamResultPage()" class="sto-input" style="width:auto;">
        <option value="">全部任务</option>
        <template x-for="p in projects.filter(item => !item.archived && item.engagement_mode === 'red_team')" :key="`rt-filter-${p.id}`">
          <option :value="p.id" x-text="`${p.id} ${p.title}`"></option>
        </template>
      </select>
      <select x-model="rtResultFilter.status" @change="loadRedTeamResultPage()" class="sto-input" style="width:auto;">
        <option value="">全部状态</option>
        <option value="reported">已上报</option>
        <option value="reviewing">审核中</option>
        <option value="verified">已验证</option>
        <option value="rejected">已驳回</option>
        <option value="duplicate">重复</option>
        <option value="needs-human">需人工</option>
      </select>
      <select x-model="rtResultFilter.type" @change="loadRedTeamResultPage()" class="sto-input" style="width:auto;">
        <option value="">全部类型</option>
        <option value="permission">权限跃迁</option>
        <option value="data">数据获取</option>
        <option value="credential">凭证获取</option>
        <option value="pivot">横向控制</option>
      </select>
    </div>
    <div class="flex flex-wrap items-center" style="gap:16px; margin-top:11px;">
      <span class="sto-muted sto-num" style="font-size:10.5px;" x-text="`显示 ${rtResultItems.length} / ${rtResultTotal}`"></span>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <template x-for="kind in [{id:'permission',label:'权限'},{id:'data',label:'数据'},{id:'credential',label:'凭证'},{id:'pivot',label:'横向'}]" :key="`rtstat-${kind.id}`">
        <span class="sto-status" :class="rtTypeClass(kind.id)" style="font-size:11px;">
          <i class="sto-sevdot" :class="rtTypeTone(kind.id)" style="box-shadow:none;"></i>
          <span x-text="kind.label"></span>
          <b class="sto-num" style="color:var(--sto-fg);" x-text="rtResultItems.filter(item => item.result_type === kind.id).length"></b>
        </span>
      </template>
      <span style="width:1px; height:14px; background:var(--sto-line);"></span>
      <span class="sto-status ok" style="font-size:11px;"><i></i><span>已验证</span><b class="sto-num" style="color:var(--sto-fg);" x-text="rtResultItems.filter(item => item.status === 'verified').length"></b></span>
      <span class="sto-status warn" style="font-size:11px;"><i></i><span>审核中</span><b class="sto-num" style="color:var(--sto-fg);" x-text="rtResultItems.filter(item => item.status === 'reviewing' || item.status === 'reported').length"></b></span>
      <span class="sto-status ok" style="font-size:11px;"><i></i><span>核定</span><b class="sto-num" style="color:var(--sto-fg);" x-text="`${rtVerifiedPoints()} 分`"></b></span>
    </div>
  </div>

  <main x-show="factViewMode === 'result'" x-cloak class="flex-1 min-h-0 grid grid-cols-[340px_minmax(0,1fr)] gap-4" style="padding:14px 16px; background:var(--sto-inset);">
    <aside class="sto-panel sto-vlist overflow-y-auto overflow-x-hidden" style="padding:10px;">
      <template x-if="!rtResultLoading && rtResultItems.length === 0">
        <div class="sto-muted" style="text-align:center; padding:36px 0;">暂无红队成果</div>
      </template>
      <template x-for="r in rtResultItems" :key="r.id">
        <button type="button" @click="selectRtResult(r)" class="sto-navitem sto-vlist"
          :class="[rtTypeTone(r.result_type), selectedRtResultId === r.id ? 'active' : '']">
          <div class="flex items-center" style="gap:7px;">
            <span class="sto-sevdot"></span>
            <span class="sto-num" style="font-size:10px; font-weight:700; color:var(--sto-fg-2);" x-text="r.id"></span>
            <span style="flex:1;"></span>
            <span class="sto-num" style="font-size:10px; font-weight:700; color:var(--sto-fg-2);" x-text="rtPointsLabel(r)"></span>
            <span class="sto-status" style="font-size:10px;" :class="rtStatusClass(r.status)"><i></i><span x-text="rtStatusLabel(r.status)"></span></span>
          </div>
          <p style="margin-top:5px; font-size:12.5px; font-weight:600; color:var(--sto-fg); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" x-text="r.title"></p>
        </button>
      </template>
    </aside>
    <section class="sto-panel overflow-y-auto" style="overflow-x:hidden;">
      <template x-if="!selectedRtResult()">
        <div class="sto-muted" style="min-height:420px; display:flex; align-items:center; justify-content:center;">请选择左侧成果查看详情</div>
      </template>
      <template x-if="selectedRtResult()">
        <article>
          <div class="sto-vhero" :class="rtTypeTone(selectedRtResult().result_type)" style="padding:16px 20px;">
            <div class="flex flex-wrap items-center" style="gap:9px;">
              <span class="sevsq" x-text="rtTypeMark(selectedRtResult().result_type)"></span>
              <span class="sto-num" style="font-size:11px; font-weight:700; color:var(--sto-fg-2);" x-text="selectedRtResult().id"></span>
              <span class="sto-status" style="font-size:11px;" :class="rtStatusClass(selectedRtResult().status)"><i></i><span x-text="rtStatusLabel(selectedRtResult().status)"></span></span>
              <span class="sto-num" style="font-size:11px; font-weight:700; color:var(--sto-fg);" x-text="rtPointsLabel(selectedRtResult())"></span>
              <span class="sto-muted" style="font-size:10.5px;" x-text="rtTaskTitle(selectedRtResult().task_id)"></span>
            </div>
            <h3 style="margin-top:9px; font-size:17px; font-weight:700; letter-spacing:-0.01em; color:var(--sto-fg); word-break:break-word;" x-text="selectedRtResult().title"></h3>
            <div class="flex flex-wrap items-center" style="gap:7px; margin-top:9px;">
              <span class="sto-sevbadge" x-text="rtTypeLabel(selectedRtResult().result_type)"></span>
              <span x-show="selectedRtResult().target_asset" class="sto-badge neutral" x-text="selectedRtResult().target_asset"></span>
              <span x-show="selectedRtResult().principal" class="sto-badge neutral" x-text="selectedRtResult().tenant ? `${selectedRtResult().principal} @ ${selectedRtResult().tenant}` : selectedRtResult().principal"></span>
            </div>
          </div>
          <div style="padding:16px 20px; display:flex; flex-direction:column; gap:13px;">
            <div class="sto-panel inset" style="padding:13px 15px;">
              <div class="flex items-center justify-between" style="gap:10px;">
                <p class="sto-label">Reviewer 审核</p>
                <span class="sto-badge" :class="rtStatusClass(selectedRtResult().status)" x-text="rtStatusLabel(selectedRtResult().status)"></span>
              </div>
              <p class="sto-muted" style="margin-top:4px;">证据优先审核；必要时在 Scope 内做最小复测。</p>
              <div x-show="!selectedRtResult().reviewed_by && !selectedRtResult().review_reason" class="sto-empty" style="margin-top:10px; padding:14px 0;">暂无 Reviewer 审核记录。成果上报后会自动排队。</div>
              <article x-show="selectedRtResult().reviewed_by || selectedRtResult().review_reason" class="sto-group" style="margin-top:10px; padding:10px 12px;">
                <div class="flex flex-wrap items-center" style="gap:7px;">
                  <span class="sto-num" style="font-size:10px; font-weight:650; color:var(--sto-fg-2);" x-text="selectedRtResult().id"></span>
                  <span class="sto-badge" style="padding:1px 7px; font-size:9px;" :class="rtStatusClass(selectedRtResult().status)" x-text="rtStatusLabel(selectedRtResult().status)"></span>
                  <span x-show="selectedRtResult().status === 'verified'" class="sto-badge" style="padding:1px 7px; font-size:9px; color:var(--sto-accent); border-color:color-mix(in srgb, var(--sto-accent) 35%, transparent);" x-text="`核定 ${selectedRtResult().points_awarded || 0} 分`"></span>
                  <span class="sto-muted sto-num" style="margin-left:auto; font-size:9.5px;" x-text="formatDate(selectedRtResult().updated_at || selectedRtResult().created_at)"></span>
                </div>
                <p x-show="selectedRtResult().reviewed_by" class="sto-muted" style="margin-top:5px; font-size:10.5px;"><span style="font-weight:650;">审查者：</span><span x-text="selectedRtResult().reviewed_by"></span></p>
                <p x-show="selectedRtResult().review_reason" class="sto-muted" style="margin-top:7px; white-space:pre-wrap; word-break:break-word; line-height:1.55;"><span style="font-weight:650; color:var(--sto-fg-2);">审核原因：</span><span x-text="formatMultiline(selectedRtResult().review_reason)"></span></p>
              </article>
            </div>
            <div class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">描述</p>
              <p style="font-size:13px; color:var(--sto-fg); white-space:pre-wrap; word-break:break-word; line-height:1.6;" x-text="formatMultiline(selectedRtResult().description)"></p>
            </div>
            <div class="sto-panel" style="padding:13px 15px;">
              <div class="flex items-center justify-between" style="gap:8px; margin-bottom:8px;">
                <p class="sto-label">攻击链</p>
                <span class="sto-num" style="font-size:10.5px; color:var(--sto-fg-2);" x-text="rtChainView && rtChainView.chainId === selectedRtResult().chain_id ? `${rtChainView.chainId} ${rtChainView.title || ''}`.trim() : (selectedRtResult().chain_id || '—')"></span>
              </div>
              <p x-show="rtChainLoading" class="sto-muted">正在读取这条链上的 Intent…</p>
              <p x-show="!rtChainLoading && rtChainView && rtChainView.chainId === selectedRtResult().chain_id && rtChainView.steps.length === 0" class="sto-muted">这条链上还没有 Intent。</p>
              <div x-show="rtChainView && rtChainView.chainId === selectedRtResult().chain_id && rtChainView.steps.length" class="chain-strip">
                <template x-for="(step, index) in (rtChainView && rtChainView.chainId === selectedRtResult().chain_id ? rtChainView.steps : [])" :key="`${selectedRtResult().id}-${step.id}`">
                  <span class="chain-strip-item">
                    <button type="button" class="chain-chip" :class="step.id === selectedRtResult().intent_id ? 'on' : ''" :title="step.description || ''" @click="openResultChainIntent(selectedRtResult(), step.id)">
                      <span x-text="step.id"></span>
                    </button>
                    <span class="chain-arrow" x-show="rtChainView && index < rtChainView.steps.length - 1">→</span>
                  </span>
                </template>
              </div>
            </div>
            <div class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">能力与归属</p>
              <div class="grid grid-cols-2 gap-x-6 gap-y-2" style="font-size:12.5px; color:var(--sto-fg-2);">
                <div><span class="sto-muted">Intent</span> <span class="sto-num" x-text="selectedRtResult().intent_id || '—'"></span></div>
                <div><span class="sto-muted">能力变化</span> <span class="sto-num" x-text="(selectedRtResult().capabilities_before || []).join(', ') || '—'"></span> → <span class="sto-num" style="color:var(--sto-fg);" x-text="(selectedRtResult().capabilities_gained || []).join(', ') || '—'"></span></div>
                <div><span class="sto-muted">上报</span> <span x-text="selectedRtResult().reported_by || '—'"></span></div>
              </div>
            </div>
            <div x-show="selectedRtResult().result_type === 'data'" class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">数据样本</p>
              <p style="font-size:13px; color:var(--sto-fg); line-height:1.6;" x-text="`${selectedRtResult().sample_count ?? '—'} 条 / ${selectedRtResult().sample_bytes ?? '—'} 字节`"></p>
              <p class="sto-muted" style="margin-top:4px;" x-text="`字段 ${(selectedRtResult().data_fields || []).join(', ') || '—'}`"></p>
              <p x-show="selectedRtResult().data_summary" style="margin-top:6px; font-size:13px; color:var(--sto-fg); white-space:pre-wrap; word-break:break-word;" x-text="formatMultiline(selectedRtResult().data_summary)"></p>
            </div>
            <div x-show="selectedRtResult().result_type === 'credential'" class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">凭证引用</p>
              <p class="sto-num" style="font-size:13px; color:var(--sto-fg);" x-text="selectedRtResult().credential_ref || '—'"></p>
            </div>
            <div class="sto-panel" style="padding:13px 15px;">
              <p class="sto-label" style="margin-bottom:7px;">证据引用</p>
              <template x-if="(selectedRtResult().evidence_refs || []).length === 0">
                <p class="sto-muted" style="font-style:italic;">未填写</p>
              </template>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <template x-for="ref in (selectedRtResult().evidence_refs || [])" :key="`${selectedRtResult().id}-${ref}`">
                  <button type="button" @click="openResultEvidence(selectedRtResult(), ref)" class="sto-item" style="border:1px solid var(--sto-line); border-radius:9px; width:100%; text-align:left; cursor:pointer;">
                    <span class="sto-num" style="font-size:11.5px; color:var(--sto-accent);" x-text="ref"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </article>
      </template>
    </section>
  </main>
</div>

<!-- Quick Status Modal -->
<div x-show="vulnStatusQuick.open" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center overlay" @click.self="closeVulnStatusQuick()">
  <div class="sto" style="width:100%; max-width:420px; margin:0 16px;">
    <div class="sto-panel" @click.stop>
      <div style="padding:15px 18px; border-bottom:1px solid var(--sto-line);">
        <h3 style="font-size:13.5px; font-weight:650; color:var(--sto-fg);">漏洞状态</h3>
        <p class="sto-muted sto-num" style="margin-top:4px; word-break:break-all; font-size:10.5px;" x-text="`${vulnStatusQuick.id} · ${vulnStatusQuick.title}`"></p>
      </div>
      <div style="padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button type="button" @click="pickVulnStatus('待验证')" class="sto-listbtn" :class="vulnStatusQuick.selected === '待验证' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">待验证</button>
        <button type="button" @click="pickVulnStatus('已验证')" class="sto-listbtn" :class="vulnStatusQuick.selected === '已验证' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">已验证</button>
        <button type="button" @click="pickVulnStatus('忽略')" class="sto-listbtn" :class="vulnStatusQuick.selected === '忽略' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">忽略</button>
        <button type="button" @click="pickVulnStatus('重复')" class="sto-listbtn" :class="vulnStatusQuick.selected === '重复' ? 'active' : ''" style="text-align:center; font-size:12.5px; font-weight:600;">重复</button>
      </div>
      <template x-if="vulnStatusQuick.selected === '忽略'">
        <div style="padding:0 18px 4px;">
          <div class="sto-field"><label>忽略原因（不少于 4 个字）</label>
            <textarea x-model="vulnStatusQuick.reason" rows="3" placeholder="请填写忽略原因…" class="sto-input"></textarea>
            <p x-show="vulnStatusQuick.reasonError" x-text="vulnStatusQuick.reasonError" class="sto-warnline"></p>
          </div>
        </div>
      </template>
      <div class="sto-foot" style="padding:13px 18px; border-top:1px solid var(--sto-line);">
        <button type="button" @click="closeVulnStatusQuick()" class="sto-ghost">取消</button>
        <button type="button" @click="confirmVulnStatus()" class="sto-btn">确认</button>
      </div>
    </div>
  </div>
</div>

<!-- Vuln Editor Modal -->
<div x-show="vulnEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="vulnEditor.open = false">
  <div class="sto sto-vmodal">
    <div class="sto-panel" style="display:flex; flex-direction:column; min-height:0; overflow:hidden;" @click.stop>

      <div class="vm-head">
        <div style="min-width:0;">
          <div class="vm-title" x-text="vulnEditor.isNew ? '新增漏洞' : '编辑漏洞'"></div>
          <div class="vm-sub" x-text="vulnEditor.project_id ? (vulnEditor.project_id + (vulnEditor.isNew ? ' · 填好后可加载已有产物' : '')) : '尚未绑定任务'"></div>
        </div>
        <button type="button" class="vm-x" @click="vulnEditor.open = false" aria-label="关闭">×</button>
      </div>

      <div class="vm-body">

        <div class="vm-sec">
          <div class="vm-seclabel">基本信息</div>
          <div class="flex" style="gap:8px;">
            <input x-model="vulnEditor.project_id" placeholder="任务 ID（如 t_042）" class="sto-input sto-num" style="flex:1;" :disabled="!vulnEditor.isNew">
            <button type="button" @click="loadVulnEditorArtifacts()" :disabled="!vulnEditor.project_id || vulnEditor.artifacts_loading" class="sto-minibtn" style="flex-shrink:0;" x-text="vulnEditor.artifacts_loading ? '加载中…' : '加载产物'"></button>
          </div>
          <div class="sto-field"><label>标题<span class="vm-req">*</span></label><input x-model="vulnEditor.title" placeholder="一句话说清：谁 · 在哪个接口 · 能干什么" class="sto-input"></div>
          <div class="sto-grid2">
            <div class="sto-field"><label>漏洞类型</label><input x-model="vulnEditor.type" placeholder="如 IDOR / SQLi / JWT" class="sto-input"></div>
            <div class="sto-field"><label>受影响目标 / 接口</label><input x-model="vulnEditor.affected_target" placeholder="如 POST /api/v1/xxx" class="sto-input"></div>
          </div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">定级与关联</div>
          <div class="sto-field"><label>严重程度</label>
            <div class="sto-sevpicker">
              <template x-for="sev in ['critical','high','medium','low','info']" :key="sev">
                <button type="button" @click="vulnEditor.severity = sev" class="sto-sevopt"
                  :class="[`sto-sev-${sev}`, vulnEditor.severity === sev ? 'active' : '']">
                  <span class="vm-dot"></span><span x-text="vulnSeverityLabel(sev)"></span>
                </button>
              </template>
            </div>
          </div>
          <div class="sto-grid2">
            <div class="sto-field"><label>状态</label>
              <select x-model="vulnEditor.status" class="sto-input">
                <option value="待验证">待验证</option>
                <option value="已验证">已验证</option>
                <option value="忽略">忽略</option>
                <option value="重复">重复</option>
              </select>
            </div>
            <div class="sto-field"><label>关联 Findings</label>
              <select x-model="vulnEditor.finding_artifact_id" class="sto-input">
                <option value="">不关联</option>
                <template x-for="artifact in (vulnEditor.available_artifacts || []).filter(item => item.artifact_type === 'explore.findings' || item.artifact_type === 'bootstrap.findings' || item.artifact_type === 'upload')" :key="`finding-${artifact.id}`"><option :value="artifact.id" x-text="`${artifact.path} · ${artifact.artifact_type}`"></option></template>
              </select>
            </div>
          </div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">内容</div>
          <div class="sto-field"><label>描述<span class="vm-req">*</span></label><textarea x-model="vulnEditor.description" rows="6" placeholder="漏洞成因 + 触发条件" class="sto-input"></textarea></div>
          <div class="sto-field"><label>利用前提</label><textarea x-model="vulnEditor.prerequisites" rows="3" placeholder="需要什么身份 / 前置条件" class="sto-input"></textarea></div>
          <div class="sto-field"><label>影响<span class="vm-req">*</span></label><textarea x-model="vulnEditor.impact" rows="5" placeholder="能造成什么后果" class="sto-input"></textarea></div>
          <div class="sto-field"><label>修复建议</label><textarea x-model="vulnEditor.remediation" rows="6" placeholder="建议怎么修" class="sto-input"></textarea></div>
        </div>

        <div class="vm-sec">
          <div class="vm-seclabel">证据</div>
          <div class="sto-field"><label>证据文件（可多选）</label>
            <select multiple size="5" x-model="vulnEditor.evidence_artifact_ids" class="sto-input">
              <template x-for="artifact in (vulnEditor.available_artifacts || []).filter(item => item.artifact_type === 'explore.evidence' || item.artifact_type === 'review.evidence' || item.artifact_type === 'upload')" :key="`evidence-${artifact.id}`"><option :value="artifact.id" x-text="`${artifact.path} · ${formatBytes(artifact.size)}`"></option></template>
            </select>
            <p class="vm-hint">按住 Command / Ctrl 可多选已有 Artifact。</p>
          </div>
          <div class="sto-field"><label>状态原因</label>
            <textarea x-model="vulnEditor.status_reason" rows="2" placeholder="状态为「忽略」时必填，不少于 4 字" class="sto-input"></textarea>
          </div>
        </div>

      </div>

      <div class="vm-foot">
        <button @click="vulnEditor.open = false" class="sto-ghost">取消</button>
        <button @click="saveVuln()" class="sto-btn">保存</button>
      </div>

    </div>
  </div>
</div>
