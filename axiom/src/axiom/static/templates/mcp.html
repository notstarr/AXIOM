<div x-show="activePage === 'mcp'" x-cloak class="flex-1 flex flex-col overflow-hidden">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800">MCP 管理</h2>
      <p class="text-xs text-slate-400 mt-0.5">管理 MCP Server、发现结果和 Tool 启停；阶段分配由 Worker 统一管理。</p>
    </div>
    <div class="flex-1"></div>
    <button @click="loadMcpPage()" class="sto-ghost" style="padding:7px 12px;">刷新</button>
    <button @click="showMcpImport=true; mcpImportContent=''" class="sto-ghost" style="padding:7px 12px;">导入配置</button>
    <button @click="openMcpEditor()" class="sto-btn" style="padding:7px 12px;">新增 Server</button>
  </header>

  <main class="sto flex-1 overflow-y-auto p-5 space-y-4">
    <!-- 概览条：Server/Tool 统计 + 五阶段可见性 -->
    <div class="sto-panel" style="padding:16px 18px;">
      <div class="sto-statstrip" style="margin-bottom:12px;">
        <div class="sto-statcell"><span class="sto-label">Servers · 已配置</span><b class="sto-num" x-text="(mcpServers || []).length"></b></div>
        <div class="sto-statcell"><span class="sto-label">Servers · 启用中</span><b class="sto-num" x-text="(mcpServers || []).filter(s => !s.disabled).length"></b></div>
        <div class="sto-statcell"><span class="sto-label">Tools · 已发现</span><b class="sto-num" x-text="(mcpServers || []).reduce((a, s) => a + (s.tools || []).length, 0)"></b></div>
        <div class="sto-statcell"><span class="sto-label">Tools · 已启用</span><b class="sto-num" x-text="(mcpServers || []).reduce((a, s) => a + (s.tools || []).filter(t => t.enabled).length, 0)"></b></div>
      </div>
      <div class="flex flex-wrap items-center justify-between" style="gap:10px;">
        <div class="flex flex-wrap items-center" style="gap:8px;">
          <template x-for="phase in axiomPhases()" :key="`mcp-strip-${phase}`">
            <span class="sto-phasechip" style="min-width:86px;" :class="phaseCapabilityCount(phase, 'mcp_tool') > 0 ? 'on' : 'off'">
              <span x-text="axiomPhaseLabel(phase)"></span>
              <b class="sto-num" x-text="phaseCapabilityCount(phase, 'mcp_tool')"></b>
            </span>
          </template>
        </div>
        <span class="sto-muted">只统计当前可用的具体 MCP Tool · 批量分配在
          <button @click="navigateToWorkerCapability('mcp_tool', '', 'reason')" class="sto-minibtn acc" style="margin:0 2px;">Worker 能力管理</button>完成
        </span>
      </div>
    </div>

    <!-- 导入配置弹窗 -->
    <div x-show="showMcpImport" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showMcpImport=false">
      <div class="sto" style="width:100%; max-width:640px;">
        <div class="sto-panel" style="padding:20px;" @click.stop>
          <div class="flex items-center justify-between" style="margin-bottom:14px;">
            <div>
              <h3 style="font-size:14.5px; font-weight:650;">导入 MCP 配置</h3>
              <p class="sto-muted" style="margin-top:3px;">支持标准 mcpServers JSON/YAML、单 Server JSON，以及 Codex TOML。</p>
            </div>
            <button @click="showMcpImport=false" class="sto-ghost" style="padding:4px 10px;">×</button>
          </div>
          <div class="sto-field">
            <label>配置格式</label>
            <select x-model="mcpImportFormat" class="sto-input" style="width:auto;">
              <option value="auto">自动识别</option><option value="json">JSON</option><option value="yaml">YAML</option><option value="toml">TOML</option>
            </select>
          </div>
          <div class="sto-field" style="margin-top:12px;">
            <label>配置内容</label>
            <textarea x-model="mcpImportContent" rows="10" class="sto-input" style="background:var(--sto-inset);" placeholder='{"mcpServers":{"browser":{"command":"npx","args":["-y","..."],"env":{}}}}'></textarea>
          </div>
          <div class="sto-foot" style="margin-top:14px;">
            <button @click="showMcpImport=false" class="sto-ghost">取消</button>
            <button @click="importMcpConfig()" :disabled="mcpImportBusy" class="sto-btn" x-text="mcpImportBusy ? '导入中…' : '导入并保存'"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- 已配置 Server -->
    <div>
      <div class="flex items-center justify-between" style="margin-bottom:10px;">
        <p class="sto-label">Servers · 已配置 <span x-text="`(${(mcpServers || []).length})`"></span></p>
        <span class="sto-muted">只注册被选中的具体 Tool，同 Server 的其他 Tool 不会披露</span>
      </div>
      <div class="grid grid-cols-1 xl:grid-cols-2" style="gap:12px;">
        <template x-for="server in (mcpServers || [])" :key="server.id">
          <article class="sto-panel sto-server" :class="server.disabled ? 'off' : ''" style="padding:14px 16px;">
            <div class="flex items-start justify-between" style="gap:10px;">
              <div style="min-width:0;">
                <div class="flex items-center flex-wrap" style="gap:7px;">
                  <span style="font-size:13.5px; font-weight:650; color:var(--sto-fg);" x-text="server.name"></span>
                  <span class="sto-badge neutral" style="padding:2px 8px; font-size:10px;" x-text="mcpTransportLabel(server)"></span>
                  <span class="sto-badge" style="padding:2px 8px; font-size:10px;" :class="mcpDiscoveryClass(server)" x-text="mcpDiscoveryLabel(server)"></span>
                  <span x-show="server.disabled" class="sto-badge warn" style="padding:2px 8px; font-size:10px;">已停用</span>
                </div>
                <p class="sto-muted" style="margin-top:5px; font-size:10.5px;" x-show="server.server_info?.name || server.server_info?.version" x-text="[server.server_info?.name, server.server_info?.version].filter(Boolean).join(' · ')"></p>
              </div>
              <div class="flex items-center" style="gap:6px; flex-shrink:0;">
                <button @click="discoverMcpTools(server)" :disabled="server._discovering" class="sto-minibtn acc" x-text="server._discovering ? '发现中…' : '重新发现'"></button>
                <button @click="toggleMcpPageServer(server)" class="sto-minibtn" x-text="server.disabled ? '启用' : '停用'"></button>
                <button @click="openMcpEditor(server)" class="sto-minibtn">编辑</button>
                <button @click="deleteMcpPageServer(server)" class="sto-minibtn danger">删除</button>
              </div>
            </div>

            <div class="sto-cmd"><span x-text="mcpServerCommand(server)"></span></div>

            <div x-show="server.discovery_status === 'error'" class="sto-errbox" style="margin-top:9px;" x-text="server.discovery_error || 'MCP Server 未返回工具清单'"></div>

            <details x-show="server.instructions" class="sto-group" style="margin-top:9px;">
              <summary class="sto-group-head" style="padding:7px 11px;"><span style="font-size:11px; font-weight:600; color:var(--sto-fg-2);">Server 使用说明</span></summary>
              <p class="sto-muted" style="padding:0 11px 9px; white-space:pre-wrap;" x-text="server.instructions"></p>
            </details>

            <div style="margin-top:11px; padding-top:11px; border-top:1px solid var(--sto-line);">
              <div class="flex items-center" style="gap:8px; margin-bottom:8px;">
                <span class="sto-label">暴露工具</span>
                <span class="sto-muted sto-num" x-text="`${(server.tools || []).length} 个`"></span>
                <span style="flex:1;"></span>
                <input x-show="(server.tools || []).length > 5" x-model="server._toolQuery" class="sto-input" style="width:150px; padding:5px 10px; font-size:11px;" placeholder="搜索工具…">
              </div>
              <div class="sto-empty" x-show="(server.tools || []).length === 0 && server.discovery_status !== 'error'">尚未发现工具，点击"重新发现"。</div>
              <div x-show="(server.tools || []).length > 0" style="max-height:30rem; overflow-y:auto; border:1px solid var(--sto-line); border-radius:10px; background:var(--sto-panel);">
                <template x-for="tool in mcpFilteredTools(server)" :key="tool.id">
                  <details class="sto-toolrow">
                    <summary>
                      <span class="chev">▶</span>
                      <div style="flex:1; min-width:0;">
                        <div class="flex items-center" style="gap:7px;">
                          <span class="tname" x-text="tool.name"></span>
                          <span class="sto-muted" x-show="tool.title && tool.title !== tool.name" x-text="tool.title"></span>
                        </div>
                        <p class="tdesc" x-text="tool.description || 'Server 未提供功能说明'"></p>
                      </div>
                      <button @click.prevent.stop="toggleMcpTool(server, tool)" class="sto-toggle" :class="tool.enabled ? 'on' : ''" :title="tool.enabled ? '停用此工具' : '启用此工具'"></button>
                    </summary>
                    <div style="padding:2px 12px 12px 34px; display:flex; flex-direction:column; gap:10px;">
                      <div>
                        <p class="sto-label" style="margin-bottom:4px;">调用方式</p>
                        <code class="sto-usage" x-text="tool.usage || `${tool.name}()`"></code>
                      </div>
                      <div x-show="mcpToolParameters(tool).length > 0">
                        <p class="sto-label" style="margin-bottom:4px;">参数</p>
                        <div class="sto-params">
                          <template x-for="param in mcpToolParameters(tool)" :key="param.name">
                            <div>
                              <div class="flex items-center flex-wrap" style="gap:7px;">
                                <span class="tname" x-text="param.name"></span>
                                <span class="sto-badge" style="padding:1px 7px; font-size:9.5px;" :class="param.required ? 'warn' : 'neutral'" x-text="param.required ? '必填' : '可选'"></span>
                                <span class="sto-badge neutral" style="padding:1px 7px; font-size:9.5px;" x-text="param.type"></span>
                                <span x-show="param.hasDefault" class="sto-muted" x-text="`默认 ${JSON.stringify(param.defaultValue)}`"></span>
                              </div>
                              <p x-show="param.description" class="sto-muted" style="margin-top:3px;" x-text="param.description"></p>
                            </div>
                          </template>
                        </div>
                      </div>
                      <p class="sto-muted" x-show="mcpToolParameters(tool).length === 0">此工具无需参数，或 Server 未提供参数 Schema。</p>
                      <div x-show="mcpCapabilityRecord(tool)" x-cloak class="sto-group" style="padding:10px 12px;">
                        <div class="flex items-start justify-between" style="gap:10px;">
                          <div>
                            <p class="sto-label">Worker 可见性</p>
                            <p class="sto-desc" style="margin-top:2px;">此处只读；Server 会随已分配 Tool 自动加载。</p>
                          </div>
                          <button @click.prevent.stop="navigateToWorkerCapability('mcp_tool', tool.id)" class="sto-minibtn acc">前往 Worker 能力管理</button>
                        </div>
                        <div class="sto-grid2" style="grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:9px;">
                          <template x-for="phase in axiomPhases()" :key="`${tool.id}-readonly-${phase}`">
                            <span class="sto-phasechip" :class="phaseCapabilityAssigned(mcpCapabilityRecord(tool), phase) ? 'on' : 'off'" x-text="`${phaseCapabilityAssigned(mcpCapabilityRecord(tool), phase) ? '✓ ' : ''}${axiomPhaseLabel(phase)}`"></span>
                          </template>
                        </div>
                      </div>
                    </div>
                  </details>
                </template>
                <div class="sto-empty" style="border:0;" x-show="mcpFilteredTools(server).length === 0">没有匹配的工具。</div>
              </div>
            </div>
          </article>
        </template>
        <div x-show="(mcpServers || []).length === 0" class="sto-empty xl:col-span-2" style="padding:44px 0; font-size:13px;">还没有 MCP Server，先导入一份配置或点击右上角新增。</div>
      </div>
    </div>
  </main>

  <!-- 编辑弹窗 -->
  <div x-show="showMcpEditor" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showMcpEditor=false">
    <div class="sto" style="width:100%; max-width:560px;">
      <div class="sto-panel" style="padding:20px;" @click.stop>
        <div class="flex items-center justify-between" style="margin-bottom:16px;">
          <h3 style="font-size:14.5px; font-weight:650;" x-text="mcpServerEditor.id ? '编辑 MCP Server' : '新增 MCP Server'"></h3>
          <button @click="showMcpEditor=false" class="sto-ghost" style="padding:4px 10px;">×</button>
        </div>
        <div class="sto-grid2">
          <div class="sto-field"><label>名称</label><input x-model="mcpServerEditor.name" class="sto-input"></div>
          <div class="sto-field"><label>URL / SSE（与 command 二选一）</label><input x-model="mcpServerEditor.url" class="sto-input mono"></div>
        </div>
        <div class="sto-field" style="margin-top:12px;"><label>command（stdio）</label><input x-model="mcpServerEditor.command" class="sto-input mono"></div>
        <div class="sto-grid2" style="margin-top:12px;">
          <div class="sto-field"><label>args JSON</label><textarea x-model="mcpServerEditor.args" rows="5" class="sto-input"></textarea></div>
          <div class="sto-field"><label>env JSON</label><textarea x-model="mcpServerEditor.env" rows="5" class="sto-input"></textarea></div>
        </div>
        <label class="sto-item" style="border:0; padding:12px 0 0; border-radius:0;">
          <input type="checkbox" class="sto-check" x-model="mcpServerEditor.disabled">
          <span class="nm">停用此 Server</span>
        </label>
        <div class="sto-foot" style="margin-top:14px;">
          <button @click="showMcpEditor=false" class="sto-ghost">取消</button>
          <button @click="saveMcpEditor()" class="sto-btn">保存</button>
        </div>
      </div>
    </div>
  </div>
</div>
