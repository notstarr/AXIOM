<div x-show="activePage === 'mcp'" x-cloak class="flex-1 flex flex-col overflow-hidden">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800">MCP 管理</h2>
      <p class="text-xs text-slate-400 mt-0.5">Server 定义、工具权限和 Worker 绑定在这里统一管理；Worker 页面只保留模型本身。</p>
    </div>
    <div class="flex-1"></div>
    <button @click="loadMcpPage()" class="h-8 px-3 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50">刷新</button>
    <button @click="openMcpEditor()" class="h-8 px-3 rounded-lg bg-brand-500 text-white text-xs hover:bg-brand-600">新增 Server</button>
  </header>

  <main class="flex-1 overflow-y-auto p-5 space-y-5">
    <section class="rounded-2xl border border-slate-200 bg-white p-4">
      <div class="flex items-center justify-between gap-3 mb-3">
        <div><h3 class="text-sm font-semibold text-slate-800">导入配置</h3><p class="text-xs text-slate-400 mt-1">支持标准 mcpServers JSON/YAML、单 Server JSON，以及 Codex TOML。</p></div>
        <div class="flex items-center gap-2">
          <select x-model="mcpImportFormat" class="h-8 rounded-lg border border-slate-200 px-2 text-xs text-slate-600"><option value="auto">自动识别</option><option value="json">JSON</option><option value="yaml">YAML</option><option value="toml">TOML</option></select>
          <button @click="importMcpConfig()" :disabled="mcpImportBusy" class="h-8 px-3 rounded-lg bg-slate-800 text-white text-xs disabled:opacity-50" x-text="mcpImportBusy ? '导入中…' : '导入并保存'"></button>
        </div>
      </div>
      <textarea x-model="mcpImportContent" rows="7" class="w-full rounded-xl border border-slate-200 bg-slate-50/60 p-3 text-xs font-mono text-slate-700 outline-none focus:border-brand-400" placeholder='{"mcpServers":{"browser":{"command":"npx","args":["-y","..."],"env":{}}}}'></textarea>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3"><h3 class="text-sm font-semibold text-slate-800">已配置 Server <span class="text-xs font-normal text-slate-400" x-text="`(${(mcpServers || []).length})`"></span></h3><span class="text-xs text-slate-400">未绑定到 Worker 的 Server 不会注入执行环境</span></div>
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-3">
        <template x-for="server in (mcpServers || [])" :key="server.id">
          <article class="rounded-2xl border bg-white p-4" :class="server.disabled ? 'border-slate-200 opacity-65' : 'border-slate-200 hover:border-brand-200'">
            <div class="flex items-start gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <h4 class="text-sm font-semibold text-slate-800 truncate" x-text="server.name"></h4>
                  <span class="px-1.5 py-0.5 rounded bg-slate-100 text-[10px] text-slate-500" x-text="mcpTransportLabel(server)"></span>
                  <span class="px-1.5 py-0.5 rounded text-[10px]" :class="mcpDiscoveryClass(server)" x-text="mcpDiscoveryLabel(server)"></span>
                  <span x-show="server.disabled" class="px-1.5 py-0.5 rounded bg-amber-50 text-[10px] text-amber-600">已停用</span>
                </div>
                <p class="mt-1 text-xs font-mono text-slate-400 truncate" x-text="mcpServerCommand(server)"></p>
                <p x-show="server.server_info?.name || server.server_info?.version" class="mt-1 text-[10px] text-slate-400" x-text="[server.server_info?.name, server.server_info?.version].filter(Boolean).join(' · ')"></p>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button @click="discoverMcpTools(server)" :disabled="server._discovering" class="px-2 py-1 rounded-lg border border-brand-100 text-[11px] text-brand-600 disabled:opacity-50" x-text="server._discovering ? '发现中…' : '重新发现'"></button>
                <button @click="toggleMcpPageServer(server)" class="px-2 py-1 rounded-lg border border-slate-200 text-[11px] text-slate-500" x-text="server.disabled ? '启用' : '停用'"></button>
                <button @click="openMcpEditor(server)" class="px-2 py-1 rounded-lg border border-slate-200 text-[11px] text-slate-500">编辑</button>
                <button @click="deleteMcpPageServer(server)" class="px-2 py-1 rounded-lg border border-rose-100 text-[11px] text-rose-500">删除</button>
              </div>
            </div>

            <div x-show="server.discovery_status === 'error'" class="mt-3 rounded-lg border border-rose-100 bg-rose-50/70 px-3 py-2 text-[11px] text-rose-600 break-words" x-text="server.discovery_error || 'MCP Server 未返回工具清单'"></div>
            <details x-show="server.instructions" class="mt-3 rounded-lg border border-slate-100 bg-slate-50/60 px-3 py-2">
              <summary class="cursor-pointer text-[11px] font-medium text-slate-600">Server 使用说明</summary>
              <p class="mt-2 whitespace-pre-wrap text-[11px] leading-5 text-slate-500" x-text="server.instructions"></p>
            </details>

            <div class="mt-3 pt-3 border-t border-slate-100">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-xs font-medium text-slate-700">暴露工具</span>
                <span class="text-[10px] text-slate-400" x-text="`${(server.tools || []).length} 个`"></span>
                <div class="flex-1"></div>
                <input x-show="(server.tools || []).length > 5" x-model="server._toolQuery" class="h-7 w-40 rounded-lg border border-slate-200 px-2 text-[11px] outline-none focus:border-brand-300" placeholder="搜索工具…">
              </div>
              <div x-show="(server.tools || []).length === 0 && server.discovery_status !== 'error'" class="rounded-lg border border-dashed border-slate-200 py-7 text-center text-xs text-slate-400">尚未发现工具，点击“重新发现”。</div>
              <div x-show="(server.tools || []).length > 0" class="max-h-[30rem] overflow-y-auto rounded-xl border border-slate-200 divide-y divide-slate-100">
                <template x-for="tool in mcpFilteredTools(server)" :key="tool.id">
                  <details class="group bg-white open:bg-slate-50/50">
                    <summary class="list-none cursor-pointer px-3 py-2.5 flex items-start gap-2">
                      <span class="mt-0.5 text-[10px] text-slate-300 group-open:rotate-90 transition">▶</span>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                          <code class="text-[11px] font-semibold text-slate-700" x-text="tool.name"></code>
                          <span x-show="tool.title && tool.title !== tool.name" class="text-[10px] text-slate-400 truncate" x-text="tool.title"></span>
                        </div>
                        <p class="mt-0.5 text-[11px] text-slate-500 line-clamp-2" x-text="tool.description || 'Server 未提供功能说明'"></p>
                      </div>
                      <button @click.prevent.stop="toggleMcpTool(server, tool)" class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full" :class="tool.enabled ? 'bg-brand-500' : 'bg-slate-200'" :title="tool.enabled ? '停用此工具' : '启用此工具'"><span class="inline-block h-4 w-4 rounded-full bg-white shadow transition" :class="tool.enabled ? 'translate-x-4' : 'translate-x-0.5'"></span></button>
                    </summary>
                    <div class="px-8 pb-3 space-y-3">
                      <div><div class="text-[10px] font-medium text-slate-400 mb-1">调用方式</div><code class="block rounded-lg bg-slate-900 px-3 py-2 text-[11px] text-emerald-300 whitespace-pre-wrap break-all" x-text="tool.usage || `${tool.name}()`"></code></div>
                      <div x-show="mcpToolParameters(tool).length > 0">
                        <div class="text-[10px] font-medium text-slate-400 mb-1">参数</div>
                        <div class="rounded-lg border border-slate-200 divide-y divide-slate-100 bg-white">
                          <template x-for="param in mcpToolParameters(tool)" :key="param.name"><div class="px-2.5 py-2 text-[11px]"><div class="flex items-center gap-2"><code class="font-semibold text-slate-700" x-text="param.name"></code><span class="text-[10px]" :class="param.required ? 'text-rose-500' : 'text-slate-400'" x-text="param.required ? '必填' : '可选'"></span><code class="text-[10px] text-blue-500" x-text="param.type"></code><span x-show="param.hasDefault" class="text-[10px] text-slate-400" x-text="`默认 ${JSON.stringify(param.defaultValue)}`"></span></div><p x-show="param.description" class="mt-1 leading-5 text-slate-500" x-text="param.description"></p></div></template>
                        </div>
                      </div>
                      <p x-show="mcpToolParameters(tool).length === 0" class="text-[11px] text-slate-400">此工具无需参数，或 Server 未提供参数 Schema。</p>
                    </div>
                  </details>
                </template>
                <div x-show="mcpFilteredTools(server).length === 0" class="py-7 text-center text-xs text-slate-400">没有匹配的工具。</div>
              </div>
            </div>
          </article>
        </template>
        <div x-show="(mcpServers || []).length === 0" class="xl:col-span-2 rounded-2xl border border-dashed border-slate-200 bg-white py-12 text-center text-sm text-slate-400">还没有 MCP Server，先导入一份配置或点击右上角新增。</div>
      </div>
    </section>

    <section class="rounded-2xl border border-slate-200 bg-white p-4">
      <div class="flex items-center justify-between mb-3"><div><h3 class="text-sm font-semibold text-slate-800">Worker 绑定</h3><p class="text-xs text-slate-400 mt-1">这里管理“哪个 Worker 可以使用哪些 MCP”，不再把 MCP 配置揉进 Worker 设置表单。</p></div></div>
      <div class="space-y-3">
        <template x-for="worker in (mcpWorkers || [])" :key="worker.worker">
          <div class="rounded-xl border border-slate-200 p-3"><div class="flex items-center justify-between"><div><span class="text-sm font-medium text-slate-700" x-text="worker.worker"></span><span class="ml-2 text-[11px] text-slate-400" x-text="worker.worker_type"></span></div><button @click="toggleMcpWorker(worker)" class="relative inline-flex h-5 w-9 items-center rounded-full" :class="worker.enabled ? 'bg-brand-500' : 'bg-slate-200'"><span class="inline-block h-4 w-4 rounded-full bg-white shadow transition" :class="worker.enabled ? 'translate-x-4' : 'translate-x-0.5'"></span></button></div><div class="mt-3 flex flex-wrap gap-2"><template x-for="server in (mcpServers || [])" :key="server.id"><button @click="toggleMcpWorkerServer(worker, server)" class="px-2.5 py-1.5 rounded-lg border text-xs" :class="mcpWorkerHasServer(worker, server) ? 'border-brand-200 bg-brand-50 text-brand-700' : 'border-slate-200 bg-slate-50 text-slate-500'" x-text="server.name"></button></template></div><div class="mt-3"><div class="flex items-center justify-between mb-1"><span class="text-[11px] text-slate-500">工具白名单（可选）</span><button @click="saveMcpWorkerTools(worker)" class="text-[11px] text-brand-600">保存</button></div><input x-model="worker._toolsText" :value="(worker.allowed_tools || []).join(', ')" @focus="worker._toolsText = (worker.allowed_tools || []).join(', ')" class="w-full rounded-lg border border-slate-200 px-2.5 py-2 text-xs font-mono" placeholder="server:tool, server:tool；留空表示不额外收窄"></div></div>
        </template>
        <div x-show="(mcpWorkers || []).length === 0" class="text-xs text-slate-400 py-5 text-center">暂无可配置 Worker。</div>
      </div>
    </section>
  </main>

  <div x-show="showMcpEditor" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showMcpEditor=false"><div class="w-full max-w-xl rounded-2xl bg-white shadow-2xl p-5" @click.stop><div class="flex items-center justify-between mb-4"><h3 class="text-base font-semibold text-slate-800" x-text="mcpServerEditor.id ? '编辑 MCP Server' : '新增 MCP Server'"></h3><button @click="showMcpEditor=false" class="text-slate-400">×</button></div><div class="grid grid-cols-2 gap-3"><label class="text-xs text-slate-600">名称<input x-model="mcpServerEditor.name" class="mt-1 w-full rounded-lg border border-slate-200 px-2.5 py-2 text-sm"></label><label class="text-xs text-slate-600">URL / SSE（与 command 二选一）<input x-model="mcpServerEditor.url" class="mt-1 w-full rounded-lg border border-slate-200 px-2.5 py-2 text-sm font-mono"></label></div><label class="block mt-3 text-xs text-slate-600">command（stdio）<input x-model="mcpServerEditor.command" class="mt-1 w-full rounded-lg border border-slate-200 px-2.5 py-2 text-sm font-mono"></label><div class="grid grid-cols-2 gap-3 mt-3"><label class="text-xs text-slate-600">args JSON<textarea x-model="mcpServerEditor.args" rows="5" class="mt-1 w-full rounded-lg border border-slate-200 p-2 text-xs font-mono"></textarea></label><label class="text-xs text-slate-600">env JSON<textarea x-model="mcpServerEditor.env" rows="5" class="mt-1 w-full rounded-lg border border-slate-200 p-2 text-xs font-mono"></textarea></label></div><label class="flex items-center gap-2 mt-3 text-xs text-slate-600"><input type="checkbox" x-model="mcpServerEditor.disabled">停用此 Server</label><div class="mt-4 flex justify-end gap-2"><button @click="showMcpEditor=false" class="px-3 py-2 rounded-lg border border-slate-200 text-xs text-slate-600">取消</button><button @click="saveMcpEditor()" class="px-3 py-2 rounded-lg bg-brand-500 text-white text-xs">保存</button></div></div></div>
</div>
