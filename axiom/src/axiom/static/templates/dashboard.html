<!-- ═══════════ DASHBOARD PAGE ═══════════ -->
<div x-show="activePage === 'dashboard'" x-cloak class="sto flex-1 flex flex-col overflow-hidden min-w-0">
  <header class="app-page-header bg-white/80 backdrop-blur border-b border-slate-200/60 px-5 py-3 flex items-center gap-3 shrink-0">
    <div>
      <h2 class="text-base font-semibold text-slate-800 tracking-tight">AXIOM</h2>
      <p class="text-xs text-slate-400 mt-0.5">项目、任务、漏洞与 Token 总览</p>
    </div>
    <div class="flex-1"></div>
    <button @click="refreshCurrentPage()" :disabled="refreshLoading" class="h-8 px-3 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50 transition inline-flex items-center gap-1.5 disabled:opacity-40">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
      刷新
    </button>
  </header>
  <main class="flex-1 overflow-y-auto p-5 space-y-4">

    <!-- Logo + stat cards -->
    <section class="grid grid-cols-2 xl:grid-cols-5 gap-3">
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm flex items-center gap-4">
        <img src="/static/logo.jpg" alt="axiom" class="w-20 h-20 rounded-2xl object-cover shrink-0">
        <div>
          <h3 class="text-lg font-bold text-slate-800 tracking-tight">AXIOM</h3>
          <p class="text-xs text-slate-400">深度渗透测试平台</p>
        </div>
      </div>

      <!-- 项目总数 -->
      <button type="button" @click="navigateTo('projects')"
        class="text-left rounded-2xl border border-slate-200 var(--sto-panel) p-5 hover:shadow-md card-hover transition group">
        <div class="flex items-start justify-between">
          <div class="h-9 w-9 rounded-xl bg-blue-50 text-blue-500 inline-flex items-center justify-center shrink-0">
            <svg class="w-4.5 h-4.5 w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z"/><path d="m4 12 8 4.5 8-4.5"/><path d="m4 16.5 8 4.5 8-4.5"/>
            </svg>
          </div>
          <svg class="w-4 h-4 text-slate-300 group-hover:text-blue-400 transition mt-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
        <div class="mt-4 text-3xl font-semibold tracking-tight text-slate-800 tabular-nums" x-text="projectGroups.length"></div>
        <p class="mt-1 text-xs font-medium text-slate-400">项目</p>
        <p class="mt-1 text-[11px] text-slate-300" x-text="projectsLoaded ? `${projects.length} 个关联任务` : (projectsError ? '加载失败，请刷新' : '正在加载任务…')"></p>
      </button>

      <!-- 运行中任务 -->
      <button type="button" @click="navigateTo('tasks')"
        class="text-left rounded-2xl border border-slate-200 var(--sto-panel) p-5 hover:shadow-md card-hover transition group">
        <div class="flex items-start justify-between">
          <div class="h-9 w-9 rounded-xl bg-teal-50 text-teal-500 inline-flex items-center justify-center shrink-0">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4V8Z" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <svg class="w-4 h-4 text-slate-300 group-hover:text-teal-400 transition mt-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
        <div class="mt-4 text-3xl font-semibold tracking-tight text-slate-800 tabular-nums" x-text="projectsLoaded ? countProjectsByStatus('active') : '—'"></div>
        <p class="mt-1 text-xs font-medium text-slate-400">运行中任务</p>
        <p class="mt-1 text-[11px] text-slate-300" x-text="projectsLoaded ? `已暂停 ${countProjectsByStatus('stopped')} · 已完成 ${countProjectsByStatus('completed')}` : (projectsError ? '加载失败，请刷新' : '正在加载…')"></p>
      </button>

      <!-- 漏洞总数 -->
      <button type="button" @click="navigateTo('vulnerabilities')"
        class="text-left rounded-2xl border border-slate-200 var(--sto-panel) p-5 hover:shadow-md card-hover transition group">
        <div class="flex items-start justify-between">
          <div class="h-9 w-9 rounded-xl bg-rose-50 text-rose-500 inline-flex items-center justify-center shrink-0">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M12 3 4.5 6v5.5c0 4.2 2.7 7.9 7.5 9.5 4.8-1.6 7.5-5.3 7.5-9.5V6L12 3Z"/>
              <path d="M12 8v5m0 3h.01"/>
            </svg>
          </div>
          <svg class="w-4 h-4 text-slate-300 group-hover:text-rose-400 transition mt-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
        <div class="mt-4 text-3xl font-semibold tracking-tight text-slate-800 tabular-nums" x-text="projectDetailsLoaded ? dashboardStats().vulnTotal : '—'"></div>
        <p class="mt-1 text-xs font-medium text-slate-400">漏洞</p>
        <p class="mt-1 text-[11px]"
          :class="dashboardStats().criticalVulns > 0 ? 'text-rose-400' : 'text-slate-300'"
          x-text="projectDetailsLoaded ? `严重 ${dashboardStats().criticalVulns} · 高危 ${dashboardStats().highVulns}` : (projectDetailsError ? '加载失败，请刷新' : '正在加载…')"></p>
      </button>

      <!-- Token 累计 -->
      <div class="text-left rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex items-start justify-between">
          <div class="h-9 w-9 rounded-xl bg-violet-50 text-violet-500 inline-flex items-center justify-center shrink-0">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h10"/>
            </svg>
          </div>
        </div>
        <div class="mt-4 text-3xl font-semibold tracking-tight text-slate-800 tabular-nums" x-text="projectDetailsLoaded && dashboardStats().tokenTotal > 0 ? dashboardStats().tokenTotal.toLocaleString() : '—'"></div>
        <p class="mt-1 text-xs font-medium text-slate-400">Token 消耗</p>
        <p class="mt-1 text-[11px] text-slate-300" x-show="projectDetailsLoaded && dashboardStats().tokenTotal > 0" x-text="`输入 ${dashboardStats().tokenInput.toLocaleString()} · 输出 ${dashboardStats().tokenOutput.toLocaleString()}`"></p>
        <p class="mt-1 text-[11px] text-slate-300" x-show="!projectDetailsLoaded" x-text="projectDetailsError ? '加载失败，请刷新' : '正在加载…'"></p>
        <p class="mt-1 text-[11px] text-slate-300" x-show="projectDetailsLoaded && dashboardStats().tokenTotal === 0">等待任务执行后统计</p>
      </div>

    </section>

    <!-- 下方：任务状态分布 + 最近事件 -->
    <section class="grid grid-cols-1 xl:grid-cols-3 gap-3">

      <!-- 任务状态分布 (2/3 width) -->
      <div class="xl:col-span-2 sto-panel overflow-hidden">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-slate-700">任务状态分布</h3>
          <button @click="navigateTo('tasks')" class="text-xs text-brand-500 hover:text-brand-600 transition inline-flex items-center gap-1">
            查看全部
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="p-4 grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="rounded-xl bg-slate-50 p-4 flex flex-col gap-1">
            <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">全部</p>
            <p class="text-2xl font-semibold text-slate-700 tabular-nums" x-text="projectsLoaded ? projects.length : '—'"></p>
          </div>
          <div class="rounded-xl p-4 flex flex-col gap-1" style="background:rgba(48,176,199,0.07)">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-teal-400 shrink-0"></span>
              <p class="text-[11px] font-medium text-teal-600 uppercase tracking-wide">运行中</p>
            </div>
            <p class="text-2xl font-semibold text-teal-700 tabular-nums" x-text="projectsLoaded ? countProjectsByStatus('active') : '—'"></p>
          </div>
          <div class="rounded-xl p-4 flex flex-col gap-1" style="background:rgba(255,159,10,0.07)">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
              <p class="text-[11px] font-medium text-amber-600 uppercase tracking-wide">已暂停</p>
            </div>
            <p class="text-2xl font-semibold text-amber-700 tabular-nums" x-text="projectsLoaded ? countProjectsByStatus('stopped') : '—'"></p>
          </div>
          <div class="rounded-xl bg-slate-50 p-4 flex flex-col gap-1">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-slate-400 shrink-0"></span>
              <p class="text-[11px] font-medium text-slate-500 uppercase tracking-wide">已完成</p>
            </div>
            <p class="text-2xl font-semibold text-slate-600 tabular-nums" x-text="projectsLoaded ? countProjectsByStatus('completed') : '—'"></p>
          </div>
        </div>
        <!-- Progress bar -->
        <div class="px-4 pb-4">
          <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden flex">
            <div class="h-full bg-teal-400 transition-all duration-500"
              :style="`width:${projects.length ? countProjectsByStatus('active') / projects.length * 100 : 0}%`"></div>
            <div class="h-full bg-amber-400 transition-all duration-500"
              :style="`width:${projects.length ? countProjectsByStatus('stopped') / projects.length * 100 : 0}%`"></div>
            <div class="h-full bg-slate-300 transition-all duration-500"
              :style="`width:${projects.length ? countProjectsByStatus('completed') / projects.length * 100 : 0}%`"></div>
          </div>
        </div>
      </div>

      <!-- 最近事件 (1/3 width) -->
      <div class="sto-panel overflow-hidden flex flex-col">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between shrink-0">
          <h3 class="text-sm font-semibold text-slate-700">最近事件</h3>
          <span class="text-[10px] text-slate-300 tabular-nums" x-text="recentGlobalEvents().length > 0 ? `${recentGlobalEvents().length} 条` : ''"></span>
        </div>
        <div class="flex-1 overflow-y-auto p-3 space-y-2" style="max-height:220px">
          <template x-if="recentGlobalEvents().length === 0">
          <div x-show="!projectDetailsLoaded" class="flex items-center justify-center h-24 text-sm text-slate-300" x-text="projectDetailsError ? '加载失败，请刷新' : '正在加载事件…'"></div>
          <div x-show="projectDetailsLoaded && recentGlobalEvents().length === 0" class="flex items-center justify-center h-24 text-sm text-slate-300">暂无事件</div>
          </template>
           <template x-for="event in recentGlobalEvents()" :key="`${event.project_id}-${event.id}`">
             <div class="sto-chip" style="align-items:flex-start;">
               <div class="flex items-center gap-2 mb-1">
                 <span class="text-[11px] font-medium text-slate-500 font-mono tabular-nums shrink-0 truncate" x-text="event.project_id"></span>
                 <span class="flex-1"></span>
                 <span class="text-[10px] text-slate-400 shrink-0 tabular-nums" x-text="formatTime(event.created_at)"></span>
               </div>
                <p class="text-[11px] text-slate-500 leading-relaxed break-words" x-text="event.message"></p>
           </div>
         </template>
      </div>
      </div>

    </section>

    <!-- LLM Token 消耗 -->
    <section class="token-usage-panel sto-panel overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2 min-w-0">
          <span class="token-usage-icon inline-flex h-8 w-8 items-center justify-center rounded-xl">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
          </span>
          <div>
            <h3 class="text-sm font-semibold text-slate-700">LLM Token 消耗</h3>
            <p class="text-[11px] text-slate-400" x-text="`${dashboardTokenTaskCount()} 个任务 · ${dashboardTokenSummary().calls || 0} 次用量记录`"></p>
          </div>
        </div>
        <div class="flex-1"></div>
        <label class="token-filter-select inline-flex items-center gap-1.5 text-[11px] text-slate-400">
          <span>模型</span>
          <select class="rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-xs text-slate-600 focus:outline-none" :value="dashboardTokenModel" @change="setDashboardTokenModel($event.target.value)">
            <option value="all">全部模型</option>
            <template x-for="model in (dashboardSummary?.available_models || [])" :key="`dashboard-model-${model.key}`">
              <option :value="model.key" x-text="model.key"></option>
            </template>
          </select>
        </label>
        <div class="token-range-switch inline-flex items-center gap-0.5 rounded-xl border border-slate-200 p-0.5">
          <template x-for="option in tokenRangeOptions()" :key="`dashboard-range-${option.value}`">
            <button type="button" @click="setDashboardTokenRange(option.value)" class="rounded-lg px-2.5 py-1.5 text-[11px] font-medium transition" :class="dashboardTokenRange === option.value ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50'" x-text="option.label"></button>
          </template>
        </div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-[260px_minmax(0,1fr)] gap-0">
        <aside class="token-usage-summary border-b xl:border-b-0 xl:border-r border-slate-100 p-5 space-y-4">
          <div>
            <p class="text-[11px] text-slate-400">总 Token</p>
            <p class="mt-1 text-3xl font-semibold tracking-tight text-slate-800 tabular-nums" x-text="formatTokenCount(dashboardTokenSummary().total)"></p>
          </div>
          <div class="token-metric-row">
            <div class="flex items-center justify-between gap-2"><span class="text-xs text-slate-500">输入（未命中）</span><strong class="text-xs tabular-nums token-fg-input" x-text="formatTokenCount(dashboardTokenSummary().input_uncached ?? dashboardTokenSummary().input)"></strong></div>
            <div class="token-metric-track"><span class="token-metric-fill token-fill-input" :style="`width:${dashboardTokenSummary().total ? (((dashboardTokenSummary().input_uncached ?? dashboardTokenSummary().input) || 0) / dashboardTokenSummary().total * 100) : 0}%`"></span></div>
          </div>
          <div class="token-metric-row">
            <div class="flex items-center justify-between gap-2"><span class="text-xs text-slate-500">缓存命中</span><strong class="text-xs tabular-nums token-fg-cache" x-text="formatTokenCount(dashboardTokenSummary().cache_read)"></strong></div>
            <div class="token-metric-track"><span class="token-metric-fill token-fill-cache" :style="`width:${dashboardTokenSummary().total ? ((dashboardTokenSummary().cache_read || 0) / dashboardTokenSummary().total * 100) : 0}%`"></span></div>
          </div>
          <div class="token-metric-row">
            <div class="flex items-center justify-between gap-2"><span class="text-xs text-slate-500">缓存写入</span><strong class="text-xs tabular-nums token-fg-cache-write" x-text="formatTokenCount(dashboardTokenSummary().cache_write)"></strong></div>
            <div class="token-metric-track"><span class="token-metric-fill token-fill-cache-write" :style="`width:${dashboardTokenSummary().total ? ((dashboardTokenSummary().cache_write || 0) / dashboardTokenSummary().total * 100) : 0}%`"></span></div>
          </div>
          <div class="token-metric-row">
            <div class="flex items-center justify-between gap-2"><span class="text-xs text-slate-500">输出</span><strong class="text-xs tabular-nums token-fg-output" x-text="formatTokenCount(dashboardTokenSummary().output)"></strong></div>
            <div class="token-metric-track"><span class="token-metric-fill token-fill-output" :style="`width:${dashboardTokenSummary().total ? ((dashboardTokenSummary().output || 0) / dashboardTokenSummary().total * 100) : 0}%`"></span></div>
          </div>
          <div class="token-hit-rate rounded-xl border border-slate-200 px-3 py-2.5 flex items-center justify-between gap-2">
            <span class="text-xs text-slate-500">缓存命中率</span>
            <strong class="text-sm tabular-nums token-fg-cache" x-text="tokenCacheHitRateLabel(dashboardTokenSummary().cache_hit_rate)"></strong>
          </div>
        </aside>

        <div class="token-chart-panel p-5 min-w-0">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-3 text-[11px] text-slate-500">
            <span class="inline-flex items-center gap-1.5"><i class="token-legend-dot token-fill-input"></i>输入（未命中）</span>
            <span class="inline-flex items-center gap-1.5"><i class="token-legend-dot token-fill-cache"></i>缓存命中</span>
            <span class="inline-flex items-center gap-1.5"><i class="token-legend-dot token-fill-cache-write"></i>缓存写入</span>
            <span class="inline-flex items-center gap-1.5"><i class="token-legend-dot token-fill-output"></i>输出</span>
          </div>
          <template x-if="tokenChartRows().length === 0">
            <div class="token-chart-empty h-56 flex items-center justify-center text-sm text-slate-400">当前范围暂无 Token 记录</div>
          </template>
          <div x-show="tokenChartRows().length > 0" class="token-chart-scroll overflow-x-auto">
            <div class="token-chart" :style="`min-width:${tokenChartMinWidth()}px`">
              <div class="token-chart-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
              <div class="token-chart-columns">
                <template x-for="row in tokenChartRows()" :key="`token-bar-${row.bucket}`">
                  <div class="token-chart-column" @mouseenter="dashboardTokenHover = row.bucket" @mouseleave="dashboardTokenHover = null">
                    <div x-show="dashboardTokenHover === row.bucket" class="token-chart-tooltip">
                      <p class="font-semibold text-slate-800" x-text="row.bucket"></p>
                      <p><span>输入</span><b x-text="formatTokenCount(row.input)"></b></p>
                      <p><span>缓存读</span><b x-text="formatTokenCount(row.cacheRead)"></b></p>
                      <p><span>缓存写</span><b x-text="formatTokenCount(row.cacheWrite)"></b></p>
                      <p><span>输出</span><b x-text="formatTokenCount(row.output)"></b></p>
                      <p class="border-t border-slate-100 pt-1 mt-1"><span>合计</span><b x-text="formatTokenCount(row.total)"></b></p>
                    </div>
                    <div class="token-chart-bar-area">
                      <div class="token-chart-bar" :style="`height:${row.heightPct}%`">
                        <template x-for="segment in row.segments" :key="`${row.bucket}-${segment.key}`">
                          <span :class="`token-segment token-segment-${segment.key}`" :style="`height:${segment.pct}%`"></span>
                        </template>
                      </div>
                    </div>
                    <span class="token-chart-label" x-show="tokenChartLabelVisible(row.index, tokenChartRows().length)" x-text="tokenChartBucketLabel(row.bucket)"></span>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div x-show="dashboardTokenSummary().complete === false || dashboardTokenSummary().incomplete_sources > 0" class="mx-5 mb-4 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">
        当前统计存在 <span class="font-semibold" x-text="dashboardTokenSummary().incomplete_sources || 0"></span> 个不完整 Session 来源；系统没有估算缺失 Token。
      </div>

      <div class="border-t border-slate-100">
        <div class="px-5 py-3.5 flex items-center justify-between gap-3">
          <div><h4 class="text-sm font-semibold text-slate-700">按任务明细</h4><p class="text-[11px] text-slate-400">包含任务全生命周期中可恢复的 Session 用量</p></div>
          <span class="text-[10px] text-slate-400" x-text="`${dashboardTokenTaskCount()} 个任务`"></span>
        </div>
        <div class="overflow-x-auto">
          <template x-if="tokenByProject().length === 0">
            <div class="px-5 py-8 text-center text-sm text-slate-400">暂无 Token 记录 — 等待任务执行后自动统计</div>
          </template>
          <table x-show="tokenByProject().length > 0" class="w-full text-[12px]">
            <thead><tr class="border-b border-slate-100">
              <th class="px-5 py-2.5 text-left text-[11px] font-semibold text-slate-400">任务</th>
              <th class="px-3 py-2.5 text-right text-[11px] font-semibold text-slate-400">输入</th>
              <th class="px-3 py-2.5 text-right text-[11px] font-semibold text-slate-400">缓存读</th>
              <th class="px-3 py-2.5 text-right text-[11px] font-semibold text-slate-400">缓存写</th>
              <th class="px-3 py-2.5 text-right text-[11px] font-semibold text-slate-400">输出</th>
              <th class="px-3 py-2.5 text-right text-[11px] font-semibold text-slate-400">命中率</th>
              <th class="px-3 py-2.5 text-right text-[11px] font-semibold text-slate-400">任务占比</th>
              <th class="px-5 py-2.5 text-right text-[11px] font-semibold text-slate-400">合计</th>
            </tr></thead>
            <tbody>
              <template x-for="row in tokenByProject()" :key="row.id">
                <tr class="border-b border-slate-50 hover:bg-slate-50/60 transition cursor-pointer" @click="openProject(row.id)">
                  <td class="px-5 py-3"><div class="flex items-center gap-2"><span class="font-mono text-slate-400 text-[10px] shrink-0" x-text="row.id"></span><span class="text-slate-700 font-medium truncate max-w-[200px]" x-text="row.title"></span><span class="px-1.5 py-0.5 rounded text-[9px] font-semibold shrink-0" :class="row.status === 'active' ? 'bg-teal-50 text-teal-600' : row.status === 'completed' ? 'bg-slate-100 text-slate-500' : 'bg-amber-50 text-amber-600'" x-text="row.status === 'active' ? '运行中' : row.status === 'completed' ? '已完成' : '已暂停'"></span><span x-show="!row.complete" class="text-[10px] text-amber-600">数据不完整</span></div></td>
                  <td class="px-3 py-3 text-right tabular-nums text-slate-500" x-text="formatTokenCount(row.input)"></td>
                  <td class="px-3 py-3 text-right tabular-nums token-fg-cache" x-text="formatTokenCount(row.cacheRead)"></td>
                  <td class="px-3 py-3 text-right tabular-nums token-fg-cache-write" x-text="formatTokenCount(row.cacheWrite)"></td>
                  <td class="px-3 py-3 text-right tabular-nums token-fg-output" x-text="formatTokenCount(row.output)"></td>
                  <td class="px-3 py-3 text-right tabular-nums text-slate-500" x-text="tokenCacheHitRateLabel(row.cacheHitRate)"></td>
                  <td class="px-3 py-3">
                    <div class="flex items-center justify-end gap-2">
                      <div class="token-metric-track w-16"><span class="token-metric-fill token-fill-input" :style="`width:${row.pct}%`"></span></div>
                      <span class="w-8 text-right text-[10px] tabular-nums text-slate-400" x-text="`${row.pct}%`"></span>
                    </div>
                  </td>
                  <td class="px-5 py-3 text-right tabular-nums font-semibold text-slate-700" x-text="formatTokenCount(row.total)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>
</div>
