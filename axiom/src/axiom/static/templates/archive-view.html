<template x-if="activePage === 'task-detail' && view === 'archive' && project">
<div class="h-full min-h-0 flex flex-col overflow-hidden min-w-0 bg-slate-50/40">
  <header class="app-page-header shrink-0 bg-white/90 backdrop-blur border-b border-slate-200/70">
    <div class="task-detail-toolbar">
      <button @click="backToList()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 transition shrink-0" aria-label="返回任务列表">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="task-detail-title min-w-0">
        <div class="flex items-center gap-2 min-w-0">
          <h2 class="text-base font-semibold text-slate-800 truncate" x-text="project?.project?.title"></h2>
          <span class="text-[11px] font-mono text-slate-400 shrink-0" x-text="project?.project?.id"></span>
          <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold shrink-0" :class="projectStatusBadgeClass(project.project.status)" x-text="projectStatusLabel(project.project.status)"></span>
          <span x-show="project?.project?.archived" class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold bg-slate-200 text-slate-600 shrink-0">已归档</span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5 truncate" x-text="project?.project?.origin"></p>
      </div>
      <div class="task-view-switcher" role="group" aria-label="任务视图">
        <button type="button" @click="switchTaskView('human')" :class="view === 'human' ? 'is-active' : ''" :aria-pressed="view === 'human'">概览</button>
        <button type="button" @click="switchTaskView('graph')" :class="view === 'graph' ? 'is-active' : ''" :aria-pressed="view === 'graph'">图谱</button>
        <button type="button" @click="switchTaskView('archive')" :class="view === 'archive' ? 'is-active' : ''" :aria-pressed="view === 'archive'">归档</button>
      </div>
      <div class="task-detail-spacer flex-1"></div>
      <div class="task-detail-actions flex items-center gap-2">
        <span x-show="taskRunWindowLabel(project?.project)" class="hidden md:inline-flex flex-col rounded-lg border px-2.5 py-1 leading-tight"
          :class="taskRunWindowClass(project?.project)">
          <span class="text-[10px] font-semibold tabular-nums" x-text="taskRunWindowLabel(project?.project)"></span>
          <span class="text-[9px] opacity-75" x-text="taskRunDeadlineLabel(project?.project)"></span>
        </span>
        <span class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200 text-[11px] text-slate-500">
          <span class="h-1.5 w-1.5 rounded-full" :class="project?.project?.status === 'active' ? 'bg-emerald-400' : project?.project?.status === 'completed' ? 'bg-slate-400' : 'bg-amber-400'"></span>
          <span x-text="humanGoalStatusLabel()"></span>
        </span>
        <button x-show="!project?.project?.archived && !project?.project?.legacy_readonly && ['active', 'stopped'].includes(project?.project?.status)"
          @click="toggleProjectStopById(project.project.id, project.project.status)"
          class="px-2.5 py-1 rounded-lg border text-xs transition shrink-0"
          :class="project.project.status === 'active' ? 'border-amber-200 text-amber-600 hover:bg-amber-50' : 'border-teal-200 text-teal-600 hover:bg-teal-50'"
          x-text="project.project.status === 'active' ? '暂停' : '继续'"></button>
        <button x-show="project?.project?.status === 'completed' && !project?.project?.archived && !project?.project?.legacy_readonly" @click="openTaskContinuation(project.project)" class="px-2.5 py-1 rounded-lg border border-amber-300 bg-amber-50 text-xs font-medium text-amber-800 hover:bg-amber-100 transition shrink-0">继续任务</button>
        <button x-show="!project?.project?.archived && !project?.project?.legacy_readonly" @click="archiveProjectById(project.project.id, project.project.title)" :disabled="project.project.status === 'active'" :title="project.project.status === 'active' ? '请先暂停任务' : '保留历史并停止后续 Worker 调度'" class="px-2.5 py-1 rounded-lg border border-slate-300 text-xs text-slate-600 hover:bg-slate-50 transition disabled:cursor-not-allowed disabled:opacity-40 shrink-0">归档任务</button>
        <button x-show="project?.project?.archived && !project?.project?.legacy_readonly" @click="unarchiveProjectById(project.project.id, project.project.title)" class="px-2.5 py-1 rounded-lg border border-emerald-200 text-xs text-emerald-700 hover:bg-emerald-50 transition shrink-0">恢复任务</button>
        <button x-show="project?.project?.archived && !project?.project?.legacy_readonly" @click="deleteProjectById(project.project.id, project.project.title)" class="px-2.5 py-1 rounded-lg border border-rose-200 text-xs text-rose-600 hover:bg-rose-50 transition shrink-0">永久删除</button>
        <button @click="loadArchives(selectedArchiveId)" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 transition shrink-0">刷新</button>
      </div>
    </div>
  </header>

  <div x-show="project?.project?.archived" class="flex-1 min-h-0 flex items-center justify-center p-6 bg-slate-50/40">
    <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
      <div class="mx-auto h-12 w-12 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center text-xl">▣</div>
      <h3 class="mt-4 text-base font-semibold text-slate-800">任务已归档</h3>
      <p class="mt-2 text-sm leading-6 text-slate-500">归档任务的历史产物不会在当前页面披露。恢复任务后才能查看对应的归档记录和文件。</p>
      <div class="mt-5 flex items-center justify-center gap-2">
        <button @click="unarchiveProjectById(project.project.id, project.project.title)" class="px-4 py-2 rounded-xl bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 transition">恢复任务并查看</button>
        <button @click="deleteProjectById(project.project.id, project.project.title)" class="px-4 py-2 rounded-xl border border-rose-200 text-sm font-medium text-rose-600 hover:bg-rose-50 transition">永久删除</button>
      </div>
    </section>
  </div>

  <div x-show="!project?.project?.archived" class="flex-1 min-h-0 grid grid-cols-[340px_minmax(0,1fr)]">
    <aside class="min-h-0 border-r border-slate-200 bg-white flex flex-col">
      <div class="p-3 border-b border-slate-100 flex items-center gap-2">
        <button @click="archiveStatusFilter='active'; changeArchiveStatusFilter()" class="flex-1 px-3 py-1.5 rounded-lg text-xs border" :class="archiveStatusFilter === 'active' ? 'border-amber-200 bg-amber-50 text-amber-700' : 'border-slate-200 text-slate-500'">当前归档</button>
        <button @click="archiveStatusFilter='restored'; changeArchiveStatusFilter()" class="flex-1 px-3 py-1.5 rounded-lg text-xs border" :class="archiveStatusFilter === 'restored' ? 'border-slate-300 bg-slate-100 text-slate-700' : 'border-slate-200 text-slate-500'">恢复历史</button>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto divide-y divide-slate-100">
        <template x-for="batch in archives" :key="batch.id">
          <button @click="selectArchive(batch.id)" class="w-full text-left px-4 py-3 transition" :class="selectedArchiveId === batch.id ? 'bg-amber-50/70' : 'hover:bg-slate-50'">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-mono font-semibold text-slate-700" x-text="batch.id"></span>
              <span class="px-1.5 py-0.5 rounded text-[9px]" :class="batch.status === 'active' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'" x-text="batch.status === 'active' ? '已归档' : '已恢复'"></span>
            </div>
            <p class="mt-1.5 text-xs text-slate-600 truncate" x-text="`${archiveEntityLabel(batch.root_type)} ${batch.root_id}`"></p>
            <p class="mt-1 text-[10px] text-slate-400 line-clamp-2" x-text="batch.reason || '未填写归档原因'"></p>
            <div class="mt-2 flex items-center justify-between text-[9px] text-slate-400"><span x-text="`${batch.members.length} 项`"></span><span x-text="formatTime(batch.created_at)"></span></div>
          </button>
        </template>
        <p x-show="!archiveLoading && archives.length === 0" class="px-5 py-12 text-center text-xs text-slate-400">当前没有归档批次。</p>
        <p x-show="archiveLoading" class="px-5 py-12 text-center text-xs text-slate-400">正在加载归档记录…</p>
      </div>
    </aside>

    <main class="min-h-0 overflow-y-auto p-5">
      <template x-if="selectedArchive">
        <div class="max-w-[1200px] mx-auto space-y-4">
          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm p-5">
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="flex items-center gap-2"><span class="text-sm font-mono font-semibold text-slate-800" x-text="selectedArchive.id"></span><span class="text-[10px] text-slate-400" x-text="`${archiveEntityLabel(selectedArchive.root_type)} ${selectedArchive.root_id}`"></span></div>
                <p class="mt-2 text-sm text-slate-600" x-text="selectedArchive.reason || '未填写归档原因'"></p>
                <p class="mt-2 text-[10px] text-slate-400" x-text="`${selectedArchive.actor} · ${formatTime(selectedArchive.created_at)}`"></p>
              </div>
              <div x-show="selectedArchive.status === 'active'" class="text-right">
                <button @click="restoreArchive(selectedArchive)" class="px-3 py-2 rounded-xl border border-emerald-200 text-xs text-emerald-700 hover:bg-emerald-50">恢复此批次</button>
                <p class="mt-1.5 text-[9px] text-slate-400" x-text="`将恢复 ${selectedArchive.restored_count || 0} 项，${selectedArchive.retained_archived_count || 0} 项仍保持归档`"></p>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-2 md:grid-cols-5 gap-2">
              <template x-for="type in ['fact','intent','todo','vulnerability','artifact']" :key="type">
                <div class="rounded-xl bg-slate-50 border border-slate-100 p-3"><div class="text-lg font-semibold text-slate-700" x-text="selectedArchive.counts[type] || 0"></div><div class="text-[10px] text-slate-400" x-text="archiveEntityLabel(type)"></div></div>
              </template>
            </div>
          </section>

          <template x-for="type in ['fact','intent','todo','vulnerability','artifact']" :key="`archive-group-${type}`">
            <section x-show="archiveMembers(type).length" class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
              <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between"><h3 class="text-sm font-semibold text-slate-700" x-text="archiveEntityLabel(type)"></h3><span class="text-xs text-slate-400" x-text="`${archiveMembers(type).length} 项`"></span></div>
              <div class="divide-y divide-slate-100">
                <template x-for="member in archiveMembers(type)" :key="`${member.entity_type}-${member.entity_id}`">
                  <div class="px-5 py-3 flex items-start gap-3">
                    <span class="mt-0.5 px-1.5 py-0.5 rounded bg-slate-100 text-[9px] font-mono text-slate-500" x-text="member.entity_id"></span>
                    <div class="min-w-0 flex-1"><p class="text-xs text-slate-700 whitespace-pre-wrap break-words" x-text="member.title || '无摘要'"></p><div class="mt-1 flex gap-2 text-[9px] text-slate-400"><span x-text="archiveRelationLabel(member.relation)"></span><span x-show="member.status" x-text="member.status"></span></div></div>
                    <template x-if="member.entity_type === 'artifact'">
                      <div class="flex items-center gap-1"><button @click="previewArchivedArtifact(member)" class="px-2 py-1 rounded border border-slate-200 text-[10px] text-slate-500 hover:bg-slate-50">预览</button><a :href="archivedArtifactDownloadUrl(member)" download class="px-2 py-1 rounded border border-slate-200 text-[10px] text-slate-500 hover:bg-slate-50">下载</a></div>
                    </template>
                  </div>
                </template>
              </div>
            </section>
          </template>
        </div>
      </template>
      <p x-show="!selectedArchive && !archiveLoading" class="py-20 text-center text-sm text-slate-400">请选择一个归档批次。</p>
    </main>
  </div>
</div>
</template>
