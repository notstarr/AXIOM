<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>axiom</title>
<link rel="icon" href="/static/logo.jpg?v=20260807-manual-reason-v1" type="image/jpeg">
<link rel="stylesheet" href="/static/apple.css?v=20260807-manual-reason-v1">
<link rel="stylesheet" href="/static/tailwind.generated.css?v=20260807-manual-reason-v1">
<script defer src="/static/vendor/alpine.min.js?v=20260807-manual-reason-v1"></script>
<link rel="stylesheet" href="/static/custom.css?v=20260902-ux-v52">
</head>
<body class="h-screen overflow-hidden" :class="{ 'select-none cursor-col-resize': isResizingPanel }" x-data="axiomApp()" style="background:var(--bg-secondary);color:var(--text-primary)">

<!-- ═══════════ AUTH GATE (登录拦截) ═══════════ -->
<template x-if="authLoading">
  <div class="fixed inset-0 z-[100] flex items-center justify-center" style="background:var(--bg-secondary)">
    <div class="flex flex-col items-center gap-3">
      <div class="w-10 h-10 rounded-xl border-2 border-slate-300 border-t-sky-500 animate-spin"></div>
      <p class="text-xs text-slate-400">正在验证登录状态…</p>
    </div>
  </div>
</template>
<template x-if="!authLoading && !isAuthenticated">
  <div class="fixed inset-0 z-[90] flex items-center justify-center p-4" style="background:
    radial-gradient(1200px 600px at 15% 10%, rgba(56,189,248,0.16), transparent 60%),
    radial-gradient(1000px 500px at 85% 85%, rgba(99,102,241,0.16), transparent 55%),
    var(--bg-secondary)">
    <div class="w-full max-w-md">
      <div class="rounded-3xl border border-white/40 shadow-2xl backdrop-blur-2xl p-8 sm:p-10"
           style="background:var(--surface-modal, rgba(255,255,255,0.72)); border-color:var(--border-default, rgba(226,232,240,0.8)); box-shadow: 0 24px 64px -12px rgba(15,23,42,0.25), inset 0 1px 0 rgba(255,255,255,0.6)">
        <div class="flex flex-col items-center text-center">
          <div class="w-14 h-14 rounded-2xl overflow-hidden shadow-lg ring-1 ring-slate-900/5"><img src="/static/logo.jpg?v=20260807-manual-reason-v1" alt="axiom" class="w-full h-full object-cover"></div>
          <h1 class="mt-4 text-xl font-bold tracking-tight" style="color:var(--text-primary, #0f172a)">AXIOM 控制台</h1>
          <p class="mt-1 text-xs" style="color:var(--text-tertiary, #64748b)">安全测试编排平台 · 请登录后继续</p>
        </div>
        <form class="mt-8 space-y-4" @submit.prevent="performLogin()">
          <div>
            <label class="block text-[11px] font-medium mb-1.5" style="color:var(--text-tertiary, #64748b)">用户名</label>
            <input x-model="loginForm.username" type="text" autocomplete="username" required
              class="w-full px-4 py-2.5 rounded-xl text-sm outline-none transition"
              style="background:var(--surface-inset, rgba(255,255,255,0.8)); border:1px solid var(--border-default, #e2e8f0); color:var(--text-primary, #0f172a)"
              placeholder="admin 用户名">
          </div>
          <div>
            <label class="block text-[11px] font-medium mb-1.5" style="color:var(--text-tertiary, #64748b)">密码</label>
            <input x-model="loginForm.password" type="password" autocomplete="current-password" required
              class="w-full px-4 py-2.5 rounded-xl text-sm outline-none transition"
              style="background:var(--surface-inset, rgba(255,255,255,0.8)); border:1px solid var(--border-default, #e2e8f0); color:var(--text-primary, #0f172a)"
              placeholder="管理员密码">
          </div>
          <label class="flex items-center gap-2 text-xs cursor-pointer select-none" style="color:var(--text-tertiary, #64748b)">
            <input x-model="loginForm.remember" type="checkbox" class="rounded border-slate-300 accent-sky-500">
            保持登录（7 天免登录）
          </label>
          <p x-show="loginForm.error" x-cloak x-text="loginForm.error" class="text-xs text-rose-500 font-medium"></p>
          <button type="submit" :disabled="loginForm.loading"
            class="w-full py-2.5 rounded-xl text-sm font-semibold text-white bg-sky-500 hover:bg-sky-600 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-lg shadow-sky-500/25">
            <span x-text="loginForm.loading ? '正在登录…' : '登 录'"></span>
          </button>
        </form>
        <p class="mt-6 text-center text-[10px] leading-relaxed" style="color:var(--text-tertiary, #94a3b8)">
          初始凭据见部署时的终端回显或 <code class="px-1 py-0.5 rounded bg-slate-900/5 font-mono">~/.local/share/axiom-v3/credentials.txt</code>
        </p>
      </div>
    </div>
  </div>
</template>
<template x-if="!authLoading && isAuthenticated">
<div>
<!-- ═══════════ APPLE-STYLE SIDEBAR ═══════════ -->
<button type="button" class="mobile-nav-trigger" @click="mobileSidebarOpen = true" aria-label="打开导航">
  <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div class="mobile-sidebar-backdrop" x-show="mobileSidebarOpen" x-cloak @click="mobileSidebarOpen = false"></div>
<aside class="sidebar" :class="{ 'is-collapsed': sidebarCollapsed, 'is-mobile-open': mobileSidebarOpen }">
  <div class="sidebar-logo-row"><div class="sidebar-logo"><img src="/static/logo.jpg?v=20260807-manual-reason-v1" alt="axiom"></div><span class="sidebar-brand">AXIOM</span><button type="button" class="sidebar-collapse" @click="toggleSidebar()" :aria-label="sidebarCollapsed ? '展开侧栏' : '折叠侧栏'"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path :d="sidebarCollapsed ? 'm9 18 6-6-6-6' : 'm15 18-6-6 6-6'"/></svg></button></div>
  <button type="button" class="nav-item nav-back" data-tooltip="返回上一页" x-show="pageHistory.length > 0" @click="goBack()"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span class="nav-label">返回</span></button>
  <nav class="sidebar-nav">
    <button type="button" class="nav-item" data-tooltip="仪表盘" :class="{ 'is-active': activePage === 'dashboard' }" @click="navigateTo('dashboard')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm10 7h6V4h-6v16ZM4 20h6v-4H4v4Z"/></svg><span class="nav-label">仪表盘</span></button>
    <button type="button" class="nav-item" data-tooltip="任务" :class="{ 'is-active': activePage === 'tasks' || activePage === 'task-detail' }" @click="navigateTo('tasks')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="nav-label">任务</span></button>
    <button type="button" class="nav-item" data-tooltip="漏洞" :class="{ 'is-active': activePage === 'vulnerabilities' }" @click="navigateTo('vulnerabilities')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.2 2.7 7.9 7.5 9.5 4.8-1.6 7.5-5.3 7.5-9.5V6L12 3Z"/><path d="M12 8v5m0 3h.01"/></svg><span class="nav-label">漏洞</span></button>
    <button type="button" class="nav-item" data-tooltip="项目" :class="{ 'is-active': activePage === 'projects' }" @click="navigateTo('projects')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z"/><path d="m4 12 8 4.5 8-4.5"/><path d="m4 16.5 8 4.5 8-4.5"/></svg><span class="nav-label">项目</span></button>
    <button type="button" class="nav-item" data-tooltip="守门审计" :class="{ 'is-active': activePage === 'guard-audit' }" @click="navigateTo('guard-audit')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.2 2.8 7.9 7 9.5 4.2-1.6 7-5.3 7-9.5V6l-7-3Z"/><path d="M9 12h6M9 15h4M9 9h6"/></svg><span class="nav-label">守门审计</span></button>
    <div class="sidebar-divider"></div>
    <button type="button" class="nav-item" data-tooltip="Worker" :class="{ 'is-active': activePage === 'workers' }" @click="navigateTo('workers')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg><span class="nav-label">Worker</span></button>
    <button type="button" class="nav-item" data-tooltip="工具管理" :class="{ 'is-active': activePage === 'tools' }" @click="navigateTo('tools')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-3-3 2.1-2.1Z"/></svg><span class="nav-label">工具</span></button>
    <button type="button" class="nav-item" data-tooltip="Skill" :class="{ 'is-active': activePage === 'skills' }" @click="navigateTo('skills')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 12h6m-3-3v6m-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14l-4-2-4 2-4-2-4 2Z"/></svg><span class="nav-label">Skill</span></button>
    <button type="button" class="nav-item" data-tooltip="文件" :class="{ 'is-active': activePage === 'files' }" @click="navigateTo('files')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v11Z"/></svg><span class="nav-label">文件</span></button>
    <button type="button" class="nav-item" data-tooltip="MCP" :class="{ 'is-active': activePage === 'mcp' }" @click="navigateTo('mcp')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.5 6h7M7.5 8l3 7.5M16.5 8l-3 7.5"/></svg><span class="nav-label">MCP</span></button>
    <button type="button" class="nav-item" data-tooltip="提示词" :class="{ 'is-active': activePage === 'prompts' }" @click="navigateTo('prompts')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></svg><span class="nav-label">提示词</span></button>
  </nav>
  <div class="sidebar-bottom">
    <button type="button" class="nav-item" data-tooltip="搜索" @click="openGlobalSearch()"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="nav-label">搜索</span></button>
    <button type="button" class="nav-item" data-tooltip="深色模式" @click="toggleDarkMode()"><template x-if="!darkMode"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></template><template x-if="darkMode"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></template><span class="nav-label">深色模式</span></button>
    <button type="button" class="nav-item" data-tooltip="设置" :class="{ 'is-active': activePage === 'settings' }" @click="navigateTo('settings')"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05a2 2 0 1 1-2.83 2.83l-.05-.05a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.07a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.07A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.34-1.88l-.05-.05a2 2 0 1 1 2.83-2.83l.05.05A1.7 1.7 0 0 0 8.97 3.6 1.7 1.7 0 0 0 10 2.07V2a2 2 0 1 1 4 0v.07a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.05-.05a2 2 0 1 1 2.83 2.83l-.05-.05A1.7 1.7 0 0 0 19.4 8c.18.6.7 1 1.56 1H21a2 2 0 1 1 0 4h-.07A1.7 1.7 0 0 0 19.4 15Z"/></svg><span class="nav-label">设置</span></button>
    <div class="sidebar-divider"></div>
    <div class="px-2 py-2">
      <div class="flex items-center gap-2 rounded-xl px-2 py-1.5" style="background:var(--surface-inset, rgba(241,245,249,0.6))">
        <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold text-white bg-gradient-to-br from-sky-500 to-indigo-500 shrink-0" x-text="(currentUser || 'A').charAt(0).toUpperCase()"></div>
        <div class="min-w-0 flex-1">
          <p class="text-xs font-semibold truncate" style="color:var(--text-primary, #334155)" x-text="currentUser || 'admin'"></p>
          <p class="text-[9px] uppercase tracking-wide" style="color:var(--text-tertiary, #94a3b8)">管理员</p>
        </div>
      </div>
      <div class="mt-1.5 grid grid-cols-2 gap-1.5">
        <button type="button" @click="openChangePasswordDialog()" class="nav-item justify-center !px-1 !py-1.5 text-[10px]" data-tooltip="修改密码"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg><span class="nav-label">改密</span></button>
        <button type="button" @click="performLogout()" class="nav-item justify-center !px-1 !py-1.5 text-[10px] hover:!text-rose-500" data-tooltip="退出登录"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span class="nav-label">退出</span></button>
      </div>
    </div>
  </div>
</aside>
<div class="main-content" :class="{ 'sidebar-collapsed': sidebarCollapsed }">
  <div id="page-host" class="page-host flex-1 flex flex-col overflow-hidden min-w-0" aria-live="polite"><div class="page-skeleton"><span></span><span></span><span></span></div></div>
</div>

<!-- ═══════════ GLOBAL SEARCH (Cmd+K) ═══════════ -->
<div x-show="showGlobalSearch" x-cloak class="fixed inset-0 z-[60] flex items-start justify-center pt-[15vh] overlay" @click.self="closeGlobalSearch()" @keydown.escape.window="closeGlobalSearch()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl mx-4 border border-slate-200/60 overflow-hidden modal-enter">
    <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-3">
      <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input x-model="globalSearchQuery" x-ref="globalSearchInput" @input="scheduleGlobalSearch()"
        placeholder="搜索项目、任务、漏洞…"
        class="flex-1 bg-transparent text-sm text-slate-700 placeholder-slate-400 focus:outline-none">
      <kbd class="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">ESC</kbd>
    </div>
    <div class="max-h-[50vh] overflow-y-auto p-2">
      <template x-if="!globalSearchQuery.trim()"><div class="py-8 text-center text-sm text-slate-400">输入关键词搜索</div></template>
      <template x-if="globalSearchQuery.trim() && globalSearchLoading"><div class="py-8 text-center text-sm text-slate-400">正在搜索…</div></template>
      <template x-if="globalSearchQuery.trim() && !globalSearchLoading && globalSearchResults().length === 0"><div class="py-8 text-center text-sm text-slate-400">未找到结果</div></template>
      <template x-for="result in globalSearchResults()" :key="`${result.type}-${result.id}`">
        <button @click="result.action(); closeGlobalSearch()"
          class="w-full text-left rounded-xl px-3 py-2.5 hover:bg-slate-50 transition flex items-center gap-3">
          <span class="shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-[10px] font-mono font-semibold"
            :class="{'bg-blue-50 text-blue-600': result.type === 'project', 'bg-emerald-50 text-emerald-600': result.type === 'group', 'bg-rose-50 text-rose-500': result.type === 'vuln'}"
            x-text="result.type === 'project' ? 'T' : result.type === 'group' ? 'P' : 'V'"></span>
          <div class="min-w-0 flex-1"><p class="text-sm font-medium text-slate-700 truncate" x-text="result.title"></p><p class="text-[11px] text-slate-400 truncate" x-text="result.subtitle"></p></div>
        </button>
      </template>
    </div>
  </div>
</div>

<!-- ═══════════ MODALS ═══════════ -->

<!-- Create Intent -->
<div x-show="showIntentModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showIntentModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">新建意图</h3>
    <div class="mb-4">
      <label class="text-[11px] text-slate-400 mb-1 block font-medium">来源事实</label>
      <div class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 min-h-[42px] flex flex-wrap gap-1.5 items-center">
        <template x-for="fid in selectedFacts" :key="`intent-from-${fid}`">
          <span class="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-mono text-slate-600" x-text="fid"></span>
        </template>
      </div>
    </div>
    <div class="space-y-3">
      <textarea x-model="intentForm.description" placeholder="本轮准备探索什么？" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">目标主机/IP（可留空，留空时使用任务白名单；多个用换行或逗号分隔）</label>
        <textarea x-model="intentForm.targets" placeholder="例如：api.example.com 或 10.0.0.1" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      </div>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500" x-show="intentScopeHint" x-text="intentScopeHint"></div>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showIntentModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="createIntent(false)" :disabled="!intentForm.description"
        class="px-5 py-2 text-sm border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition disabled:opacity-30">声明</button>
      <button @click="createIntent(true)" :disabled="!intentForm.description"
        class="px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium hover:bg-brand-600 transition disabled:opacity-30 shadow-sm shadow-brand-200">声明并认领</button>
    </div>
  </div>
</div>

<!-- Conclude -->
<div x-show="showConcludeModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showConcludeModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">结束意图</h3>
    <p class="text-xs text-slate-400 mb-4 font-mono" x-text="concludeForm.intentId"></p>
    <div class="space-y-3">
      <textarea x-model="concludeForm.description" placeholder="本轮发现了什么（写入新事实）" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showConcludeModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="concludeIntent()" :disabled="!concludeForm.description"
        class="px-5 py-2 text-sm bg-teal-500 text-white rounded-xl font-medium hover:bg-teal-600 transition disabled:opacity-30 shadow-sm shadow-teal-200">确认结束</button>
    </div>
  </div>
</div>

<!-- Complete Project -->
<div x-show="showCompleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showCompleteModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">完成项目</h3>
    <p class="text-xs text-slate-400 mb-4">将项目标记为已完成</p>
    <div class="space-y-3">
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">来源事实</label>
        <div class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 min-h-[42px] flex flex-wrap gap-1.5 items-center">
          <template x-for="fid in selectedFacts" :key="`complete-from-${fid}`">
            <span class="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-mono text-slate-600" x-text="fid"></span>
          </template>
        </div>
      </div>
      <textarea x-model="completeForm.description" placeholder="为什么可以判定目标已达成？" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showCompleteModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="completeProject()" :disabled="selectedFacts.length === 0 || !completeForm.description"
        class="px-5 py-2 text-sm bg-teal-500 text-white rounded-xl font-medium hover:bg-teal-600 transition disabled:opacity-30 shadow-sm shadow-teal-200">确认完成</button>
    </div>
  </div>
</div>

<!-- Hint -->
<div x-show="showHintModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showHintModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-4">添加提示</h3>
    <div class="space-y-3">
      <textarea x-model="hintForm.content" placeholder="策略建议或备注..." rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showHintModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="addHint()" :disabled="!hintForm.content"
        class="px-5 py-2 text-sm bg-amber-500 text-white rounded-xl font-medium hover:bg-amber-600 transition disabled:opacity-30 shadow-sm shadow-amber-200">添加</button>
    </div>
</div>
</div>

<!-- Blackboard Editor -->
<div x-show="blackboardEditor.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="blackboardEditor.open = false">
<div class="bg-white rounded-2xl shadow-2xl modal-enter p-6 w-full max-w-lg mx-4 relative z-10">
  <h3 class="text-lg font-semibold text-slate-800" x-text="blackboardEditor.id ? '编辑共享知识' : '添加共享知识'"></h3>
  <input x-model="blackboardEditor.title" placeholder="标题（可选）" class="mt-4 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400">
  <textarea x-model="blackboardEditor.content" rows="5" placeholder="内容（如测试账号、业务逻辑等）" class="mt-3 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400"></textarea>
  <div class="mt-3">
    <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide block mb-1">何时相关（hint）</label>
    <input x-model="blackboardEditor.hint" placeholder="一句话说明何时 AI 应参考此条目，空则始终注入" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400 text-slate-600 placeholder-slate-300">
    <p class="text-[10px] text-slate-300 mt-1">例：“发送 HTTP 请求时使用”、“判断越权时参考”——AI 会读取所有条目但优先关注 hint 匹配的条目</p>
  </div>
  <div class="flex justify-end gap-2 mt-5">
    <button @click="blackboardEditor.open = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
    <button @click="saveBlackboardItem()" :disabled="!blackboardEditor.title && !blackboardEditor.content"
      class="px-5 py-2 text-sm bg-sky-500 text-white rounded-xl font-medium hover:bg-sky-600 transition disabled:opacity-30 shadow-sm shadow-sky-200">保存</button>
  </div>
</div>
</div>

<!-- Reopen -->
<div x-show="showReopenModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showReopenModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">重新打开项目</h3>
    <p class="text-xs text-slate-400 mb-4" x-text="projectLabel(reopenForm.projectId, reopenForm.projectTitle)"></p>
    <div class="space-y-3">
      <textarea x-model="reopenForm.description" placeholder="为什么这个项目其实还不能算完成？" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者：<span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showReopenModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="reopenProject()" :disabled="!reopenForm.projectId || !reopenForm.description"
        class="px-5 py-2 text-sm bg-sky-500 text-white rounded-xl font-medium hover:bg-sky-600 transition disabled:opacity-30 shadow-sm shadow-sky-200">重新打开</button>
    </div>
  </div>
</div>

<!-- Continue completed Task with a new Goal -->
<div x-show="continuationForm.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="closeTaskContinuation()">
  <div class="app-modal-surface rounded-2xl shadow-2xl modal-enter w-full max-w-2xl p-6 border" @click.stop>
    <div class="flex items-start justify-between gap-4">
      <div>
        <h3 class="text-base font-semibold text-slate-700">继续任务并设置新 Goal</h3>
        <p class="mt-1 text-xs text-slate-400" x-text="projectLabel(continuationForm.projectId, continuationForm.projectTitle)"></p>
      </div>
      <button @click="closeTaskContinuation()" :disabled="continuationForm.saving" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
    </div>
    <div class="mt-5 space-y-4">
      <label class="block">
        <span class="text-xs font-medium text-slate-600">新 Goal</span>
        <textarea x-model="continuationForm.goal" rows="3" placeholder="本轮唯一有效的任务目标" class="app-input mt-1.5 w-full px-3 py-2 rounded-xl text-sm"></textarea>
      </label>
      <label class="block">
        <span class="text-xs font-medium text-slate-600">继续原因</span>
        <textarea x-model="continuationForm.reason" rows="3" placeholder="为什么需要继续运行？" class="app-input mt-1.5 w-full px-3 py-2 rounded-xl text-sm"></textarea>
      </label>
      <label class="block">
        <span class="text-xs font-medium text-slate-600">本轮重点（可选）</span>
        <textarea x-model="continuationForm.focus" rows="2" placeholder="希望 Reason 优先关注的方向" class="app-input mt-1.5 w-full px-3 py-2 rounded-xl text-sm"></textarea>
      </label>
      <label class="block">
        <span class="text-xs font-medium text-slate-600">运行时长（分钟）</span>
        <input x-model.number="continuationForm.durationMinutes" type="number" min="1" step="1" class="app-input mt-1.5 w-full px-3 py-2 rounded-xl text-sm">
      </label>
      <div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs leading-5 text-amber-800">
        不会重新执行 Bootstrap，也不会恢复上一轮被取消的 Intent。系统会立即创建 Continuation ReasonRun，由 Reason 根据新 Goal 复用历史结果并选择性续接。
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="closeTaskContinuation()" :disabled="continuationForm.saving" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="continueCompletedTask()" :disabled="continuationForm.saving || !String(continuationForm.goal || '').trim() || !String(continuationForm.reason || '').trim() || Number(continuationForm.durationMinutes || 0) < 1"
        class="px-5 py-2 text-sm bg-amber-500 text-white rounded-xl font-medium hover:bg-amber-600 transition disabled:opacity-30 shadow-sm shadow-amber-200"
        x-text="continuationForm.saving ? '正在创建新一轮…' : '继续任务'"></button>
    </div>
  </div>
</div>

<!-- Resume Task Run Window -->
<div x-show="resumeTaskDialog.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="closeResumeTaskDialog()">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-md p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700">继续任务</h3>
    <p class="mt-1 text-xs text-slate-400 truncate" x-text="resumeTaskDialog.title"></p>
    <p class="mt-4 text-[11px] text-slate-500">请选择这一次运行窗口。上一次未使用的剩余时间不会继承。</p>
    <div class="mt-4 inline-flex w-full rounded-xl border border-slate-200 bg-slate-50 p-1 text-sm">
      <button type="button" @click="resumeTaskDialog.limited = false"
        class="flex-1 px-3 py-2 rounded-lg transition"
        :class="!resumeTaskDialog.limited ? 'bg-white text-slate-800 shadow-sm font-medium' : 'text-slate-500'">不限时运行</button>
      <button type="button" @click="resumeTaskDialog.limited = true"
        class="flex-1 px-3 py-2 rounded-lg transition"
        :class="resumeTaskDialog.limited ? 'bg-brand-500 text-white shadow-sm font-medium' : 'text-slate-500'">限时运行</button>
    </div>
    <div x-show="resumeTaskDialog.limited" x-cloak class="mt-4 grid grid-cols-2 gap-3">
      <label class="text-[11px] text-slate-400">小时
        <input type="number" min="0" max="8760" step="1" x-model.number="resumeTaskDialog.hours"
          class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-brand-100">
      </label>
      <label class="text-[11px] text-slate-400">分钟
        <input type="number" min="0" max="59" step="1" x-model.number="resumeTaskDialog.minutes"
          class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-brand-100">
      </label>
    </div>
    <div class="mt-4 rounded-xl border px-3 py-2 text-xs"
      :class="resumeRunDurationValid() ? 'border-sky-100 bg-sky-50 text-sky-700' : 'border-rose-100 bg-rose-50 text-rose-700'"
      x-text="runDeadlinePreview(resumeTaskDialog.limited, resumeTaskDialog.hours, resumeTaskDialog.minutes)"></div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="closeResumeTaskDialog()" :disabled="resumeTaskDialog.submitting" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition disabled:opacity-40">取消</button>
      <button @click="confirmResumeTask()" :disabled="resumeTaskDialog.submitting || !resumeRunDurationValid()"
        class="px-5 py-2 text-sm bg-teal-500 text-white rounded-xl font-medium hover:bg-teal-600 transition disabled:opacity-30 shadow-sm shadow-teal-200"
        x-text="resumeTaskDialog.submitting ? '继续中...' : '继续任务'"></button>
    </div>
  </div>
</div>

<!-- Rename Project -->
<div x-show="showRenameModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showRenameModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">重命名项目</h3>
    <p class="text-xs text-slate-400 mb-4" x-text="projectLabel(renameForm.projectId, renameForm.originalTitle)"></p>
    <div class="space-y-3">
      <input x-ref="renameTitleInput" x-model="renameForm.title" @keydown.enter.prevent="renameProject()" placeholder="项目名称" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300">
      <p class="text-[11px] text-slate-400">仅修改项目标题，任何状态下都允许。</p>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showRenameModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="renameProject()" :disabled="!renameForm.projectId || !renameForm.title"
        class="px-5 py-2 text-sm bg-slate-800 text-white rounded-xl font-medium hover:bg-slate-900 transition disabled:opacity-30 shadow-sm">保存</button>
    </div>
  </div>
</div>

<!-- Edit Fact/Intent/Hint -->
<div x-show="showEditContentModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showEditContentModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-2xl p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1" x-text="editForm.title"></h3>
    <p class="text-xs text-slate-400 mb-4 font-mono" x-text="editForm.id"></p>
    <textarea x-ref="editContentInput" x-model="editForm.content" rows="14"
              class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300 resize-y"
              placeholder="内容..."></textarea>
    <div class="flex justify-end gap-2 mt-4">
      <button @click="showEditContentModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="saveEditContent()" :disabled="!editForm.content"
              class="px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium hover:bg-brand-600 transition disabled:opacity-30 shadow-sm">保存</button>
    </div>
  </div>
</div>

<!-- Content Preview -->
<div x-show="showYamlModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showYamlModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-4xl mx-4 border border-slate-200/60 overflow-hidden" @click.stop>
    <div class="px-5 py-4 border-b border-slate-200/80 flex items-center justify-between gap-4">
      <p class="min-w-0 text-xs text-slate-400 truncate" x-text="yamlPreviewTitle"></p>
      <div class="flex items-center gap-2">
        <button @click="copyYamlPreview()" class="px-3 py-1.5 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">复制</button>
        <button @click="showYamlModal = false" class="px-3 py-1.5 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">关闭</button>
      </div>
    </div>
    <div class="max-h-[75vh] overflow-auto bg-slate-50 p-4">
      <div class="rounded-xl border border-slate-200 bg-white overflow-y-auto overflow-x-auto shadow-sm">
        <div class="w-full p-0 text-[12px] leading-6 font-mono select-text break-words whitespace-pre-wrap" x-html="yamlPreviewHtml"></div>
      </div>
    </div>
  </div>
</div>

<!-- New Project Group Modal -->
<div x-show="showGroupModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showGroupModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-md mx-4 border border-slate-200/60 overflow-hidden" @click.stop>
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
      <h3 class="text-sm font-semibold text-slate-700">新建项目</h3>
      <button @click="showGroupModal = false" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
    </div>
    <div class="p-5 space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-500 mb-1 block">项目名称</label>
        <input x-model="projectGroupForm.title" placeholder="例如：XX系统渗透测试" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 mb-1 block">项目说明（可选）</label>
        <textarea x-model="projectGroupForm.description" rows="3" placeholder="项目描述、目标范围、注意事项等" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"></textarea>
      </div>
    </div>
    <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2">
      <button @click="showGroupModal = false" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition">取消</button>
      <button @click="createProjectGroup()" :disabled="!projectGroupForm.title" class="px-4 py-2 text-sm rounded-xl bg-brand-500 text-white font-medium hover:bg-brand-600 transition disabled:opacity-30">创建</button>
    </div>
  </div>
</div>

<!-- Delete Project Group Confirmation -->
<div x-show="showDeleteGroupModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showDeleteGroupModal = false">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-md p-6 border border-slate-200/60" @click.stop>
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="text-sm font-semibold text-slate-700">删除项目</h3>
        <p class="mt-1 text-xs text-slate-400">即将删除项目「<span class="font-medium text-slate-600" x-text="deleteGroupConfirm.title"></span>」及其下所有任务、漏洞、共享知识和项目凭证。此操作不可撤销。</p>
      </div>
    </div>
    <div class="mt-5 flex justify-end gap-2">
      <button @click="showDeleteGroupModal = false" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition">取消</button>
      <button @click="confirmDeleteProjectGroup()" class="px-4 py-2 text-sm rounded-xl bg-rose-500 text-white font-medium hover:bg-rose-600 transition">确认删除</button>
    </div>
  </div>
</div>

<!-- Delete Project -->
<div x-show="showDeleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="closeDeleteModal()">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-md p-6 border border-slate-200/60" @click.stop>
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6"/><path d="M19 6l-.63 11.338A2 2 0 0 1 16.37 19.5H7.63a2 2 0 0 1-1.997-2.162L5 6"/><path d="M10 10.5v5"/><path d="M14 10.5v5"/></svg>
      </div>
      <div class="min-w-0 flex-1">
        <h3 class="text-base font-semibold text-slate-700">永久删除任务</h3>
        <p class="text-sm text-slate-500 mt-1 leading-relaxed">
          将永久删除
          <span class="font-medium text-slate-700 break-all" x-text="deleteConfirmLabel()"></span>.
        </p>
        <p class="text-xs text-slate-400 mt-3">任务历史、Fact、Todo、Intent、漏洞、证据文件、运行目录和 Token 统计都会一并删除。此操作不可撤销。</p>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-6">
      <button @click="closeDeleteModal()" :disabled="isDeletingProject" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">取消</button>
      <button @click="confirmDeleteProject()" :disabled="isDeletingProject" class="px-4 py-2 text-sm bg-rose-500 text-white rounded-xl font-medium hover:bg-rose-600 transition shadow-sm shadow-rose-200 disabled:opacity-40 disabled:cursor-not-allowed">
        <span x-text="isDeletingProject ? '删除中...' : '删除'"></span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div x-show="showArchivePreviewModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="closeArchivePreview()">
  <div class="bg-white rounded-2xl shadow-2xl modal-enter w-full max-w-2xl mx-4 border border-slate-200/60 overflow-hidden" @click.stop>
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between"><div><h3 class="text-sm font-semibold text-slate-700">确认级联归档</h3><p class="mt-1 text-xs text-slate-400">仅归档下游链路，不会反向归档来源 Fact 或旁支。</p></div><button @click="closeArchivePreview()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button></div>
    <div class="p-5 max-h-[65vh] overflow-y-auto">
      <p x-show="archivePreviewLoading" class="py-10 text-center text-xs text-slate-400">正在计算归档闭包…</p>
      <template x-if="archivePreview">
        <div class="space-y-4">
          <div class="rounded-xl border border-slate-200 bg-slate-50 p-3"><div class="text-xs text-slate-500">归档根</div><div class="mt-1 text-sm font-mono text-slate-700" x-text="`${archiveEntityLabel(archivePreview.root_type)} ${archivePreview.root_id}`"></div></div>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2"><template x-for="type in ['fact','intent','todo','vulnerability','artifact']" :key="`preview-${type}`"><div class="rounded-xl border border-slate-100 bg-slate-50 p-2.5"><div class="text-base font-semibold text-slate-700" x-text="archivePreview.counts[type] || 0"></div><div class="text-[9px] text-slate-400" x-text="archiveEntityLabel(type)"></div></div></template></div>
          <div x-show="archivePreview.blockers?.length" class="rounded-xl border border-rose-200 bg-rose-50 p-3"><p class="text-xs font-semibold text-rose-700">当前不能归档</p><template x-for="blocker in archivePreview.blockers" :key="blocker"><p class="mt-1 text-xs text-rose-600" x-text="blocker"></p></template></div>
          <div><label class="text-xs font-medium text-slate-500">归档原因（可选）</label><textarea x-model="archiveReason" rows="2" placeholder="例如：与现有攻击链重复" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-100 focus:border-amber-300"></textarea></div>
          <div class="rounded-xl border border-slate-200 overflow-hidden"><div class="px-3 py-2 bg-slate-50 text-xs font-medium text-slate-600">影响明细</div><div class="max-h-56 overflow-y-auto divide-y divide-slate-100"><template x-for="member in archivePreview.members" :key="`preview-member-${member.entity_type}-${member.entity_id}`"><div class="px-3 py-2 flex items-start gap-2"><span class="px-1.5 py-0.5 rounded bg-slate-100 text-[9px] font-mono text-slate-500" x-text="member.entity_id"></span><div class="min-w-0 flex-1"><p class="text-xs text-slate-600 truncate" x-text="member.title || archiveEntityLabel(member.entity_type)"></p><p class="text-[9px] text-slate-400" x-text="`${archiveEntityLabel(member.entity_type)} · ${archiveRelationLabel(member.relation)}`"></p></div></div></template></div></div>
        </div>
      </template>
    </div>
    <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2"><button @click="closeArchivePreview()" :disabled="archiveSubmitting" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500">取消</button><button @click="confirmArchive()" :disabled="archiveSubmitting || archivePreviewLoading || !archivePreview || (archivePreview.blockers?.length > 0)" class="px-4 py-2 text-sm rounded-xl bg-amber-500 text-white font-medium hover:bg-amber-600 disabled:opacity-30" x-text="archiveSubmitting ? '归档中…' : '确认归档'"></button></div>
  </div>
</div>

<!-- Toast -->
<div x-show="toast && toast.show" x-cloak
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0 translate-y-2"
  class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium"
  :class="(toast && toast.type) === 'error' ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'">
  <span x-text="toast ? toast.message : ''"></span>
</div>

<!-- ═══════════ CHANGE PASSWORD (修改密码) ═══════════ -->
<div x-show="changePasswordDialog.open" x-cloak class="fixed inset-0 z-[70] flex items-center justify-center overlay" @click.self="changePasswordDialog.open = false">
  <div class="rounded-2xl shadow-2xl modal-enter w-full max-w-md p-6 border bg-white" @click.stop>
    <div class="flex items-start justify-between gap-3">
      <div>
        <h3 class="text-base font-semibold text-slate-800">修改密码</h3>
        <p class="mt-0.5 text-xs text-slate-400">当前管理员：<span class="font-mono font-medium text-slate-600" x-text="currentUser || 'admin'"></span></p>
      </div>
      <button @click="changePasswordDialog.open = false" class="text-slate-400 hover:text-slate-600 text-lg leading-none">&times;</button>
    </div>
    <div class="mt-5 space-y-3.5">
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">原密码</label>
        <input x-model="changePasswordDialog.oldPassword" type="password" autocomplete="current-password"
          class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400">
      </div>
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">新密码（至少 6 位）</label>
        <input x-model="changePasswordDialog.newPassword" type="password" autocomplete="new-password"
          class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400">
      </div>
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">确认新密码</label>
        <input x-model="changePasswordDialog.confirmPassword" type="password" autocomplete="new-password"
          class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-100 focus:border-sky-400">
      </div>
      <p x-show="changePasswordDialog.error" x-cloak x-text="changePasswordDialog.error" class="text-xs text-rose-500 font-medium"></p>
      <p x-show="changePasswordDialog.success" x-cloak x-text="changePasswordDialog.success" class="text-xs text-emerald-600 font-medium"></p>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="changePasswordDialog.open = false" :disabled="changePasswordDialog.loading" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition disabled:opacity-40">取消</button>
      <button @click="submitChangePassword()" :disabled="changePasswordDialog.loading"
        class="px-5 py-2 text-sm bg-sky-500 text-white rounded-xl font-medium hover:bg-sky-600 transition disabled:opacity-40 shadow-sm shadow-sky-200"
        x-text="changePasswordDialog.loading ? '提交中…' : '确认修改'"></button>
    </div>
  </div>
</div>
</div></template>
