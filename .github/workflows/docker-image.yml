name: docker-image

on:
  push:
    branches:
      - feat/reason-queue-050a20a
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # axiom/Dockerfile：uv 依赖 + npm ci 安装 Pi（本机锁文件钉版本）
      # + 安全工具链（版本与生产 Mac 实测对齐，见 Dockerfile ARG 段）
      - uses: docker/build-push-action@v6
        with:
          context: ./axiom
          file: ./axiom/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/notstarr/axiom:feat-reason-queue-050a20a
            ghcr.io/notstarr/axiom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
