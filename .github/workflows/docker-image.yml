name: docker-image

on:
  push:
    branches:
      - feat/reason-queue-050a20a
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 与 compose.deploy.yaml 同构的三件套镜像（PG 直接用官方 pinned 镜像，
      # 这里只构建 app+runner 一体镜像）。tag：分支名蛇形 + latest。
      - uses: docker/build-push-action@v6
        with:
          context: ./axiom
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/notstarr/axiom:feat-reason-queue-050a20a
            ghcr.io/notstarr/axiom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
